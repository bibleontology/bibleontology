<script id="why" type="text/html"><p class="kind">Overnight, 2026-10-09</p>
<h1>What changes, and why</h1>
<p class="lead">The assignment: “look at concept cards, such as love, and figure out how to improve them.” Then, through the night: “concepts like love are almost as important as themes”; “we need a natural bridge from the language card to the concept card”; “this is the love hub”; build “a second concept card like righteousness at the same time so that you know that the decisions are transferable”; and “concept cards need to accommodate multiple forms.”</p>

<h3>The love card today</h3>
<ul>
<li>A good opening (1 Corinthians 13:13, 1 John 4:8) and the charity/love note.</li>
<li>The same 18 passages twice, once as a diagram (“+16 more”) and once as a list, in no order: “God is love” beside “Older men are to be temperate” and “Shechem's attachment to Dinah”.</li>
<li>692 verses shown only as counts per book: sixty labels, nothing to read.</li>
<li>The word list has four words; the verse note says the verses come from אהב, <b>חֶסֶד</b>, ἀγαπάω and ἀγάπη. φιλέω (John 21) was in neither. The cause: a verb glossed “to love” did not match the concept “love”. Fixed in the preview.</li>
<li>The theme links, the most useful part, came last.</li>
<li>Nothing led to it from the word cards: ἀγαπάω's card had no way to the love card at all.</li>
</ul>

<h3>The hub, by the forms the text uses</h3>
<p>Each section comes from the Hebrew and Greek grammar, not from a reading: the verb (who acts on whom, from the frames layer: agent, patient), the noun (the words standing in its phrase: “of God”, “and justice”, “do”), the adjective (who is called it). The sections follow the text's own weight:</p>
<div class="tblwrap"><table>
<tr><th></th><th>Verb</th><th>Noun</th><th>Adjective</th></tr>
<tr><td>Love</td><td>343 uses</td><td>about 260 phrases</td><td>about 90</td></tr>
<tr><td>Righteousness</td><td>38 uses</td><td>about 640 phrases</td><td>about 150</td></tr>
</table></div>
<p>So love leads with who loves whom, and righteousness with what it stands beside.</p>

<h3>What held for both, and what did not</h3>
<ul>
<li><b>Held:</b> sections by form; rows named by what the grammar decides (plain labels, no reading); every row a set of quotations; the words as a grid with their counts; the themes near the top; “gathered here” for the cards that stand apart today.</li>
<li><b>Differed:</b> which form leads, and how its rows are made: love's verb rows by who and whom; righteousness's noun rows by companion words. A template that fixed the order would have put righteousness's 38 verbs first and buried its 640 nouns.</li>
<li><b>Needed in both:</b> a note where traditions part, kept to the texts side by side: “the love of God” (God's love, or love for God?) and “justified” (Romans 3:28 beside James 2:24).</li>
</ul>

<h3>The bridge from a word to its hub (built, in the preview)</h3>
<p>A word card now names the concept cards that list it, right under its name: “What the text says of love →”. ἀγαπάω, ἀγάπη, אהב, אַהֲבָה and now φιλέω lead to love; δικαιοσύνη and צְדָקָה to righteousness. It shows the scatter too: δίκαιος leads to “righteous”, צַדִּיק to “righteous” and two cards named “the righteous”, δικαιόω to “justification”. The hub is what gathers them.</p>

<h3>Found on the way</h3>
<ul>
<li><b>Doubles from the KJV renames</b> (A.22): the old “charity” card is now a second “love”, “fidelity” a second “faith”, “the just” a second “the righteous”, “pity” a second “kindness”. Each wants the consolidation rule: two judges, then you.</li>
<li><b>The righteousness card's opening</b> says the Bible “mostly speaks of it as something reckoned rather than achieved”. The rows count “do righteousness” 48 times and “justice and righteousness” 63. Flagged on the page, for the nine readers.</li>
<li><b>Deuteronomy 16:20</b>: the Berean says “Pursue justice, and justice alone”; the Hebrew is צֶדֶק twice, “righteousness, righteousness you shall pursue”. Marked with the asterisk on the page, the mechanism you approved yesterday.</li>
<li><b>A trap in the code:</b> Hebrew typed into a program did not match the same Hebrew in the data, because the vowel points were stored in another order. “Justice and righteousness” found 3 verses, all Greek; normalized, 63. Anything in the site comparing typed Hebrew with the data may be losing matches the same way; to be swept.</li>
</ul>

<h3>How far the rows can be trusted yet</h3>
<p>For love, 13 of 16 sampled verses landed in the right row before two fixes (a verse-numbering offset in the Psalms, and “the children of God” filed as parents and children). 158 of 343 love verbs are not placed yet, mostly “love him” and “love me”, where the pronoun is not yet resolved. The examples on this page were each read by hand. The build would resolve the pronouns and pass the usual checks before anything goes live.</p>

<h3>Every concept card, not only the hubs</h3>
<ul>
<li>The front page's card style throughout.</li>
<li>Show the passages once, grouped, not as both a diagram and a list.</li>
<li>The book counts as one compact strip, not sixty labels.</li>
<li>The word list and the verse list from the same words.</li>
<li>The themes near the top.</li>
<li>The word-to-concept bridge (built in the preview).</li>
<li>The leftover “a model's unreviewed reading” line retired, as the theme stamps were.</li>
</ul>

<h3>For you to decide</h3>
<ol>
<li>The hub design: sections by form, led by the text's own weight, as on the two pages here.</li>
<li>Which concepts become hubs, and in what order. By how much the text says of them and how often readers ask: truth (your “what this site is all about”), faith, grace, mercy and loving devotion (חֶסֶד), hope, peace, joy, holiness, glory, the fear of the LORD, forgiveness, repentance, prayer, praise, life, light.</li>
<li>The four doubles: to the two judges for consolidation.</li>
<li>The general improvements above, for every concept card.</li>
</ol>

<script>
(function(){
  const D = JSON.parse(document.getElementById('data').textContent);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const quote = e => `<div class="q">${esc(e.text)}${e.find ? `<button type="button" class="vmark" data-note="${esc(e.find)}" aria-label="A note on the original">*</button>` : ''}<span class="r">${esc(e.ref)}</span></div>`;
  function hub(h){
    let s = `<p class="kind">${esc(h.kind)} · a hub</p><h1>${esc(h.name)}</h1>`;
    s += h.intro.map(p => `<p class="lead">${esc(p)}</p>`).join('');
    if(h.leads) s += `<div class="eyebrow" style="margin-top:12px">Leads to</div><div class="leads">${
      h.leads.map(x => `<a href="#" class="door">${esc(x)}</a>`).join('')}</div>`;
    if(h.intro_flag) s += `<p class="flag">${esc(h.intro_flag)}</p>`;
    s += `<div class="h2">The words the text uses</div><div class="words">${h.words.map(w =>
      `<div class="word"><div class="l">${esc(w[0])} <span class="t">${esc(w[1])}</span></div><div class="m">${esc(w[2])} · ${esc(w[3])} · ${w[4]} uses</div></div>`).join('')}</div>`;
    s += `<div class="h2">In the themes</div><div class="chips">${h.themes.map(t =>
      `<span class="chip"><b>${esc(t[0])}</b> · ${esc(t[1])}</span>`).join('')}</div>`;
    s += `<div class="h2">In the texts' own words</div>${h.own_words.map(quote).join('')}`;
    h.sections.forEach(sec => {
      s += `<section class="sec"><div class="eyebrow">${esc(sec.form)}</div><div class="h2" style="margin-top:2px">${esc(sec.title)}</div>`;
      if(sec.note) s += `<p class="note">${esc(sec.note)}</p>`;
      s += `<div class="cards">${sec.rows.map(r => `<div class="card"><div class="n">${esc(r.label)}${
        r.n != null ? `<span class="c">${r.n} verses</span>` : ''}</div>${(r.doors || []).length
        ? `<div class="doors">opens: ${r.doors.map(x => `<a href="#" class="door">${esc(x)}</a>`).join('')}</div>` : ''}${r.eg.map(quote).join('')}</div>`).join('')}</div></section>`;
    });
    s += `<div class="h2">Gathered here</div><p class="note" style="font-size:14px;color:var(--muted)">The cards that today stand apart and would lead into this hub:</p><div class="chips">${
      h.gather.map(g => `<span class="chip">${esc(g)}</span>`).join('')}</div>`;
    return s;
  }
  const page = document.getElementById('page');
  function show(t){
    document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.t === t ? 'true' : 'false'));
    page.innerHTML = t === 'why' ? `<div class="why">${document.getElementById('why').textContent}</div>` : hub(D[t]);
    try{ localStorage.setItem('hubtab', t); }catch(e){}
  }
  document.querySelector('.tabs').addEventListener('click', e => { const b = e.target.closest('button[data-t]'); if(b) show(b.dataset.t); });
  page.addEventListener('click', e => {
    if(e.target.closest('a.door')){ e.preventDefault(); return; }   // in the site, each opens its card
    const b = e.target.closest('.vmark'); if(!b) return;
    const n = b.nextElementSibling;
    if(n && n.classList.contains('vnote')){ n.remove(); return; }
    const s = document.createElement('span'); s.className = 'vnote';
    s.innerHTML = '<b>On the original (this site’s note):</b> ' + esc(b.dataset.note); b.after(s);
  });
  let t0 = 'love'; try{ t0 = localStorage.getItem('hubtab') || 'love'; }catch(e){}
  show(D[t0] || t0 === 'why' ? t0 : 'love');
})();
</script>
