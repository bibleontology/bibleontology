<script>
(function(){
  const S = JSON.parse(document.getElementById('data').textContent);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const TIER = {1: 'Tier 1 · a hub', 2: 'Tier 2 · the graph checked', 3: 'Tier 3 · the face-lift'};
  const POSN = {verb: 'As a verb', noun: 'As a noun', adjective: 'As an adjective', word: 'As a word'};
  const quote = e => `<div class="q">${esc(e.text)}<span class="r">${esc(e.ref)}</span></div>`;
  const fr = document.getElementById('fruits');
  fr.innerHTML = S.cards.map((c, i) => `<button type="button" id="f-${i}" data-i="${i}" aria-pressed="false"><span class="dot d${c.tier}"></span>${esc(c.label)}</button>`).join('');
  function card(c, i){
    let s = `<p class="kind">Concept · ${esc(TIER[c.tier])} · ${c.study.n} of ${c.study.of} in the study</p><h1>${esc(c.label === c.name ? c.name : c.label)}</h1>`;
    s += c.intro.length ? c.intro.map(p => `<p class="lead">${esc(p)}</p>`).join('') : '<p class="lead none">No opening yet.</p>';
    s += `<div class="h2">The words the text uses</div><div class="words">${c.words.map(w =>
      `<div class="word${w.tier2 ? ' add' : ''}"><div class="l">${esc(w.lemma)} ${w.translit ? `<span class="tr">${esc(w.translit)}</span>` : ''}</div><div class="m">${esc(w.gloss || '')} · ${esc(w.lang)} ${esc(w.pos)} · ${w.uses} uses${w.tier2 ? ' · added in tier 2' : ''}</div></div>`).join('')}</div>`;
    s += `<div class="h2">In the themes</div>${c.themes.length ? `<div class="chips">${c.themes.map(t => `<span class="chip"><b>${esc(t[0])}</b>${t[1] ? ' · ' + esc(t[1]) : ''}</span>`).join('')}</div>` : '<p class="none">No theme page names it yet.</p>'}`;
    if(c.own_words.length) s += `<div class="h2">In the texts' own words</div>${c.own_words.map(quote).join('')}`;
    c.forms.forEach(f => {
      s += `<div class="eyebrow" style="margin-top:20px">${esc(POSN[f.form] || f.form)}</div><div class="card"><div class="n">${esc(c.label)}, ${esc(f.form === 'word' ? 'in Hebrew' : 'as ' + (f.form === 'adjective' ? 'an adjective' : 'a ' + f.form))}<span class="c">${f.n} verses</span></div>${f.eg.map(quote).join('')}</div>`;
    });
    if(c.cluster.length) s += `<div class="h2">Beside it</div><div class="chips">${c.cluster.map(x => `<span class="chip">${esc(x.name)}</span>`).join('')}</div>`;
    if(c.tier === 1) s += `<div class="hubnote">A hub adds the curated reading on this same page: rows by who and what (for love, “The LORD loves”, “Love one another”, “Love your enemies”…), the cards it gathers, and quotations chosen by hand.</div>`;
    if(c.check && c.check.length) s += `<div class="check"><div class="eyebrow">The graph check (tier 2)</div><ul>${c.check.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`;
    s += `<div class="nav"><button type="button" data-go="${i - 1}" ${i ? '' : 'disabled'}>← ${esc(c.study.prev || '')}</button><button type="button" data-go="${i + 1}" ${c.study.next ? '' : 'disabled'}>${esc(c.study.next || '')} →</button></div>`;
    return s;
  }
  const page = document.getElementById('page');
  function show(i){
    i = Math.max(0, Math.min(S.cards.length - 1, i));
    fr.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.i === i ? 'true' : 'false'));
    page.innerHTML = card(S.cards[i], i);
    try{ localStorage.setItem('fruit', String(i)); }catch(e){}
  }
  fr.addEventListener('click', e => { const b = e.target.closest('button[data-i]'); if(b){ show(+b.dataset.i); } });
  page.addEventListener('click', e => { const b = e.target.closest('button[data-go]'); if(b && !b.disabled){ show(+b.dataset.go); window.scrollTo({top: 0}); } });
  let i0 = 0; try{ i0 = +(localStorage.getItem('fruit') || 0) || 0; }catch(e){}
  show(i0);
})();
</script>
