/* 25/75. 2026-09-15: the paragraph view on the left takes 25% of
   the space and the right takes 75%. The Berean text is the reference you

.cols{display:grid; grid-template-columns:minmax(200px,25fr) 75fr; gap:20px;
      align-items:start}

   starts at the RIGHT edge of its column while the page starts at the left --
   the eye has to cross the whole width to find the first word. 2026-09-15:
   with Hebrew the original language goes on the left.

   the 75%-wide original into the 25fr track, because the split is positional
   rather than named. */
.cols.heb{grid-template-columns:75fr minmax(200px,25fr)}

.conntoggle{display:flex; gap:6px; margin:2px 0 8px}
.conntab{font:inherit; font-size:14.5px; background:var(--paper); color:var(--ink); border:1px solid var(--rule);
  border-radius:14px; padding:3px 12px; cursor:pointer}
.conntab.on{border-color:var(--ochre); background:var(--ochre-soft)}
.connview.chubtail{margin-top:0}
.chubgrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:2px 24px;
  border-left:0 !important; padding-left:0 !important; margin-left:0 !important}
.chubgrid .relrow{border-bottom:1px solid var(--rule); padding:6px 0}
.chubtail details.sub > summary{font-family:Spectral, serif; text-transform:none; letter-spacing:0;
  font-size:15.5px; color:var(--muted)}
.chubtail details.sub > .subbody{display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:2px 24px}
.chubtail details.sub > .subbody .relrow{border-bottom:1px solid var(--rule); padding:6px 0}
.bookgrid{display:flex; flex-wrap:wrap; gap:6px; margin:2px 0 10px}
.bookchip{font:inherit; font-size:14.5px; background:var(--paper); color:var(--ink); border:1px solid var(--rule);
  border-radius:14px; padding:3px 11px; cursor:pointer}
.bookchip .g{font-size:12.5px}
.bookchip.on{border-color:var(--ochre); background:var(--ochre-soft)}
#etpanel{margin-top:6px; max-width:880px}
.chubtail > details.sec, .pane .chubtail > details.sec{border:1px solid var(--rule); border-radius:8px; background:var(--surface);
  padding:2px 14px; margin:8px 0}
.chubtail > details.sec > summary, .pane .chubtail > details.sec > summary{font-family:Spectral, serif; font-size:19px;
  text-transform:none; letter-spacing:0; color:var(--ink); padding:10px 0}
.chubtail > details.sec > summary .ct{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--muted)}
.chubtail details.sec .body > details.sec > summary{font-family:Spectral, serif; font-size:16px; text-transform:none;
  letter-spacing:0; color:var(--ink)}
.chubtail > p.lead, .pane .chubtail > p.lead{border:1px solid var(--rule); border-radius:8px; background:var(--surface);
  padding:10px 14px; margin:8px 0; max-width:none; color:var(--ink)}
.chubtag{font-size:14px; margin-left:8px; padding:0 6px; border:1px solid var(--rule); border-radius:10px; white-space:nowrap}
.chubfew{display:block; margin:4px 0} .chubfew .g{font-size:13px}
.otl{display:grid; gap:10px; max-width:760px; margin:6px 0 4px}
.otlc{border:1px solid var(--rule); border-radius:8px; background:var(--surface); padding:12px 14px}
.otln{font-family:Spectral, serif; font-size:19px; color:var(--ink); margin:0 0 4px}
.otln .link{color:var(--slate)}
.otlc .hubq{margin:5px 0}
.otlr{margin:6px 0 0; font-size:13px; color:var(--muted)}
.otlr .refmore{margin:2px 4px 2px 0}
.otlsec{font-size:15px; margin:3px 0}
.hubh{font-family:Spectral, serif; font-size:21px; color:var(--ink); margin:26px 0 6px; font-weight:normal}
.hubnode{cursor:pointer} .hubnode circle{fill:var(--ochre)} .hubnode text{fill:var(--slate); font-size:13px; text-decoration:underline}
.imgbar{position:sticky; top:0; z-index:2; background:var(--paper); padding:8px 0; border-bottom:1px solid var(--rule);
  display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:14px}
.imgmx{border-collapse:collapse; font-size:13px; margin:6px 0} .imgmx th{font-size:11px; color:var(--muted); padding:2px 5px}
.imgmx td{padding:1px 5px; border:0} .imgmx td.d{text-align:center; color:var(--ochre)}
.imgmx tr:hover td{background:var(--slate-soft)}
details.imgrow{border-top:1px solid var(--rule); padding:6px 0; scroll-margin-top:110px}
details.imgrow > summary{cursor:pointer; color:var(--ochre); font-weight:600; padding:4px 0}
.imgcells{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px; margin:6px 0}
.imgcol{font-size:12px; color:var(--muted); font-weight:600; margin-bottom:2px}
.imgq{margin:0 0 6px; font-size:14px}
.imgcmp{background:var(--slate-soft); padding:8px 10px; border-radius:4px; font-size:14px; max-width:80ch}
details.revc{margin:2px 0}
details.revc > summary{cursor:pointer; padding:3px 0; font-size:15px; color:var(--slate); list-style:none}
details.revc > summary::before{content:"▸ "; color:var(--slate)}
details.revc[open] > summary::before{content:"▾ "}
details.revc > summary::-webkit-details-marker{display:none}
.tgv{font-family:inherit; font-size:12px; letter-spacing:0; font-weight:400;
  line-height:1.4; color:var(--slate); cursor:pointer; background:none; border:0;
  border-radius:3px; padding:0 3px; vertical-align:1px;
  text-decoration:underline dotted; text-underline-offset:2px}
.tgv + .tgv::before{content:"·"; color:var(--muted); margin-right:6px;
  display:inline-block}
.tgv:hover{background:var(--slate-soft)}
.tgv.on{color:var(--ochre); background:var(--ochre-soft)}
/* keyboard focus is visible on the spans made focusable (see keyboardReach) */
.vn:focus-visible, span.link:focus-visible, .thb:focus-visible{
  outline:2px solid var(--slate); outline-offset:1px; border-radius:3px}
.colL .vn.vn-r, .colL .vn.vn-r:hover{cursor:auto; color:var(--muted)}
.vhint{margin:0 0 12px}
body.withcol .vhint .vh-orig{display:none}
/* THE MAJOR-THEME BRACKETS and section labels: one hue per theme, spaced by
   the golden angle so neighbours differ, darker on paper and lighter on the
   dark ground (thColor in the script sets the hue) */
:root{--th-s:62%; --th-l:36%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--th-l:70%}}
:root[data-theme="dark"]{--th-l:70%}
.thb{font-weight:700; cursor:pointer; margin:0 1px; font-size:1.05em}
.thb:hover{text-decoration:underline}
.sthemes{display:flex; flex-wrap:wrap; gap:4px; margin:-2px 0 10px}
.sth{font-size:12px; font-style:italic; border:1px solid; border-radius:10px;
  padding:1px 8px; cursor:pointer; background:transparent}
.sth:hover{text-decoration:underline}
/* the chip and its clause list are step one, which is fine for mobile; a
   clause's diagram needs width, so on a narrow screen rows do not open one
   or look clickable (step one of the structure is fine for mobile) */
@media (max-width: 767px){
  /* `.vpanel .scl`, not `.scl`: this rule sits ABOVE the base .scl rules,
     so at equal specificity the later `cursor:pointer` won (Claude's review
     of the delegated patch) */
  .vpanel .scl{cursor:default}
  .vpanel .scl:hover{border-color:var(--rule)}
  /* NO SPLIT VIEW ON A PHONE. 2026-10-01: the reader split
     view is not offered on mobile and the button is removed. The button goes, and the
     page drops the split layout on a narrow screen even if it was left on
     (applyColsForWidth). */
  #colswitch{display:none}
}
.vs .endchips{margin-left:4px}
/* what a chip opens: a panel between the two halves of a split paragraph */
.vpanel{margin:2px 0 16px; padding:10px 12px; background:var(--surface);
  border:1px solid var(--rule); border-left:3px solid var(--ochre);
  border-radius:3px}
.rtlcue{color:var(--muted); opacity:.65; font-size:12px; margin:0 6px;
  letter-spacing:0; text-transform:none; cursor:help; align-self:center}
/* in a panel's header it sits at the right, over where the Hebrew begins */
.vp-h .rtlcue{float:right; margin:0 2px 0 6px; font-size:13px}
.vpanel .vp-h{font-family:"IBM Plex Mono",monospace; font-size:10px;
  letter-spacing:.06em; text-transform:uppercase; color:var(--muted);
  margin:0 0 6px}
.vpanel .vp-sec + .vp-sec{margin-top:12px; padding-top:10px;
  border-top:1px solid var(--rule)}
.vpanel .ovr{font-size:13.5px}
.vp-note{font-size:12px; color:var(--muted); margin:0 0 8px}
.vp-status{font-family:"IBM Plex Mono",monospace; font-size:10px;
  color:var(--ochre)}
.scl{padding:6px 8px; border:1px solid var(--rule); border-radius:3px;
  margin:0 0 6px; cursor:pointer; background:var(--bg, transparent)}
.scl:hover{border-color:var(--ochre)}
.scl.open{border-color:var(--ochre)}
.scl-top{display:flex; gap:8px; align-items:baseline}
.scl-f{font-family:"IBM Plex Mono",monospace; font-size:9.5px;
  text-transform:uppercase; letter-spacing:.05em; padding:0 5px;
  border-radius:8px; border:1px solid var(--rule); color:var(--muted);
  white-space:nowrap}
.scl-f.directive{color:#9a6b2f; border-color:#d9b98a}
.scl-f.assertion{color:#2f5d8a; border-color:#9dbad6}
.scl-t{font-size:13.5px}
.scl-l{display:flex; flex-wrap:wrap; gap:4px 10px; margin-top:4px;
  font-size:11.5px; color:var(--muted)}
.scl-l b{font-weight:600; color:var(--ink)}
/* a stamp page: shared features and the organise-by bar */
button.shared{font-size:12.5px; border:1px solid var(--rule); border-radius:8px;
  background:none; padding:1px 7px; margin:0 3px 4px 0; cursor:pointer; color:var(--ink);
  font-family:inherit}
button.shared.on, .orgby.on{border-color:var(--ochre, #8a4b12);
  background:color-mix(in srgb, var(--ochre, #8a4b12) 14%, transparent)}
.orgbar{font-size:13px; color:var(--muted); margin:6px 0 10px}
.orgby, .clearonly{font-size:12.5px; border:1px solid var(--rule); border-radius:8px;
  background:none; padding:1px 8px; margin-left:4px; cursor:pointer; color:var(--ink);
  font-family:inherit}
/* a clause as a role list (narrow screens) */
.rl{display:flex; gap:10px; align-items:baseline; padding:3px 0;
  border-bottom:1px dotted var(--rule); font-size:14px}
.rlr{flex:0 0 92px; font-size:11px; text-transform:uppercase; letter-spacing:.04em;
  color:var(--muted)}
.rlw{flex:1; min-width:0; overflow-wrap:anywhere}
.rlk{color:var(--ink); text-decoration:underline dotted; cursor:pointer}
/* the upper ontologies: nested plain lists */
.uptree{margin:4px 0 8px; padding-left:18px; font-size:13.5px; line-height:1.5}
.uptree .uptree{margin:2px 0 4px}
.upst{font-size:10.5px; color:var(--muted); border:1px solid var(--rule);
  border-radius:8px; padding:0 5px; margin-left:4px}
.uphead{font-size:11px; text-transform:uppercase; letter-spacing:.05em;
  color:var(--muted); margin:8px 0 2px}
/* a clause's tags: strength is the weight (high 1 / medium .67 / low .33) */
.scl-tags{display:flex; flex-wrap:wrap; gap:4px; margin-top:4px; align-items:center}
.ctag{font-size:11px; padding:0 6px; border-radius:8px; border:1px solid var(--rule);
  white-space:nowrap; color:var(--ink); background:none; font-family:inherit}
button.ctag{cursor:pointer}
button.ctag:hover{border-color:var(--ochre, #8a4b12)}
.ctag.high{background:color-mix(in srgb, var(--ochre, #8a4b12) 22%, transparent)}
.ctag.medium{background:color-mix(in srgb, var(--ochre, #8a4b12) 10%, transparent)}
.ctag.low{color:var(--muted); border-style:dashed}
.ctag.concept{font-style:italic}
.ctag-by{font-size:10.5px; color:var(--muted); margin-left:4px}
.scl-d{margin-top:8px; overflow-x:auto; cursor:default}
.scl-d svg{max-width:none}
/* In a clause diagram every node carries a mermaid `click` line, so mermaid
   hands them all a pointer; take it back and give it only to the words that
   have a card behind them, with a subtle hover cue. The !important beats the
   svg's own theme styles, which arrive after ours and can be id-scoped. */
.scl-d .node{cursor:default !important}
.scl-d .sw-link, .scl-d .sw-link *{cursor:pointer !important}
.scl-d .sw-link:hover > :first-child{stroke:var(--ochre) !important}
.scl-d .sw-link:hover .nodeLabel{color:var(--ochre) !important}

/* The left column is the Berean text; the links are a bonus laid over it and
   must not turn a page of prose into a field of blue -- so the words keep the
   ink colour and only the underline says "click". It was drawn in the rule
   colour, and too faint: 2026-10-05, the hyperlink underlines
   within the verse were made about as bold as the underlines of the orig ·
   struct · links at the verse end, because readers did not see
   them. So the same dotted slate as those. */
a.ph{color:inherit; text-decoration:none; border-bottom:1px dotted var(--slate);
     text-decoration-skip-ink:auto}
a.ph:hover{border-bottom-color:var(--ochre); color:var(--ochre)}

/* The original leads each example on the word card; the English follows it,
   smaller, as the reading rather than the evidence. */
.porig{font-family:"Noto Serif Hebrew",Spectral,serif; font-size:16px;
  line-height:1.5; margin:0 0 3px}
.porig.rtl{direction:rtl}
/* Each original word is a little stack: the word, how to say it, what it
   means. inline-flex so the stacks flow along the line instead of each
   becoming its own row -- the same trap the reader's `.ow` hit. */
.pwd{display:inline-flex; flex-direction:column; align-items:center;
  vertical-align:top; margin:0 7px 4px 0; direction:ltr}
.pwd .pw{font-family:"Noto Serif Hebrew",Spectral,serif; font-size:16px;
  line-height:1.3; color:var(--ink)}
.px{font-family:"IBM Plex Mono",monospace; font-size:9.5px; color:var(--ochre);
  line-height:1.25}
.pg{font-family:"IBM Plex Mono",monospace; font-size:9.5px; color:var(--muted);
  line-height:1.25; max-width:13ch; text-align:center; overflow-wrap:anywhere}
.pwd.on .pw{color:var(--ochre); font-weight:600}
/* THE ANCHOR ON A PATTERN CARD. 2026-09-19: the Hebrew is displayed
   prominently in the formula pattern as in the reader, with phonetic
   and English below it (the node representation of the word). Same markup as
   the reader's word node, larger, and a button because it opens the same
   card a reader gets by clicking the word in a verse. */
.anchorw{display:flex; gap:16px; align-items:stretch; flex-wrap:wrap;
  margin:0 0 16px}
/* The primary word and its evidence, bordered as one thing; the comparison
   sits outside it so the card's subject is unambiguous. */
.anchormain{border:1px solid var(--rule); border-radius:10px;
  padding:8px 14px 10px; background:var(--panel, transparent)}
.anchorrow{display:flex; gap:16px; align-items:center; flex-wrap:wrap}
.anchorcmp{display:flex; flex-direction:column; justify-content:center;
  align-items:flex-start}
.langtag{font-size:10px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--muted); margin:0 0 4px}
.cmpnote{font-size:10.5px; color:var(--muted); margin-top:4px}
.anchornode{background:none; border:1px solid var(--rule); border-radius:8px;
  padding:8px 14px; cursor:pointer}
.anchornode:hover{border-color:var(--ochre)}
.anchornode .porig{margin:0}
.anchornode .pwd .pw{font-size:26px; color:var(--ink)}
.anchornode .px{font-size:11px}
.anchornode .pg{font-size:11px}
.anchorside{font-size:13px; line-height:1.7}
.anchorside .g{color:var(--muted); margin-right:6px}
.eqarrow{color:var(--ochre); font-size:20px; margin:0 2px}
.plink{background:none; border:none; color:var(--ochre); cursor:pointer;
  font:inherit; padding:0; text-decoration:underline dotted}
.plink:hover{text-decoration:underline}
.anchorside .n{color:var(--muted); font-size:11px; margin-right:10px}
/* The list marker for a pattern the text uses in both testaments. */
.xnote{border-left:3px solid var(--ochre); padding:8px 0 8px 12px;
  margin:0 0 18px; max-width:66ch; font-size:14px; color:var(--muted)}
.xnote b{color:var(--ink); display:block; margin-bottom:3px}
.xshape{margin:16px 0 0}
.xlang{font-size:11px; letter-spacing:.06em; text-transform:uppercase;
  color:var(--ochre); margin:0 0 4px}
.xlang .g{color:var(--muted); text-transform:none; letter-spacing:0;
  margin-left:8px; font-size:11.5px}
/* The pattern's name, in the original. Larger than the row's English and set
   in a serif that carries Hebrew and Greek, because it is the title and the
   rendering below it is the note. */
.lexname{font-size:1.12em; letter-spacing:.01em}
/* Directly after the lexeme, not across the row: the two are one label read
   left to right. 2026-09-21: the English sits at the
   immediate right of the lexeme. */
.lexgloss{color:var(--muted); font-style:italic; font-size:.92em;
          margin-left:.55em}
.xmark.xm2{border-style:dashed; opacity:.8}
.xmark{display:inline-block; border:1px solid var(--ochre); color:var(--ochre);
  border-radius:3px; font-size:9.5px; padding:0 4px; margin-left:6px;
  letter-spacing:.04em; vertical-align:middle}
/* The Septuagint word on the word card, beside the lemma rather than in a
   collapsed section at the foot of the page. */
.eqrow{display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  margin:0 0 10px}
.eqrow > .g{color:var(--muted); font-size:13px; min-width:150px}
.eqnode{background:none; border:1px solid var(--rule); border-radius:6px;
  padding:4px 10px; cursor:pointer; display:inline-flex; align-items:center;
  gap:6px}
.eqnode:hover:not(.dead){border-color:var(--ochre)}
.eqnode.dead{cursor:default; opacity:.85}
.eqnode .porig{margin:0}
.eqnode .pwd .pw{font-size:17px; color:var(--ink)}
.eqnode .n{color:var(--muted); font-size:10px; vertical-align:super}
.eqrow .hint{font-size:12px}
/* A loanword: the text switching language mid-verse. */
.loanline{margin:0 0 14px; font-size:14px; color:var(--muted)}
.loanline .tag{display:inline-block; border:1px solid var(--ochre);
  color:var(--ochre); border-radius:4px; padding:1px 7px; font-size:11px;
  letter-spacing:.04em; text-transform:uppercase; margin-right:8px}
.loanline b{color:var(--ink)}
/* The two marks on an example's original strip. The anchor is what every
   instance of the pattern shares; the slot is what this one puts in the gap.
   Boxed rather than coloured, because a box says "this word" without claiming
   anything about the words beside it. */
.pwd.mk-anchor, .pwd.mk-slot{border-radius:5px; padding:2px 5px; margin:0 1px}
.pwd.mk-anchor{border:1.5px solid var(--ochre)}
.pwd.mk-anchor .pw{color:var(--ochre); font-weight:600}
.pwd.mk-slot{border:1.5px dashed var(--ink); opacity:.95}
.pwd.mk-slot .pw{font-weight:600}
.fillbar .pct{color:var(--muted); font-size:10.5px; margin-left:6px}
.refmore{background:none; border:1px dashed var(--rule); border-radius:5px;
  color:var(--muted); font-size:11px; padding:2px 9px; cursor:pointer;
  margin:0 0 4px 4px}
.refmore:hover{border-color:var(--ochre); color:var(--ochre)}
/* A book's verses are INSIDE that book, so they are set in. 2026-09-19:
   expanded books show some indentation. Without it the
   references sat flush with the book names above them and the list read as one
   flat run where it is two levels. */
details.bookgrp{border-left:2px solid transparent; padding-left:2px}
details.bookgrp[open]{border-left-color:var(--rule)}
details.bookgrp > summary{cursor:pointer; padding:4px 0 4px 8px; font-size:14px}
details.bookgrp > summary .g{color:var(--muted); font-size:12px; margin-left:8px}
details.bookgrp > .fillrefs{margin-left:22px; border-left-color:var(--rule)}
/* The translation's half of the mark. Underlined rather than boxed, so the
   prose still reads as prose while pointing at the same two things the
   original strip boxes above it. */
.pen .mk{border-bottom:2px solid transparent; padding-bottom:1px}
.pen .mk-anchor{border-bottom-color:var(--ochre); color:var(--ink);
  font-weight:600}
.pen .mk-slot{border-bottom-style:dashed; border-bottom-color:var(--ink);
  font-weight:600}
/* The verses belonging to one filler, indented under its bar so the grouping
   is visible rather than implied. */
.fillrefs{margin:2px 0 12px 14px; padding-left:10px;
  border-left:2px solid var(--rule)}
.fillrefs .occ{margin:0 4px 4px 0}
.pw{color:var(--muted)}
.pw.on{color:var(--ochre); font-weight:600}
.pen{display:block; font-size:12.5px; color:var(--muted); line-height:1.5}

/* All of a word's references at once. They are the INDEX to the examples, so
   they wrap tight and small; the verse itself opens underneath. */
.occgrid{display:flex; flex-wrap:wrap; gap:4px; margin:0 0 10px}
.occ{font-family:"IBM Plex Mono",monospace; font-size:11px; padding:2px 7px;
  border:1px solid var(--rule); border-radius:3px; color:var(--muted);
  background:var(--paper); cursor:pointer}
.occ:hover{border-color:var(--ochre); color:var(--ochre)}
.occ.on{border-color:var(--ochre); color:var(--ochre);
  background:var(--ochre-soft); font-weight:600}
.occshow{border-top:1px solid var(--rule); padding-top:10px}

/* The list block: filter, rows, and an honest footer.
   `chips` is for lists of reference buttons, which have to flow across the
   line rather than stack; the row wrapper steps out of the layout with
   display:contents so the buttons remain children of the flex container. */
.lb.chips .lbrows{display:flex; flex-wrap:wrap; gap:4px}
.lb.chips .lbrow{display:contents}
.lb.chips .lbrow[hidden]{display:none}
/* The list block: filter, rows, and an honest footer. */
.lbf{
  width:100%; max-width:22em; margin:0 0 10px; padding:6px 9px;
  border:1px solid var(--rule); border-radius:3px; background:var(--paper);
  font-family:inherit; font-size:12.5px; color:var(--ink);
}
.lbf:focus{outline:none; border-color:var(--ochre)}
.lbfoot{display:flex; align-items:center; gap:12px; margin:10px 0 0}
.lbmore{
  font-family:"IBM Plex Mono",monospace; font-size:11px; padding:4px 12px;
  border:1px solid var(--rule); border-radius:3px; background:var(--paper);
  color:var(--muted); cursor:pointer;
}
.lbmore:hover{border-color:var(--ochre); color:var(--ochre)}

/* A passage as an ordered column of actions. A rule down the left carries the
   eye through the order; the shaded rows are speech rather than narration. */
.seq{margin:6px 0 0}
.seqstep{display:flex; align-items:baseline; gap:10px; padding:3px 0}
.seqref{font-family:"IBM Plex Mono",monospace; font-size:10px;
  color:var(--muted); min-width:7em; text-align:right}
.seqbar{width:1px; align-self:stretch; background:var(--rule); flex:none}
.seqbody{font-size:13.5px; line-height:1.5}
.seqstep.spoken .seqbody{color:var(--muted); font-style:italic}
.seqrole{font-family:"IBM Plex Mono",monospace; font-size:9.5px;
  letter-spacing:.08em; text-transform:uppercase; color:var(--muted);
  margin:0 4px 0 10px}
.seqbtn{font-family:"IBM Plex Mono",monospace; font-size:10px;
  margin-left:6px; padding:1px 6px; border:1px solid var(--rule);
  border-radius:3px; background:var(--paper); color:var(--muted);
  cursor:pointer}
.seqbtn:hover{border-color:var(--ochre); color:var(--ochre)}

/* A collection's members, which are the point of the card. */
.memlist{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 0}
.mem{
  font-size:13px; padding:3px 10px; border:1px solid var(--rule);
  border-radius:12px; background:var(--paper); color:var(--ink);
}
/* on a list's card every member and move opens something (A.34) */
button.mem, button.move{font-family:inherit; cursor:pointer}
button.mem:hover, button.mem.on{border-color:var(--ochre); color:var(--ochre)}
button.mem.link{text-decoration:none; border-color:var(--ochre-soft, var(--rule))}
button.move{font-size:13px; padding:2px 0; border:0; background:none;
  color:var(--ochre); text-decoration:underline; text-underline-offset:3px}
.memlist > .peeked{flex-basis:100%}
/* A verb example: the grammar row, and the verse it came from underneath. */
.vex{margin:0 0 6px}
.vex .occshow{margin:6px 0 10px 0; border-top:0; padding-top:0}
.vex .rowline .occ{flex:none}

/* ONE box -- the section. Everything inside is a bracket: a pair of thin
   rules, no fill, no label, so three levels of nesting cost three hairlines
   instead of three borders. Depth is shown by how faint the rule is. */
.bx.sec{display:block; border:1px solid #6C7684; border-radius:3px; padding:8px}
.bx.openT{border-top:0; border-top-left-radius:0; border-top-right-radius:0}
.bx.openB{border-bottom:0; border-bottom-left-radius:0; border-bottom-right-radius:0}

.br{display:inline; padding:0 1px}
.br::before, .br::after{color:var(--muted); font-size:15px; vertical-align:-1px}
.br::before{content:"["}
.br::after{content:"]"}
.br.b1::before, .br.b1::after{opacity:.75}
.br.b2::before, .br.b2::after{opacity:.5}
.br.b3::before, .br.b3::after{opacity:.3}
.br:hover::before, .br:hover::after{color:var(--ochre); opacity:1}
.contin{color:var(--muted); font-size:12px; font-style:italic; margin:6px 0}

/* NOT a flex container. As flex, every word and every box became a flex item
   and shrank below its own content width, so a gloss like "In [the]
   beginning" was squeezed into a ~20px column and stacked one letter deep.
   Ordinary inline flow lets each word keep its natural width and wrap between
   words, which is what an interlinear is. */
.ovr{margin:3px 0; display:block}
.ovr.rtl{direction:rtl}
.ovn{color:var(--muted); font-size:11px; margin-right:4px;
     vertical-align:top; display:inline-block}
.oo{display:block; font-size:13px; line-height:1.25}
.og{display:block; font-size:9.5px; line-height:1.2; color:var(--muted)}

.chips{display:flex; flex-wrap:wrap; gap:5px; margin-bottom:8px}
/* Chips that sit where their evidence does, at the end of the verse that
   completes the pattern. Inline, so they read as a note on the line rather
   than a header over it. */
.endchips{display:inline-flex; flex-wrap:wrap; gap:4px; margin-left:8px;
          vertical-align:middle}
.chip{font-size:11px; padding:3px 8px; border-radius:11px; cursor:pointer;
      border:1px solid var(--rule); background:var(--surface); color:var(--muted)}
.chip:hover{border-color:var(--ochre); color:var(--ochre)}
/* a story shape's event cards, and its passages with no card (dashed) */
.shapechips{display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 12px}
.shapechips .chip{font-size:12px; color:var(--ink)}
.shapechips .chip.gap{border-style:dashed; color:var(--muted)}
/* a story pattern's stage beginning in the reader (plan A.9) */
.stchip{display:inline-block; font-family:'IBM Plex Mono', monospace; font-size:10.5px;
  letter-spacing:.02em; color:var(--ochre); border:1px solid var(--ochre-soft);
  background:var(--ochre-soft); border-radius:3px; padding:1px 6px; margin:0 6px 0 0;
  cursor:pointer; vertical-align:2px}
.stchip:hover{border-color:var(--ochre)}
/* a role pattern's part: the same chip, outlined rather than filled */
.stchip.role{background:transparent; color:var(--slate); border-color:var(--rule)}
/* a divine message: the same chip, in the ink of the text */
.stchip.msg{background:transparent; color:var(--ink); border-color:var(--ochre-soft); border-style:dashed}
/* a speech act: dotted, in slate, so it reads apart from a message (dashed)
   and a role (plain) */
.stchip.act{background:transparent; color:var(--slate); border-color:var(--slate); border-style:dotted}
/* a stage's own card: whose stage it is (templateBlock) */
.stagehead{border-left:3px solid var(--ochre); padding:4px 0 4px 12px; margin:8px 0 12px}
.stagehead .stageseq{margin-top:4px; font-size:15px}
/* the passage a "view in reader" opened, lit until the reader leaves its chapter */
.vs.hl{background:var(--ochre-soft); box-shadow:0 0 0 3px var(--ochre-soft); border-radius:2px}
/* a story pattern's instances, a column per stage (tplTable) */
.tplwrap{overflow-x:auto; margin:6px 0 4px}
.tpltab{border-collapse:collapse; font-size:14px; min-width:100%}
.tpltab th, .tpltab td{border-bottom:1px solid var(--rule); padding:6px 10px 6px 0;
  text-align:left; vertical-align:top; white-space:nowrap}
.tpltab thead th{font-family:'IBM Plex Mono', monospace; font-size:10.5px; font-weight:normal;
  letter-spacing:.08em; text-transform:uppercase; color:var(--slate)}
.tpltab tbody th{font-weight:normal; white-space:normal; min-width:150px; max-width:220px}
.tpltab .g{font-size:12px}
.tpltab .peekrow td{white-space:normal; padding:0 0 8px}
/* the table scrolls sideways; the verse stays in the visible part */
.tpltab .peekrow .peeked{position:sticky; left:0; max-width:min(620px, calc(100vw - 48px));
  box-sizing:border-box}
/* "+N more" that opens in place (moreJoin) */
.moreinl{display:inline}
.moreinl > summary{display:inline; cursor:pointer; color:var(--ochre); list-style:none;
  font-size:.9em}
.moreinl > summary::-webkit-details-marker{display:none}
.moreinl[open] > summary{display:none}
.shapechips .moreinl[open]{display:contents}
.patform{margin:.4em 0 .2em}
.slot{display:inline-block; border:1px solid var(--rule); border-radius:3px;
      padding:2px 8px; font-size:13px}
.arr{color:var(--muted); margin:0 4px}
.instlist{list-style:none; padding:0; margin:.3em 0; columns:2; column-gap:22px}
.instlist li{break-inside:avoid; margin:.2em 0; font-size:13px}
.fill{color:var(--muted); font-size:11.5px; margin-left:6px}
.explorebtn{
  padding:7px 14px; border:1px solid var(--rule); border-radius:3px;
  font-size:14px; color:var(--ink); background:var(--surface); white-space:nowrap;
}
.explorebtn:hover{background:var(--ochre-soft); border-color:var(--ochre); color:var(--ochre)}
.searchwrap{position:relative; flex:1 1 200px; min-width:150px; max-width:340px}
/* on a phone the name has the first row to itself, and search and the menu
   share the second -- the shorter name "Bible Ontology" otherwise let the
   search squeeze up beside it and pushed the menu onto a row of its own */
@media (max-width:767px){ .bar .brand{flex-basis:100%} }
/* Back sits on the name's row on a phone, and the strip's Back goes */
.barback, .barbreak{display:none}
@media (max-width:767px){
  .bar .brand{flex:1 1 auto; flex-basis:auto}
  .barback{display:inline-block; align-self:center; padding:5px 10px; font-size:13px;
    font-family:inherit; color:var(--slate); background:var(--paper); cursor:pointer;
    border:1px solid var(--rule); border-radius:14px}
  .barback[disabled]{opacity:.4; cursor:default}
  .barbreak{display:block; flex-basis:100%; height:0}
  .tabs .tabback{display:none}
}

/* The housekeeping control. Deliberately the quietest thing on the bar --
   muted, borderless until hovered, and last in the order -- because none of
   what it opens is part of reading. */
.morewrap{position:relative; margin-left:auto}
.morebtn{background:none; border:1px solid transparent; color:var(--muted);
  font-size:19px; line-height:1; padding:3px 9px 6px; border-radius:3px;
  cursor:pointer}
.morebtn:hover, .morebtn[aria-expanded="true"]{border-color:var(--rule);
  color:var(--ink)}
.moremenu{position:absolute; right:0; top:calc(100% + 6px); z-index:60;
  min-width:210px; background:var(--surface); border:1px solid var(--rule);
  border-radius:4px; box-shadow:0 6px 24px rgba(0,0,0,.12); padding:5px}
.moremenu [role="menuitem"]{display:block; width:100%; text-align:left; box-sizing:border-box;
  background:none; border:0; padding:8px 10px; border-radius:3px; text-decoration:none;
  font:inherit; font-size:14.5px; color:var(--ink); cursor:pointer}
.moremenu [role="menuitem"]:hover{background:var(--slate-soft)}
.moresep{height:1px; background:var(--rule); margin:5px 2px}
.morelab{font-family:"IBM Plex Mono",monospace; font-size:10.5px;
  letter-spacing:.1em; text-transform:uppercase; color:var(--muted);
  padding:4px 10px 3px}
.morenote{padding:2px 10px 8px; font-size:13px; color:var(--muted);
  max-width:200px; line-height:1.45}
/* the theme: the device's by default, or one chosen here (2026-10-13) */
.themeopts{display:flex; gap:4px; padding:2px 10px 8px}
.themeopts button{font:inherit; font-size:13.5px; flex:1; padding:5px 0; border:1px solid var(--rule);
  border-radius:3px; background:none; color:var(--ink); cursor:pointer}
.themeopts button[aria-pressed="true"]{border-color:var(--slate); background:var(--slate-soft)}

/* Coverage: two families of number that must never be added together. */
.covgrid{display:grid; grid-template-columns:1fr auto auto auto auto;
  gap:2px 18px; align-items:baseline; font-size:14px}
.covgrid.covgrid5{grid-template-columns:1fr auto auto auto auto auto; gap:2px 14px}
.covhead{font-family:"IBM Plex Mono",monospace; font-size:10.5px;
  letter-spacing:.1em; text-transform:uppercase; color:var(--muted);
  border-bottom:1px solid var(--rule); padding-bottom:4px; margin-bottom:4px}
.covyes{color:var(--ochre)}
.aboutnum{display:grid; grid-template-columns:auto 1fr; gap:3px 14px;
  font-size:14.5px; margin:0 0 14px}
.aboutnum b{font-weight:600}
/* ABOUT'S PRIMER (2026-10-20: the schema map mock belongs in the
   About view): five tiles, one verse down the layers, four standings. No script */
.amap{--st:#1F6B47; --de:var(--ochre); --he:#8C8C8C; --sp:#6A3D7A; margin-bottom:14px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .amap{--st:#6CCB98; --he:#7E8792; --sp:#C49AD6}}
:root[data-theme="dark"] .amap{--st:#6CCB98; --he:#7E8792; --sp:#C49AD6}
.amap .tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px; margin:8px 0 14px}
.amap .tile{background:var(--surface); border:1px solid var(--rule); border-radius:12px; padding:10px 12px;
  display:flex; flex-direction:column}
.amap h3, .pane .amap h3{font:600 15px Spectral,Georgia,serif; text-transform:none; letter-spacing:0;
  color:var(--ink); margin:0}
.amap .tile .n{font:600 20px system-ui,sans-serif; color:var(--slate)}
.amap .tile .n small{font-size:12.5px; font-weight:400; color:var(--muted)}
.amap .tile p{margin:5px 0; font-size:14px}
.amap .tile .ex{font-size:13px; color:var(--muted); border-top:1px dashed var(--rule); padding-top:5px; margin-top:auto}
.amap .go{align-self:flex-start; margin-top:6px; font:13px system-ui,sans-serif; color:var(--slate);
  background:none; border:0; padding:0; cursor:pointer; text-align:left}
.amap .go:hover{text-decoration:underline}
.amap details.term{font:12px ui-monospace,Consolas,monospace; color:var(--muted); margin-top:5px}
.amap details.term summary{cursor:pointer; font:12.5px system-ui,sans-serif; color:var(--slate)}
.amap .svgwrap{overflow-x:auto; background:var(--surface); border:1px solid var(--rule); border-radius:12px; padding:10px}
.amap svg{display:block; width:100%; height:auto; min-width:540px}
.amap svg text{font-family:Georgia,serif; fill:var(--ink)}
.amap svg .sm{font:12px system-ui,sans-serif; fill:var(--muted)}
.amap svg .lbl{font:600 13px system-ui,sans-serif}
.amap svg .box{fill:var(--surface); stroke:var(--rule); stroke-width:1.5}
.amap svg .layer{fill:var(--slate-soft)}
.amap .legend{display:flex; flex-wrap:wrap; gap:14px; font:13px system-ui,sans-serif; color:var(--muted); margin:12px 0 0}
.amap .legend span{display:inline-flex; align-items:center; gap:6px}
.amap .legend i{display:inline-block; width:32px; border-top:3px solid}
.amap .compare{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px; margin-top:10px}
.amap .claim{background:var(--surface); border:1px solid var(--rule); border-left-width:5px; border-radius:12px; padding:10px 12px}
.amap .claim.k-st{border-left-color:var(--st)} .amap .claim.k-de{border-left-color:var(--de)}
.amap .claim.k-he{border-left-color:var(--he)} .amap .claim.k-sp{border-left-color:var(--sp)}
.amap .claim h3{font-size:15px; margin:2px 0}
.amap .claim .verse{font-size:13px; color:var(--muted); font-style:italic; margin:3px 0}
.amap .claim .tag{font:600 11.5px system-ui,sans-serif; text-transform:uppercase; letter-spacing:.04em}
.amap .claim.k-st .tag{color:var(--st)} .amap .claim.k-de .tag{color:var(--de)}
.amap .claim.k-he .tag{color:var(--he)} .amap .claim.k-sp .tag{color:var(--sp)}
.amap .claim ul{margin:5px 0 0; padding-left:18px; font-size:14px}
#q{
  width:100%; padding:8px 12px; border:1px solid var(--rule); border-radius:3px;
  background:var(--paper); color:var(--ink); font-size:15px; font-family:inherit;
}
#q::placeholder{color:var(--muted)}
.finderlist{display:flex; flex-direction:column}
.fr{display:block; width:100%; text-align:left; padding:10px 4px;
  border-bottom:1px solid var(--rule)}
.fr:hover{background:var(--slate-soft)}
.fr .t{font-size:15.5px}
.fr .s{font-size:12.5px; color:var(--muted)}
.results{
  position:absolute; top:calc(100% + 6px); left:0; right:0; z-index:40;
  background:var(--surface); border:1px solid var(--rule); border-radius:3px;
  box-shadow:0 8px 24px var(--shadow); max-height:60vh; overflow:auto;
}
.results button{
  display:block; width:100%; text-align:left; padding:9px 13px;
  border-bottom:1px solid var(--rule);
}
.results button:last-child{border-bottom:0}
.results button:hover,.results button:focus{background:var(--slate-soft)}
/* the suggestion Enter opens (Tab / Shift-Tab move it) */
.results button.sel{background:var(--slate-soft); box-shadow:inset 3px 0 0 var(--ochre)}
.results .t{font-size:15.5px; display:flex; flex-wrap:wrap; gap:8px;
  align-items:baseline}
/* Two lines, hard. One entity's description runs to a full screen of prose and
   it filled the whole dropdown, hiding every other result behind the first. */
.results .s{font-size:12.5px; color:var(--muted); display:-webkit-box;
  -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
/* The word behind the name, so ten rows reading "God" are ten distinct rows. */
.rorig{font-size:16px; color:var(--ink)}
.rtr{font-size:12px; color:var(--muted); font-style:italic}
.raka{font-size:11.5px; color:var(--ochre); margin-top:2px}
.rnone{padding:10px 12px; font-size:13.5px; line-height:1.45; color:var(--muted)}

/* the one lever */
.lever{display:flex; align-items:center; gap:0; border:1px solid var(--rule); border-radius:3px; overflow:hidden}
.lever button{
  padding:7px 13px; font-size:13px; color:var(--muted); white-space:nowrap;
  border-right:1px solid var(--rule);
}
.lever button:last-child{border-right:0}
.lever button[aria-pressed="true"]{background:var(--ochre-soft); color:var(--ochre); font-weight:600}

/* ---------- panes ---------- */
.panes{display:grid; grid-template-columns:1fr; overflow:hidden}

.reader{overflow:auto; padding:26px clamp(14px, 3vw, 40px) 120px}
.readerinner{max-width:38em; margin:0 auto}

/* THE HEADER BLOCK HOLDS; ONLY THE TEXT SCROLLS. 2026-09-15: scrolling
   starts below the headings and chapter selector.

   Both live inside `main.reader`, which is the scroll container, so both used
   to scroll away -- and losing the chapter selector while reading is the worst
   of it, because changing chapter then means scrolling back up first.

   Two sticky layers rather than one, because the tab strip and the chapter
   head are rendered by different paths and cannot share a wrapper. The strip
   WRAPS to two rows on a narrow window, so its height is measured into
   `--tabsH` rather than assumed; see stickyHead(). Backgrounds are opaque or
   the text scrolls through them. */
/* ONE ROW, AND NO GAP ABOVE IT. The UI committee, 2026-09-30: text scrolled
   up into the reader's 26px top padding and showed half-cut above the strip
   (a sticky element pins inside the padding), and nine open cards wrapped the
   strip to three rows, about 110px of every screen. So the strip reaches up
   over the padding (top, padding and margin of -26/26/-26 cancel in the
   layout), and it stays one row, scrolling sideways, with the open tab
   brought into view (openTab). */
.tabs{display:flex; gap:4px; flex-wrap:nowrap; overflow-x:auto; overflow-y:hidden;
  margin:-26px auto 20px; padding-top:26px;
  max-width:1500px; border-bottom:1px solid var(--rule); padding-bottom:0;
  position:sticky; top:-26px; z-index:6; background:var(--paper)}
.tabs > *{flex:0 0 auto}
/* a hairline to scroll by, not a Windows scrollbar with arrows */
.tabs::-webkit-scrollbar{height:3px}
.tabs::-webkit-scrollbar-thumb{background:var(--rule); border-radius:2px}
@supports not selector(::-webkit-scrollbar){ .tabs{scrollbar-width:thin} }
.chaphead{position:sticky; top:var(--tabsH, 46px); z-index:5;
  background:var(--paper); padding-bottom:10px}
.tab{
  display:flex; align-items:center; gap:8px; padding:7px 12px; font-size:13.5px;
  border:1px solid var(--rule); border-bottom:0; border-radius:3px 3px 0 0;
  color:var(--muted); background:var(--paper); position:relative; top:1px;
  max-width:22em;
}
.tab .lbl{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
/* The permanent tabs read as fixtures rather than things you opened: darker
   ground, and no close control. */
.tab.perm{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.tabback{align-self:center; margin:0 6px 2px 0; padding:5px 10px; font-size:13px;
  position:sticky; left:0; z-index:2; box-shadow:-8px 0 0 var(--paper);
  font-family:inherit; color:var(--slate); background:var(--paper); cursor:pointer;
  border:1px solid var(--rule); border-radius:14px}
.tabback:hover:not([disabled]){border-color:var(--ochre); color:var(--ochre)}
.tabback[disabled]{opacity:.4; cursor:default}
/* THE PAGE'S OWN COLOUR, not #fff. In dark mode --ink turns light, so white
   on it was unreadable (2026-10-16: in dark mode the white tab text
   when highlighted was hard to read, on Explore and Reader);
   --paper is near-black there and near-white in light mode. */
.tab.perm[aria-selected="true"]{background:var(--ink); color:var(--paper);
  border-color:var(--ink); font-weight:700}
.tab[aria-selected="true"]{background:var(--surface); color:var(--ink);
  border-color:var(--rule); font-weight:600}
.tab .x{font-size:15px; line-height:1; color:var(--muted); padding:0 2px}
.tab .x:hover{color:var(--ochre)}
/* Fill a wide screen, shrink to a phone -- but never stretch running text.
   The content widens on a big screen and shrinks to fit a phone. So the PANE grows and the reading measure does not: prose stays
   near 65 characters, while diagrams, strips, tables and lists take the room. */
.paneinner{max-width:1500px; margin:0 auto; width:100%}
.vline{max-width:42em}
.pane .lead, .pane p{max-width:70ch}
.paneinner .readerinner{max-width:none}

.pane h1{font-size:27px; font-weight:600; letter-spacing:-.015em; margin:0 0 4px}
.pane .kind{font-family:"IBM Plex Mono",monospace; font-size:10.5px;
  letter-spacing:.16em; text-transform:uppercase; color:var(--ochre); margin:0 0 10px}
.pane .lead{color:var(--muted); margin:0 0 22px; max-width:60ch}
.pane h3{font-size:13px; font-family:"IBM Plex Mono",monospace; letter-spacing:.1em;
  text-transform:uppercase; color:var(--muted); margin:28px 0 12px; font-weight:400}
.fillbar{display:flex; align-items:center; gap:10px; padding:6px 0;
  border-bottom:1px solid var(--rule)}
.fillbar .w{flex:none; width:11em; overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap}
.fillbar .bar{height:8px; background:var(--ochre); border-radius:2px; min-width:2px}
.fillbar .n{font-family:"IBM Plex Mono",monospace; font-size:12px;
  color:var(--muted); margin-left:auto}
.uses{display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:6px}
.use{
  font-family:"IBM Plex Mono",monospace; font-size:12px; padding:5px 8px;
  border:1px solid var(--rule); border-radius:3px; color:var(--muted);
  background:var(--surface); text-align:center;
}
.use:hover{border-color:var(--ochre); color:var(--ochre)}
.bookgrp{margin:0 0 16px}
.usewrap{display:contents}
.uses{align-items:start}
.use.on{border-color:var(--ochre); color:var(--ochre); background:var(--ochre-soft)}
/* the marks beside the Berean's words (vtext): an asterisk for a finding on
   the original, a dagger for the Berean's manuscript note */
.vmark{border:0; background:none; padding:0 1px; margin:0; font:inherit; font-size:.78em;
  line-height:1; vertical-align:super; color:var(--ochre); cursor:pointer; font-weight:600}
.vmark:hover, .vmark[aria-expanded="true"]{text-decoration:underline}
.vnote{display:block; margin:4px 0 8px; padding:6px 10px; font-size:13.5px; line-height:1.45;
  background:var(--ochre-soft); border-left:2px solid var(--ochre); font-style:normal}
.peeked{grid-column:1/-1; padding:10px 12px; margin:2px 0 8px;
  background:var(--surface); border:1px solid var(--rule); border-radius:3px;
  font-size:15.5px; line-height:1.55}
.peeked .goto{display:block; margin-top:8px; font-family:"IBM Plex Mono",monospace;
  font-size:11.5px; color:var(--slate); border:1px solid var(--rule);
  border-radius:3px; padding:4px 9px}
.peeked .goto:hover{border-color:var(--slate); background:var(--slate-soft)}
.qrow{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:0 0 14px}
.qrow input{flex:1 1 190px; padding:8px 11px; border:1px solid var(--rule);
  border-radius:3px; background:var(--paper); color:var(--ink);
  font-family:inherit; font-size:15px}
.qlab{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--slate)}
.qcount{font-family:"IBM Plex Mono",monospace; font-size:11.5px;
  color:var(--muted); margin:0 0 10px}
.qres{padding:10px 0; border-bottom:1px solid var(--rule)}
.qres .g{font-size:12.5px; color:var(--muted); margin-left:8px}
.slotname{font-family:"IBM Plex Mono",monospace; font-size:11.5px;
  color:var(--slate); letter-spacing:.08em; margin:10px 0 4px}
.menuwrap{position:relative}
.menuwrap .results{min-width:250px; left:auto; right:0}
.identbox{border:1px solid var(--ochre); border-radius:3px; padding:16px 18px;
  margin:0 0 20px; background:var(--surface)}
.identhead{font-family:"IBM Plex Mono",monospace; font-size:11px;
  letter-spacing:.12em; text-transform:uppercase; color:var(--ochre);
  display:flex; flex-wrap:wrap; gap:10px; align-items:baseline; margin:0 0 8px}
.overlay{font-size:10px; letter-spacing:.06em; color:var(--muted);
  text-transform:none; border:1px solid var(--rule); border-radius:9px;
  padding:1px 8px}
.idrow{padding:7px 0; border-bottom:1px solid var(--rule)}
.idrow:last-child{border-bottom:0}
.idnote{font-size:13.5px; color:var(--muted); margin-top:3px; max-width:64ch}
.apart{margin-top:14px; padding-top:12px; border-top:2px solid var(--slate)}
.aparthead{font-family:"IBM Plex Mono",monospace; font-size:11px;
  letter-spacing:.12em; text-transform:uppercase; color:var(--slate); margin:0 0 6px}
.idfoot{font-size:13px; color:var(--muted); margin:10px 0 0; max-width:64ch}
.alsobox{background:var(--slate-soft); border:1px solid var(--rule);
  border-left:3px solid var(--slate); border-radius:3px; padding:15px 18px;
  margin:0 0 20px}
.alsodesc{font-size:14px; color:var(--muted); margin:0 0 8px; max-width:64ch}
.origbox{background:var(--surface); border:1px solid var(--rule);
  border-left:3px solid var(--ochre); border-radius:3px; padding:16px 18px;
  margin:0 0 20px}
.origname{display:flex; align-items:baseline; gap:14px}
.origname .heb{font-size:30px; color:var(--ochre)}
.origmeta{font-family:"IBM Plex Mono",monospace; font-size:11.5px;
  color:var(--muted); margin-top:5px}
.origbox .tg{margin-top:12px}
/* the lighter folds (details.sub) are level 2 of the card sections, styled
   with them below (option D) */
/* a count: plain, beside its label, never letter-spaced or capitalised */
.ct{font:400 var(--fs-data)/1 var(--ff-data); font-variant-numeric:tabular-nums;
  letter-spacing:0; text-transform:none; color:var(--muted); margin-left:.1em; flex:none}
.ct:empty{display:none}
/* (a stray quote had hidden this block since it was written; the two-column
   fold it held is left out -- it never rendered, and D's guide lines read
   down one column) */
@media (min-width:1100px){
  .uses{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
}
.relrow{display:flex; flex-wrap:wrap; align-items:baseline; gap:8px 12px;
  padding:8px 0; border-bottom:1px solid var(--rule)}
.relrow .rl{font-family:"IBM Plex Mono",monospace; font-size:11.5px;
  color:var(--muted); min-width:12em}
/* a story echo's words side by side, on their own line under the link */
.relrow .echopair{flex-basis:100%; display:grid; grid-template-columns:1fr auto 1fr;
  gap:4px 12px; align-items:start; font-size:13.5px; line-height:1.5; padding-left:12px;
  border-left:2px solid var(--rule)}
.relrow .echoat{font-size:12.5px; margin-top:2px}
@media (max-width:520px){ .relrow .echopair{grid-template-columns:1fr} }
/* the reader's "what the originals share": an explanation under a link, an
   image's members, a story's beats side by side (2026-10-04) */
.echo .expl{font-size:13.5px; line-height:1.55; margin-top:4px}
.echo .nodename{font-weight:600; color:var(--ochre); margin-bottom:2px}
.echo .nodemember{margin:2px 0}
.echo .beatpair{display:grid; grid-template-columns:1fr auto 1fr; gap:4px 12px;
  font-size:13.5px; line-height:1.5; margin:4px 0; padding-left:10px;
  border-left:2px solid var(--rule)}
@media (max-width:520px){ .echo .beatpair{grid-template-columns:1fr} }
.phrase{display:flex; gap:12px; padding:9px 0; border-bottom:1px solid var(--rule);
  align-items:baseline; line-height:1.55}
.phrase b{color:var(--ochre); font-weight:600}
.phrase .use{flex:none}
.translit{font-style:italic; color:var(--ochre)}
.lexdef{font-size:15px; color:var(--muted); max-width:62ch; line-height:1.6;
  border-left:2px solid var(--rule); padding-left:14px; margin:0}
.bookgrp .bname{font-size:13px; color:var(--ink); margin:0 0 6px; font-weight:600}

.chaphead{display:flex; align-items:flex-start; gap:18px; margin:0 0 20px;
  flex-wrap:wrap}
.chaptitle{flex:1 1 320px; min-width:0}
.chaphead h1{font-size:30px; font-weight:600; letter-spacing:-.015em; margin:0}
.chaphead .hint{margin:5px 0 0; max-width:52ch}
.chaphead .chapnav{flex:0 0 auto; padding-top:7px}
/* Tree mode. The caret only exists where there is something to fold, so a
   verse with no dependents shows none and the eye is not asked to scan
   disclosure triangles that do nothing. */
/* An explicit `display` BEATS the browser's default [hidden]{display:none},
   so anything laid out with flex must opt back in or `el.hidden = true` sets
   the attribute and changes nothing on screen. Folding a group looked like it
   worked -- the class flipped, the caret turned -- while every verse stayed
   visible. */
.grp-b[hidden],.v[hidden]{display:none !important}

.caret,.gcaret{border:0; background:none; cursor:pointer; padding:0 4px 0 0;
  font-size:10px; line-height:1.6; color:var(--slate, #6b7a86); opacity:.55;
  font-family:inherit}
.caret:hover,.gcaret:hover{opacity:1}
.caret{align-self:flex-start; padding-top:.35em}
body:not(.treemode) .caret,body:not(.treemode) .gcaret{display:none}
.v.folded > .vt > .vline{opacity:.86}
.v.folded::after{content:"+" attr(data-kids); font-family:ui-monospace,monospace;
  font-size:9px; color:var(--slate,#6b7a86); opacity:.6; margin-left:6px}
.grp.folded{opacity:.72}
.grp.folded .grp-h{margin-bottom:0}
.modebtn[aria-pressed="true"]{background:var(--slate-soft, #e8eaed);
  color:var(--ink, #16181a)}

.v.d1{margin-left:20px} .v.d2{margin-left:40px} .v.d3{margin-left:60px}
.v.d4{margin-left:80px} .v.d5{margin-left:100px} .v.d6{margin-left:120px}
.v[class*=" d"]:not(.d0){position:relative}
.v.d1::before,.v.d2::before,.v.d3::before,.v.d4::before,.v.d5::before,
.v.d6::before{content:""; position:absolute; left:-11px; top:.72em; width:7px;
  height:1px; background:var(--slate, #6b7a86); opacity:.45}
.limb{margin:0 0 9px; line-height:1.62}
.limb.l1{margin-left:22px} .limb.l2{margin-left:44px} .limb.l3{margin-left:66px}
.limb.l4{margin-left:88px} .limb.l5{margin-left:110px} .limb.l6{margin-left:132px}
.limb[hidden]{display:none !important}
.vnum{font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:9.5px;
  color:var(--slate, #6b7a86); opacity:.68; vertical-align:.42em;
  margin-right:3px; cursor:pointer}
.vnum:hover{opacity:1; color:var(--accent, #a9662a)}
.grp-span{font-family:ui-monospace,monospace; font-size:9.5px; opacity:.45;
  margin-left:auto; white-space:nowrap}
.grp-tools{display:flex; gap:5px}
.gsub{margin:0 0 10px; padding-left:10px;
  border-left:1px solid var(--rule, #ddd8cc)}
.gsubn{font-family:ui-monospace,monospace; font-size:9px; opacity:.5;
  display:block; margin-bottom:2px}
.att-s{font-style:italic; text-transform:none; letter-spacing:.02em}
.att{font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:9px;
  letter-spacing:.06em; text-transform:uppercase; color:var(--slate, #6b7a86);
  opacity:.7; align-self:flex-start; padding-top:.35em; white-space:nowrap}

/* GROUPS. The chapter is a stack of bounded blocks, not a run of verses with
   rules between them. The left edge carries the provenance: a Berean section
   heading reads loudest because an editor committed to a title, our own
   derived seam is named by the evidence that produced it, and a borrowed
   paragraph break is quietest — it is the editor's opinion, not our finding,
   and three quarters of them are borrowed. */
.grp{margin:0 0 22px; padding-left:14px;
  border-left:2px solid var(--rule, #ddd8cc)}
.grp-heading{border-left-color:var(--accent, #a9662a)}
.grp-derived{border-left-color:var(--slate, #6b7a86)}
.grp-bsb{border-left-color:var(--rule, #ddd8cc)}
.grp-open{border-left-color:transparent; padding-left:0}
.grp-h{display:flex; align-items:baseline; gap:9px; margin:0 0 7px;
  min-height:15px}
.grp-open .grp-h{display:none}
.grp-b{display:flex; flex-direction:column}
.seam-l{font-size:12px; letter-spacing:.02em}
.seam-n{font-size:10px; letter-spacing:.08em; text-transform:uppercase;
  opacity:.55; white-space:nowrap}
.grp-heading .seam-l{font-weight:600; font-size:16px; letter-spacing:-.006em;
  font-family:Spectral, Georgia, serif}
.grp-derived .seam-l{font-family:ui-monospace,"SF Mono",Menlo,monospace;
  font-size:11px; color:var(--slate, #6b7a86)}
.grp-bsb .seam-l{font-size:10px; letter-spacing:.08em;
  text-transform:uppercase; opacity:.6}

.chapnav{display:flex; gap:4px; margin-left:auto; align-items:center}
/* Back and Prev do different things, so they do not read as a pair: a gap and
   a rule separate the history move from the chapter move. */
.chapnav .back{margin-right:10px; position:relative}
.chapnav .back::after{content:""; position:absolute; right:-6px; top:3px;
  bottom:3px; width:1px; background:var(--rule)}
.chapnav button{
  padding:4px 11px; border:1px solid var(--rule); border-radius:3px; font-size:13px;
  color:var(--muted);
}
.chapnav button:hover{background:var(--slate-soft); color:var(--ink)}
.hint{color:var(--muted); font-size:13.5px; margin:0 0 22px}
/* how a line was found: a quiet marker that opens to one short phrase */
details.prov{display:inline; color:var(--muted); font-size:12.5px}
details.prov summary{display:inline; cursor:pointer; list-style:none; padding:0 3px; opacity:.75}
details.prov summary::-webkit-details-marker{display:none}
details.prov summary:hover, details.prov[open] summary{opacity:1; color:var(--ochre)}
details.prov span{margin-left:2px; font-style:italic}

/* One column: an expansion belongs to its verse and sits under it. */
.v{margin:0 0 18px; display:flex; gap:11px; align-items:baseline}
.vtools{display:flex; align-items:center; gap:8px; margin-top:5px; flex-wrap:wrap}
.tg{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.06em;
  color:var(--muted); border:1px solid var(--rule); border-radius:10px; padding:2px 9px}
.tg:hover{border-color:var(--ochre); color:var(--ochre)}
.tg.on{background:var(--ochre-soft); border-color:var(--ochre); color:var(--ochre)}
.exp{margin-top:8px}
.exp[hidden]{display:none}
.vn{
  font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--muted);
  flex:none; width:2.1em; text-align:right; padding-top:.35em; cursor:pointer;
}
.vn:hover{color:var(--ochre)}
.vt{flex:1}
/* A word that is clickable must LOOK clickable. Tying this to the density
   lever left every link active and invisible once the lever became a default
   rather than a lock. */
mark.m{
  background:none; color:inherit; cursor:pointer; padding-bottom:1px;
  border-bottom:1px dotted var(--ochre);
}
mark.m.proper{color:var(--ochre); font-weight:600; border-bottom-color:transparent}
mark.m:hover{background:var(--ochre-soft); border-bottom-style:solid}

/* the original beside the translation — hidden in Plain, so reading stays reading */
.origstrip{display:flex; flex-wrap:wrap; gap:4px 12px; margin:9px 0 4px;
  padding:9px 11px; background:var(--surface); border:1px solid var(--rule);
  border-radius:3px}
.origstrip.rtl{direction:rtl}

/* INLINE-FLEX, not flex. As a block-level flex box every word became its own
   line inside a structure box, and the box's max-content collapsed to the
   width of its widest word rather than the sum -- which is why the two-column
   reader stacked five words down a 108px column instead of laying them across
   a 974px one. The column direction is what stacks the word over its gloss,
   and that is wanted; being block-level was not. */
.ow{display:inline-flex; flex-direction:column; align-items:center;
  vertical-align:top; cursor:pointer;
  padding:2px 4px; border-radius:2px; direction:ltr}
.ow:hover{background:var(--ochre-soft)}
.oo{font-family:"Noto Serif Hebrew",Spectral,serif; font-size:17px; line-height:1.35}
/* `max-width:12ch` capped the BOX but nothing let the text break, and MACULA's
   Hebrew glosses are dot-joined with no spaces, so 33 of Genesis 1's 701
   glosses ran up to 50px past their box and printed over their neighbours.
   Reported 2026-09-15: English words overlapped under the original
   language.
   `gloss()` turns those dots into real spaces, which is what actually fixes
   it. `overflow-wrap` stays as the guarantee for the remaining case a space
   cannot help -- a single word wider than the box. */
.og{font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--muted);
  line-height:1.3; max-width:12ch; text-align:center; overflow-wrap:anywhere}
.ow.verb .oo{color:var(--ochre)}

.pats{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 6px}
/* connections under a verse: echoes, the thread, mined patterns */
.echo{margin:6px 0; line-height:1.45}
.echo.reading{border-left:3px solid var(--accent, #8a4b12); padding-left:8px}
.echo .rk{font-size:.8em; text-transform:uppercase; letter-spacing:.04em;
  color:var(--accent, #8a4b12); margin-right:4px}
.echo .hint{margin:2px 0 0 2px; font-size:13px}
.echo.here{border-left:3px solid var(--accent, #8a4b12); padding-left:8px}
.vp-h2{font-size:13px; font-weight:600; margin:12px 0 4px; color:var(--muted)}
.examples .ex{margin:4px 0 4px 14px; font-size:15px; line-height:1.45}
.saying{border-left:3px solid var(--accent, #8a4b12); padding:4px 0 6px 10px;
        margin:6px 0 10px; font-size:15px}
.saying .ex{margin:4px 0}
details.dig, details.thread{margin:10px 0}
details.dig > summary, details.thread > summary{cursor:pointer; color:var(--muted); font-size:14px}
/* A LEVEL DOWN SHOWS ITS RULE. The UI committee, 2026-09-30: the less-certain
   matches opened flush to the edge, reading as siblings of the certain ones
   above -- the one nested fold on the cards without the indentation line. */
details.dig > .digbody{margin-left:14px; padding:2px 0 2px 16px; border-left:1px solid var(--rule)}
.pat{
  font-family:"IBM Plex Mono",monospace; font-size:11px; padding:3px 9px;
  border:1px solid var(--rule); border-radius:11px; color:var(--muted);
  background:var(--surface);
}
.pat:hover{border-color:var(--ochre); color:var(--ochre)}
.pat.formula{border-style:dashed}
.pat.local{border-color:var(--slate); color:var(--slate)}

.struct{margin:0 0 6px}
.sheetbox{
  background:var(--surface); border:1px solid var(--rule); border-radius:3px;
  padding:12px 10px 8px; box-shadow:0 1px 2px var(--shadow); overflow-x:auto;
}
/* (two stray quotes had hidden these rules and the one after them; revived
   without max-width, which the live site never had -- a wide diagram scrolls
   rather than shrinking: legibility beats fitting) */
.sheetbox svg{display:block; margin:0 auto}
.sheetbox.wide{overflow-x:auto}
.graphnote{font-family:"IBM Plex Mono",monospace; font-size:11px;
  color:var(--muted); padding:8px 4px 0}
.sheetbox.wide svg{max-width:none; margin:0}
.structnote{
  font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--muted);
  padding:6px 4px 0;
}

/* ---------- card stack ---------- */
.stack{
  border-left:1px solid var(--rule); background:var(--surface);
  display:flex; flex-direction:column; overflow:hidden;
}
@media (max-width:999px){
  .stack{
    position:fixed; inset:auto 0 0 0; height:min(74vh,620px); z-index:50;
    border-left:0; border-top:1px solid var(--rule);
    border-radius:12px 12px 0 0; box-shadow:0 -8px 30px var(--shadow);
    transform:translateY(102%); transition:transform .22s ease;
  }
  .stack.open{transform:translateY(0)}
  .grabber{width:38px; height:4px; border-radius:2px; background:var(--rule); margin:8px auto 0}
}
@media (min-width:1000px){ .grabber{display:none} }
.stackhead{
  display:flex; align-items:center; gap:10px; padding:11px 16px;
  border-bottom:1px solid var(--rule);
}
.stackhead .crumb{font-size:12.5px; color:var(--muted); flex:1; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap}
.stackhead button{padding:4px 9px; border:1px solid var(--rule); border-radius:3px;
  font-size:12.5px; color:var(--muted)}
.cardwrap{overflow:auto; padding:18px 18px 40px; flex:1}
.empty{color:var(--muted); font-size:15px; padding:22px 18px; line-height:1.7}
.empty b{color:var(--ink); font-weight:600}

.card h2{font-size:23px; font-weight:600; margin:0 0 2px; letter-spacing:-.01em}
.card .kind{
  font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--ochre); margin:0 0 10px;
}
.card .lead{color:var(--muted); margin:0 0 16px; font-size:15.5px}
.heb{font-family:"Noto Serif Hebrew",Spectral,serif}

/* NESTED SECTIONS READ AS A GROUP. 2026-09-16: the 7 patterns are indented
   under the one section so the grouping is apparent when open.

   Opened, the seven pattern layers looked like seven peers of the group that
   contains them, because every `details.sec` carries the same top rule at the
   same margin. Indenting them and running a rule down the left says these
   belong to the section above; the top rule comes off so the left rule is the
   only boundary the eye follows. */
/* EVERY OPENING INDENTS, BEHIND A LINE. 2026-10-01: each time a plus in the
   tree hierarchy opens, all of the expanded content below it is
   indented to the right of an additional indentation line; before, it was hit
   and miss. This is fundamental readability for a tree structure,
   particularly when the headers are as unassuming as they are in this app.
   The rule used to sit on a NESTED section, beside its own header -- so a
   top-level section's contents ran flush with its header, and rows and
   sections inside one body sat at different depths. Now the line belongs to
   the opened BODY, under its + : one more level of depth, one more line, at
   every level, on Explore and on every card alike. A nested section is just a
   row in its parent's body (no rule of its own, no top rule). */
/* OPTION D (2026-10-13: the recommended option; docs/review/CARD-SECTIONS.md).
   The labels were 13px grey monospace capitals, quieter than the rows under
   them; level 2 was styled exactly as level 1, because `details.sec summary`
   matched every summary inside. Now: serif sentence case in ink, one chevron
   that turns, the count beside the label, and a closed heading previews what
   is inside (.pv). Child selectors only, so levels cannot bleed again. The
   2026-10-01 rule stands: every opening indents behind a line. */
details.sec{border-top:1px solid var(--rule-strong); padding-top:1px}
details.sec[open]{border-top:2px solid var(--ink); padding:0 0 8px}
details.sec details.sec, details.sec details.sec[open]{border-top:0; padding:0}
details.sec > summary, details.sub > summary{
  list-style:none; cursor:pointer; display:flex; align-items:baseline; gap:.45em; min-width:0; color:var(--ink)}
details.sec > summary::-webkit-details-marker, details.sub > summary::-webkit-details-marker{display:none}
details.sec > summary::before, details.sub > summary::before{
  content:"\203A"; flex:none; width:.8em; text-align:center; color:var(--muted);
  font-style:normal; font-weight:400; font-size:1.5em; line-height:.9; transition:transform .15s}
details.sec[open] > summary::before, details.sub[open] > summary::before{transform:rotate(90deg)}
details.sec > summary{padding:11px 0; font:600 var(--fs-body)/1.3 var(--ff-text)}
/* the open heading stays put while its body scrolls (NN/g's persistent
   heading; approved 2026-10-13 with a watch on it) */
details.sec[open] > summary{position:sticky; top:var(--stick-top, 0px); z-index:2; background:var(--paper)}
details.sec details.sec[open] > summary, details.sub[open] > summary{position:static}
/* level 2: a kind of relation, or a section inside a section */
details.sec details.sec > summary, details.sub > summary{padding:8px 0; font:600 var(--fs-small)/1.35 var(--ff-text)}
details.sec details.sec > summary::before, details.sub > summary::before{font-size:1.35em}
/* the preview a closed heading carries: the first names inside it */
.pv{flex:1 1 0; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  font:400 var(--fs-meta)/1.3 var(--ff-text); color:var(--muted); margin-left:.35em}
details[open] > summary > .pv{display:none}

<body data-density="plain">
<div class="app">

  <div class="bar">
    <div class="brand">Bible <span>Ontology</span><small>a Scripture explorer</small></div>
    <!-- Back, on a phone: up here, beside the name. 2026-10-01: the
         mobile back button was obscuring the tab and had to move up; in
         the tab strip it stayed pinned at the left while the tabs scrolled
         under it. On a larger screen the strip's own Back is used. -->
    <button class="barback" id="goback" title="Back to what you were looking at before"
      disabled>← Back</button>
    <span class="barbreak"></span>
    <div class="searchwrap">
      <input id="q" type="search" autocomplete="off" placeholder="Search — Jn 3, Ahithophel, mercy">
      <div class="results" id="results" hidden></div>
    </div>

    <!-- Housekeeping lives here and not in Explore. 2026-09-08: Explore is kept
         for content exploration, and housekeeping and settings are reached
         another way, a subtle ellipsis.
         Subtle is the specification: it is the one control on this bar that
         should not catch the eye, because nothing behind it is part of reading. -->
    <div class="morewrap">
      <button id="morebtn" class="morebtn" aria-haspopup="menu"
              aria-expanded="false" title="About, coverage and settings">⋯</button>
      <div class="moremenu" id="moremenu" role="menu" hidden>
        <button role="menuitem" data-more="welcome">How this works</button>
        <button role="menuitem" data-more="about">About this graph</button>
        <a role="menuitem" class="moreitem" href="/faq">Questions (FAQ)</a>
        <a role="menuitem" class="moreitem" href="/blog/">Blog</a>
        <button role="menuitem" data-more="feedback">Something wrong or missing?</button>
        <button role="menuitem" data-more="coverage">What is covered</button>
        <div class="moresep"></div>
        <!-- No selector until switching actually works. The reader shows the
             Berean Standard Bible beside the original language; a control that
             lists other translations and changes nothing would be worse than
             the absence, because it would look like a choice. (2026-09-28:
             the menu still said KJV; changed to BSB + original.) -->
        <div class="morelab">Translation</div>
        <div class="morenote">BSB + original — the Berean Standard Bible,
          with the Hebrew, Aramaic and Greek beneath it (MACULA). Every
          citation is named from the Berean.</div>
        <div class="moresep"></div>
        <div class="morelab">Theme</div>
        <div class="themeopts" id="themeopts">
          <button data-theme-set="device" aria-pressed="true">Device</button>
          <button data-theme-set="light" aria-pressed="false">Light</button>
          <button data-theme-set="dark" aria-pressed="false">Dark</button>
        </div>
      </div>
    </div>
  </div>

  <div class="panes">
    <main class="reader" id="reader">
      <!-- Tabs, because a pattern with 2,739 uses does not belong in a side
           panel. The scripture tab is never closable, so the passage is always
           one click away no matter how deep a dive goes. -->
      <div class="tabs" id="tabs"></div>
      <!-- One container. A chapter is a tab like any other, so the reader
           stopped being a special case. -->
      <div class="paneinner" id="paneinner"></div>
    </main>

  </div>
</div>

<script>
const $ = s => document.querySelector(s);
/* All matches. The reader wires up chips, phrase links and words by the
   hundred, and there was no plural helper -- the first version of that wiring
   called `$$` and died on every chapter load. */
const $$ = s => Array.from(document.querySelectorAll(s));
/* A PAGE OPENED WHILE THE SITE RESTARTS WAITS, AND SAYS SO. After a deploy
   the server takes a minute or two to load the graph; Caddy answers 503
   (Retry-After) meanwhile. A page loaded in that window had its first answer
   fail and stayed blank, with no word why (2026-10-09, after a push; it took
   a long time and was never fully rendered). Now a 502/503 is
   retried, every few seconds for up to about three minutes, under a line
   saying the site is restarting; after that it fails as before. */
const _restartNote = on => {
  let n = document.getElementById('restartnote');
  if(!on){ if(n) n.remove(); return; }
  if(n) return;
  n = document.createElement('div');
  n.id = 'restartnote';
  n.setAttribute('role', 'status');
  n.textContent = 'The site is restarting — this will load in a moment.';
  n.style.cssText = 'position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:50;'
    + 'background:var(--surface);color:var(--ink);border:1px solid var(--rule);border-radius:8px;'
    + 'padding:8px 14px;font-size:15px;box-shadow:0 4px 14px var(--shadow)';
  document.body.appendChild(n);
};
const api = async (p, q) => {
  const url = p + '?' + new URLSearchParams(q);
  for(let i = 0; ; i++){
    const r = await fetch(url);
    if((r.status !== 503 && r.status !== 502) || i >= 36){ _restartNote(false); return r.json(); }
    _restartNote(true);
    const wait = Math.min(Math.max(parseInt(r.headers.get('Retry-After'), 10) || 5, 2), 10);
    await new Promise(res => setTimeout(res, wait * 1000));
  }
};
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// THE ARRIVAL ADDRESS, read before anything can rewrite it: startup code that
// shows the address of the first tab clears the app's own hashes (#tag=love),
// and the boot script, which runs last, found the address already bare
// (2026-10-17, the first test of the new deeplinks)
const BOOT_HASH = location.hash;
/* HOW IT WAS FOUND, QUIETLY. 2026-10-16: the UI keeps its mention of automation
   subtle while attribution stays as it is in the graph. Where automated
   analysis was involved the line says 'Surfaced by automated analysis'; where
   it is deterministic only, 'Surfaced by algorithmic analysis'; where the
   site owner made the final judgment, 'Determined by site owner judgment'. All
   of these are expandable footnotes, while credits to outside entities such as
   Berean editors remain prominent. The full account stays in About; outside
   it no tool is named. */
const PROV = {auto: 'Surfaced by automated analysis', algo: 'Surfaced by algorithmic analysis',
              owner: 'Determined by site owner judgment'};
const prov = (kind, more) => `<details class="prov"><summary title="How this was found"
  aria-label="How this was found">ⓘ</summary><span>${PROV[kind]}${more ? '. ' + more : ''}</span></details>`;
// a reading's reader: the site owner's, or automated. The server unnames him
// before anything is sent ("doug" arrives as "a reader": server.py UNNAME)
const OWNER = new Set(['doug', 'a reader']);
const provOf = (reader, confirmedBy) =>
  prov(OWNER.has(reader) || OWNER.has(confirmedBy) ? 'owner' : 'auto');

/* Configuration accumulates from use rather than from a settings screen:
   whatever sections you open stay open next time. */
const mem = {
  get(k,d){ try{ const v=localStorage.getItem('se.'+k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem('se.'+k, JSON.stringify(v)); }catch(e){} }
};
const openSecs = new Set(mem.get('open', ['what-the-text-does']));
/* Two permanent tabs. An Explore tab is always present. Explore is a place you
   return to rather than something you summon, so it is always there and never
   closable, like Scripture. */
/* Explore is home: the only tab present at the start, the only dark one, and
   the only one without a close control. Everything else -- a chapter, a word, a
   pattern, a person, a search -- is a closable peer, opened by choosing a
   chapter, searching, or clicking something. */
/* The reader is tab 2 from the start rather than appearing when first used
   (always tab 2). A place that comes and goes is not a
   place. */
let state = { book:'Gen', chapter:1,
  tabs:[{id:'explore', kind:'explore', title:'Explore'},
        {id:'ch:reader', kind:'ch', title:'Scripture'}], active:'explore' };

/* ---------------- tabs ----------------
   The scripture tab is never closable, so however deep a dive goes the
   passage is one click away. Tabs are not limited to reader panes -- a
   pattern, a word or a person is just as legitimate a thing to keep open. */
/* Neither the reader nor Explore can be closed: both are places, and a place
   you cannot get back to is a dead end. */
const PERM = new Set(['explore', 'ch:reader']);
function renderTabs(){
  /* BACK, AT THE TOP, ON EVERY TAB. 2026-10-01: a 'back to previous tab'
     button at the higher level, because flexible navigation can make a
     user feel they lost their place. The chapter head had the only one; this is the same
     move (goBack: the last tab or chapter you were on), first in the strip. */
  $('#tabs').innerHTML = `<button class="tabback" id="tabback" title="Back to what you were looking at before"
      ${histDepth ? '' : 'disabled'}>← Back</button>` + state.tabs.map(tb =>
    // tb.id can carry a deep link's own text (#tag=, #pat=, #unit=), so it is
    // escaped like any stranger's input: unescaped, a crafted link could close
    // the attribute and plant a meta refresh in the tab strip (security
    // review, 2026-10-19)
    `<button role="tab" data-id="${esc(tb.id)}"
      class="tab${PERM.has(tb.id) ? ' perm' : ''}"
      aria-selected="${tb.id===state.active}">
      <span class="lbl">${esc(tb.title)}</span>
      ${PERM.has(tb.id) ? ''
        : `<span class="x" data-close="${esc(tb.id)}">×</span>`}
    </button>`).join('');
  $('#tabs').querySelectorAll('.tab').forEach(b => {
    b.onclick = e => {
      const c = e.target.closest('.x');
      if(c){ closeTab(c.dataset.close); return; }
      selectTab(b.dataset.id);
    };
  });
  $('#tabback').onclick = goBack;
  $('#goback').onclick = goBack;          // the phone's, in the header
  syncBack();
}
/* ---------------- history ----------------
   2026-09-15: the app takes over the back button and applies it to
   the tab actions, so that Back returns to the verse.

   The browser's Back means "undo the last move I made", and in a tabbed app
   every move is a tab change or a chapter change -- none of which the browser
   sees, so Back was leaving the app entirely. It now walks the app's own
   moves instead.

   `restoring` is what keeps the two in step: applying a popped state must not
   push a new one, or Back would push a forward entry and never reach the
   move before it. */
let restoring = false;

/* How many entries this session has pushed, so the Back button can be disabled
   at the bottom of the stack rather than walking the reader out of the app.
   `history.length` cannot answer this -- it counts the whole tab's history,
   including whatever was open before. */
let histDepth = 0;

/* Back is NOT Prev. 2026-09-15: the scripture tab needs a back button
   separate from Prev. Prev is the previous CHAPTER; Back is the previous
   thing you were looking at, which is usually the verse you came from, as
   asked a day earlier. Two different moves that happen to sit next to each other, so they
   are separated in the toolbar rather than merged. */
function goBack(){
  if(histDepth > 0) history.back();
}

function push(kind, a, b){
  if(restoring) return;
  const cur = history.state;
  /* A chapter load renders through openTab -> selectTab, so it would push a
     `chapter` entry and then a `tab` entry for the reader, and Back would need
     two presses to move one chapter. The chapter entry already says which tab
     is showing, so the tab push that follows it is dropped. */
  if(kind === 'tab' && a === 'ch:reader' && cur && cur.kind === 'chapter') return;
  if(cur && cur.kind === kind && cur.a === a && cur.b === b) return;
  history.pushState({kind, a, b}, '', location.pathname);
  histDepth++;
  syncBack();
}

/* Two Backs, one shown: the tab strip's on a larger screen, the header's
   (#goback) on a phone. Both follow the same depth. */
function syncBack(){
  for(const id of ['goback', 'tabback']){
    const b = document.getElementById(id);
    if(b) b.disabled = histDepth === 0;
  }
}

window.addEventListener('popstate', e => {
  const s = e.state;
  restoring = true;
  try{
    if(!s){ selectTab('explore'); }
    else if(s.kind === 'chapter'){ selectTab('ch:reader'); loadChapter(s.a, s.b); }
    else if(s.kind === 'tab'){
      if(state.tabs.find(x => x.id === s.a)) selectTab(s.a);
      else selectTab('explore');
    }
  } finally {
    restoring = false;
    histDepth = Math.max(0, histDepth - 1);
    syncBack();
  }
});

function selectTab(id){
  push('tab', id);
  /* KEEP WHAT THE READER OPENED. 2026-09-16: on returning to Explore
     the tree was collapsed.

     Explore is rendered from the string stored on its tab, so every return
     repainted the original — and since Explore now deliberately starts closed,
     that meant every return closed everything the reader had opened. Saving
     the LIVE dom of the tab being left preserves open sections, filter text
     and revealed verses, on every card rather than only this one.

     Guarded on the id changing: openTab() re-renders a tab it already has and
     then selects it, and capturing there would overwrite the fresh content
     with the stale dom. */
  /* AND WHERE THE READER WAS IN IT. 2026-10-01: each tab remembers the
     user's position and expansion state so they
     can quickly return to where they left off. The live dom already kept
     what was open; the scroll position is kept beside it, and given back on
     return (a tab rendered fresh starts at the top). */
  if(state.active && state.active !== id){
    const prev = state.tabs.find(x => x.id === state.active);
    const pane = $('#paneinner');
    if(prev && pane && pane.innerHTML){ prev.html = pane.innerHTML; prev.scroll = $('#reader').scrollTop; }
  }
  state.active = id;
  const tb = state.tabs.find(x => x.id === id);
  if(!tb) return;
  if(id === 'explore' && !tb.html){ renderTabs(); showAddress(tb); return buildExplore(); }
  renderTabs();
  $('#paneinner').innerHTML = tb.html || '';
  if(tb.wire) tb.wire();
  $('#reader').scrollTop = tb.scroll || 0;
  // the strip is one row that scrolls sideways: bring the open tab into it
  const on = document.querySelector('#tabs [aria-selected="true"]');
  if(on) on.scrollIntoView({block: 'nearest', inline: 'nearest'});
  showAddress(tb);
}
/* THE ADDRESS BAR SHOWS THE TAB YOU ARE ON (plan A.21). 2026-10-03,
   chosen over a copy-link button: the address follows the active tab
   QUIETLY -- replaced, never pushed, so Back moves through what you did
   exactly as before and no tab switch becomes a step. Copying the address
   shares that one card or passage (P-80: "geared more to the tab than the
   entire set of open tabs"). Kinds without addresses yet show the root. */
const ADDR = {};      // card id -> its public address, where they differ
