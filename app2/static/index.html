    ${/* BELOW THE FRONT PAGE, IN ITS STYLE (plan 7.6c, 2026-10-08): the
          concepts as cards, the rest under plain headings as chip rows; the
          same content as before, every item still a link */''}
    <div class="otl-cards">${conceptCards(d.concepts)}</div>
    ${elsewhereSec}
    ${d.secondary.length ? `<h2 class="hubh">Also in this theme</h2>${d.secondary.map(s =>
      `<div class="otlsec">${secName(s)} ${(s.refs || []).map(refBtn).join(' ')}${
        s.note ? ` <span class="hint">${esc(s.note)}</span>` : ''}</div>`).join('')}` : ''}
    ${/* THE EVENTS IN IT. 2026-09-29: events to themes. Each event is
          here because of scripture: the theme cites a passage of it, or the
          clause tags give its verses the theme's stamps. */''}
    ${(d.events || []).length ? `<h2 class="hubh">Events</h2><p class="hint" style="max-width:62ch">Events whose
      passages this theme cites, or whose verses the clause tags give it.</p>${chipRow(d.events,
      x => `<button class="hubchip link" data-ent="${esc(x.id)}">${esc(x.title)}</button>`)}` : ''}
    ${related.length ? `<h2 class="hubh">Related themes</h2><p class="hint" style="max-width:62ch">Each with a
      passage cited under both, or verses the clause tags give to both.</p>${chipRow(related,
      x => `<button class="hubchip" data-mtheme="${esc(x.to)}">${esc(x.to_title)}</button>`, 30)}` : ''}
    ${(d.messages || []).length ? `<h2 class="hubh">What God says in its passages</h2>${chipRow(d.messages,
      m => `<button class="hubchip link" data-ent="${esc(m.id)}" title="${m.n} verse${m.n === 1 ? '' : 's'}">${esc(m.name)}</button>`)}` : ''}
    ${(d.acts || []).length ? `<h2 class="hubh">Kinds of speaking in its passages</h2>${chipRow(d.acts,
      m => `<button class="hubchip link" data-ent="${esc(m.id)}" title="${m.n} verse${m.n === 1 ? '' : 's'}">${esc(m.name)}</button>`)}` : ''}
    ${deeper}
    <p class="hint" style="margin-top:18px">${ownNode(d.node).replace(/<\/?p[^>]*>/g, '')} ${nodeLine(d.nodes).replace(/<\/?p[^>]*>/g, '')}</p>
    ${syn}
  </div>`, () => {});
}

/* A THEME'S IMAGERY SIDE BY SIDE (plan 7.6b), at /theme/<id>/imagery.
   2026-10-06: Apocalyptic hinges on that table, so the navigation
   opportunity is made obvious; two readers, the one who wants all of it and one
   a little overwhelmed by the topic; every quotation opens its verse in
   context (the verse quotes provide a path to the reader).
   An index of every image (a dot per book that describes it), a filter by
   book, open/close all, and each image's cells, Alike and Different. */
// a theme's table address under it (theme-hubs.json `slug`): imagery, side-by-side
const IMG_SLUG = {};
async function openImagery(id, opts = {}){
  const d = await api('/api/imagery', {id});
  if(!d.found) return;
  id = d.id;                       // a slug from the address resolves to the id
  IMG_SLUG[id] = d.slug;
  IMG_PATH[id] = d.path;
  const IMG_SHORT = d.short || {};
  const books = r => d.columns.filter(c => (r.cells[c] || []).length);
  const vref = v => `<button class="refmore" data-tgo="${esc(v)}">${esc(v)}</button>`;
  const rows = d.rows.map(r => `<details class="imgrow" id="img-row-${r.n}" data-books="${esc(books(r).join('|'))}">
      <summary>${esc(r.title)}</summary>
      <div class="imgcells">${d.columns.filter(c => (r.cells[c] || []).length).map(c => `<div class="imgcell">
        <div class="imgcol">${esc(c)}</div>${r.cells[c].map(([v, w, a]) => `<div class="imgq">“${esc(w)}” ${vref(v)}${
          a === 'aside' ? ' <span class="g" title="' + esc(d.aside_note) + '">*</span>' : ''}</div>`).join('')}
      </div>`).join('')}</div>${Object.values(r.cells).some(cs => cs.some(x => x[2] === 'aside'))
        ? `<p class="hint">* ${esc(d.aside_note)}</p>` : ''}
      <div class="imgcmp"><div><b>Alike:</b> ${esc(r.alike || '')}</div>${r.different
        ? `<div><b>Different:</b> ${esc(r.different)}</div>` : ''}</div>${(r.cards || []).length
        ? `<p class="hint">See also: ${r.cards.map(c => `<span class="link" data-ent="${esc(c.id)}">${
            esc(c.name)}</span>`).join(' · ')}</p>` : ''}</details>`).join('');
  const matrix = `<table class="imgmx"><thead><tr><th></th>${d.columns.map(c =>
      `<th title="${esc(c)}">${esc(IMG_SHORT[c] || c)}</th>`).join('')}</tr></thead><tbody>${d.rows.map(r =>
      `<tr data-books="${esc(books(r).join('|'))}"><td><span class="link" data-imgrow="${r.n}">${esc(r.title)}</span></td>${
        d.columns.map(c => `<td class="d">${(r.cells[c] || []).length ? '●' : ''}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  const starters = (d.starters || []).map(s => { const r = d.rows.find(x => x.title === s);
      return r ? `<span class="link" data-imgrow="${r.n}">${esc(s)}</span>` : ''; }).filter(Boolean).join(' · ');
  openTab('mimagery:' + id, `${d.title} · ${d.door.toLowerCase()}`, `<div class="pane imgpane" data-imgtheme="${esc(id)}">
    <p class="kind"><span class="link" data-mtheme="${esc(id)}">${esc(d.title)}</span> · ${esc(d.door.toLowerCase())}</p>
    <h1>${esc(d.door)}</h1>
    <p class="lead" style="max-width:62ch">${d.rows.length} things that more than one book describes, each with the
      passages' own words (the Berean Standard Bible, every quotation checked by machine), what they share and where
      their wording differs. A quotation is only a few words: choose any reference to read the verse, and go on to it
      in the reader.</p>
    <div class="saying" style="max-width:62ch">${esc(d.note || '')}</div>
    ${starters ? `<p class="hint"><b>New here?</b> Start with one: ${starters}</p>` : ''}
    <div class="imgbar">Show rows found in: <button class="imgb on" data-imgbook="">All books</button>${d.columns.map(c =>
      `<button class="imgb" data-imgbook="${esc(c)}">${esc(c)}</button>`).join('')}
      <span class="imgall"><button class="imgb" data-imgall="open">Open all</button><button class="imgb"
        data-imgall="close">Close all</button></span> <span class="imgcount g"></span></div>
    <details class="sec" open><summary>Every row at a glance</summary>
      <p class="hint">A dot marks each column that has it (${d.columns.map(c => `${esc(IMG_SHORT[c] || c)} ${esc(c)}`).join(' · ')}).
        ${esc(d.columns_note || '')}</p>${matrix}</details>
    <div class="vp-h2">Side by side</div>${rows}
  </div>`, () => {}, id);
  // after the tab is drawn, whether new or already open: an image to begin
  // with, or a book to filter by, from the link that brought you. Waits for
  // the rows to be in the page (a first visit draws the tab after the
  // address is read: #row-33 opened nothing with a bare setTimeout)
  const want = opts.row != null && opts.row !== '';
  if(!opts.book && !want) return;
  for(let i = 0; i < 40 && !document.getElementById('img-row-0'); i++) await new Promise(r => setTimeout(r, 50));
  if(opts.book) imageryFilter(opts.book);
  if(want) imageryOpenRow(opts.row);
}
function imageryFilter(book){
  document.querySelectorAll('#paneinner .imgb[data-imgbook]').forEach(b => b.classList.toggle('on', b.dataset.imgbook === book));
  let n = 0;
  document.querySelectorAll('#paneinner details.imgrow, #paneinner .imgmx tr[data-books]').forEach(el => {
    const ok = !book || el.dataset.books.split('|').includes(book);
    el.hidden = !ok;
    if(ok && el.tagName === 'DETAILS') n++;
  });
  const c = document.querySelector('#paneinner .imgcount');
  if(c) c.textContent = book ? `${n} of ${document.querySelectorAll('#paneinner details.imgrow').length}` : '';
}
function imageryOpenRow(n){
  const d = document.getElementById('img-row-' + n);
  if(!d) return;
  d.hidden = false; d.open = true;
  d.scrollIntoView({block: 'start'});
}

async function buildExplore(){
  const c = await api('/api/collections', {});
  /* A missing pattern layer should cost its category, not the page. */
  const psets = await api('/api/patternsets', {}).catch(() => ({sets: []}));
  const lists = await api('/api/lists', {}).catch(() => ({kinds: []}));
  const events = await api('/api/events', {}).catch(() => ({kinds: []}));
  const upper = await api('/api/upper', {}).catch(() => ({parts: []}));
  const mthemes = await api('/api/majorthemes', {}).catch(() => ({themes: []}));
  /* THE MAJOR THEMES, UNDER PATTERNS, before the counted finds. They led
     Explore from 2026-09-29 (a quick way to detect, navigate to, and
     understand these major themes); 2026-10-04: the themes are not
     among the site's most impressive work, and they can be organized under
     patterns on the Explore page without
     changing the links, so as not to harm SEO. A theme is a subject the text returns
     to, so a pattern; each still opens its card, and its address
     (/theme/<id>) is unchanged. The map is Microsoft Copilot's, credited,
     every passage checked against the text. Collapsed, like every list here
     (2026-09-30). "For digging" stays last: it is the mechanical one.
     A function, called when Patterns is drawn: `row` is defined below. */
  /* FIRST AGAIN, 2026-10-07. The themes are placed first in the Explore page,
     explaining that these are topical groupings for viewers to see related
     content grouped together. Since 10-04 they sat under Patterns; every
     theme now has a front page and a table setting its passages side by
     side, which is what makes them the way in. Shown open, in their five
     groups, each row naming its table. Addresses unchanged. */
  const mtBy = Object.fromEntries((mthemes.themes || []).map(t => [t.id, t]));
  const themesSec = () => (mthemes.themes||[]).length ? sec('x-themes', `Themes`,
      `<p class="hint" style="margin:0 0 10px;max-width:62ch">Topical groupings. Each theme gathers what
        the Bible says on one subject — its passages set side by side, book beside book, and the
        themes it meets — so that related texts can be read together. ${mthemes.themes.length} themes,
        in ${(mthemes.groups || []).length} groups.</p>`
      + (mthemes.groups || []).map(g => `<div class="vp-h2">${esc(g.name)}</div>` + g.themes
          .filter(id => mtBy[id]).map(id => { const t = mtBy[id];
            return row(`data-mtheme="${esc(t.id)}"`, t.title,
              t.door ? `${t.door.title} · ${t.door.n} rows` : (t.subtitle || '')); }).join('')).join(''),
      mthemes.themes.length, true) : '';
  const recurs = await api('/api/recurs', {}).catch(() => ({groups: []}));
  /* Every Explore list goes through the block, so filter + paging arrive
     everywhere at once rather than being added per list. */
  const list = (items, mk, total, src) => listBlock(items, mk, total, '', src);
  /* `title` may carry one trusted marker span appended by the caller; the
     text itself is escaped before the marker is added. */
  /* A ROW IS ESCAPED EXCEPT FOR AN ALLOWLIST OF SPANS. The previous version
     kept only TRAILING `xmark` spans, by anchoring a regex at the end, which
     was enough while the mark was the one piece of markup a row carried. A
     pattern row now leads with its lexeme — 2026-09-21: patterns are done
     the right way by the lexeme — and that span sits at
     the FRONT, so it came out as visible angle brackets.
     Everything outside the allowlist is still escaped, and the allowed spans
     carry only already-escaped text. */
  const KEEP =
    /<span class="(?:lexname|lexgloss|xmark(?: xm2)?)"(?: dir="auto")?>[^<]*<\/span>/g;
  const mixed = s => {
    s = String(s == null ? '' : s);
    let out = '', last = 0, m;
    KEEP.lastIndex = 0;
    while ((m = KEEP.exec(s))) {
      out += esc(s.slice(last, m.index)) + m[0];
      last = m.index + m[0].length;
    }
    return out + esc(s.slice(last));
  };
  const row = (attrs, title, sub) =>
    `<div class="rowline"><span class="link" ${attrs}>${mixed(title)}</span>
     <span class="g">${mixed(sub)}</span></div>`;
  /* ONE ITEM OF A PATTERN SET, whatever layer it comes from: each kind opens
     its own card. A pattern the text uses in BOTH testaments is marked (2026-09-19: cross-corpus patterns are the most interesting), and a
     row names its lexeme first with the English beside it (2026-09-21:
     by the lexeme, with the English at the immediate right of the lexeme). */
  const patItem = it => row(
      it.kind === 'pat'   ? `data-pat="${esc(it.key)}"`
    : it.kind === 'theme' ? `data-theme="${esc(it.key)}"`
    : it.kind === 'stamp' ? `data-pat="${esc(it.key)}"`
    : it.kind === 'ref'   ? `data-goref="${esc(it.key)}"`
    : it.kind === 'node' || it.kind === 'ladder'
      ? `data-layer="${esc(it.kind)}" data-lkey="${esc(it.key)}"`
    : 'data-flat="1"',
      (it.lex ? `<span class="lexname" dir="auto">${esc(it.lex)}</span>`
                + `<span class="lexgloss">${esc(it.title)}</span>` : it.title)
      + (it.crosses && it.crosses.direct ? '<span class="xmark">OT+NT</span>' : '')
      + (it.crosses && it.crosses.counterpart && !(it.crosses.direct)
         ? '<span class="xmark xm2">via LXX</span>' : ''),
      it.sub);
  /* ONE ROW OF THE PATTERNS SECTION (plan A.8): a formula or refrain opens its
     verses; a set folds open to its items; a story shape shows the event
     cards it is made of, and the passages with no card as gaps. */
  const recRow = r => r.kind === 'recur'
      ? row(`data-recur="${esc(r.key)}"`, r.title, r.sub)
    : r.kind === 'set'
      ? sec('ps-' + r.key, `${r.title} · ${r.sub}`,
          `<p class="hint" style="margin:0 0 10px;max-width:62ch">${esc(r.note || '')}</p>`
          + list(r.items, patItem, r.items.length), null, false)
    : `<div class="rowline"><span class="link" ${r.ent ? `data-ent="${esc(r.key)}"`
         : `data-pat="${esc(r.key)}"`}>${esc(r.title)}</span>
         <span class="g">${esc(r.sub || '')}</span></div>
       <div class="shapechips">${moreJoin(r.events || [], 10, e =>
         `<span class="link chip" data-ent="${esc(e.id)}">${esc(e.title)}</span>`, '')}${
         moreJoin(r.gaps || [], 8, g => `<span class="link chip gap" data-go="${esc(g)}"
            title="no event card yet">${esc(g)}</span>`, '')}</div>`;
  setExplore(`<div class="pane">
    <p class="kind">What is in here</p><h2>Explore</h2>
    ${/* Plain words for a newcomer (the committee as first-time Reddit
          visitors, 2026-10-01): "Nothing here is a separate mode" answered a
          question only the builders were asking. */''}
    <p class="lead">The way in by subject: themes first, then lists of people, places and
      things, events, and patterns the text repeats. Everything here opens as a card or a
      page, the same you get by tapping a word in the reader.</p>
    ${themesSec()}
    ${/* The note is not decoration. Without it the first question a reader has
          is "why isn't the commonest one first", and the answer -- that the
          commonest ones are grammar -- is the most useful thing on the page. */''}
    ${/* ONE PATTERNS GROUP, several layers inside it. 2026-09-16:
          an overall patterns set which includes the fixed
          phrases where the text repeats, and also a rich patterns taxonomy
          with the most interesting patterns in each category.

          The categories divide by WHAT KIND OF EVIDENCE stands behind a
          pattern, not by subject: something counted, something mechanical,
          something a model read, something the text says outright. That
          distinction is the one this project keeps having to redraw, and it is
          the difference between a ladder a reader can check and a `chiasm`
          stamp they have to take on trust. Each category carries its label so
          the reader knows which they are looking at. */''}
    ${/* TWO MAJORS. 2026-09-16: patterns is one major category;
          people are a subcategory under lists, which include places,
          concepts, symbols, and other prominent lists.

          So: what the text DOES, and what the text is ABOUT. Contrasts moved
          under Patterns because a contrast is a pattern -- a reader's own reading
          of it -- and the word list moved there too, and last, because it is
          a frequency table rather than a finding: the words the text says most
          about are fairly trivial, so the list is a pattern listed last. */''}
    ${/* EVENTS, THEN LISTS, THEN PATTERNS. 2026-09-21: the page was leading with the least
          interesting; going events, then lists, then patterns on the highest
          level helps.

          Patterns led because they are the biggest layer, which is a fact
          about the build rather than about a reader. What HAPPENED and WHO
          is in it are the questions someone arrives with; how the language
          repeats a shape is the question they arrive at. */''}
    ${/* LISTS BEFORE EVENTS. 2026-09-29: lists move above events on
          the Explore page — the events are the September section stamps, and
          the lists (people, places, concepts ...) are what a reader arrives
          wanting to find. */''}
    ${sec('x-lists', `Lists · ${(lists.kinds||[]).length} kinds`,
      (lists.kinds||[]).map(k => sec('lk-' + k.id,
        `${k.name} · ${k.count.toLocaleString()}`,
        list(k.items, e => row(`data-ent="${esc(e.id)}"`, e.title, e.sub),
             k.count,
             k.more ? `/api/lists?set=${encodeURIComponent(k.more)}` : ''),
        null, false)).join('')
      /* A FREQUENCY TABLE IS A LIST, NOT A PATTERN: moved here from Patterns
         with the overhaul (plan A.8). */
      + sec('ps-words', `Words the text says most about · ${
              c.words.count.toLocaleString()}`,
          `<p class="hint" style="margin:0 0 10px;max-width:62ch"><b>a frequency
             table</b> — Which lemmas the corpus uses most. Raw frequency finds
             grammar, so this opens with pronouns and prepositions and tells you
             little.</p>`
          + list(c.words.items, w => row(`data-key="${esc(w.key)}"
              data-word="${esc(w.title||'')}"`, w.title, w.sub),
              c.words.count), null, false), null, false)}

    ${sec('x-events', `Events · ${(events.kinds||[]).length} kinds`,
      `<p class="hint" style="margin:0 0 10px;max-width:62ch">What HAPPENS. The
         events are cards, by part of the canon: who is in each, every passage
         that tells it, the events within it, and what it points to. The kinds below them are stamped, not
         sequenced — they say a passage is a parable or a vision. Nothing here
         yet puts events in order.</p>`
      + (events.kinds||[]).map(k => sec(k.id,
          k.id.startsWith('ev-nodes')
            ? `${k.name} · ${k.count} events · ${k.instances.toLocaleString()} tellings`
            : `${k.name} · ${k.count} kinds · ${k.instances.toLocaleString()} sections`,
          `<p class="hint" style="margin:0 0 10px;max-width:62ch">${
             esc(k.note)}</p>`
          /* an event that is a node opens its card; the rest are still the
             stamp pages they always were */
          + list(k.items, it => row(it.kind === 'event' ? `data-ent="${esc(it.key)}"`
                                                        : `data-pat="${esc(it.key)}"`,
                                    it.title, it.sub), k.count),
          null, false)).join(''), null, false)}

    ${/* PATTERNS, BY WHAT RECURS (plan A.8, P-58). 2026-09-30: Patterns needed
          an overhaul for the most part; the one chosen
          groups the section by the reader's question — what recurs — with the
          text's own declared repeats first, its refrains named by their own
          line, story shapes as event cards side by side, how the text is
          built, and the counted statistics last, for digging. */''}
    ${sec('x-patternsets', `Patterns · what recurs`,
      (recurs.groups || []).map(g => sec('pg-' + g.id, `${g.title} · ${g.rows.length}`,
        `<p class="hint" style="margin:0 0 10px;max-width:62ch">${esc(g.note)}</p>`
        + (g.id === 'refrains'
            ? list(g.rows, r => row(`data-recur="${esc(r.key)}"`, r.title, r.sub), g.rows.length)
            : g.rows.map(recRow).join(''))
        + (g.id === 'built' ? sec('ps-contrasts', `What the text sets against what · ${
              c.contrasts.count.toLocaleString()}`,
          `<p class="hint" style="margin:0 0 10px;max-width:62ch"><b>an
             inherited reading</b> — Pairs the text sets against each other.
             Read from MACULA's contextual English rather than from morphology,
             so this is a reading carried in rather than derived.</p>`
          + list(c.contrasts.items, x => row(
              `data-ca="${esc(x.a||'')}" data-cb="${esc(x.b||'')}"`,
              x.title, x.sub), c.contrasts.count), null, false) : ''),
        null, false)).join(''),
      null, false)}

    ${/* THE FOURTH MAJOR: the ontologies themselves. 2026-09-28: the
          ontologies are made visible in a fourth section under
          Explore, called Upper
          Ontologies to avoid confusion. kinds.json already names its meaning
          layer "upper". Four parts, each saying what it is; nothing here is a
          finding, it is the vocabulary the findings are stated in. */''}
    ${sec('x-upper', 'Schema',
      `<p class="hint" style="margin:0 0 10px;max-width:62ch">The vocabulary the
         graph is written in, published at its own addresses: each a page to
         read and, for semantic-web tools, RDF.</p>`
      /* LINKS ONLY, THE MAP FIRST (2026-10-21: upper ontologies on
         Explore provide a link to the map, and the accordion content beyond
         the 4 links is dropped). The map is offered once
         /api/about says it is published; the tag list's expansion is gone
         (its taxonomy still names a tag's place on the tag pages) */
      + (upper.schema_map ? `<p style="margin:6px 0"><a href="/ns/map" target="_blank" rel="noopener"><b>The
           whole design, as a map</b> ↗</a></p>` : '')
      + [['/ns/meaning', 'Meaning'], ['/ns/structure', 'Structure'], ['/ns/relation', 'Relations'],
         ['/ns/claim', 'Claims']].map(([u, n]) =>
          `<p style="margin:6px 0"><a href="${u}" target="_blank" rel="noopener"><b>${n}</b> ↗</a></p>`).join(''),
      null, false)}

    ${/* THE KNOWLEDGE GRAPH NAVIGATOR, LAST AND QUIET. 2026-10-01: app1's
          node graph, a quick way to explore,
          placed here so it rewards the curious without making
          it the centerpiece of the app. On a phone since 2026-10-02, and
          nothing loads until it is opened (kgnStart). */''}
    ${sec('x-kgn', 'Knowledge Graph Navigator',
      `<p class="hint" style="margin:0 0 10px;max-width:62ch">The relations of one
         person, place, idea, event or passage, one step out, drawn as a graph.
         Click anything to put it in the middle, or name it in the box on the
         graph; the line's thickness is how much the text gives the two
         together. Opens on the last card you looked at.</p>
       <div class="kgn" id="kgn"></div>`, null, !!KGN.want)}

    ${/* THE THIRD MAJOR. The stamped event taxonomy -- parables, dreams,
          visions, oracles, things that happen -- which needed no new
          detector, only surfacing. What it does NOT do is order them or say
          who acted, which is the swimlane half and is not built; the heading
          says as much rather than implying a sequence. */''}
    <!-- The query panel is gone. 2026-09-08: 'ask the text a question'
         was useless in its form then: it promised a
         question-answering surface and offered two text boxes over a slot
         filler. A placeholder that sets an expectation it cannot meet is worse
         than an absence, because the reader concludes the thing was tried and
         does not work. It returns when it can answer something. -->
  </div>`, () => {
    // the navigator is built when its section opens, never before
    const kd = $('#paneinner details[data-sec="x-kgn"]');
    if(kd){
      kd.addEventListener('toggle', () => {
        if(kd.open) kgnStart();
        else KGN.want = false;     // shut by the reader: stays shut on redraw
      });
      if(kd.open) kgnStart();
    }
    wireLists($('#paneinner'));
    $('#paneinner').querySelectorAll('.link').forEach(l =>
      l.onclick = () => l.dataset.ent ? openEntity(l.dataset.ent)
                      : l.dataset.recur ? openRecur(l.dataset.recur)
                      : l.dataset.go ? peekAt(l, l.dataset.go)
                      : l.dataset.mtheme ? openMajorTheme(l.dataset.mtheme)
                      : l.dataset.theme ? openTheme(l.dataset.theme)
                      : l.dataset.layer
                        ? openLayerItem(l.dataset.layer, l.dataset.lkey)
                      : l.dataset.ca ? openContrast(l.dataset.ca, l.dataset.cb)
                      : l.dataset.goref ? peekAt(l, l.dataset.goref)
                      /* A `stamp:` key belongs to the higher-pattern card, a
                         bare key to the subsentence one; they are different
                         endpoints and routing both through openPattern would
                         silently return nothing. */
                      : l.dataset.pat
                        ? (l.dataset.pat.startsWith('stamp:')
                             ? openHigherPattern(l.dataset.pat)
                             : openPattern(l.dataset.pat))
                      : l.dataset.flat ? null
                      : openSense(l.dataset.key, l.dataset.word));
    /* EXPLORE STARTS CLOSED, and deliberately does not restore `openSecs`.
       2026-09-16: People no longer starts open; much is done
       on Explore, so it starts closed.

       Nothing hardcoded People open; the sections follow `openSecs`, which
       persists across sessions, so one visit to a section kept it open
       forever. That is the right behaviour for a card you return to and the
       wrong one for an index you scan, where the whole list should be visible
       at once. */
  });
}

/* ---------------- the Knowledge Graph Navigator ----------------
   app1's node graph (app/static/app.js), brought over as an Easter egg at the
   foot of Explore. 2026-10-01: the last Explore option, not on a phone;
   app1's strength slider and auto-filter; one hop, always; app1's legend with
   every category its own colour, or striped when colours run out; recentre on
   a click; the centre's card one chip away. Then: keep it simple, with no
   flexibility on hops, no fit or relayout, auto on any node
   click and then the slider, siblings inferred by default, no path/trace
   support. The scoring is app1's, so the same ties are thick and thin.

   One layout only, concentric, which runs synchronously: app1's crashes all
   came from an asynchronous force layout racing a fit, and a one-hop view is
   a centre and a ring, which concentric draws exactly. */
const CYTO_SRC = '/vendor/cytoscape-3.30.2.min.js';
const KGN = {cy:null, data:null, center:null, history:[], hidden:new Set(),
             auto:true, floor:0, frame:0, seenLast:null, looks:null};
// app1's three branches, grouped by what a relation reaches, with this
// graph's two extra categories placed where they read
const KGN_GROUPS = [
  {key:'people', label:'Among people', cats:['kinship','lineage','marital','political','service',
     'religious','affiliation','antagonism','opposition','encounter','deity']},
  {key:'world', label:'The world', cats:['geography','community','artifact','observance']},
  {key:'meaning', label:'Meaning', cats:['imagery','meaning','assessment','covenant','language',
     'derivation']},
];
/* EVERY CATEGORY ITS OWN LOOK. Ten colours that hold in both themes go to the
   ten commonest categories between drawable things (counted 2026-10-01:
   places 1,425, kinship 1,012, concepts 844 ...); the rest are striped, two
   of the ten together, so no two categories ever draw alike. */
const KGN_PALETTE = ['#2f6fb0','#c0392b','#2e8b57','#d68910','#7d3c98',
                     '#1597a6','#8d6e63','#d6336c','#7a8f1d','#5d6d7e'];
const KGN_SOLID = ['geography','kinship','meaning','community','encounter',
                   'antagonism','language','imagery','religious','artifact'];
/* THE NAVIGATOR'S RULE COMES WITH THE GRAPH (plan 8.1f): its certainty
   factors, weights and how many records it draws first are declared once, in
   ontology/schema/salience.json, and /api/graph serves them as `policy`. The
   numbers below are only a fallback should an older server send none; the
   policy decides (tests/test_salience.py holds them equal). 21 records (app1's NODE_TARGET x NODE_TOLERANCE); on a
   phone, the centre and six (2026-10-02). A tier of equal ties is still
   kept or dropped whole, so a centre whose sixth and seventh ties are equally
   strong shows seven; the slider goes either way from there. */
const kgnCeiling = () => (KGN.pol && KGN.pol.rank) ? (PHONE.matches ? KGN.pol.rank.phone : KGN.pol.rank.desktop) : 21;
const KGN_PLURAL = {person:'people', place:'places', group:'groups', event:'events',
  concept:'concepts', object:'things', image:'images', title:'titles', creature:'creatures',
  covenant:'covenants', being:'beings', observance:'observances'};

function kgnLooks(cats){
  if(KGN.looks) return KGN.looks;
  const order = KGN_GROUPS.flatMap(g => g.cats).concat(Object.keys(cats));
  const rest = [...new Set(order)].filter(c => !KGN_SOLID.includes(c));
  const looks = {};
  KGN_SOLID.forEach((c, i) => looks[c] = {a: KGN_PALETTE[i]});
  rest.forEach((c, j) => looks[c] = {a: KGN_PALETTE[j % 10],
                                    b: KGN_PALETTE[(j + 3 + Math.floor(j / 10)) % 10]});
  return KGN.looks = looks;
}
/* A category key as a class name and selector (Fable, 2026-10-01, L2): the
   keys come from the project's own taxonomy and are plain words today, but
   one with a space or a quote would break Cytoscape's selector parser. */
const kgnKey = c => String(c).replace(/[^a-z0-9_-]/gi, '_');
function kgnSwatch(l){
  return l.b ? `background:repeating-linear-gradient(90deg,${l.a} 0 5px,${l.b} 5px 10px)`
             : `background:${l.a}`;
}

/* app1's edgeStrength: how much of the relationship the type accounts for
   (its declared weight, at reduced influence) and how much text the two
   share, discounted by certainty. A rank, not a quantity. */
function kgnStrength(e){
  const p = (KGN.pol && KGN.pol.parameters) || {};
  const shared = (e.shared_verses || 0) + (e.shared_chapters || 0) * (p.chapter_weight ?? 0.5);
  const cf = (p.certainty_factor || {})[e.certainty] ?? (p.certainty_factor_default ?? 1);
  return cf * ((e.weight ?? (p.weight_default ?? 2)) * (p.weight_coefficient ?? 0.35)
               + Math.log2(1 + shared) * (p.shared_coefficient ?? 1.1));
}

function kgnStyle(){
  const v = n => getComputedStyle(document.documentElement).getPropertyValue('--' + n).trim();
  const T = {surface: v('surface'), ink: v('ink'), rule: v('rule'), muted: v('muted'), slate: v('slate')};
  const looks = KGN.looks || {};
  const font = 'system-ui, -apple-system, Segoe UI, sans-serif';
  const lk = KGN.lblK || 1;      // the label scale for the current zoom (kgnInit)
  const stripe = l => {
    const cols = [], pos = [];
    for(let k = 0; k < 8; k++){
      const c = k % 2 ? l.b : l.a;
      cols.push(c, c); pos.push(`${k * 12.5}%`, `${(k + 1) * 12.5}%`);
    }
    return {'line-fill':'linear-gradient', 'line-gradient-stop-colors': cols.join(' '),
            'line-gradient-stop-positions': pos.join(' ')};
  };
  return [
    {selector:'node', style:{'background-color':T.surface, 'border-width':1.5, 'border-color':T.muted,
      label:'data(label)', 'font-size':11 * lk, 'font-family':font, color:T.ink,
      'text-valign':'center', 'text-halign':'center', shape:'round-rectangle', padding:'6px',
      width:'label', height:'label', 'text-wrap':'wrap', 'text-max-width':`${Math.round(120 * lk)}px`}},
    // app1's shapes, plain polygons only (its rounded ones throw on reciprocal edges)
    {selector:'node[etype = "place"]', style:{shape:'diamond', 'border-style':'dashed', padding:'10px'}},
    {selector:'node[etype = "group"]', style:{shape:'tag', 'border-width':2, padding:'9px'}},
    {selector:'node[etype = "event"]', style:{shape:'hexagon', padding:'9px'}},
    {selector:'node[etype = "object"]', style:{shape:'cut-rectangle', padding:'9px'}},
    {selector:'node[etype = "observance"]', style:{shape:'pentagon', padding:'9px'}},
    {selector:'node[etype = "being"]', style:{shape:'diamond', 'border-style':'double', 'border-width':3, padding:'9px'}},
    {selector:'node[etype = "covenant"]', style:{shape:'cut-rectangle', 'border-style':'double', 'border-width':3, padding:'10px'}},
    {selector:'node[etype = "creature"]', style:{shape:'barrel', padding:'9px'}},
    {selector:'node[etype = "title"]', style:{shape:'tag', 'border-style':'double', 'border-width':3, padding:'9px'}},
    {selector:'node[etype = "image"]', style:{shape:'barrel', 'border-style':'dashed', padding:'9px'}},
    {selector:'node[etype = "concept"]', style:{shape:'octagon', 'border-style':'dashed', 'border-width':2, padding:'10px'}},
    {selector:'node[etype = "text"]', style:{shape:'round-rectangle', 'border-style':'dotted', 'border-width':2, padding:'8px'}},
    {selector:'node[etype = "passage"]', style:{shape:'round-rectangle', 'border-style':'dotted', 'border-width':2, padding:'8px'}},
    {selector:'node[etype = "assessment"]', style:{shape:'vee', padding:'10px'}},
    {selector:'node[etype = "pattern"]', style:{shape:'star', padding:'10px'}},
    // the centre, enlarged, so the chip under it has room to sit naturally
    {selector:'node.center', style:{'font-size':15 * lk, 'font-weight':600, 'border-width':3,
      'border-color':T.slate, padding:'16px', 'text-max-width':`${Math.round(170 * lk)}px`}},
    {selector:'edge', style:{width: e => Math.max(1.2, Math.min(4, 1 + (e.data('strength') || 2) * 0.45)),
      'curve-style':'bezier', 'control-point-step-size':26, 'target-arrow-shape':'triangle',
      'arrow-scale':0.8, opacity:0.88, 'overlay-padding':6, 'overlay-opacity':0}},
    ...Object.entries(looks).map(([c, l]) => ({selector:`edge.c-${kgnKey(c)}`,
      style:{'line-color':l.a, 'target-arrow-color':l.a, ...(l.b ? stripe(l) : {})}})),
    {selector:'edge[?symmetric]', style:{'target-arrow-shape':'none'}},
    {selector:'edge[certainty = "implied"]', style:{'line-style':'dashed'}},
    {selector:'edge[certainty = "conjectured"], edge[certainty = "disputed"]', style:{'line-style':'dotted', opacity:0.65}},
    // inferred, not stated: thin and dotted so it never reads as a citation
    {selector:'edge[?derived]', style:{width:1.3, 'line-style':'dotted', opacity:0.6, 'target-arrow-shape':'none'}},
    // a line holding several relations (kgnFilter): a little thicker per
    // relation, its count on it, and an arrow only if they all point one way
    {selector:'edge.bundle', style:{
      width: e => Math.max(1.2, Math.min(4, 1 + (e.data('strength') || 2) * 0.45))
                  + 0.7 * Math.min(4, Math.log2((e.data('bundle') || [1]).length)),
      label: e => '×' + (e.data('bundle') || []).length,
      'font-size':10 * lk, color:T.ink, 'text-background-color':T.surface, 'text-background-opacity':0.9,
      'text-background-padding':'2px', 'text-background-shape':'roundrectangle',
      'line-style':'solid', opacity:0.9,
      'target-arrow-shape': e => {
        const ids = e.data('bundle') || [], s = e.data('source');
        return ids.every(i => KGN.cy.getElementById(i).data('source') === s) ? 'triangle' : 'none';
      }}},
    // ties between two neighbours, not to the centre: faint, so the centre's
    // own relations lead (David's officers and Jesse's sons otherwise drew a
    // web of chords over him); hovering a node brings its ties up
    {selector:'edge.rim', style:{opacity:0.22}},
    {selector:'edge.hl', style:{opacity:1, 'z-index':99}},
    {selector:'edge.sel', style:{opacity:1, 'z-index':100, width:4.5}},
  ];
}

async function kgnStart(){
  const host = document.getElementById('kgn');
  if(!host) return;
  if(!window.cytoscape){
    host.innerHTML = '<p class="hint">Loading the graph…</p>';
    try{ await loadScript(CYTO_SRC); }
    catch(e){ host.innerHTML = '<p class="hint">The graph could not be loaded.</p>'; return; }
  }
  // Explore re-renders its HTML when the tab is shown again -- from a copy
  // saved as the reader left, so the old container's MARKUP comes back
  // without the live graph behind it. So the test is whether the graph is
  // drawing into this page, not whether a container exists (found
  // 2026-10-01: returning from a card left a blank canvas, every redraw
  // throwing inside the layout because the old container was detached).
  const live = KGN.cy && !KGN.cy.destroyed() && KGN.cy.container()
    && KGN.cy.container().isConnected && host.contains(KGN.cy.container());
  if(!live){
    host.innerHTML = `<div class="kgn-main">
        <div class="kgn-bar"><span id="kgnTitle"></span>
          <label title="Hide the weaker ties: how much the text gives the two together, and how surely">
            Strength <input type="range" id="kgnStrength" min="0" max="10" step="0.5" value="0">
            <span id="kgnStrengthVal"></span></label>
          <button class="kgn-back" id="kgnBack" hidden></button></div>
        <div class="kgn-wrap"><div class="kgn-cy" id="kgnCy"></div>
          <div class="kgn-find"><label for="kgnFind">Centre this graph on</label>
            <input id="kgnFind" type="search" placeholder="a person, place, idea…" autocomplete="off">
            <div class="kgn-find-list" id="kgnFindList" hidden></div></div>
          <button class="kgn-open" id="kgnOpen">open card ›</button>
          <div class="kgn-pick" id="kgnPick" hidden></div>
          <div class="kgn-tip" id="kgnTip"></div></div>
        <div class="kgn-info" id="kgnInfo"></div>
        <div class="kgn-sel" id="kgnSel"></div>
      </div>
      <div class="kgn-legend" id="kgnLegend"></div>`;
    if(KGN.cy){ try{ KGN.cy.destroy(); }catch(e){} KGN.cy = null; }
    kgnInit();
    kgnFindWire();
  }
  // Opens on the last card the reader looked at, if it can be drawn; after
  // that it stays where they walked it, until they look at another card
  const last = LAST_ENTITY && LAST_ENTITY.id;
  let want = KGN.center || 'jesus';
  if(last && last !== KGN.seenLast){ KGN.seenLast = last; want = last; }
  if(want !== KGN.center || !KGN.data) await kgnGo(want, false, true);
  // a fresh canvas (Explore re-rendered) is empty until drawn into
  if(KGN.cy && KGN.data && !KGN.cy.elements().length) kgnDraw();
}

function kgnInit(){
  /* ZOOM HOLDS THE CENTRE. 2026-10-01: the zoom that recentres was disliked;
     if the centre cannot be held, disable it. Cytoscape zooms toward the pointer, so the centre slid away
     under the wheel. Its own zooming is off and the wheel zooms about the
     centre node instead, which stays put while the ring grows or shrinks. */
  const el = document.getElementById('kgnCy');
  const cy = KGN.cy = cytoscape({container: el,
    minZoom:0.2, maxZoom:3, userZoomingEnabled:false, boxSelectionEnabled:false,
    style: kgnStyle()});
  el.addEventListener('wheel', ev => {
    const n = KGN.center && cy.getElementById(KGN.center);
    if(!n || !n.length) return;
    ev.preventDefault();
    // a trackpad pinch arrives as a wheel event with ctrlKey, in finer steps
    const f = Math.exp(-ev.deltaY * (ev.ctrlKey ? 0.01 : 0.0015));
    const level = Math.max(cy.minZoom(), Math.min(cy.maxZoom(), cy.zoom() * f));
    cy.zoom({level, renderedPosition: n.renderedPosition()});
  }, {passive:false});
  cy.on('tap', 'node', e => { const id = e.target.id(); if(id !== KGN.center) kgnGo(id, true); });
  // a single line opens its verses where it was clicked, in a box that stays
  // (2026-10-12: hovering on the connection showed click for verses
  // but the menu moved with the mouse and could not be clicked); the details below
  // the graph were out of view
  cy.on('tap', 'edge', e => e.target.hasClass('bundle') ? kgnPick(e) : (kgnSelect(e.target), kgnPopSel(e.renderedPosition)));
  cy.on('tap', e => { if(e.target === cy){ cy.edges().removeClass('sel'); $('#kgnSel').innerHTML = ''; kgnPickClose(); } });
  cy.on('mouseover', 'edge', e => { e.target.addClass('hl'); kgnTip(e); });
  cy.on('mousemove', 'edge', kgnTipMove);
  cy.on('mouseout', 'edge', e => { e.target.removeClass('hl'); $('#kgnTip').classList.remove('on'); });
  cy.on('mouseover', 'node', e => e.target.connectedEdges().addClass('hl'));
  cy.on('mouseout', 'node', e => e.target.connectedEdges().removeClass('hl'));
  cy.on('viewport position', kgnChip);
  /* LABELS A READER CAN READ. The 2026-10-02 evaluation: "Graph Navigator
     labels ~6-7 px" -- 11px labels on a graph fitted to the pane at about
     0.5 zoom (Jesus's ring). The label grows as the graph shrinks, up to 2.1
     times, so it stays near 11px on screen without the boxes swelling into
     each other (1.7 gave 9.6px on Jesus's ring, measured). */
  let lblFrame = 0;
  const lblScale = () => {
    lblFrame = 0;
    const k = Math.min(2.1, Math.max(1, 1 / cy.zoom()));
    if(Math.abs(k - (KGN.lblK || 1)) < 0.04) return;
    // kgnStyle reads KGN.lblK, so a redraw's cy.style(kgnStyle()) keeps it
    KGN.lblK = k;
    cy.style(kgnStyle());
  };
  KGN.lblScale = lblScale;
  cy.on('zoom', () => { if(!lblFrame) lblFrame = requestAnimationFrame(lblScale); });
  $('#kgnOpen').onclick = () => KGN.center && openEntity(KGN.center);
  $('#kgnBack').onclick = () => { const prev = KGN.history.pop(); if(prev) kgnGo(prev, false); };
  const slider = $('#kgnStrength');
  // dragging only thins; the ring is redrawn once a frame at most
  slider.oninput = () => {
    KGN.auto = false; KGN.floor = Number(slider.value);
    if(KGN.frame) return;
    KGN.frame = requestAnimationFrame(() => { KGN.frame = 0; kgnFilter(); });
  };
  slider.onchange = () => {
    if(KGN.frame){ cancelAnimationFrame(KGN.frame); KGN.frame = 0; }
    KGN.auto = false; KGN.floor = Number(slider.value); kgnFilter();
  };
}

/* THE CENTRE FIELD: the site's search, kept to records the graph can draw;
   a pick centres the navigator and goes no further (the search box opens
   cards; this one only moves the graph) */
function kgnFindWire(){
  const inp = $('#kgnFind'), list = $('#kgnFindList');
  if(!inp || !list) return;
  let hits = [], on = 0, timer = 0, seq = 0;
  const close = () => { list.hidden = true; hits = []; };
  const pick = h => { close(); inp.value = ''; inp.blur(); kgnGo(h.id, true); };
  const paint = () => {
    list.innerHTML = hits.map((h, i) => `<button type="button" data-i="${i}" class="${i === on ? 'on' : ''}">${
      esc(h.title)}<small>${esc(h.sub || h.type || '')}</small></button>`).join('');
    list.hidden = !hits.length;
    // the touch itself, not the mouse event a phone sends after it: on an
    // iPhone the field's blur closed the list before that arrived
    // (2026-10-11: the recenter did not work on an iPhone)
    list.querySelectorAll('button').forEach(b => {
      const go = e => { e.preventDefault(); const h = hits[+b.dataset.i]; if(h) pick(h); };
      b.onpointerdown = go;
      b.onmousedown = e => e.preventDefault();
      b.onclick = go;                      // a browser with no pointer events
    });
  };
  inp.oninput = () => {
    clearTimeout(timer);
    const q = inp.value.trim();
    if(q.length < 2){ close(); return; }
    timer = setTimeout(async () => {
      const my = ++seq;
      const d = await api('/api/search', {q});
      if(my !== seq) return;               // a later keystroke won
      hits = (d.results || []).filter(r => r.kind === 'entity' && r.id).slice(0, 8);
      on = 0; paint();
    }, 180);
  };
  inp.onkeydown = e => {
    if(e.key === 'ArrowDown' && hits.length){ on = (on + 1) % hits.length; paint(); e.preventDefault(); }
    else if(e.key === 'ArrowUp' && hits.length){ on = (on + hits.length - 1) % hits.length; paint(); e.preventDefault(); }
    else if(e.key === 'Enter' && hits.length){ pick(hits[on]); e.preventDefault(); }
    else if(e.key === 'Escape'){ close(); inp.value = ''; }
  };
  // The list outlives the keyboard: an iPhone's Done (the checkmark) takes
  // the focus away, and closing on that left nothing to tap (2026-10-11:
  // tapping the checkmark made the keyboard go away). It closes on a tap
  // anywhere outside the field, or on Escape.
  if(!KGN.findOutside){
    KGN.findOutside = true;
    document.addEventListener('pointerdown', e => {
      const box = document.querySelector('.kgn-find'), l = $('#kgnFindList');
      if(l && !l.hidden && box && !box.contains(e.target)) l.hidden = true;
    });
  }
}

async function kgnGo(id, push, quiet){
  const d = await api('/api/graph', {id});
  if(!d.found || !d.drawable){
    if(!quiet) $('#kgnInfo').textContent = d.found
      ? `${d.name} is a ${d.type}; the navigator does not draw this kind of record.`
      : 'Nothing to draw there.';
    if(quiet && id !== 'jesus' && !KGN.data) return kgnGo('jesus', false, true);
    return;
  }
  if(push && KGN.center) KGN.history.push(KGN.center);
  KGN.center = d.center; KGN.data = d;
  if(d.addr && d.addr !== d.center) ADDR[d.center] = d.addr;
  KGN.auto = true;                 // "auto automatically on any node click"
  if(state.active === 'explore') showAddress(state.tabs.find(x => x.id === 'explore'));
  kgnLooks(d.categories);
  kgnDraw();
}

function kgnDraw(){
  const cy = KGN.cy, d = KGN.data;
  if(!cy || !d || !(cy.container() && cy.container().isConnected)) return;
  cy.style(kgnStyle());
  cy.elements().remove();
  cy.add([
    ...d.nodes.map(n => ({data:{id:n.id, label:n.label, etype:n.etype},
                          classes: n.id === d.center ? 'center' : ''})),
    ...d.edges.map(e => ({data:{...e, strength:(KGN.pol = d.policy || KGN.pol, kgnStrength(e))},
      classes: 'c-' + kgnKey(e.category) + (e.source !== d.center && e.target !== d.center ? ' rim' : '')})),
  ]);
  $('#kgnTitle').innerHTML = `Centred on <b>${esc(d.name)}</b>`;
  const back = $('#kgnBack'), prev = KGN.history[KGN.history.length - 1];
  back.hidden = !prev;
  if(prev){
    const pn = (cy.getElementById(prev).data('label')) || prev.replace(/_/g, ' ');
    back.textContent = `← back to ${pn}`;
  }
  $('#kgnSel').innerHTML = '';
  kgnLegend();
  kgnFilter();
}

/* app1's autoFloor, one hop: the lowest strength that keeps the drawing to
   about twenty-one things. A tier of equal ties is dropped whole or not at
   all, and inferred siblings do not count toward the budget -- in app1
   counting them made the sibling feature remove half of Joseph's diagram and
   add none of them. (They do face the floor once it is set: kgnFilter.) */
function kgnAutoFloor(cand){
  const c = KGN.center;
  const stated = cand.filter(x => !x.e.data('derived'));
  const nodesAt = f => {
    const ids = new Set([c]);
    stated.forEach(x => { if(x.s >= f){ ids.add(x.e.data('source')); ids.add(x.e.data('target')); } });
    return ids.size;
  };
  if(nodesAt(0) <= kgnCeiling()) return 0;
  const levels = [...new Set(stated.map(x => x.s))].sort((a, b) => a - b);
  for(const l of levels) if(nodesAt(l) <= kgnCeiling()) return l;
  return levels[levels.length - 1] || 0;
}

function kgnFilter(){
  const cy = KGN.cy, c = KGN.center;
  // nothing to draw into once the reader has left the tab; kgnStart
  // rebuilds when they come back
  if(!cy || !c || !(cy.container() && cy.container().isConnected)) return;
  const touches = e => e.data('source') === c || e.data('target') === c;
  const cand = cy.edges().filter(e => !KGN.hidden.has(e.data('category')))
    .map(e => ({e, s: e.data('strength')}));
  // the bar's range is this graph's range, so every position does something
  const slider = $('#kgnStrength');
  const top = Math.max(0, ...cand.filter(x => touches(x.e)).map(x => x.s));
  const step = top > 6 ? 0.5 : top > 3 ? 0.25 : 0.1;
  slider.max = String(Math.max(2, Number((Math.ceil((top + step) / step) * step).toFixed(2))));
  slider.step = String(step);
  if(KGN.auto) KGN.floor = kgnAutoFloor(cand.filter(x => touches(x.e)));
  slider.value = String(Math.min(Number(slider.max), KGN.floor));
  $('#kgnStrengthVal').textContent = (KGN.auto ? 'auto ' : '')
    + (KGN.floor > 0 ? `≥ ${KGN.floor.toFixed(1)}` : 'all');
  /* INFERRED SIBLINGS FACE THE FLOOR TOO; they only do not SET it. In app1
     they were exempt, and that worked because app1 derived them from parents
     already in the drawing, so a sibling mostly added a line between people
     already there. Here the server supplies them, so each also adds a
     person: centred on David, Ozem, Raddai, Nethaneel and Shimea (strength
     1.9) stood on the canvas beside Saul and Solomon while the floor (5.2)
     kept Bathsheba off. 2026-10-01: zooming into David on the
     navigator showed Saul, Shimea, Zeruiah, Abigail, God, Nethaneel, Ozem,
     Raddai, where app 1 had worked well. Measured with the floor applied:
     David keeps none of his six inferred siblings; Joseph keeps 8 of 9, since
     his brothers share so much of the text with him; the slider brings the
     rest back. They still do not count toward the budget (kgnAutoFloor) --
     app1's lesson from Joseph stands. */
  const admitted = new Set(cand.filter(x => x.s >= KGN.floor).map(x => x.e.id()));
  // one hop: what the centre reaches through a tie that is drawn. A node held
  // up only by a neighbour's tie would claim a connection the graph is not
  // showing (app1, reachableFromCentre)
  const keep = new Set([c]);
  cand.forEach(({e}) => {
    if(!admitted.has(e.id())) return;
    if(e.data('source') === c) keep.add(e.data('target'));
    else if(e.data('target') === c) keep.add(e.data('source'));
  });
  let hiddenTies = 0, nRel = 0;
  /* ONE LINE PER PAIR (2026-10-11: with 7 lines connecting
     two concepts it was too much; line thickness is adjusted (slightly)
     instead, and a click on the line pops up a relation list to pick
     from). The strongest relation between two nodes is drawn; the others
     fold into it, which thickens it a little and counts them on it; a tap
     opens the list (kgnPick). Nothing is dropped: every relation is one tap
     away, and the count below says how many there are. */
  const pairs = new Map();
  cy.batch(() => {
    cy.nodes().forEach(n => n.style('display', keep.has(n.id()) ? 'element' : 'none'));
    cy.edges().forEach(e => {
      const on = admitted.has(e.id()) && keep.has(e.data('source')) && keep.has(e.data('target'));
      e.style('display', on ? 'element' : 'none');
      e.removeClass('bundle'); e.removeData('bundle');
      if(on){
        nRel++;
        const a = e.data('source'), b = e.data('target'), k = a < b ? a + '|' + b : b + '|' + a;
        if(!pairs.has(k)) pairs.set(k, []);
        pairs.get(k).push(e);
      }
      if(!on && touches(e) && !KGN.hidden.has(e.data('category'))) hiddenTies++;
    });
    pairs.forEach(es => {
      if(es.length < 2) return;
      es.sort((x, y) => (y.data('strength') || 0) - (x.data('strength') || 0));
      es.slice(1).forEach(e => e.style('display', 'none'));
      es[0].data('bundle', es.map(e => e.id()));
      es[0].addClass('bundle');
    });
  });
  // laid out at the labels' own size, then scaled for the zoom it fits to:
  // laying out the scaled boxes fitted smaller, which scaled them again
  if((KGN.lblK || 1) !== 1){ KGN.lblK = 1; cy.style(kgnStyle()); }
  cy.elements(':visible').layout({name:'concentric', animate:false, fit:true, padding:34,
    minNodeSpacing:22, spacingFactor:0.8, avoidOverlap:true, equidistant:true,
    levelWidth:() => 1, concentric: n => n.id() === c ? 2 : 1}).run();
  if(KGN.lblScale) KGN.lblScale();
  kgnChip();
  // say what was left out: silently thinning would make someone look less
  // connected than the text records
  const kinds = {};
  cy.nodes(':visible').forEach(n => { if(n.id() !== c){ const k = n.data('etype'); kinds[k] = (kinds[k] || 0) + 1; } });
  const nE = nRel;                  // relations, not lines: a folded line counts all it holds
  $('#kgnInfo').textContent = [
    Object.entries(kinds).sort((a, b) => b[1] - a[1])
      .map(([k, n]) => `${n} ${n === 1 ? k : (KGN_PLURAL[k] || k + 's')}`).join(' · ') || 'nothing related',
    `${nE} ${nE === 1 ? 'relation' : 'relations'}`,
    hiddenTies ? `${hiddenTies} weaker ${hiddenTies === 1 ? 'tie' : 'ties'} hidden` : '',
  ].filter(Boolean).join(' · ');
}

// the chip sits on the centre's lower edge and follows it through pan and zoom
function kgnChip(){
  const chip = $('#kgnOpen'), cy = KGN.cy;
  if(!chip || !cy || !KGN.center) return;
  const n = cy.getElementById(KGN.center);
  if(!n.length || n.style('display') === 'none'){ chip.style.display = 'none'; return; }
  const p = n.renderedPosition(), h = n.renderedOuterHeight();
  chip.style.display = 'block';
  chip.style.left = p.x + 'px';
  chip.style.top = (p.y + h / 2) + 'px';
}

function kgnSentence(e){
  const s = KGN.cy.getElementById(e.data('source')).data('label');
  const t = KGN.cy.getElementById(e.data('target')).data('label');
  return `${s} ${e.data('label')} ${t}`;
}
function kgnTip(ev){
  const e = ev.target, tip = $('#kgnTip');
  if(e.hasClass('bundle')){
    const cy = KGN.cy, a = cy.getElementById(e.data('source')).data('label'), b = cy.getElementById(e.data('target')).data('label');
    tip.innerHTML = `<b>${(e.data('bundle') || []).length} relations between ${esc(a)} and ${esc(b)}</b><br><span class="g">click to choose one</span>`;
    tip.classList.add('on'); kgnTipMove(ev); return;
  }
  const how = e.data('derived') ? `inferred: ${e.data('note')}`
    : e.data('certainty') !== 'explicit' ? e.data('certainty') : '';
  tip.innerHTML = `<b>${esc(kgnSentence(e))}</b><br><span class="g">${
    esc((e.data('refs') || []).map(prettyRef).join('; '))}${how ? ' · ' + esc(how) : ''}</span>`
    + `<br><span class="g">click the line to open its verses</span>`;
  tip.classList.add('on');
  kgnTipMove(ev);
}
function kgnTipMove(ev){
  const tip = $('#kgnTip'), p = ev.renderedPosition || {x:0, y:0};
  const w = tip.parentElement.clientWidth;
  tip.style.left = Math.min(p.x + 14, w - 310) + 'px';
  tip.style.top = (p.y + 14) + 'px';
}
// a folded line, tapped: the relations it holds, to pick one (2026-10-11)
function kgnPick(ev){
  const e = ev.target, box = $('#kgnPick');
  if(!box) return kgnSelect(e);
  const es = (e.data('bundle') || []).map(i => KGN.cy.getElementById(i)).filter(x => x.length);
  KGN.cy.edges().removeClass('sel'); e.addClass('sel');
  box.innerHTML = `<div class="g">${es.length} relations — pick one</div>` + es.map((x, i) =>
    `<button type="button" data-i="${i}">${esc(kgnSentence(x))}${
      (x.data('refs') || []).length ? `<small>${esc(prettyRef(x.data('refs')[0]))}</small>` : ''}</button>`).join('');
  box.querySelectorAll('button').forEach(b => {
    const go = evt => { evt.preventDefault(); kgnSelect(es[+b.dataset.i]); e.addClass('sel'); kgnPopSel(ev.renderedPosition); };
    b.onpointerdown = go; b.onclick = go;
  });
  box.hidden = false;
  const p = ev.renderedPosition || {x:20, y:20}, w = box.parentElement.clientWidth, h = box.parentElement.clientHeight;
  box.style.left = Math.max(6, Math.min(p.x - 20, w - box.offsetWidth - 6)) + 'px';
  box.style.top = Math.max(6, Math.min(p.y + 10, h - box.offsetHeight - 6)) + 'px';
}
function kgnPickClose(){ const b = $('#kgnPick'); if(b) b.hidden = true; }
// the chosen relation, in a box that stays where the line was clicked: its
// sentence, its verses (each opening in place) and its note
function kgnPopSel(pos){
  const box = $('#kgnPick'), sel = $('#kgnSel');
  if(!box || !sel || !sel.innerHTML) return;
  $('#kgnTip').classList.remove('on');
  box.innerHTML = `<div style="padding:4px 6px">${sel.innerHTML}</div>`;
  box.querySelectorAll('[data-goref]').forEach(l => l.onclick = () => peekAt(l, l.dataset.goref));
  box.hidden = false;
  const p = pos || {x:20, y:20}, w = box.parentElement.clientWidth, h = box.parentElement.clientHeight;
  box.style.left = Math.max(6, Math.min(p.x - 20, w - box.offsetWidth - 6)) + 'px';
  box.style.top = Math.max(6, Math.min(p.y + 10, h - box.offsetHeight - 6)) + 'px';
}

// a clicked tie: its sentence, and its verses opening in place (peekAt)
function kgnSelect(e){
  KGN.cy.edges().removeClass('sel'); e.addClass('sel');
  const refs = e.data('refs') || [];
  const how = e.data('derived') ? ` <span class="g">(inferred: ${esc(e.data('note'))})</span>` : '';
  // the tie's own note, folded away for the curious (2026-10-02: show
  // the notes on click in the navigator, but in a subtle way for the curious)
  const note = !e.data('derived') && e.data('note');
  // a note that is only a quotation is the text's words, not a reason, so it
  // says so and names its verse (2026-10-02, on Mary and Jesus: it is
  // odd sometimes)
  const qref = e.data('note_ref');
  const bare = qref !== undefined;
  const label = bare ? "in the text's words" : "why it's recorded";
  const body = bare && qref ? `<span class="link" data-goref="${esc(qref)}">${esc(prettyRef(qref))}</span>: ${esc(note)}`
                            : esc(note);
  $('#kgnSel').innerHTML = `${esc(kgnSentence(e))}${how}${refs.length ? ' · ' : ''}${
    refs.map(r => `<span class="link" data-goref="${esc(r)}">${esc(prettyRef(r))}</span>`).join(', ')}${
    note ? `<details class="kgn-note"><summary>${label}</summary>${body}</details>` : ''}`;
  $('#kgnSel').querySelectorAll('[data-goref]').forEach(l => l.onclick = () => peekAt(l, l.dataset.goref));
}

/* app1's legend, as a side column: grouped, each category its look, the
   centre's own count of relations in it, and a checkbox. Counts are the
   centre's relations, not what is drawn, so dragging the bar never makes a
   category look empty when it is only hidden. */
function kgnLegend(){
  const d = KGN.data, looks = KGN.looks, box = $('#kgnLegend');
  const counts = {};
  d.edges.forEach(e => { if(e.source === d.center || e.target === d.center)
    counts[e.category] = (counts[e.category] || 0) + 1; });
  const known = new Set(KGN_GROUPS.flatMap(g => g.cats));
  const groups = KGN_GROUPS.map((g, i, all) => ({...g, cats: g.cats.filter(c => c in d.categories)
    .concat(i === all.length - 1 ? Object.keys(d.categories).filter(c => !known.has(c)) : [])}));
  box.innerHTML = groups.filter(g => g.cats.length).map(g => {
    const on = g.cats.filter(c => !KGN.hidden.has(c)).length;
    const n = g.cats.reduce((s, c) => s + (counts[c] || 0), 0);
    return `<div class="lg-group" data-g="${g.key}">
      <label class="lg-head"><input type="checkbox" data-group="${g.key}"${on ? ' checked' : ''}>
        ${esc(g.label)}<span class="n g">${n || ''}</span></label>
      ${g.cats.map(c => `<label class="lg-row${counts[c] ? ' has' : ''}">
        <input type="checkbox" data-cat="${esc(c)}"${KGN.hidden.has(c) ? '' : ' checked'}>
        <span class="kgn-sw" style="${kgnSwatch(looks[c] || {a:'#888'})}"></span>
        ${esc(d.categories[c])}<span class="n">${counts[c] || ''}</span></label>`).join('')}
    </div>`;
  }).join('') + `<div class="lg-key"><span></span>stated<br>
      <span style="border-top-style:dashed"></span>implied<br>
      <span style="border-top-style:dotted"></span>inferred, or less certain<br>
      Thicker: more of the text is given to the two together.</div>`;
  groups.forEach(g => {
    const head = box.querySelector(`input[data-group="${g.key}"]`);
    if(!head) return;
    const on = g.cats.filter(c => !KGN.hidden.has(c)).length;
    head.indeterminate = on > 0 && on < g.cats.length;
    // a partial group completes; a full one clears (app1's rule)
    head.onclick = ev => {
      const want = g.cats.some(c => KGN.hidden.has(c));
      ev.preventDefault();
      g.cats.forEach(c => want ? KGN.hidden.delete(c) : KGN.hidden.add(c));
      kgnLegend(); kgnFilter();
    };
  });
  box.querySelectorAll('input[data-cat]').forEach(i => i.onchange = () => {
    i.checked ? KGN.hidden.delete(i.dataset.cat) : KGN.hidden.add(i.dataset.cat);
    kgnLegend(); kgnFilter();
  });
}

// the canvas cannot read CSS variables, so a theme change restyles it
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => KGN.cy && KGN.cy.style(kgnStyle()));
new MutationObserver(() => KGN.cy && KGN.cy.style(kgnStyle()))
  .observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});

function setExplore(html, wire){
  const tb = state.tabs.find(x => x.id === 'explore');
  tb.html = html; tb.wire = wire;
  if(state.active === 'explore'){
    $('#paneinner').innerHTML = html;
    if(wire) wire();
  }
}

/* ---------------- boot ---------------- */
(async function(){
  /* the script ran: counted as a reader on /ops (2026-10-22). A farm of
     clients that load a page and never run it is counted apart. Never
     cached, carries nothing, and a failure is ignored. */
  /* and the site they came from, by its name alone (www.google.com): the
     page itself is often served from Cloudflare's cache, so the server
     never saw where most readers came from (2026-10-22) */
  try{
    let from = '';
    try{ const h = document.referrer ? new URL(document.referrer).host : '';
         if(h && h !== location.host) from = h.slice(0, 80); }catch(e){}
    fetch('/api/open' + (from ? '?r=' + encodeURIComponent(from) : ''),
          {cache: 'no-store', keepalive: true}).catch(() => {});
  }catch(e){}
  const b = await api('/api/books', {});
  BOOKS = b.books;
  b.books.forEach(x => { BOOKMAP[x.id] = x.id; BOOKMAP[x.macula] = x.id; });
  renderTabs();
  setDensity(mem.get('density','plain'));
  // one column by default; the two-column layout if the reader chose it --
  // never on a phone (2026-10-01), where the choice is kept for later
  // but not applied, and a window narrowed to phone width drops it
  applyColsForWidth();
  PHONE.addEventListener('change', () => { applyColsForWidth(); alignParas(); });
  wireMore();
  wireReaderClicks();
  /* Fill the reader before showing Explore, so tab 2 is never an empty pane.
     The remembered place if there is one, Genesis 1 otherwise. */
  const at = mem.get('place', {b:'Gen', c:1});
  /* APP1'S ADDRESSES OPEN WHAT THEY NAME (2026-10-01, before the app2
     switch: done first so that nothing breaks). A link an invitee kept from
     app1 -- a card at /e/<id> (or the older ?id=), a passage at /p/<ref> --
     opens that card or that verse. They are now app2's own addresses too
     (A.21): the address bar keeps them, and from then on follows the tab
     you are on (showAddress). Anything it cannot resolve lands where the
     app would anyway, at the root. */
  // a malformed escape ("/e/%E0") must not stop the app loading (Fable, L4)
  let path = location.pathname;
  // read now: loading the reader below rewrites the address and drops it
  // (/theme/apocalyptic/imagery#row-33 opened no row)
  const bootHash = BOOT_HASH;
  try{ path = decodeURIComponent(path); }catch(e){}
  const oldId = path.startsWith('/e/') ? path.slice(3)
              : new URLSearchParams(location.search).get('id');
  const oldRef = path.startsWith('/p/') ? path.slice(3).trim() : null;
  // only the old ?id= form is tidied away here; /e/ and /p/ are kept
  if(oldId && !path.startsWith('/e/')) history.replaceState(null, '', '/');
  if(oldRef){
    // app1 wrote these as chapter names -- "Genesis 1", "1 Samuel 3" -- which
    // the search box already reads, so it resolves them the same way
    const s = await api('/api/search', {q: oldRef});
    const p = (s.results || []).find(x => x.kind === 'passage');
    if(p){
      if(p.verse){
        await jumpTo(`${p.id}.${p.chapter}.${p.verse}`);
        // /p/John.3.16#orig opens the verse's original (and #struct, #links)
        if(/^#(orig|struct|links|note)\b/.test(bootHash)) openDepth(p.verse, bootHash);
      }
      else await loadChapter(p.id, p.chapter);
      return;
    }
  }
  await loadChapter(at.b || 'Gen', at.c || 1);
  selectTab('explore');
  // a major theme's own address (A.21)
  // (/themes/<slug> since 7.6d; the server sends /theme/<id> there with a 301,
  // and the API takes the slug or the id)
  const themeId = path.startsWith('/themes/') ? path.slice(8).replace(/\/$/, '')
    : path.startsWith('/theme/') ? path.slice(7).replace(/\/$/, '') : null;
  // the Navigator centred on a record (A.21): it starts from KGN.center
  const graphId = path.startsWith('/graph/') ? path.slice(7).replace(/\/$/, '') : null;
  // an Explore group's own address (/explore/told-again, /explore/shared):
  // Explore, with that group open and in view (2026-10-04: it might work if
  // consolidated on the Explore page)
  const exploreId = path.startsWith('/explore/') ? path.slice(9).replace(/\/$/, '') : null;
  // a word card at its Strong's number, /word/H1254 (2026-10-16)
  const wordM = path.match(/^\/word\/([HhGg])0*(\d+)/);
  // a tab with no page of its own, after the # (DEEP, near openTab): /#tag=love
  const HP = new URLSearchParams(bootHash.replace(/^#/, ''));
  const two = v => String(v || '').split('|');
  const DEEP_OPEN = {
    tag: v => openTag(v), recur: v => openRecur(v), pat: v => openHigherPattern(v),
    mined: v => openMined(v), pattern: v => openPattern(v), seq: v => openSequence(v),
    theme: v => openTheme(v), contrast: v => openContrast(...two(v)), layer: v => openLayerItem(...two(v)),
    coverage: () => openCoverage(), unit: v => openUnit(v), explore: () => buildExplore(),
  };
  const deepKind = path.replace(/\/$/, '') === '' ? Object.keys(DEEP_OPEN).find(k => HP.has(k)) : null;
  if(oldId) openEntity(oldId);
  else if(wordM) openSense(wordM[1].toLowerCase() + wordM[2]);
  else if(deepKind) await DEEP_OPEN[deepKind](HP.get(deepKind));
  // a theme's imagery at its own address, an image opened from its #row-N
  else if(themeId && themeId.includes('/'))   // a theme's table: /theme/<id>/<slug>
    openImagery(themeId.split('/')[0], {row: (bootHash.match(/^#row-(\d+)$/) || [])[1]});
  else if(themeId) openMajorTheme(themeId);
  else if(exploreId){
    await buildExplore();
    // every section has an address (2026-10-11): a Patterns group by its
    // readable name, a top-level section by its own (server: EXPLORE_GROUPS,
    // EXPLORE_SECTIONS)
    const PG = {'story-shapes':'shapes', 'declared-repeats':'declared', 'role-patterns':'roles',
                'significant-numbers':'numbers', 'speech-acts':'acts', 'how-the-text-is-built':'built',
                'for-digging':'dig'};
    const XS = {events:'x-events', lists:'x-lists', patterns:'x-patternsets', 'upper-ontologies':'x-upper'};
    const sel = XS[exploreId] || `pg-${PG[exploreId] || exploreId}`;
    const g = document.querySelector(`details[data-sec="${CSS.escape(sel)}"]`);
    if(g){
      for(let p = g; p; p = p.parentElement) if(p.tagName === 'DETAILS') p.open = true;
      g.scrollIntoView({block: 'start'});
    }
  }
  else if(graphId){ KGN.center = graphId; openNavigator(); }
  // the Navigator's own page, /graph: opens it where it would open anyway
  else if(path.replace(/\/$/, '') === '/graph') openNavigator();
  // About's own page (A.21)
  else if(path.replace(/\/$/, '') === '/about') openAbout();
  // a first visit, not arriving by an old link to something specific
  else if(!mem.get('welcomed', false)) showWelcome();
  // and a section opened within it (#open=rel-Family), once it is drawn
  if(HP.get('open')) openSecLater(HP.get('open'));
})();
</script>
