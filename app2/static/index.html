/* A verse with no pattern to mark — used by the layer cards. */
/* An original-language line with the pronunciation and the gloss under each
   word. 2026-09-16: the phonic and the definition are needed below
   each original language symbol, with the BSB also there unchanged. So the translation stays where it is and the original
   above it gains two lines: how to say the word, and what it means. */
/* The original strip with the pattern's own words boxed: the anchor, and the
   word filling the slot in THIS verse. Two marks rather than one, because they
   are different things — one is what every instance shares and the other is
   what makes this instance different — and telling them apart is most of what
   a reader wants from an example. */
function origMarked(orig, rtl){
  if(!(orig||[]).length) return '';
  return `<div class="porig${rtl?' rtl':''}">${orig.map(w =>
    `<span class="pwd${w.mark ? ' mk-' + w.mark : ''}">
       <span class="pw">${esc(w.t||'')}</span>
       ${w.x ? `<span class="px">${esc(w.x)}</span>` : ''}
       ${w.g ? `<span class="pg">${esc(w.g)}</span>` : ''}
     </span>`).join('')}</div>`;
}

function origLine(orig, rtl, markOn){
  if(!(orig||[]).length) return '';
  return `<div class="porig${rtl?' rtl':''}">${orig.map(w =>
    `<span class="pwd${markOn && w.on ? ' on' : ''}">
       <span class="pw">${esc(w.t||'')}</span>
       ${w.x ? `<span class="px">${esc(w.x)}</span>` : ''}
       ${w.g ? `<span class="pg">${esc(w.g)}</span>` : ''}
     </span>`).join('')}</div>`;
}

async function showPlainVerse(btn){
  /* `.body` is the wrapper sec() puts round a section, and not every card
     using these buttons has one -- the stamp card lists its instances
     directly in the pane, so scoping to `.body` alone found no reveal box and
     the click did nothing at all, silently. */
  const scope = btn.closest('.body') || btn.closest('.pane') || document;
  const box = scope.querySelector('.occshow');
  if(!box) return;
  const was = btn.classList.contains('on');
  scope.querySelectorAll('.occ.on').forEach(x => x.classList.remove('on'));
  if(was){ box.hidden = true; return; }
  btn.classList.add('on');
  box.hidden = false;
  box.innerHTML = '<span class="hint">loading…</span>';
  const p = await api('/api/verse', {ref: btn.dataset.vref});
  /* The original under the translation. A literary device is a feature of the
     Hebrew or Greek -- an acrostic cannot be seen in English at all -- so the
     example is only evidence if the text is there with it. */
  box.innerHTML = p.text
    ? `<div class="phrase"><button class="use" data-ref="${esc(btn.dataset.vref)}"
         >${esc(prettyRef(btn.dataset.vref))}</button>
       <span>${origLine(p.orig, p.rtl)}<span class="pen">${
         esc(p.text)}</span></span></div>`
    : `<span class="hint">No text for ${esc(btn.dataset.vref)}.</span>`;
  box.querySelectorAll('.use').forEach(u => u.onclick = () => peek(u));
}

/* One instance of a pattern, with the words that put it on the list marked. */
async function showPatternVerse(btn){
  /* Two groupings use these buttons now: the by-book list under "where it is
     used", and the per-filler list under "what fills each slot". Closing on
     `.bookgrp` alone made `grp` null for the second and threw before anything
     rendered, so the reference simply did nothing when clicked. */
  const grp = btn.closest('.bookgrp, .fillrefs');
  const box = grp && grp.querySelector('.occshow');
  if(!box) return;
  const was = btn.classList.contains('on');
  const sect = btn.closest('.body') || btn.closest('.pane') || document;
  sect.querySelectorAll('.occ.on').forEach(x => x.classList.remove('on'));
  sect.querySelectorAll('.occshow').forEach(x => { if(x !== box) x.hidden = true; });
  if(was){ box.hidden = true; return; }
  btn.classList.add('on');
  box.hidden = false;
  box.innerHTML = '<span class="hint">loading…</span>';
  const p = await api('/api/pattern-verse',
                      {key: btn.dataset.pkey, ref: btn.dataset.pref});
  if(!p || !p.found){ box.innerHTML = '<span class="hint">No text.</span>'; return; }
  /* THE BEREAN TEXT IS SHOWN PLAIN. 2026-09-19: the BSB highlighting was
     very misleading as the wrong words were emphasized. The solution is to
     remove the emphasis/bolding from the BSB, which is a guess anyway, and put
     boxes around the matched word, including the slot word in the original
     language.

     Nothing here knows which English word renders which word of the original,
     so any emphasis on the translation was a guess dressed as an alignment.
     The original is where the pattern actually lives, and the server marks the
     two things it genuinely knows: the anchor's lexeme, and the filler this
     verse contributes. */
  /* The same two marks on the translation, from the Berean editors' own tags
     rather than from matching words. 2026-09-19: the value is that it
     bridges oracle to prophecy in Num 24:4 — the Hebrew is boxed and glossed
     "oracle", the English reads "the prophecy", and the mark says they are one
     word. Spans arrive sorted and non-overlapping; anything unmarked is left
     alone rather than guessed at. */
  const t = p.text || '';
  let body = '', at = 0;
  for(const [s, e, kind] of (p.spans || [])){
    if(s < at || e > t.length) continue;
    body += esc(t.slice(at, s))
          + `<span class="mk mk-${kind}">${esc(t.slice(s, e))}</span>`;
    at = e;
  }
  body += esc(t.slice(at));
  box.innerHTML = `<div class="phrase">
    <button class="use" data-ref="${esc(p.ref)}">${esc(prettyRef(p.ref))}</button>
    <span>${origMarked(p.orig, p.rtl)}<span class="pen">${body}</span></span></div>`;
  box.querySelectorAll('.use').forEach(u => u.onclick = () => peek(u));
}

/* A lane diagram rather than a hairball. The legacy app's force chart had
   merits and organised nothing: everything at once, no grouping, and no way to
   see what KIND of link you were looking at. Here the entity sits on the left
   and each CATEGORY of relation gets its own lane -- closer to a class diagram,
   and it stays readable because the taxonomy does the organising. */
function drawEntityGraph(d, opts){
  /* Every category gets a lane, and how much of each is shown depends on the
     room available. A hub like Jesus (419 relations, 57 types) must look bigger
     than a minor figure -- but on a phone a lane diagram is unreadable at any
     size, so below the narrow breakpoint it is dropped entirely and the folded
     tree beneath carries the same information better. */
  const W = (document.querySelector('#paneinner') || {}).clientWidth
            || window.innerWidth || 900;
  /* On a phone, scrolling is not bad on mobile. So the
     diagram stays at every size and the FILTERING gets harder instead -- fewer
     categories and fewer boxes in each -- with the sheet scrolling sideways
     rather than the labels shrinking. */
  /* ALL OF IT, WRAPPED, ON A HUB CARD. 2026-10-09, with the graph moved
     up into the hub: where it connects was far from Concepts, so
     all the concept boxes show in the diagram. Every lane and every box,
     each lane's boxes wrapping onto further rows at the pane's width. */
  // -- on a desktop, across the pane's whole width; on a phone the capped
  // lanes and "+N more" as everywhere (the plus expansion is fine on a phone,
  // but a desktop takes the horizontal space)
  const all = !!(opts && opts.all) && W >= 900;
  const maxLanes = all ? 1e9 : W < 620 ? 3 : W < 900 ? 4 : W < 1300 ? 6 : 12;
  const perLane  = all ? 1e9 : W < 620 ? 2 : W < 900 ? 2 : W < 1300 ? 3 : 5;
  const lanes = (d.groups||[]).slice(0, maxLanes)
    .map(g => ({cat: g.category, items: g.items.slice(0, perLane),
                more: Math.max(0, g.items.length - perLane),
                total: g.items.length}))
    .filter(g => g.items.length);
  if(!lanes.length) return '';
  /* THE CENTRE BOX FITS ITS NAME. 2026-09-30: the orange box in the node graph
     is expanded wide enough to
     accommodate wider text. It was a fixed 118px, which a name like "Jesus at
     Mark 2:19" or a saying's label overran. It is sized from the label now
     (Spectral at 15px, about 8.2px a character), and a label too long for one
     line wraps to two at the space nearest its middle rather than making one
     very wide box; the lanes start after it. */
  const name = d.label || d.name;
  const CH = 8.2, ONE = 38;
  let lines = [name];
  if(name.length > ONE){
    const mid = name.length / 2;
    let cut = -1;
    for(let i = 0; i < name.length; i++)
      if(name[i] === ' ' && (cut < 0 || Math.abs(i - mid) < Math.abs(cut - mid))) cut = i;
    // the space stays on the first line, so the label still reads as words
    // when it is read as text ("theresurrection", UI committee)
    if(cut > 0) lines = [name.slice(0, cut + 1), name.slice(cut + 1)];
  }
  const boxW = Math.max(118, Math.ceil(CH * Math.max(...lines.map(l => l.length)) + 28));
  const boxH = lines.length > 1 ? 58 : 38;
  const PAD=16, LANE=52, BOXH=26, GAPX=26, ROWH=34;
  const LEFT = PAD + boxW + GAPX;
  const fw = s => 7.4*String(s).length + 20;
  // each lane's boxes laid in rows: one row unless wrapping (all), where a
  // row ends at the pane's width
  // the pane's width, inside the sheet's padding: the sheet steps out of the
  // hub's 760px text column (below)
  const wrapAt = all ? Math.max(W - 44, LEFT + 320) : Infinity;
  let top = PAD;
  lanes.forEach(g => {
    let x = LEFT + 4, row = 0;
    g.boxes = g.items.map(it => {
      // a name longer than a box can hold (a saying named by its whole text)
      // is cut, in full on hover and in the list (2026-10-09: one ran past
      // the sheet on mercy)
      it.short = it.name.length > 48 ? it.name.slice(0, 46).trimEnd() + '…' : it.name;
      const w = fw(it.short);
      if(x + w > wrapAt && x > LEFT + 4){ row++; x = LEFT + 4; }
      const b = {it, w, x, row};
      x += w + 10;
      return b;
    });
    g.endX = x; g.rows = row + 1;
    g.y = top + LANE/2;
    top += LANE + row * ROWH;
  });
  const H = Math.max(top + PAD, boxH + PAD*2);
  let parts = [], maxX = LEFT;
  const cy = all ? Math.min(H/2, PAD + boxH/2 + 8) : H/2;
  parts.push(`<rect x="${PAD}" y="${cy-boxH/2}" width="${boxW}" height="${boxH}"
    rx="3" fill="var(--ochre-soft)" stroke="var(--ochre)"/>
    <text x="${PAD+boxW/2}" y="${cy + 5 - (lines.length - 1) * 10}" text-anchor="middle"
    fill="var(--ink)" font-family="Spectral, serif" font-size="15">${lines.map((l, i) =>
      `<tspan x="${PAD+boxW/2}" dy="${i ? 20 : 0}">${esc(l)}</tspan>`).join('')}</text>`);
  lanes.forEach(g => {
    const y = g.y;
    parts.push(`<path d="M${LEFT-GAPX} ${cy} C ${LEFT-8} ${cy}, ${LEFT-8} ${y}, ${LEFT} ${y}"
      fill="none" stroke="var(--rule)"/>`);
    // on a hub card the lane's name opens the same group below, with its
    // verses (the concepts below are richer, and the
    // disconnect between the two was the problem)
    parts.push(`${all ? `<g class="entmore" data-cat="${esc(g.cat)}" style="cursor:pointer">` : ''}<text x="${LEFT+2}" y="${y-15}"
      fill="${all ? 'var(--ochre)' : 'var(--slate)'}" font-family="IBM Plex Mono, monospace" font-size="9.5"
      letter-spacing=".1em">${esc(g.cat.toUpperCase())} · ${g.total}${all ? ' — with verses' : ''}</text>${all ? '</g>' : ''}`);
    let x = g.endX;
    g.boxes.forEach(({it, w, x: bx, row}) => {
      const by = y + row * ROWH;
      parts.push(`<g class="entnode" data-ent="${esc(it.other)}" style="cursor:pointer"><title>${esc(it.name)}</title>
        <rect x="${bx}" y="${by-BOXH/2}" width="${w}" height="${BOXH}" rx="3"
          fill="var(--surface)" stroke="var(--rule)"/>
        <text x="${bx+w/2}" y="${by+5}" text-anchor="middle" fill="var(--ink)"
          font-family="Spectral, serif" font-size="13">${esc(it.short)}</text></g>`);
      maxX = Math.max(maxX, bx + w + 10);
    });
    if(g.more){
      /* "+N more" opens that category in the list below and scrolls to it
         (2026-09-30: the list is expandable) -- a drawing cannot
         unfold in place, the list can */
      const w = fw('+' + g.more + ' more');
      parts.push(`<g class="entmore" data-cat="${esc(g.cat)}" style="cursor:pointer">
        <rect x="${x}" y="${y-BOXH/2}" width="${w}" height="${BOXH}"
        rx="3" fill="var(--surface)" stroke="var(--rule)" stroke-dasharray="3 3"/>
        <text x="${x+w/2}" y="${y+5}" text-anchor="middle" fill="var(--ochre)"
        font-family="IBM Plex Mono, monospace" font-size="11">+${g.more} more</text></g>`);
      maxX = Math.max(maxX, x + w);
    }
  });
  /* Natural size, never scaled to fit. Capping the width made a hub like
     Jesus or David shrink until its labels were unreadable -- the diagram was
     technically complete and practically useless. The sheet scrolls instead,
     so a big subject looks big and every label stays legible. */
  const hidden = (d.groups||[]).length - lanes.length;
  return `<div class="sheetbox wide" id="entgraph"${all ? ` style="width:${W}px;max-width:${W}px;box-sizing:border-box"` : ''}><svg viewBox="0 0 ${maxX+PAD} ${H}"
    width="${maxX+PAD}" height="${H}" role="img"
    aria-label="How ${esc(d.name)} connects">${parts.join('')}</svg>${
    hidden > 0 ? `<div class="graphnote">${hidden} further categor${
      hidden===1?'y is':'ies are'} in the list below</div>` : ''}</div>`;
}

/* The identity block leads the page: the 'is' relationships are surfaced
   first, in order of closeness of match. What is
   claimed to BE this one comes first, ranked; what is explicitly held APART
   from it is second and separate, because a distinction is not weak identity,
   it is evidence of the opposite.

   Everything here is the legacy graph's reasoned work, so it is labelled an
   overlay and never blended with what the parser computed. */
function identityBlock(d){
  const same = d.identity || [], apart = d.distinct || [];
  if(!same.length && !apart.length) return '';
  const byLabel = {};
  same.forEach(r => (byLabel[r.label] = byLabel[r.label] || []).push(r));
  const line = r => `<div class="idrow">
      <span class="link" data-ent="${esc(r.id)}">${esc(r.name)}</span>
      ${r.otype ? `<span class="g">${esc(r.otype)}</span>` : ''}
      ${cites(r.refs)}${/* whose words (P-71): a speaker's claim says so here too */''}${r.claimed_by
        ? `<span class="g claimby">— the words of <span class="link" data-ent="${esc(r.claimed_by)}">${
            esc(r.claimed_by_name)}</span></span>` : ''}
      ${r.note ? `<div class="idnote">${r.note.length > 180
        ? `${esc(r.note.slice(0, 180))}<details class="moreinl"><summary>… more</summary>${
            esc(r.note.slice(180))}</details>` : esc(r.note)}</div>` : ''}
    </div>`;
  const groups = Object.entries(byLabel).map(([label, rows]) =>
    `<details class="sub" ${rows.length <= 6 ? 'open' : ''}>
      <summary>${esc(label)}<span class="ct">${rows.length}</span></summary>
      <div class="subbody">${rows.map(line).join('')}</div></details>`).join('');
  return `<div class="identbox">
    <div class="identhead">Who this is said to be
      <span class="overlay" title="Read from the text verse by verse, each with its reference; not yet derived by rule.">reasoned, not yet derived</span></div>
    ${groups}
    ${/* In a reader's words (2026-10-02, reworded from the 'pipeline' line):
          it had said "The pipeline does not compute these yet; the aim is to
          retire the need for them" -- the project's working language. */''}
    <p class="idfoot">Each line was read from the text verse by verse and
      carries its reference. These are readings, not yet derived by rule.</p>
    ${apart.length ? `<div class="apart">
      <div class="aparthead">And held apart from<span class="ct">${apart.length}</span></div>
      ${apart.map(line).join('')}
      <p class="idfoot">Only where the text ALSO identifies them. A distinction
        is not weak identity — it is evidence of the opposite — but it is only
        load-bearing where something was claimed to settle.${
        (d.contrasted||[]).length ? ` ${d.contrasted.length} further contrast${
        d.contrasted.length===1?' is':'s are'} recorded (${
        d.contrasted.map(c => nameLink(c.id, c.name)).join(', ')}) and sit in the list
        below: nothing proposed those were the same, so there is nothing to
        settle.` : ''}</p>
    </div>` : ''}
  </div>`;
}

let LAST_ENTITY = null;

/* Redraw on resize rather than re-render: the diagram is the only thing whose
   content depends on width, and re-rendering the pane would collapse the folds
   the reader had opened. */
let entResizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(entResizeTimer);
  entResizeTimer = setTimeout(() => {
    const holder = document.querySelector('#entgraph');
    if(!holder || !LAST_ENTITY) return;
    const wrap = document.createElement('div');
    wrap.innerHTML = drawEntityGraph(LAST_ENTITY);
    if(wrap.firstElementChild){
      holder.replaceWith(wrap.firstElementChild);
      document.querySelectorAll('#entgraph .entnode').forEach(n =>
        n.onclick = () => openEntity(n.dataset.ent));
    }
  }, 180);
});

/* AN EVENT'S CARD. 2026-09-29: the Explore events were tags, and on
   arriving at an event it was disappointing that they were not really
   nodes. An event is: the passages that tell it (and which the Berean
   editors' notes confirm), who is in it (everyone its tellings name, by
   rule), the sections it holds, and the passages it points to, each with the
   evidence the graph has for the link or marked as a suggestion without it.
   It speaks about the TEXT; the tools that drafted the list are credited once,
   in About (2026-09-30: automation helps generate things but everything is
   sourced in the Bible, so the credit is not repeated). All
   links are delegated (data-go, data-ent), so the card survives being
   restored from a tab. */
function eventBlock(ev){
  const WHO = {both: 'confirmed by the Berean editors’ notes', copilot: '',
               editors: 'from the Berean editors’ notes'};
  const go = (first, label) => first
    ? `<span class="link" data-go="${esc(first)}">${esc(label)}</span>` : findLink(label);
  const tell = ev.tellings.map(t => `<div class="rowline">${go(t.first, t.label)}
      <span class="g">${WHO[t.by] ? esc(WHO[t.by]) + ' · ' : ''}${t.n} ${t.n === 1 ? 'verse' : 'verses'}${
        t.note && !/copilot/i.test(t.note) ? ' · ' + esc(t.note) : ''}</span></div>${
      t.disputed ? `<div class="hint" style="margin:-4px 0 8px 2px">Disputed: ${
        esc(t.disputed)}; the Berean editors join it here, and they are the more
        credible source.</div>` : ''}`).join('');
  /* the people the text gives no name (the rich young ruler, the woman at
     the well, "the priests") joined by their own records' verses, not by a
     count of names (P-74): a line of their own, first, since they are often
     who the event is about */
  const P = (ev.participants || []).filter(x => x.via !== 'cited');
  const C = (ev.participants || []).filter(x => x.via === 'cited');
  const person = x => `<span class="link" data-ent="${esc(x.id)}">${esc(x.name)}</span>`
    + ` <span class="g">${x.n}</span>`;
  const byVerses = C.length ? `<p class="lead" style="margin:4px 0 8px">${C.map(x =>
      `<span class="link" data-ent="${esc(x.id)}">${esc(x.name)}</span>`).join(' · ')}
      <span class="hint">— here by their own verses: the text gives them no name, or none
      the graph could tie to them</span></p>` : '';
  const who = byVerses + (P.length ? `<p class="lead" style="margin:4px 0 0">${
      P.slice(0, 14).map(person).join(' · ')}</p>${P.length > 14
      ? `<details class="sub"><summary>${P.length - 14} more</summary><div class="subbody">${
          P.slice(14).map(person).join(' · ')}</div></details>` : ''}
    <p class="hint" style="margin:6px 0 0;max-width:62ch">Everyone the tellings name, and
      how often — pronouns included.</p>`
    : (C.length ? '' : '<p class="hint">No one in these passages is resolved to a node yet.</p>'))
    /* NOT SETTLED, SAID. Where the tellings disagree on which person a shared
       name means, the graph does not guess: the verse and the possibilities
       (2026-10-01: the possibilities are listed with the verse). */
    + ((ev.unsettled || []).length ? `<div style="margin:10px 0 0">
      <p class="hint" style="margin:0 0 4px;max-width:62ch">Not settled — the tellings
        disagree on which person these names mean, so none is chosen:</p>
      ${ev.unsettled.map(u => `<div class="rowline" style="display:block">
        <b>${esc(u.name)}</b> at <span class="link" data-go="${esc(u.go)}">${esc(u.ref)}</span>
        <span class="g">— ${u.candidates.map(c => `<span class="link" data-ent="${esc(c.id)}">${
          esc(c.name)}${c.who ? ', ' + esc(c.who) : ''}</span>`).join(', or ')}</span>
      </div>`).join('')}</div>` : '');
  const within = (ev.within || []).length > 1 ? sec('ev-within',
    'Sections within it (the Berean editors)', ev.within.map(w => `<div class="rowline">
      <span>${w.first ? go(w.first, w.title) : findLink(w.title)}</span><span class="g">${(w.elsewhere || []).length
        ? 'also in ' + w.elsewhere.map(x => go(x.first, x.label)).join(', ') : ''}</span>
    </div>`).join(''), ev.within.length, false) : '';
  const par = (ev.parallels || []).length ? sec('ev-par', 'Parallels the Berean editors give',
    `<p class="hint" style="margin:0 0 8px;max-width:62ch">The editors note these passages
      as parallels, but under a different heading, so they are not counted as tellings of
      this event.</p>` + ev.parallels.map(p => `<div class="rowline">${go(p.first, p.label)}
      <span class="g">${esc(p.section)}${p.aligned ? ` · wording shared in ${p.aligned} verses`
        : ''}</span></div>`).join(''), ev.parallels.length, true) : '';
  const S = ev.secondary || [];
  const ground = S.filter(s => s.evidence.length), reading = S.filter(s => !s.evidence.length);
  const xrow = s => `<div class="rowline">${go(s.first, s.label)}
      <span class="g">${s.note ? esc(s.note) : ''}</span></div>
    <div class="hint" style="margin:-4px 0 8px 2px">${s.evidence.length
      ? esc(s.why.join('; ')) : 'suggested' + (s.kind && s.kind !== 'reference'
        ? ' · ' + esc(s.kind) : '') + (s.read_note ? ' · ' + esc(s.read_note) : '')}</div>`;
  const xrefs = S.length ? sec('ev-xrefs', 'Passages it points to',
    (ground.length ? `<div class="uphead">with evidence in the graph</div>` + ground.map(xrow).join('') : '')
    + (reading.length ? `<div class="uphead">suggested, with no evidence in the graph
        yet — read the passage and judge</div>` + reading.map(xrow).join('') : ''),
    S.length, true) : '';
  /* REFERRED TO IN THE LETTERS (plan 6.21). A verse of Romans-Jude that
     points at this happening: the letter's words beside the account's, both
     quoted exactly; and only where the link is not obvious, one sentence
     (2026-10-04: where it is obvious it does not require an
     explanation). Shown only after the site's owner has read them. */
  /* ...AND IN THE PSALMS AND POEMS (plan 6.19), the same in every respect:
     a psalm's own title placing it here (Psalm 3, "when he fled from his son
     Absalom"), or a poem retelling or naming the happening. */
  const refRows = L => L.map(r => `<div class="rowline">${go(r.letter[0], prettyRef(r.letter[0]))}
        <span class="g">“${esc(r.words)}”</span></div>
      <div class="hint" style="margin:-4px 0 8px 2px">${esc(r.account_verse)}: “${esc(r.account_words)}”${
        r.why ? `<br><b>How they connect:</b> ${esc(r.why)}` : ''}${r.certainty === 'apparent'
        ? `<br><i>apparent, not certain · ${r.reason === 'disputed'
            ? 'readers differ on which account is meant'
            : 'the tie rests on words other accounts share'}</i>` : ''}</div>`).join('');
  const refNote = what => `<p class="hint" style="margin:6px 0 0">A reading: each found by reading every
        verse of ${what} and judged with both texts in full, and every quotation checked
        against the Berean text. ${prov('auto')}</p>`;
  const L = ev.letters || [], PO = ev.poems || [];
  const letters = L.length ? sec('ev-letters', 'Referred to in the letters',
    refRows(L) + refNote('the letters'), L.length, true) : '';
  const poems = PO.length ? sec('ev-poems', 'Referred to in the psalms and poems',
    refRows(PO) + refNote('the Psalms, Job, Proverbs to the Song, and the poems in the narrative books'),
    PO.length, true) : '';
  /* ...AND THE PROPHETS (plan 6.20), in the plan's three kinds, each its own
     section: looking back, dated to it, and -- with the strongest disclaimer
     the site has -- the later text taking up a prophet's words. */
  const PR = ev.prophets || [], prOf = k => PR.filter(r => r.pkind === k);
  const prNote = refNote('Isaiah to Malachi');
  const prBack = prOf('back').length ? sec('ev-pr-back', 'Referred to by the prophets',
    refRows(prOf('back')) + prNote, prOf('back').length, true) : '';
  const prOwn = prOf('own_time').length ? sec('ev-pr-own', 'Prophets who date their words to it',
    refRows(prOf('own_time')) + prNote, prOf('own_time').length, true) : '';
  const prFwd = prOf('forward').length ? sec('ev-pr-fwd', 'Takes up the words of the prophets',
    refRows(prOf('forward')) + `<p class="hint fwdnote" style="margin:6px 0 0">Here the text of this event
      itself quotes the prophet, or says something happened as the prophet spoke. The site reports what that
      text says. It does not say what a prophecy meant, whom it was about, or whether it was fulfilled;
      readers and traditions differ on these.</p>` + prNote, prOf('forward').length, true) : '';
  /* THE MAJOR THEMES IT BELONGS TO, each with its scripture: the theme map
     cites a passage of this event, or the clause tags give its verses the
     theme's stamps. The list's other theme words follow, unlinked, because
     nothing in the graph backs them yet. */
  const MT = ev.mthemes || [];
  const mtNodes = new Set(MT.map(m => m.node));
  const other = (ev.themes || []).filter(t => !t.node || !mtNodes.has(t.node));
  /* "Also described as … words with no scripture behind them in the graph
     yet" read, on the Crucifixion, as a verdict that atonement has no
     scripture at the cross (the UI committee; cleaned up 2026-10-01).
     They are theme words no node answers to yet, so they are offered as what
     they are -- searches -- and say nothing about the text. */
  const themes = (MT.length || other.length) ? sec('ev-themes', 'In the major themes',
      MT.map(m =>
      `<div class="rowline"><span class="link" data-mtheme="${esc(m.theme)}">${esc(m.title)}</span>
       <span class="g">${[m.n_cited ? `the theme cites ${m.n_cited} of its verses` : '',
                          m.n_tagged ? `${m.n_tagged} verses tagged with it` : '']
                          .filter(Boolean).join(' · ')}</span>
       </div>`).join('')
    + (MT.length ? `<p class="hint" style="margin-top:6px">A reading: the major-theme map, drawn over the text.</p>` : '')
    + (other.length ? `<p class="hint" style="margin-top:6px">Search the text for: ${
        other.map(t => findLink(t.name)).join(' · ')}</p>` : ''), MT.length || null, true) : '';
  /* GROUPING. An event inside a larger one says so, and a larger one lists
     the events inside it -- read from their passages. */
  const partOf = (ev.part_of || []).length ? `<p class="lead" style="margin:4px 0">Part of ${
      ev.part_of.map(p => `<span class="link" data-ent="${esc(p.id)}">${esc(p.title)}</span>`).join(', ')}</p>` : '';
  const parts = (ev.parts || []).length ? sec('ev-parts', 'Events within it',
    ev.parts.map(p => `<div class="rowline"><span class="link" data-ent="${esc(p.id)}">${
      esc(p.title)}</span><span class="g">${esc(prettyRef(p.first))}</span></div>`).join('')
    + `<p class="hint" style="margin:6px 0 0">Their passages lie inside this event's.</p>`,
    ev.parts.length, true) : '';
  return `${partOf}
    ${(ev.aliases || []).length ? `<p class="hint">Also called ${
      ev.aliases.map(a => '“' + findLink(a.title) + '”').join(', ')}.</p>` : ''}
    ${ev.notes ? `<p class="lead">${esc(ev.notes)}</p>` : ''}
    ${/* WHAT HAPPENS, IN THE EDITORS' WORDS, until a retelling passes its
          review: the Berean's own section headings, each opening its verse */''}
    ${!ev.notes && (ev.heads || []).length ? `<div class="evheads"><div class="g" style="margin:0 0 4px">What happens, in the
      Berean editors' section headings</div><ol>${ev.heads.slice(0, 12).map(h =>
        `<li><span class="link" data-go="${esc(h.go)}">${esc(h.title)}</span> <span class="g">${esc(prettyRef(h.go))}</span></li>`).join('')}${
        ev.heads.length > 12 ? `<li class="g">and ${ev.heads.length - 12} more sections</li>` : ''}</ol></div>` : ''}
    <p class="hint" style="max-width:62ch">${esc(ev.credit)}</p>
    ${sec('ev-tell', `Told in ${ev.tellings.length} ${ev.tellings.length === 1 ? 'passage' : 'passages'}`,
      tell, null, true)}
    ${parts}
    ${/* a section like the others, so its people sit behind the line under
          its heading (2026-10-01, on event cards' indentation) */''}
    ${sec('ev-who', 'Who is in it', who, (P.length + C.length) || null, true)}
    ${themes}
    ${poems}
    ${prBack}
    ${prOwn}
    ${prFwd}
    ${letters}
    ${xrefs}
    ${par}
    ${within}
    ${ev.stamp ? `<p class="hint" style="margin-top:8px">The sections the readings stamped
      “${esc(ev.stamp.replace(/_/g, ' '))}”: <span class="link" data-pat="stamp:${
      esc(ev.stamp)}">open the stamp page</span></p>` : ''}`;
}

/* EVENT TEMPLATES (plan A.9). On an event or an arc of events: the template
   it is an instance of, stage by stage, each stage its verses and what in the
   text supports it. On a template's own card: its stages (optional ones in
   brackets, those added from the text marked) and its instances. A
   relabelled or reassigned instance says so — it is a reading. */
/* THE PATTERN AS A TABLE. 2026-09-30: a
   table for each story pattern with each of the instances slotted in. A row
   per story, a column per stage, each cell the verses that fill it -- so the
   stories can be read across as one shape, and a stage a story does without
   shows as a gap rather than disappearing. A stage a story passes through
   twice (the golden calf turns more than once) holds both. The book is named
   once per row; after that a cell gives chapter and verse. */
function tplTable(F){
  const bookOf = l => l.replace(/\s[\d:–\-, ]+$/, '');
  const head = F.stages.map(s => `<th class="${s.optional ? 'g' : ''}">${
    s.optional ? '[' + esc(s.name) + ']' : esc(s.name)}${s.added ? '*' : ''}</th>`).join('');
  const rows = F.instances.map(i => {
    let book = null;
    const cells = F.stages.map(s => {
      const got = (i.stages || []).filter(x => x.kind === s.stage);
      if(!got.length) return '<td class="g">—</td>';
      return '<td>' + got.map(x => {
        // a stage in two runs is "Exodus 32:7–10; Exodus 32:15–29"
        const shown = x.label.split('; ').map(part => {
          const b = bookOf(part);
          const s = b === book ? part.slice(b.length + 1) : part;
          book = b;
          return s;
        }).join('; ');
        /* a role cell resting on a reading, not on the slot's own word, is
           grey and says so on hover */
        return `<span class="link${x.reading ? ' g' : ''}" data-go="${esc(x.first)}"${
          x.reading ? ' title="a reading: the verses do not use this word"' : ''}>${esc(shown)}</span>`;
      }).join('<br>') + '</td>';
    }).join('');
    /* The story's own name, and the card it opens when that card is a larger
       event -- Samson & Delilah is told inside "Judges raised up". */
    const nm = (i.name || '').replace(/^Story arc: /, '');
    // named only when it is plainly another story's card: no word in common
    const words = s => new Set(s.toLowerCase().replace(/\(.*$/, '').split(/[^a-z]+/)
      .filter(w => w.length > 2 && w !== 'the' && w !== 'and'));
    const tw = words(i.title);
    const inCard = nm && nm !== i.title && ![...words(nm)].some(w => tw.has(w)) ? nm : '';
    return `<tr><th><span class="link" data-ent="${esc(i.instance)}">${esc(i.title)}</span>${
      inCard ? `<div class="g">in ${esc(inCard)}</div>` : ''}${
      i.mark ? `<div class="g">${esc(i.mark)}</div>` : ''}${
      i.conjectured ? '<div class="g">a reading</div>' : ''}</th>${cells}</tr>`;
  }).join('');
  return `<div class="tplwrap"><table class="tpltab"><thead><tr><th></th>${head}</tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

/* THE DIVINE MESSAGES. 2026-09-30: taxonomy linking is what binds
   the whole together. A message's card says who speaks it, where it is spoken in the
   other taxonomies (each a link, each grounded by the verses they share),
   and every verse its form stands in, each opening in place. A card of
   anything a message is spoken in lists it back. */
/* WHERE A MESSAGE OR SPEECH ACT IS SPOKEN: the instance first, its pattern
   after it in grey. 2026-09-30, of "Role pattern: Prophet ·
   repentance" on a message card: role patterns are not what is expected
   to be listed under a message even if the link is legitimate; a
   real instance is expected on that card. */
/* A VERSE ON A MESSAGE OR SPEECH-ACT CARD. An overlay -- a hand correction
   where a rule is known to fall short (2026-09-30: the
   remaining known imperfections are handled with overlays) -- must look like one: a
   dashed outline, the word "overlay", and its reason on hover. */
function ovlRef(x, title){
  return x.overlay
    ? `<button class="refmore" data-go="${esc(x.v)}" style="border-style:dashed" title="${
        esc('Overlay, a hand correction: ' + x.overlay)}">${esc(prettyRef(x.v))} <span class="g">overlay</span></button>`
    : `<button class="refmore" data-go="${esc(x.v)}" title="${esc(title)}">${esc(prettyRef(x.v))}</button>`;
}

function spokenRows(M){
  /* THE VERSES THEMSELVES, each opening in place. 2026-09-30, on the
     Lament card: the 1 or 2 verses in "Spoken In" could not be seen or
     drilled into -- an event row showed "2 verses" as plain text */
  const n = x => x.verses && x.verses.length
    ? moreJoin(x.verses, 4, v => `<button class="refmore" data-go="${esc(v)}">${esc(prettyRef(v))}</button>`, ' ')
    : x.first ? `<span class="link" data-go="${esc(x.first)}">${x.n} verse${x.n === 1 ? '' : 's'}</span>`
    : `${x.n} verse${x.n === 1 ? '' : 's'}`;
  const rows = (xs, f) => (xs || []).map(f).join('');
  return rows(M.story, s => `<div class="rowline"><span><span class="link" data-ent="${esc(s.id)}">${
        esc(s.name.replace(/^Story arc: /, ''))}</span> <span class="g">· ${esc(s.stage)} · <span class="link" data-ent="${
        esc(s.pattern)}">story pattern ${esc(s.pattern_name)}</span></span></span><span class="g">${n(s)}</span></div>`)
    + rows(M.roles, r => `<div class="rowline"><span><span class="link" data-ent="${esc(r.id)}">${
        esc(r.name)}</span> <span class="g">· ${esc(r.slot.toLowerCase())} · <span class="link" data-ent="${
        esc(r.pattern)}">role pattern ${esc(r.pattern_name)}</span></span></span><span class="g">${n(r)}</span></div>`)
    + rows(M.themes, t => `<div class="rowline"><span class="link" data-mtheme="${esc(t.id)}">${esc(t.name)}</span>
        <span class="g">${n(t)}</span></div>`)
    + rows(M.events, e => `<div class="rowline"><span class="link" data-ent="${esc(e.id)}">${esc(e.name)}</span>
        <span class="g">${n(e)}</span></div>`)
    + rows(M.refrain, r => `<div class="rowline"><span class="link" data-recur="${esc(r.id)}">${esc(r.title)}</span>
        <span class="g">the same words, a refrain the text repeats</span></div>`);
}

/* A SPEECH ACT (plan A.12): the kind of speaking -- blessing, lament,
   rebuke -- found where the text names it. On the cards and the graph, and
   since 2026-10-01 (P-73, A.18) as a dotted chip at its verse in the reader.
   A draft passage the text does not name
   this way is listed apart, marked as a reading. */
function actBlock(d){
  let out = '';
  const A = d.speech_act;
  if(A && A.group === true){
    out += `<p class="hint" style="max-width:62ch">${esc(A.desc)}</p>`
      + sec('act-list', `Speech acts · ${A.acts.length}`, A.acts.map(a =>
      `<div class="rowline"><span class="link" data-ent="${esc(a.id)}">${esc(a.name)}</span>
        <span class="g">${a.count} verses</span></div>`).join(''), null, true);
  } else if(A){
    const HOW = {label: 'the text names it', formula: 'a formula that is the act', heading: 'a psalm headed so',
                 relation: 'an edge the graph had', overlay: 'an overlay, a hand correction'};
    out += `<p class="hint">A speech act in <span class="link" data-ent="${esc(A.group_id)}">${
        esc(A.group_name)}</span> · ${A.count} verse${A.count === 1 ? '' : 's'}${A.added ? ' · added from the evidence' : ''}</p>`
      + (A.searle_class ? `<div class="rowline"><span class="g">Kind of act</span><span>${
        esc(A.searle_class)} <span class="g">— ${esc(A.searle_gloss || '')}</span></span></div>` : '')
      + `<div class="rowline"><span class="g">How the text names it</span><span>${
        A.how.map(h => `${esc(HOW[h[0]] || h[0])} <span class="g">${h[1]}</span>`).join(' · ')}</span></div>
      <div class="rowline"><span class="g">Who speaks it</span><span>${
        moreJoin(A.speakers, 6, s => `${esc(s[0])} <span class="g">${s[1]}</span>`, ' · ')}</span></div>`;
    if(A.psalms.length) out += `<div class="rowline"><span class="g">Headed so</span><span>${A.psalms.map(p =>
        `<button class="refmore" data-go="${esc(p + '.1')}">${esc(p.replace('.', ' '))}</button>`).join(' ')}</span></div>`;
    if(A.messages.length) out += sec('act-msgs', `Narrower forms · ${A.messages.length}`, A.messages.map(m =>
      `<div class="rowline"><span class="link" data-ent="${esc(m.id)}">Message: ${esc(m.name)}</span>
        <span class="g">${m.n} verses</span></div>`).join(''), A.messages.length, false);
    const spoken = spokenRows(A);
    if(spoken) out += sec('act-in', 'Spoken in', spoken, null, true);
    out += sec('act-where', `Where the text names it · ${A.count}`,
      `<div class="refbox">${moreJoin(A.instances, 40, x => ovlRef(x,
        x.who + ' · ' + x.how.join(', ')), ' ')}</div>`, A.count, false);
    const R = A.cites.filter(c => c.grade === 'reading');
    if(R.length) out += sec('act-read', `Readings · ${R.length}`,
      `<p class="hint" style="max-width:62ch">Passages a draft list gives for this act where the text does not
        name it so. Shown as readings, not counted.</p>` + R.map(c =>
      `<div class="rowline"><span>${c.first ? `<span class="link" data-go="${esc(c.first)}">${esc(c.ref)}</span>` : esc(c.ref)}
        <span class="g">${esc(c.claim)}</span></span><span class="g">${c.instead.length
          ? 'the text names ' + c.instead.map(x => esc(x.replace(/_/g, ' '))).join(', ') + ' there' : ''}</span></div>`).join(''),
      R.length, false);
  }
  if((d.acts_in || []).length){
    out += sec('act-here', `Speech acts spoken in it · ${d.acts_in.length}`, d.acts_in.map(m =>
      `<div class="rowline"><span class="link" data-ent="${esc(m.id)}">Speech act: ${esc(m.name)}</span>
        <span class="g">${m.where ? esc(m.where) + ' · ' : ''}${m.first
          ? `<span class="link" data-go="${esc(m.first)}">${m.n} verse${m.n === 1 ? '' : 's'}</span>` : m.n}</span></div>`).join(''),
      d.acts_in.length, false);
  }
  return out;
}

function msgBlock(d){
  let out = actBlock(d);
  const M = d.message;
  // a group's card has group === true; a message's carries its group's id
  if(M && M.group === true){
    out += sec('msg-list', `Messages · ${M.messages.length}`, M.messages.map(m =>
      `<div class="rowline"><span class="link" data-ent="${esc(m.id)}">${esc(m.name)}</span>
        <span class="g">${m.count} verses · ${m.speakers.map(s => esc(s[0])).join(', ')}</span></div>`).join(''),
      null, true);
  } else if(M){
    out += `<p class="hint">A message in <span class="link" data-ent="${esc(M.group_id)}">Message group: ${
        esc(M.group_name)}</span> · ${M.count} verse${M.count === 1 ? '' : 's'}${
        M.who === 'div' ? ', spoken by God or on his behalf' : ''}${M.act
        ? ` · a form of <span class="link" data-ent="${esc(M.act.id)}">${esc(M.act.name.toLowerCase())}</span>` : ''}</p>
      <div class="rowline"><span class="g">Who speaks it</span><span>${
        moreJoin(M.speakers, 6, s => `${esc(s[0])} <span class="g">${s[1]}</span>`, ' · ')}</span></div>`;
    const spoken = spokenRows(M);
    if(spoken) out += sec('msg-in', 'Spoken in', spoken, null, true);
    out += sec('msg-where', `Where the text says it · ${M.count}`,
      `<div class="refbox">${moreJoin(M.instances, 40, x => ovlRef(x, x.who), ' ')}</div>`,
      M.count, false);
  }
  if((d.messages_in || []).length){
    out += sec('msg-here', `Messages spoken in it · ${d.messages_in.length}`, d.messages_in.map(m =>
      `<div class="rowline"><span class="link" data-ent="${esc(m.id)}">Message: ${esc(m.name)}</span>
        <span class="g">${m.where ? esc(m.where) + ' · ' : ''}${m.first
          ? `<span class="link" data-go="${esc(m.first)}">${m.n} verse${m.n === 1 ? '' : 's'}</span>` : m.n}</span></div>`).join(''),
      d.messages_in.length, false);
  }
  return out;
}

/* A SIGNIFICANT NUMBER (plan 6.16): the times the text counts it as a span,
   the phrases it repeats, and where the text itself joins one forty to
   another. Nothing about what the number means. 2026-10-03: 40
   deserves its own significant number card because it also ties to the
   flood. */
function numberBlock(d){
  const N = d.number;
  if(!N) return '';
  const occ = Object.fromEntries(N.occasions.map(o => [o.id, o]));
  const row = o => `<div class="relrow"><span>${esc(o.title)}</span>${cites(o.verses)}${
      (o.events || []).map(e => `<span class="g">· <span class="link" data-ent="${esc(e.id)}">${
        esc(e.title)}</span></span>`).join('')}${
      o.note ? `<div class="hint" style="flex-basis:100%;margin:0">${esc(o.note)}</div>` : ''}</div>`;
  let out = '';            // the lead is the card's own description, shown above
  if(N.phrases.length) out += sec('num-phr', `Phrases the text repeats · ${N.phrases.length}`,
    N.phrases.map(p => `<div class="relrow"><span>“${esc(p.text)}”</span>${cites(p.verses)}${
      p.occasions.length ? `<span class="g">— ${p.occasions.map(id => esc((occ[id] || {}).title || id)).join('; ')}</span>` : ''}${
      p.note ? `<div class="hint" style="flex-basis:100%;margin:0">${esc(p.note)}</div>` : ''}</div>`).join(''),
    null, true);
  N.groups.forEach(g => {
    const os = N.occasions.filter(o => o.group === g.id);
    if(!os.length) return;
    out += sec('num-' + g.id, `${g.title} · ${os.length}`,
      (g.note ? `<p class="hint" style="margin:0 0 6px">${esc(g.note)}</p>` : '') + os.map(row).join(''),
      null, true);
  });
  if(N.joins.length) out += sec('num-joins', `Where the text sets one beside another · ${N.joins.length}`,
    N.joins.map(j => `<div class="relrow"><span>${esc(j.title)}</span>${['a', 'b', 'c'].filter(k => j[k]).map(k =>
      `<div class="echopair" style="grid-template-columns:1fr"><div>“${esc(j[k][1])}” ${cites([j[k][0]])}</div></div>`).join('')}${
      j.note ? `<div class="hint" style="flex-basis:100%;margin:0">${esc(j.note)}</div>` : ''}</div>`).join(''),
    null, true);
  const aside = Object.values(N.set_aside || {});
  const nAside = aside.reduce((n, s) => n + s.verses.length, 0);
  out += `<p class="hint" style="max-width:62ch">${N.counts.verses_with_the_number} verses of the Berean
    have the number; ${N.counts.verses_on_occasions} are on these occasions.
    ${N.counts.other_counts} count things — armies, measures, gifts — and ${nAside} are set aside:
    ${aside.map(s => esc(s.why)).join('; ')}.</p>`;
  return out;
}

function templateBlock(d){
  let out = msgBlock(d) + numberBlock(d);
  /* A STAGE SAYS WHOSE STAGE IT IS, first. 2026-09-30: it should be
     obvious when looking at a pattern stage how to navigate to the story
     pattern; the link could not be found from within. The pattern, the
     story, and the story's stages in order with this one marked. */
  const S = d.template_stage;
  if(S){
    out += `<div class="stagehead">
      <div>${S.pattern_kind === 'Role pattern' ? 'A cell of' : 'A stage of'} <span class="link" data-ent="${
        esc(S.pattern_id)}">${esc(S.pattern_kind)}: ${esc(S.family_name)}</span></div>
      <div class="g">in <span class="link" data-ent="${esc(S.instance)}">${
        esc(S.instance_name.replace(/^Story arc: /, ''))}</span></div>
      <div class="stageseq">${S.stages.map(s => s.here
        ? `<b title="${esc(s.label)}">${esc(s.name)}</b>`
        : `<span class="link" data-ent="${esc(s.id)}" title="${esc(s.label)}">${esc(s.name)}</span>`
      ).join(' → ')}</div></div>`;
  }
  const F = d.template_family;
  if(F && F.kind === 'role'){
    /* ROLE PATTERNS (plan A.10): the same table, its columns the role's
       slots. A row "by analogy" is a figure the text never gives the role in
       its own words; a grey cell rests on a reading. */
    out += (F.single ? `<p class="hint">A row of <span class="link" data-ent="${esc(F.pattern_id)}">Role pattern: ${
          esc(F.name)}</span>${F.instances[0] && F.instances[0].given.length
          ? ` — the text gives the role: ${esc(F.instances[0].given.join('; '))}` : ''}.</p>`
        : `<p class="hint" style="max-width:62ch">A row for each figure, a column for each
        ${F.frame ? 'part of the role' : 'stage'}. “By analogy” marks a figure the text
        never gives this role in its own words; a grey cell rests on a reading rather than
        on the word itself; * marks a stage added from the text; — is a gap.</p>`)
      + sec('tpl-inst', F.single ? 'This row' : `Rows · ${F.instances.length}`, tplTable(F), null, true);
  } else if(F){
    out += `<p class="hint" style="max-width:62ch">A row for each story told this way,
        a column for each stage. Stages in brackets are optional; * marks a stage
        added from the text's own markers; — is a stage that story does without.</p>`
      + sec('tpl-inst', `Instances · ${F.instances.length}`, tplTable(F), null, true);
  }
  /* a person's role patterns, and whether the text or a reader gives the role */
  if((d.role_patterns || []).length){
    out += `<div class="vp-h2">Role patterns</div>` + d.role_patterns.map(x =>
      `<div class="rowline"><span><span class="link" data-ent="${esc(x.pattern_id)}">Role pattern: ${
        esc(x.pattern_name)}</span> · <span class="link" data-ent="${esc(x.row)}">${esc(x.row_name)}</span></span>
        <span class="g">${x.given.length ? 'the text calls it so: ' + esc(x.given[0])
          : (x.reading ? 'by analogy' : '')}</span></div>`).join('');
  }
  (d.templates || []).forEach(t => {
    out += `<div class="vp-h2">Story pattern: <span class="link" data-ent="tpl_${esc(t.family)}">${
        esc(t.family_name)}</span>${t.via_arc ? ` <span class="g">— through the arc ${
        esc(t.via_arc)}</span>` : ''}</div>`
      /* No tag ids on the row (UI committee: "· judgment ev, judgment" was the
         stage's supporting tags by their internal names); a stage added from
         the text's own markers says so in words a reader can use. */
      + t.stages.map(s => `<div class="rowline"><span><span class="link" data-ent="tplstage_${esc(s.kind)}">${
          esc(s.name)}</span>${s.added ? ' <span class="g">(a stage the text itself marks here)</span>' : ''}</span>
          <span class="g"><span class="link" data-go="${esc(s.first)}">${esc(s.label)}</span></span></div>`).join('')
      + (t.conjectured || t.note ? `<p class="hint" style="max-width:62ch;margin-top:4px">${
          t.conjectured ? 'A reading of the text: ' : ''}${mdLite(t.note || '')}</p>` : '');
  });
  return out;
}

/* A DECLARED LIST'S CARD IS A HUB (A.34). 2026-10-07, on the armor of
   God: nothing in the member diagram was clickable, though it is intended to act as
   a hub to explore the concepts listed and even the moves; and having
   two cards was confusing, so the list is one card and this is on it. A
   member the graph holds opens its card; any other opens its verse; a move is
   the passage's own verb and opens its verse. All are served by the page's
   delegated listener, so a restored tab keeps them. */
/* A CONCEPT HUB (plan 7.6f; the design approved 2026-10-09).
   The concept by the forms the text uses -- the verb (who loves whom),
   the noun (what it stands beside), the adjective (who is called it) -- led by
   the form the text uses most, each row a card of quotations. Every row is a
   door: the graph is the distinguishing factor this site
   brings (love is a bridge to God, to the commandments). Built by
   tools/concepts/hub_build.py; the rest of the card follows unchanged. */
function conceptHubBlock(h, graph){
  if(!h) return '';
  const ent = c => `<span class="link" data-ent="${esc(c.id)}">${esc(c.name)}</span>`;
  // each quotation names the word it stands on, opening that word's card
  const wtag = w => `<span class="link heb chubtag" data-key="${esc(w.key)}">${esc(w.lemma)}</span>`;
  const q = e => `<div class="hubq">${linkNames(e.text, e.names)} <span class="cite" data-ref="${esc(e.id)}">${esc(e.ref)}</span>${
    (e.words || []).map(wtag).join('')}</div>`;
  const cite = v => `<span class="cite" data-ref="${esc(v)}">${esc(prettyRef(v))}</span>`;
  const TITLE = Object.assign({verb: 'Who and whom', noun: 'What it stands beside', adjective: 'Who is called it'}, h.titles || {});
  const FORM = {verb: 'As a verb', noun: 'As a noun', adjective: 'As an adjective'};
  let s = `<div class="chub">`;
  if((h.leads || []).length) s += `<div class="chubk">Leads to</div><div class="chubleads">${h.leads.map(ent).join('')}</div>`;
  s += `<h3 class="hubh">The words the text uses</h3><div class="chubw">${h.words.map(w =>
    `<div class="chubwd"><span class="link heb" data-key="${esc(w.key)}" data-word="${esc(w.gloss || '')}">${esc(w.lemma)}</span>${
      w.translit ? ` <span class="translit">${esc(w.translit)}</span>` : ''}<div class="g">${esc(w.gloss || '')} · ${esc(w.lang)} ${esc(w.form)} · ${w.uses} uses${
      w.other_sense ? ` (and ${w.other_sense} in another sense)` : ''}</div></div>`).join('')}</div>`;
  if((h.own_words || []).length) s += `<h3 class="hubh">In the texts' own words</h3>${h.own_words.map(q).join('')}`;
  // THE GRAPH, RIGHT AFTER THE TEXT'S WORDS. 2026-10-09: the
  // diagrams move up to right after IN THE TEXT'S OWN WORDS
  // -- the connections are what this site adds, so they come before the rows
  if(graph) s += `<h3 class="hubh">Where it connects</h3>${graph}`;
  (h.forms || []).forEach(f => {
    s += `<div class="chubk" style="margin-top:22px">${esc(FORM[f.form] || f.form)} · ${f.verses} verses</div><h3 class="hubh" style="margin-top:2px">${esc(TITLE[f.form] || '')}</h3><div class="otl">`;
    f.rows.filter(r => r.n).forEach(r => {
      s += `<div class="otlc"><div class="otln">${esc(r.label)} <span class="g" style="font-size:13px">${r.n} verse${r.n === 1 ? '' : 's'}</span></div>${
        (r.doors || []).length ? `<div class="chubdoors">opens: ${r.doors.map(ent).join('')}</div>` : ''}${
        r.note ? `<p class="hint" style="margin:2px 0 6px">${esc(r.note)}</p>` : ''}${
        r.eg.slice(0, 3).map(q).join('')}${r.verses.length > 3
        ? `<div class="otlr">${moreJoin(r.verses.slice(3), 0, cite, ' ')}</div>` : ''}</div>`;
    });
    s += `</div>`;
    if(f.more && f.more.n) s += `<details class="moreinl" style="margin:6px 0 0"><summary>${f.more.n} more verses with these words</summary>${
      f.more.verses.map(cite).join(' ')}</details>`;
  });
  if((h.gather || []).length) s += `<h3 class="hubh">Gathered here</h3><div class="chubleads">${h.gather.map(ent).join('')}</div>`;
  // different words the English renders the same way: named apart, never
  // folded into the rows above
  const ow = (h.others || {}).words || [];
  if(ow.length){
    const head = w => `<span class="link heb" data-key="${esc(w.key)}">${esc(w.lemma)}</span>${
      w.translit ? ` <span class="translit">${esc(w.translit)}</span>` : ''} <span class="g">${esc(w.gloss || '')} · ${esc(w.lang)} · ${w.n} verse${w.n === 1 ? '' : 's'}</span>`;
    s += `<h3 class="hubh">${esc(h.others.title || 'Other words translated the same way')}</h3><p class="hint" style="margin:0 0 8px">Different words in the Hebrew and Greek, which English also renders this way.</p><div class="otl">`;
    ow.filter(w => w.n >= 3).forEach(w => {
      s += `<div class="otlc"><div class="otln">${head(w)}</div>${
        w.note ? `<p class="hint" style="margin:2px 0 4px">${esc(w.note)}</p>` : ''}${(w.eg || []).slice(0, 1).map(q).join('')}${
        w.verses.length > 1 ? `<div class="otlr">${moreJoin(w.verses.slice(1), 0, cite, ' ')}</div>` : ''}</div>`;
    });
    s += `</div>`;
    const few = ow.filter(w => w.n < 3);
    if(few.length) s += `<div class="otlr" style="margin-top:8px">${few.map(w => `<span class="chubfew">${head(w)} ${w.verses.map(cite).join(' ')}${
      w.note ? ` <span class="hint">${esc(w.note)}</span>` : ''}</span>`).join('')}</div>`;
  }
  return s + `</div>`;
}
/* THE HUB'S TOP HALF, BY RULE, on a concept card without a hub (plan 7.6g;
   2026-10-09: the hub look makes the cards more appealing): its
   words as the hubs show them, with the same root's words beside them; its
   key verses quoted; the graph; and the other words the English renders the
   same way, named apart. Built by concept_face in the server. */
/* THE DIAGRAM AND ITS LIST IN ONE PLACE. 2026-10-09: the diagram and the later sections with the
   exact same content felt redundant, so there is a toggle between the 2 in the exact
   same position, with the diagram as the default. The list is the
   relation groups that sat in the tail, each with its verses. */
function connBlock(graph, groups){
  if(!graph && !groups) return '';
  if(!groups) return graph;
  // on a desktop the list takes the pane's width, as the diagram does
  const W = (document.querySelector('#paneinner') || {}).clientWidth || window.innerWidth || 900;
  const wide = W >= 900 ? ` style="width:${W}px;max-width:${W}px;box-sizing:border-box"` : '';
  return `<div class="conntoggle" role="tablist">
      <button class="conntab on" data-conn="diagram" role="tab" aria-selected="true">Diagram</button>
      <button class="conntab" data-conn="list" role="tab" aria-selected="false">List, with the verses</button></div>
    <div class="connview" data-view="diagram">${graph || '<p class="hint">No diagram for this card.</p>'}</div>
    <div class="connview chubtail" data-view="list" hidden${wide}>${groups}</div>`;
}
function connShow(view){
  document.querySelectorAll('#paneinner .conntab').forEach(b => {
    const on = b.dataset.conn === view;
    b.classList.toggle('on', on); b.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  document.querySelectorAll('#paneinner .connview').forEach(v => v.hidden = v.dataset.view !== view);
}
/* A TEXT CARD'S FACE (2026-10-12: these were sparse nodes, now presented
   in a cleaner way that shows what they accomplish): the
   words themselves, quoted whole; who said them, once; what it is part of;
   what it speaks of. The card's note follows as "About this", only where it
   says more than the quote does. */
function textFaceBlock(d){
  const f = d.said;
  const link = x => `<span class="link" data-ent="${esc(x.id)}">${esc(x.name)}</span>`;
  const q = f.quote || [];
  // consecutive verses read as one passage, labelled first–last
  const label = q.length > 1 ? `${prettyRef(q[0].id)}–${q[q.length - 1].id.split('.').pop()}`
              : q.length ? prettyRef(q[0].id) : '';
  const kind = (f.kind || 'saying').replace(/_/g, ' ');
  const who = (f.speakers || []).length ? ` · said by ${f.speakers.map(link).join(', ')}` : '';
  // a verdict says whom it is said of (Eliphaz's "your own lips testify
  // against you" is said of Job)
  const of = (f.said_of || []).length ? ` · of ${f.said_of.map(link).join(', ')}` : '';
  // whom it is about, where the record names them: "Role · Moses"
  const fig = (f.figures || []).length ? ` · ${f.figures.map(link).join(', ')}` : '';
  let s = `<div class="chub tface"><div class="g" style="margin:0 0 6px">${esc(kind[0].toUpperCase() + kind.slice(1))}${fig}${who}${of}</div>`;
  /* ONE QUOTE PER PLACE. Verses that follow one another read as one passage;
     verses from different places are separate quotes, each with its own
     reference. Run together, Moses's role row read Exodus, Psalms and Isaiah
     as one quotation labelled "Exod 3:1–6" (2026-10-13) -- and a saying
     recorded in three Gospels read as one. */
  const runs = [];
  q.forEach(x => {
    const [b, c, v] = x.id.split('.'), last = runs.length && runs[runs.length - 1];
    const [pb, pc, pv] = last ? last[last.length - 1].id.split('.') : [];
    if(last && pb === b && pc === c && +pv + 1 === +v) last.push(x); else runs.push([x]);
  });
  const SHOW = 4;
  runs.slice(0, SHOW).forEach((r, i) => {
    const lab = r.length > 1 ? `${prettyRef(r[0].id)}–${r[r.length - 1].id.split('.').pop()}` : prettyRef(r[0].id);
    const cut = f.more && runs.length === 1;      // a passage's run, cut at eight
    const once = new Set();
    s += `<blockquote class="tquote">${r.map(x => linkNames(x.text, x.names, once)).join(' ')}${cut ? ' …' : ''}</blockquote>`
      + `<div style="margin:4px 0 ${i < Math.min(runs.length, SHOW) - 1 ? 8 : 12}px"><span class="cite" data-ref="${esc(r[0].id)}">${esc(cut ? lab + ' …' : lab)}</span>`
      + (cut ? ` <span class="g">· ${f.more} more ${f.more === 1 ? 'verse' : 'verses'}</span>` : '')
      + ` · <button class="refmore" data-go="${esc(r[0].id)}">open in the reader</button></div>`;
  });
  if(runs.length > SHOW) s += `<p class="g" style="margin:0 0 12px">and ${runs.length - SHOW} more ${runs.length - SHOW === 1 ? 'place' : 'places'}: ${
    runs.slice(SHOW).map(r => `<span class="cite" data-ref="${esc(r[0].id)}">${esc(prettyRef(r[0].id))}</span>`).join(' ')}</p>`;
  /* THE EVENT IT BELONGS TO, inside the face (it stood above it as "Said in
     Israel receives the law told in Exodus, Deuteronomy", and on a passage
     "Said in" was wrong): a passage tells its event, a saying is said in it */
  const ev = (d.within_events || []);
  const tells = ev.length ? ev.slice(0, 2).map(x => `${link({id: x.id, name: x.title})}${
      (x.told_in || []).length > 1 ? ` <span class="g">· told in ${esc(x.told_in.join(', '))}</span>` : ''}`)
    : (f.tells || []).map(link);
  if(tells.length) s += `<p style="margin:6px 0"><span class="g">${['passage', 'telling'].includes(f.kind) ? 'Tells'
    : /^(role|stage)/.test(f.kind) ? 'In' : 'Said in'}</span> ${tells.join(' · ')}</p>`;
  if((f.part_of || []).length) s += `<p style="margin:6px 0"><span class="g">Part of</span> ${f.part_of.map(link).join(' · ')}</p>`;
  if((f.instance_of || []).length) s += `<p style="margin:6px 0"><span class="g">An instance of</span> ${f.instance_of.map(link).join(' · ')}</p>`;
  if((f.speaks_of || []).length) s += `<p style="margin:6px 0"><span class="g">Speaks of</span> ${f.speaks_of.map(link).join(' · ')}</p>`;
  // the note, when it says more than the quote ("Leah says, '…'" does not;
  // "Fifteen clauses and not one of them is a definition" does): what is
  // left once its quotations and references are taken out
  const rest = (d.desc || '').replace(/'[^']*'|“[^”]*”|"[^"]*"/g, '')
    .replace(/\([^)]*\d[^)]*\)/g, '').replace(/[*_.,;:\s]+/g, ' ').trim();
  if(d.desc && rest.split(' ').length > 8 && !/a telling of an event\.?$/.test(d.desc))
    s += `<details class="tabout"><summary class="g">About this ${esc(kind)}</summary>${leadHtml(d.desc)}</details>`;
  return s + `</div>`;
}

/* THE NAMES IN A QUOTE, LINKED (2026-10-13: more
   linking on the cards within the text). The server says which
   words name which record (verse_names: resolved in that verse from the
   original, never a pronoun, never a shared name); each is linked once per
   quote, the longest first, and the rest of the text is escaped as before. */
function linkNames(text, names, seen){
  text = String(text || '');
  seen = seen || new Set();
  const spans = [];
  (names || []).slice().sort((a, b) => b.at.length - a.at.length).forEach(n => {
    if(seen.has(n.id)) return;
    for(let i = text.indexOf(n.at); i >= 0; i = text.indexOf(n.at, i + 1)){
      const j = i + n.at.length;
      if(/[\w'’]/.test(text[i - 1] || '') || /\w/.test(text[j] || '')) continue;
      if(spans.some(s => i < s.e && j > s.s)) continue;
      spans.push({s: i, e: j, id: n.id, name: n.name}); seen.add(n.id); break;
    }
  });
  spans.sort((a, b) => a.s - b.s);
  let out = '', p = 0;
  spans.forEach(s => { out += esc(text.slice(p, s.s)) + `<span class="link vname" data-ent="${esc(s.id)}" title="${
    esc(s.name)}">${esc(text.slice(s.s, s.e))}</span>`; p = s.e; });
  return out + esc(text.slice(p));
}

/* THE BAR ABOVE THE STACK (option D): how many sections, and "open all ·
   close all" -- GOV.UK ships "Show all sections"; NN/g recommends expand and
   collapse all. Also: "and N more" in the family line opens Kinship; the open
   heading sticks below the site's own header; and an opened section is
   counted, by its id alone (2026-10-13: approved as a counter with no
   per-card, per-visitor or personal data). */
function secBar(root){
  const bar = root.querySelector('#secbar');
  const pane = root.querySelector('.pane') || root;
  const top = [...pane.querySelectorAll('details.sec')].filter(s => !s.parentElement.closest('details.sec'));
  if(bar){
    if(top.length < 3) bar.remove();
    else {
      bar.innerHTML = `<span>${top.length} sections</span><span><button data-all="1">open all</button> · <button data-all="0">close all</button></span>`;
      bar.querySelectorAll('button').forEach(b => b.onclick = () => {
        const open = b.dataset.all === '1';
        top.forEach(s => { s.open = open; });
        if(open) seen('open-all');
      });
    }
  }
  root.querySelectorAll('[data-opensec]').forEach(a => a.onclick = () => {
    const s = pane.querySelector(`details.sec[data-sec="${CSS.escape(a.dataset.opensec)}"]`);
    if(s){ s.open = true; s.scrollIntoView({block: 'start', behavior: 'smooth'}); }
  });
  // the open heading sticks just below the card tabs, which stick themselves
  // (at top:-26px inside the reader's 26px padding: measured, 2026-10-13)
  const tabs = document.querySelector('.tabs');
  const ts = tabs && getComputedStyle(tabs);
  root.style.setProperty('--stick-top', ts && ts.position === 'sticky'
    ? (tabs.offsetHeight + (parseFloat(ts.top) || 0)) + 'px' : '0px');
  // a reader's opening, not a section that opens itself on load (a details
  // parsed open fires `toggle` too): counted on the click of a closed heading
  top.forEach(s => { const h = s.querySelector(':scope > summary');
    if(h) h.addEventListener('click', () => { if(!s.open && s.dataset.sec) seen(s.dataset.sec); }); });
}
/* one plain count per section id: no card, no visitor, nothing personal */
function seen(id){
  try{ fetch('/api/seen?s=' + encodeURIComponent(String(id).replace(/^rel-/, 'rel:').slice(0, 60)),
             {keepalive: true}).catch(() => {}); }catch(e){}
}

/* A PERSON'S FAMILY IN THE FACE (2026-10-13, option D): "Son of Jesse
   · father of Solomon, Absalom, Amnon, Adonijah and 17 more · husband of
   Michal ..." -- the question most asked of a person, answered before any
   fold. "and N more" opens Kinship. */
function faceKin(d){
  const K = d.kin || [];
  if(!K.length) return '';
  const by = new Map();
  K.forEach(k => { if(!by.has(k.rel)) by.set(k.rel, []); by.get(k.rel).push(k); });
  const link = k => `<span class="link" data-ent="${esc(k.id)}">${esc(k.name)}</span>`;
  const parts = [...by.entries()].map(([rel, ks], i) => {
    const r = i ? rel : rel[0].toUpperCase() + rel.slice(1);
    const shown = ks.slice(0, 4).map(link);
    const more = ks.length > 4 ? ` <span class="link" data-opensec="rel-Kinship">and ${ks.length - 4} more</span>` : '';
    return `${esc(r)} ${shown.length > 1 ? shown.slice(0, -1).join(', ') + (more ? ', ' + shown[shown.length - 1] : ' and ' + shown[shown.length - 1]) : shown[0]}${more}`;
  });
  if((d.roles || []).length) parts.push(`<span class="g">${esc(d.roles.join(', '))}</span>`);
  return `<p class="facekin">${parts.join(' · ')}</p>`;
}

function conceptFaceBlock(d, graph){
  const f = d.face;
  if(!f) return '';
  const q = e => `<div class="hubq">${linkNames(e.text, e.names)} <span class="cite" data-ref="${esc(e.id)}">${esc(e.ref)}</span></div>`;
  const cite = v => `<span class="cite" data-ref="${esc(v)}">${esc(prettyRef(v))}</span>`;
  let s = `<div class="chub">`;
  /* A SUB-THEME'S VERSES FIRST (2026-10-13, done together with the rest of the batch): a
     sub-theme of the major-theme map is named in its passages' words
     ("Everyone who calls on the name of the Lord will be saved"), and the
     card opened on eight word tiles before the verses that say it */
  const versesFirst = !!d.reading && (f.own_words || []).length;
  if(versesFirst) s += `<h3 class="hubh">In the texts' own words</h3>${f.own_words.map(q).join('')}`;
  // a people's card has no words of its own; the server gives the words its
  // English renders as its words ("the Jews": יְהוּדִי, Ἰουδαῖος)
  const words = (d.words || []).length ? d.words : (f.words || []);
  if(words.length){
    s += `<h3 class="hubh">The words the text uses</h3><div class="chubw">${words.map(w =>
      `<div class="chubwd"><span class="link heb" data-key="${esc(w.key)}" data-word="${esc(w.gloss || '')}">${esc(w.lemma || w.key)}</span>${
        w.translit ? ` <span class="translit">${esc(w.translit)}</span>` : ''}<div class="g">${esc(w.gloss || '')} · ${esc(w.lang || '')} · ${w.uses || w.n} ${w.uses ? 'uses' : 'verses'}</div>${
        w.via ? `<div class="hint">${esc(w.via)}</div>` : ''}</div>`).join('')}</div>`;
    if((f.family || []).length) s += `<p class="hint" style="margin:6px 0 0">From the same root: ${f.family.map(w =>
      `<span class="link heb" data-key="${esc(w.key)}">${esc(w.lemma || w.key)}</span> <span class="g">${esc(w.gloss || '')} · ${w.uses}</span>`).join(' · ')}</p>`;
  }
  if((f.own_words || []).length && !versesFirst) s += `<h3 class="hubh">In the texts' own words</h3>${f.own_words.map(q).join('')}`;
  if(graph) s += `<h3 class="hubh">Where it connects</h3>${graph}`;
  if((f.others || []).length){
    s += `<h3 class="hubh">Other words translated the same way</h3><p class="hint" style="margin:0 0 8px">Different words in the Hebrew and Greek, which English also renders this way.</p><div class="otl">`;
    f.others.forEach(w => {
      s += `<div class="otlc"><div class="otln"><span class="link heb" data-key="${esc(w.key)}">${esc(w.lemma || w.key)}</span>${
        w.translit ? ` <span class="translit">${esc(w.translit)}</span>` : ''} <span class="g">${esc(w.gloss || '')} · ${esc(w.lang)} · ${
        w.n} verse${w.n === 1 ? '' : 's'}</span></div><div class="otlr">${moreJoin(w.verses, 8, cite, ' ')}</div></div>`;
    });
    s += `</div>`;
  }
  return s + `</div>`;
}
function hubBlock(h){
  if(!h) return '';
  const mem = m => m.card
    ? `<button class="mem link" data-ent="${esc(m.card)}" title="${esc(m.ref)}">${esc(m.label)}</button>`
    : `<button class="mem" data-go="${esc(m.ref)}" title="${esc(m.ref)}">${esc(m.label)}</button>`;
  // no count where traditions count differently (the Beatitudes, the Ten
  // Commandments): the A.34 review
  const head = h.members_heading || (h.uncounted ? 'members' : `${h.members.length} members`);
  return `<div class="sheetbox hubbox">
    ${h.note ? `<p class="hint" style="margin:0 0 10px;max-width:62ch">${esc(h.note)}</p>` : ''}
    <div class="slotname">${esc(head)}${h.passage ? ' · ' + esc(h.passage) : ''}</div>
    <div class="memlist">${h.members.map(mem).join('')}</div>
    ${(h.moves||[]).length ? `<div class="slotname" style="margin-top:12px">${esc(h.moves_heading || 'the moves, in the passage’s words')}</div>
    <div class="memlist">${h.moves.map(m =>
      `<button class="move" data-go="${esc(m.ref)}" title="${esc(m.ref)}">${esc(m.words)}</button>`
    ).join('<span class="g"> · </span>')}</div>` : ''}
    ${(h.tagged||[]).length ? `<details class="moreinl" style="margin-top:12px"><summary class="g">sections
      tagged with this list · ${h.tagged.length} <span title="tagged by a machine pass, not each read">(a tagging pass, not each read)</span></summary>
      <div class="memlist" style="margin-top:6px">${h.tagged.map(t =>
        `<button class="refmore" data-go="${esc(t.ref)}">${esc(prettyRef(t.ref))}${
          t.title ? ' · ' + esc(t.title) : ''}</button>`).join('')}</div></details>` : ''}
  </div>`;
}

async function openEntity(id){
  const d = await api('/api/entity', {id});
  if(!d.found) return;
  LAST_ENTITY = d;
  if(d.addr && d.addr !== d.id) ADDR[d.id] = d.addr;
  // ON A HUB CARD "Also called" stands under the name, not in the tail (2026-10-09:
  // "Also called" seemed out of place elsewhere)
  // THE HUB'S LOOK ON EVERY CONCEPT CARD (2026-10-09: the hub look
  // makes them look very appealing): the tail as cards, the books as a
  // grid, "Also called" under the name. Only a hub card drops "Where
  // mentioned" -- elsewhere nothing above repeats it.
  const lifted = !!d.concept_hub || d.type === 'concept' || !!d.face;
  // a person's card leads with its sections, family first (option D)
  const person = d.type === 'person' && !lifted;
  // ...and on every card now (2026-10-13: a person's other name, Gideon's
  // Jerubbaal, was there but inside "What is recorded", which the
  // card-sections redesign put below the relations on a person's card)
  const akaTop = (d.aka||[]).length;
  const facts = [
    d.tribe && ['Tribe', d.tribe], d.era && ['Era', d.era],
    (d.roles||[]).length && ['Roles', d.roles.join(', ')],
    (d.aka||[]).length && !akaTop && ['Also called', d.aka.join(', ')],
  ].filter(Boolean).map(([k,v]) =>
    `<div class="rowline"><span class="g">${esc(k)}</span><span>${esc(v)}</span></div>`)
    .join('') || '<div style="color:var(--muted)">Nothing further recorded.</div>';
  const factsEmpty = !(d.tribe || d.era || (d.roles||[]).length || ((d.aka||[]).length && !akaTop));

  /* Grouped by the taxonomy's own category, so a reader meets "Kinship" and
     "Rule & succession" rather than 116 type names. */
  /* A tree, not a flat wall. Categories fold, and inside a category the
     relations fold again by TYPE -- David has 26 kinship links and most are the
     same relation repeated, so the type is the rung that carries information. */
  /* NOT SAID TWICE. The UI committee, 2026-09-30 (remove the
     repeats): a card rendered its own sections, then the same edges again as
     categories at the bottom -- role patterns, speech acts and messages spoken
     in it, "is recounted by" under the tellings, story stages under the stage
     list, "is an instance of" under the pattern's own header. An edge a section
     above already shows is dropped here; the rest stay. Edges that remain
     but sit in a category that names the relation's vocabulary rather than
     what they are (an arc's events under "Language") move to "Events". */
  // an event card with its tellings, or an arc with its stages: both list
  // their verses above; an older event record with neither keeps its refs
  const pat = d.type === 'pattern', ev = !!d.event || (d.type === 'event' && (d.templates||[]).length > 0);
  // a text card quotes its own words at the top (textFaceBlock), so "where the
  // text speaks of it" would say the same verse twice
  const etextSec = pat || ev || d.said ? '' : `<details class="sec" data-sec="e-text" id="etext"${d.phrase_n ? ' open' : ''}><summary>Where the
      text speaks of it <span class="ct" id="etextn">${d.phrase_n || ''}</span></summary><div class="body" id="etextb">
      <span class="hint">loading…</span></div></details>`;
  const shownAbove = it =>
    (it.type === 'spoken_in' && ((d.acts_in||[]).length || (d.messages_in||[]).length
                                 || d.message || d.speech_act))
    || (it.type === 'specializes' && (d.message || d.speech_act))
    || (it.type === 'instance_of' && ((d.role_patterns||[]).length || d.template_family
                                      || (d.templates||[]).length))
    || (it.type === 'recounts' && d.event)
    || (it.type === 'occasion_of' && d.number)
    || (it.type === 'in_theme' && (d.event || (d.mthemes||[]).length))
    || (it.type === 'part_of' && /^stage_/.test(it.other) && (d.templates||[]).length);
  /* WHAT SPEAKS OF IT, BY KIND. Every "is spoken of in" sat under
     "Concepts", whatever spoke: a passage, an image, a verdict (2026-10-09, on righteousness: 'text' should not be
     considered a concept, but could have different relationships for text vs
     collections vs images; fixed generically for all concepts
     at the same time). Grouped here by what is on the other end, on every
     card; the graph's relation is unchanged (P-2026-10-09-1 holds whether it
     should be several). */
  const SPOKEN = {text: 'Passages that speak of it', concept: 'Concepts that speak of it',
                  image: 'Images & figures', assessment: 'Verdicts'};   // the taxonomy's own
  // names where it has one: "Verdicts that speak of it" stood beside "Verdicts" on faith
  const regrouped = {};
  (d.groups||[]).forEach(g => g.items.filter(it => !shownAbove(it)).forEach(it => {
    /* CONFLICT BY DIRECTION (the review of "the Jews", 2026-10-10): "was
       persecuted by Haman" and "persecuted Jesus" under one heading read as
       a people always in conflict; whom it was done to and whom they opposed
       are two groups, on every card */
    const cat = it.type === 'part_of' && it.otype === 'event' ? 'Events'
      : g.category === 'Conflict' ? (it.dir === 'in' ? 'Conflict: opposed by' : 'Conflict: opposing')
      : (it.type === 'speaks_of' && it.dir === 'in' && SPOKEN[it.otype]) || g.category;
    (regrouped[cat] = regrouped[cat] || []).push(it);
  }));
  // the node graph draws its lanes from the same, so it repeats nothing either
  // what someone said, not what the narrator tells, comes after everything
  // narrated (P-71)
  const SAID = "In someone's words";
  // on a person's card, family first: the questions asked of a person (option D)
  // ...and who else they may be: the reader who missed Shammah's link to
  // Shimeah looked for it (2026-10-13)
  const FIRST = person ? ['Kinship', 'Who else this may be', 'Marriage & union'] : [];
  const rank = c => FIRST.includes(c) ? FIRST.indexOf(c) : FIRST.length;
  d.groups = Object.entries(regrouped).map(([category, items]) => ({category, items}))
    .sort((a, b) => (a.category === SAID) - (b.category === SAID) || rank(a.category) - rank(b.category));
  const groups = d.groups.map(g => {
    const byType = {};
    g.items.forEach(it => (byType[it.label] = byType[it.label] || []).push(it));
    /* ON A HUB CARD, NO HEADER UNDER A HEADER. 2026-10-09: the
       bottom section always felt off. "Passages that speak of
       it" opened onto "IS SPOKEN OF IN · 18" -- one relation needs no second
       heading, and where every item is the same kind the kind is not said
       again on each row ("text" eighteen times). The rows lie in a grid. */
    const flat = lifted && Object.keys(byType).length === 1;
    const oneType = lifted && new Set(g.items.map(i => i.otype)).size === 1;
    const inner = Object.entries(byType)
      .sort((a,b) => b[1].length - a[1].length).map(([label, items]) =>
      `${flat ? '<div class="subbody chubgrid">' : `<details class="sub" ${items.length <= (lifted ? 40 : 3) ? 'open' : ''}>
        <summary>${esc(label)} <span class="ct">${items.length}</span>${pvOf(items)}</summary>
        <div class="subbody">`}${items.map(it => `<div class="relrow">
          <span class="link" data-ent="${esc(it.other)}">${esc(it.name)}</span>
          ${it.otype && !oneType ? `<span class="g">${esc(it.otype)}</span>` : ''}
          ${cites(it.refs)}${/* a theme-map edge says it is a reading (2026-10-02) */''}${it.reading
            ? `<span class="g" title="drawn by ${esc(it.reading)}, not the text's own statement">— a reading</span>` : ''}${
            /* and a reading the text does not state shows its evidence both
               ways (Rahab, plan 5.12) */''}${it.reading && it.note
            ? `<details class="moreinl" style="flex-basis:100%"><summary class="g">the evidence, both ways</summary><p class="hint" style="max-width:62ch;margin:4px 0">${
                esc(it.note)}</p></details>` : ''}${
            /* a speaker's claim says whose it is (P-71) */''}${it.claimed_by

let tmr;
$('#q').addEventListener('input', e => {
  clearTimeout(tmr);

  if(v.length<2){ $('#results').hidden = true; return; }
  tmr = setTimeout(async () => {
    const d = await api('/api/search', {q:v});
    /* NOTHING FOUND SAYS SO. The 2026-10-02 evaluation: "Mosez", a typo'd
       name, or an empty search hid the dropdown, so the reader could not
       tell "nothing matched" from "nothing happened". */
    if(!d.results.length){
      $('#results').innerHTML = `<div class="rnone">Nothing found for “${esc(v)}”.
        Search takes a reference (Jn 3:16), a name (Ahithophel) or a word
        (mercy), in the Berean's spelling.</div>`;
      $('#results').hidden = false;
      return;
    }
    /* A transient dropdown under the box, NOT a tab. Search-as-you-type made
       one tab per keystroke, which is exactly the wrong lifetime for a
       surface: a result list is scaffolding you use and drop, and a tab is
       something you keep. It sits under the box on the left, so the control
       and its output are together. */
    /* Each row has to say what makes it different from the one above it.
       On searching God: there were a ton of options, one was elohim
       and the second was eloh, so it was helpful for the Hebrew to
       show up in the dropdown. So the original word rides on the title
       line, and names the same thing answers to ride under it. */
    $('#results').innerHTML = d.results.map((r, i) =>
      `<button data-i="${i}"><div class="t">${esc(r.title)}${
         r.orig ? `<span class="rorig" lang="${r.lang==='Greek'?'el':'he'}"
                   >${esc(r.orig)}</span>` : ''}${
         r.translit ? `<span class="rtr">${esc(r.translit)}</span>` : ''}</div>
       <div class="s">${mdLite(r.sub||'', false)}</div>${
         /* "the name is also used of", not "also recorded as": the list is
            other records that ANSWER TO THIS NAME, and King Saul's row read
            "also recorded as Paul" (the 2026-10-02 evaluation) */
         r.aka ? `<div class="raka">the name is also used of ${
           r.aka.map(esc).join(' · ')}</div>` : ''}</button>`).join('');
    $('#results').hidden = false;
    searchSel(0);
    // Enter pressed before the list arrived opens its top row now
    const go = SEARCH_ENTER;

    $('#results').querySelectorAll('button').forEach(b => b.onclick = () => {
      const r = d.results[b.dataset.i];
      $('#results').hidden = true;
