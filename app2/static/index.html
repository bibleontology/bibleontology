    ${/* The same alignment read from the Greek end. 2026-09-19: the
          Greek card references the Hebrew just as the Hebrew references
          the Greek. Same row, same nodes, same click — it is one bridge and
          a reader should not have to know which side it was stored on. */''}
    ${(d.equiv && d.equiv.hebrew || []).length ? `<div class="eqrow">
      <span class="g">Septuagint used it for</span>
      ${d.equiv.hebrew.map(w => `<button class="eqnode"
        data-sense="${esc(w.key)}">
        ${origLine([{t: w.t, x: w.x, g: w.g}], true, false)}
        <span class="n">${w.n}</span></button>`).join('')}
      <span class="hint">an alignment recorded in the data, not a guess</span>
      </div>` : ''}
    ${d.equiv && d.equiv.aramaic ? `<div class="eqrow">
      <span class="g">Aramaic passages use</span>
      <button class="eqnode dead" disabled>
        ${origLine([{t: d.equiv.aramaic.t, x: d.equiv.aramaic.x,
                     g: d.equiv.aramaic.g}], true, false)}
        <span class="n">${d.equiv.aramaic.n}</span></button>
      <span class="hint">same consonants — a cognate in Daniel/Ezra, not a
        translation</span></div>` : ''}

    ${/* THE LEXICON ENTRY FIRST. 2026-09-27: the Lexicon
          Entry is the first collapsible entry. It had been kept last
          on purpose (2026-09-15); this reverses that. */''}
    ${d.definition ? sec('w-lex', 'Lexicon entry',
      `<p class="lexdef">${esc(d.definition)}</p>
       <p style="color:var(--muted);font-size:13px;margin:6px 0 0">Written for
       lexicographers. Everything below it is derived from how this Bible
       actually uses the word.</p>
       ${/* CREDITED WHERE IT IS SHOWN (2026-10-04: fetch on the server and
             credit): STEPBible's terms ask attribution to Tyndale House and
             point to their repository; the server fetches it from there
             (tools/fetch_lexicon.py). Hebrew after Brown-Driver-Briggs, Greek
             after Abbott-Smith. */''}
       ${/* the credit in the form their repository asks: "Credit it to 'STEP
             Bible' linked to www.STEPBible.org" (STEPBible-Data README, CC BY
             4.0; read 2026-10-04) */''}
       <p style="color:var(--muted);font-size:12px;margin:4px 0 0">From the
       Translators Brief lexicons of <a href="https://www.STEPBible.org" target="_blank"
       rel="noopener">STEP Bible</a>, CC BY 4.0.</p>`) : ''}
    ${/* THE WORD FAMILY (plan 5.10). 2026-10-01: a bridge between Phil 4:11 and 1 Tim 6:8 and
          1 Tim 6:6 -- αὐτάρκης,
          ἀρκέω, αὐτάρκεια, whose cards never named each other. One step of
          the lexicon's own derivation notes, words the text uses only. */''}
    ${(d.family||[]).length ? sec('w-family', 'Word family',
      d.family.map(k => `<div class="rowline"><span class="link" data-key="${esc(k.key)}"
          data-word="${esc(k.gloss || k.lemma)}"><span class="orig">${esc(k.lemma)}</span>${
          k.gloss ? ' “' + esc(k.gloss) + '”' : ''}</span>
        <span class="g">${esc(k.how)} ${esc(d.lemma || '')} · ${k.uses} ${k.uses === 1 ? 'use' : 'uses'}</span></div>`).join('')
      + `<p style="color:var(--muted);font-size:13px;margin:8px 0 0;max-width:60ch">Kin by
         derivation, one step, as the Greek lexicon (Abbott-Smith) records it;
         their verses are listed with each verse's connections. Where the lexicon
         only points to a word to compare, that is said, and it is not counted
         as kin.</p>`,
      d.family.length) : ''}
    ${acts}
    ${vclass}
    ${/* EVERYTHING COLLAPSED. 2026-09-15: the original language
          page starts with everything collapsed. Two sections used to open on
          arrival and between them they filled the screen, so the card led with
          its bulkiest content instead of with what the word IS. Passing no
          `open` lets each section follow `openSecs`, which remembers what the
          reader themselves opened. */''}
    ${sec('w-phrase', 'The word in a phrase', ph, (d.occurrences||{}).total)}
    ${sec('w-does', 'What the text does with it', feats, d.features.length)}
    ${minedSection('w-mined', d.mined)}
    ${gram ? sec('w-infl', 'How it inflects', gram, d.grammar.length) : ''}
    ${/* THE COLLAPSED SEPTUAGINT SECTION IS GONE. It listed the same words the
          row at the top of the card now shows, and by the rule from the
          pattern card — "what fills each slot serves both purposes" — two
          lists of one thing are worse than one. The caveat it carried has
          moved to the row, where it is read rather than hidden behind a
          disclosure triangle. */''}
    ${sec('w-near', 'Words it behaves most like',
      near + `<p style="color:var(--muted);font-size:13.5px;margin:10px 0 0;max-width:60ch">
      Nobody told it these were related — it is worked out from how the sentences
      are built. A weak signal: good for finding a thread, not an authority.</p>`,
      (d.neighbours||[]).length)}
    ${sec('w-against', 'What it is set against', contr, (d.contrasts||[]).length)}
    ${/* 2026-09-27: 'Said of it in the structure', 'How it is spoken' and
          'Where it occurs' are collapsible sections, and the spider graph is
          always visible but last. Filled by loadConnect after the card opens; a word too rare to
          measure has them removed. */''}
    ${sec('w-said', 'Said of it in the structure', `<div class="wc" id="wc-said"></div>`)}
    ${sec('w-spoken', 'How it is spoken', `<div class="wc" id="wc-spoken"></div>`)}
    ${sec('w-where', 'Where it occurs', `<div class="wc" id="wc-where"></div>`)}
    ${/* The graph is collapsible too, but open on arrival, since it is last
          and interesting (2026-09-27). */''}
    ${sec('w-graph', 'How it connects to other words',
      `<div class="wc" id="wconnect" data-key="${esc(key)}"><p class="wcnote">Loading…</p></div>`, null, true)}
  </div>`, () => {
    $('#paneinner').querySelectorAll('.use').forEach(u =>
      u.onclick = () => peek(u));
    $('#paneinner').querySelectorAll('.cite').forEach(c =>
      c.onclick = () => peek(c));
    /* A CONCEPT LINK OPENS ITS CARD. Every .link here was wired to open a
       word, so "What the text says of pleasure →" (data-ent, no key) opened
       nothing and its href="#" sent the reader to the root (2026-10-16,
       from /word/H2656). */
    $('#paneinner').querySelectorAll('.link').forEach(l =>
      l.onclick = e => { e.preventDefault();
        return l.dataset.ent ? openEntity(l.dataset.ent) : openSense(l.dataset.key, l.dataset.word); });
    wireLists($('#paneinner'));
    $('#paneinner').querySelectorAll('.occ').forEach(b =>
      b.onclick = () => showOccurrence(b));
    /* An equivalent is a word, so it opens a word card. The Aramaic node
       carries no key and is rendered disabled rather than offering a click
       that would open nothing — the sense profiles are Hebrew and Greek. */
    $('#paneinner').querySelectorAll('.eqnode[data-sense]').forEach(b =>
      b.onclick = () => openSense(b.dataset.sense));
    loadConnect(key);
  /* KEYED BY THE WORD, not its title, so the tab has an address (/word/H1254,
     2026-10-16) -- and two words glossed alike ("love": ἀγάπη, אַהֲבָה) are
     two tabs, not one replacing the other. */
  }, key);
}

/* ---------------- how a word connects to other words ----------------
   2026-09-27: enhances the word tabs in the main app
   without taking away from what is there. One collapsed section at
   the bottom of the card, loaded after the card itself: if it fails, the
   card above it is untouched. Data: /api/wordspace. */
const WC_EV = {
  cross:   ['across the languages', '--cross', 'Hebrew to Greek through the Septuagint: the partner first in 36 of 39 known pairs'],
  all:     ['all the evidence together', '--all', 'tested on 24 near-synonym pairs: 0.99'],
  context: ['shares its clauses with', '--ctx', 'the words in the same clauses: 0.99 (Greek 0.92)'],
  lxx:     ['alike in the Septuagint', '--lxx', 'rendered by the same Greek, or rendering the same Hebrew: 0.99 (Greek 0.98)'],
  roles:   ['plays the same part', '--roles', 'what the text says it does, is, and has done to it: 0.86'],
};
const WC_LANG = {H: 'Hebrew', A: 'Aramaic', G: 'Greek'};
const WC_REL = {does: 'does', is: 'is', undergoes: 'is done to it', is_said_of: 'is said of'};
const WC_FORCE = [['assertion', '#356A8C'], ['directive', '#b4502e'], ['question', '#6d4aa3'], ['nonfinite', '#8f8a80']];
let wcShown = {cross: true, all: true, context: true, lxx: true, roles: true};

async function loadConnect(key){
  const box = document.getElementById('wconnect');
  if(!box || box.dataset.key !== key) return;
  let d = null;
  try { d = await api('/api/wordspace', {key}); } catch(e) { d = null; }
  if(!d || !d.found){
    box.innerHTML = '<p class="wcnote">This word is too rare (fewer than five uses) for its connections to be measured.</p>';
    // no data on this server at all (or the request failed): leave the
    // graph out too, rather than call every word too rare
    const gone = !d || d.absent ? ['w-graph'] : [];
    ['w-said', 'w-spoken', 'w-where', ...gone].forEach(s => {
      const el = document.querySelector(`details[data-sec="${s}"]`); if(el) el.remove(); });
    return;
  }
  box._d = d;
  drawConnect(box);
  fillConnectSections(d);
}

function fillConnectSections(d){
  const put = (id, sid, html) => {
    const el = document.getElementById(id);
    if(!el) return;
    if(!html){ const s = document.querySelector(`details[data-sec="${sid}"]`); if(s) s.remove(); return; }
    el.innerHTML = html;
    el.querySelectorAll('[data-sense]').forEach(x => x.onclick = () => openSense(x.dataset.sense));
  };
  /* the portrait: what the structure graph says of it */
  const rels = Object.keys(WC_REL).filter(r => (d.portrait[r] || []).length);
  const chip = p => `<span class="wcchip" ${p.key ? `data-sense="${esc(p.key)}"` : ''}
      title="${esc(p.lemma)}">${esc(p.gloss || p.lemma)} <span style="color:var(--muted)">${p.n}</span></span>`;
  put('wc-said', 'w-said', rels.length ? `<div class="wcrel">${rels.map(r =>
      `<b>${WC_REL[r]}</b><div>${d.portrait[r].map(chip).join('')}</div>`).join('')}</div>
      <p class="wcnote">From every clause's subject, verb, object and predicate in the structure graph; a
      pronoun counts for the one it refers to. Numbers are clauses.</p>`
    : (d.lang === 'G' ? `<p class="wcnote">The Greek structure is not built yet, so what the text says of a
      Greek word cannot be read from it.</p>` : ''));
  const f = d.force || {}, tot = Object.values(f).reduce((a, b) => a + b, 0);
  put('wc-spoken', 'w-spoken', tot ? `<div class="wcforce">${WC_FORCE.map(([k, c]) =>
      f[k] ? `<i style="width:${100 * f[k] / tot}%;background:${c}" title="${k}: ${f[k]}"></i>` : '').join('')}</div>
      <div class="wcbk" style="justify-content:flex-start;gap:14px;flex-wrap:wrap">${WC_FORCE.map(([k, c]) =>
      `<span><span class="wcsw" style="background:${c}"></span> ${k} ${Math.round(100 * (f[k] || 0) / tot)}%</span>`).join('')}</div>
      <p class="wcnote">The force of the clauses it stands in, read off the verb's form: stated, commanded,
      asked, or not finite.</p>` : '');
  const max = Math.max(1, ...d.books);
  const cell = (n, i) => `<i title="${esc(d.book_names[i] || '')}: ${n}" style="background:${n
      ? `color-mix(in srgb, var(--ochre) ${15 + 85 * Math.sqrt(n / max)}%, transparent)` : 'var(--rule)'}"></i>`;
  put('wc-where', 'w-where', `
    <div class="wcbooks" style="grid-template-columns:repeat(39,1fr)">${d.books.slice(0, 39).map(cell).join('')}</div>
    <div class="wcbk"><span>Genesis</span><span>Psalms</span><span>Malachi</span></div>
    <div class="wcbooks" style="grid-template-columns:repeat(27,1fr);margin-top:8px">${d.books.slice(39).map((n, i) => cell(n, i + 39)).join('')}</div>
    <div class="wcbk"><span>Matthew</span><span>Romans</span><span>Revelation</span></div>
    <p class="wcnote">Every book of the Hebrew Bible and the New Testament; hover for counts.</p>`);
}

function drawConnect(box){
  const d = box._d, W = 700, H = 540, cx = W / 2, cy = H / 2 - 4;
  const evs = Object.keys(WC_EV).filter(e => wcShown[e] && (d.near[e] || []).length);
  /* RADIAL: each kind of evidence has its own sector; nearer the centre is
     more alike. Deterministic, and drawn without a graph library. */
  const placed = {}, nodes = [], links = [];
  const span = (2 * Math.PI) / Math.max(1, evs.length);
  evs.forEach((ev, i) => {
    const lst = (d.near[ev] || []).slice(0, 6), a0 = -Math.PI / 2 + i * span;
    lst.forEach((n, j) => {
      if(!placed[n.id]){
        const ang = a0 + span * (j + 0.5) / lst.length;
        // two staggered rings inside the sector keep labels apart; the
        // line's thickness carries the score
        const r = (j % 2) ? 190 : 122;       // the bottom was cut off
        placed[n.id] = Object.assign({}, n, {x: cx + r * Math.cos(ang), y: cy + r * Math.sin(ang), evs: [ev]});
        nodes.push(placed[n.id]);
      } else placed[n.id].evs.push(ev);
      links.push({ev: ev, n: placed[n.id], s: n.score || 0});
    });
  });
  const scr = l => l === 'G' ? 'grk' : 'heb';
  const col = ev => 'var(' + WC_EV[ev][1] + ')';
  const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Words connected to ${esc(d.gloss)}">
    ${links.map(l => `<line x1="${cx}" y1="${cy}" x2="${l.n.x.toFixed(1)}" y2="${l.n.y.toFixed(1)}"
       stroke="${col(l.ev)}" stroke-opacity=".7" stroke-width="${(1 + 5 * l.s).toFixed(1)}"/>`).join('')}
    <circle cx="${cx}" cy="${cy}" r="38" fill="var(--ochre)"/>
    <text x="${cx}" y="${cy + 7}" text-anchor="middle" font-size="22" fill="var(--surface)"
      class="${scr(d.lang)}">${esc(d.lemma)}</text>
    ${nodes.map(n => `<g class="wcnode${n.key ? '' : ' dead'}" ${n.key ? `data-sense="${esc(n.key)}"` : ''}>
       <title>${esc(n.gloss)} · ${n.count} uses · ${n.evs.map(e => WC_EV[e][0]).join('; ')}</title>
       <circle cx="${n.x.toFixed(1)}" cy="${n.y.toFixed(1)}" r="${(7 + Math.min(9, Math.log2(1 + n.count))).toFixed(1)}"
         fill="var(--surface)" stroke="${n.evs.length > 1 ? 'var(--ink)' : col(n.evs[0])}"
         stroke-width="${n.evs.length > 1 ? 2.5 : 2}"/>
       <text x="${n.x.toFixed(1)}" y="${(n.y - 16).toFixed(1)}" text-anchor="middle" font-size="15"
         class="${scr(n.lang)}" fill="var(--ink)">${esc(n.lemma)}</text>
       <text x="${n.x.toFixed(1)}" y="${(n.y + 24).toFixed(1)}" text-anchor="middle" font-size="11.5"
         fill="var(--muted)">${esc(n.gloss)}${n.lang !== d.lang ? ' · ' + WC_LANG[n.lang] : ''}</text></g>`).join('')}
  </svg>`;
  const legend = '<div class="wclegend">' + Object.keys(WC_EV).filter(e => (d.near[e] || []).length).map(e =>
      `<label title="${esc(WC_EV[e][2])}"><input type="checkbox" data-ev="${e}" ${wcShown[e] ? 'checked' : ''}>
       <span class="wcsw" style="background:${col(e)}"></span>${WC_EV[e][0]}</label>`).join('') + '</div>';
  box.innerHTML = legend + svg + `
    <p class="wcnote">Each colour is one kind of evidence, each tested before it was shown (hover a colour for
    its score); a word ringed in dark was found by more than one. A thicker line is more alike. Click a word
    to open it.</p>`;
  box.querySelectorAll('[data-sense]').forEach(el => el.onclick = () => openSense(el.dataset.sense));
  box.querySelectorAll('.wclegend input').forEach(i => i.onchange = () => {
    wcShown[i.dataset.ev] = i.checked; drawConnect(box); });
}

/* One example verse, fetched when its reference box is clicked. The original
   leads and the English follows -- see the note on the porig styles: the
   translation changes with context and cannot show what the examples share. */
async function showOccurrence(btn){
  /* Two layouts use these boxes: the phrase section, where one grid of refs
     shares a single reveal below it, and the verb examples, where each row
     carries its own so the verse lands next to the grammar it explains.
     `.vex` first, falling back to the section body, serves both. */
  const scope = btn.closest('.vex') || btn.closest('.body');
  const box = scope.querySelector('.occshow');
  const was = btn.classList.contains('on');
  /* NOT `body`: this function already declares one further down for the verse
     HTML, and a duplicate `const` is a SyntaxError that takes the WHOLE script
     with it -- every function in the file stops existing, which showed up as
     `doSearch is not defined` on an unrelated click. */
  const sect = btn.closest('.body');
  sect.querySelectorAll('.occ.on').forEach(x => x.classList.remove('on'));
  sect.querySelectorAll('.vex .occshow').forEach(x => {
    if(x !== box) x.hidden = true;
  });
  if(was){ box.hidden = true; return; }
  btn.classList.add('on');
  box.hidden = false;
  box.innerHTML = '<span class="hint">loading…</span>';
  const p = await api('/api/sense-verse',
                      {key: btn.dataset.key, ref: btn.dataset.ref});
  if(!p || !p.found){ box.innerHTML = '<span class="hint">Not found.</span>';
                      return; }
  const t = p.text || '';
  const body = p.hit
    ? esc(t.slice(0,p.hit[0])) + '<b>' + esc(t.slice(p.hit[0],p.hit[1]))
      + '</b>' + esc(t.slice(p.hit[1]))
    : esc(t);
  box.innerHTML = `<div class="phrase">
    <button class="use" data-ref="${esc(p.ref)}">${esc(prettyRef(p.ref))}</button>
    <span>${origLine(p.orig, p.rtl, true)}<span class="pen">${body}</span></span>
  </div>`;
  box.querySelectorAll('.use').forEach(u => u.onclick = () => peek(u));
}

async function openUnit(ref){
  const d = await api('/api/unit', {ref});
  const holder = document.createElement('div');
  drawStructure(holder, d);
  const named = d.nodes.filter(n => n.proper).map(n =>
    `<span class="pill">${esc(n.text||n.local)}</span>`).join('') ||
    '<span class="g" style="color:var(--muted)">None named here.</span>';
  DEEP = 'unit=' + encodeURIComponent(ref);
  pushCard(prettyRef(ref), 'unit', `<div class="card">
    <p class="kind">Structure</p><h2>${esc(prettyRef(ref))}</h2>
    <p class="lead">Who did what to whom, read out of the grammar of the original
      language. Dashed boxes mean the actor is carried from a previous sentence.</p>
    ${holder.innerHTML}
    ${sec('named-here','Names in this unit', named)}
  </div>`);
}

/* A template drawn with the same grammar as the verse diagrams: solid boxes
   for what is fixed, dashed slate boxes for the slots. Seeing the shape is the
   point -- a pattern read as a string is just a string. */
function drawTemplate(tmpl){
  const toks = tmpl.match(/\[[A-Z]\]|[^\s]+/g) || [];
  const PAD=14, BOXH=34, GAP=14, H=86;
  const fw = s => 9*String(s).length + 26;
  let x = PAD, parts = [];
  toks.forEach((tk, i) => {
    const slot = /^\[[A-Z]\]$/.test(tk);
    const verbish = !slot && i > 0 && /^\[/.test(toks[0]);
    const w = Math.max(fw(tk), 62);
    if(slot){
      parts.push(`<rect x="${x}" y="26" width="${w-GAP}" height="${BOXH}" rx="3"
        fill="none" stroke="var(--slate)" stroke-width="1" stroke-dasharray="4 4"/>
        <text x="${x+(w-GAP)/2}" y="48" text-anchor="middle" fill="var(--slate)"
        font-family="IBM Plex Mono, monospace" font-size="13">${esc(tk)}</text>
        <text x="${x+(w-GAP)/2}" y="76" text-anchor="middle" fill="var(--muted)"
        font-family="IBM Plex Mono, monospace" font-size="9.5"
        letter-spacing=".1em">SLOT</text>`);
    } else {
      parts.push(`<rect x="${x}" y="26" width="${w-GAP}" height="${BOXH}" rx="3"
        fill="var(--ochre-soft)" stroke="var(--ochre)" stroke-width="1"/>
        <text x="${x+(w-GAP)/2}" y="48" text-anchor="middle" fill="var(--ink)"
        font-family="Spectral, serif" font-size="15.5"
        font-style="${verbish?'italic':'normal'}">${esc(tk)}</text>
        <text x="${x+(w-GAP)/2}" y="76" text-anchor="middle" fill="var(--muted)"
        font-family="IBM Plex Mono, monospace" font-size="9.5"
        letter-spacing=".1em">FIXED</text>`);
    }
    x += w;
  });
  return `<div class="sheetbox"><svg viewBox="0 0 ${x+PAD} ${H}"
    width="${Math.min(x+PAD, 700)}" role="img"
    aria-label="Template ${esc(tmpl)}">${parts.join('')}</svg></div>`;
}

/* ---------------- mined patterns and echoes ----------------
   The pattern miner's findings (tools/patterns/mine.py) travel as pattern
   keys prefixed `m:`, so every list, chip and link that already opens a
   pattern opens these too. 2026-09-28: patterns show up in the
   node descriptions, as the most interesting patterns a node
   participates in. */
/* A few example verses, read in place: 2026-09-28, the
   strong examples of each pattern are shown directly, since they were too hard to
   navigate to. */
const exampleRows = xs => (xs||[]).map(x => `<div class="ex"><button class="refmore"
    data-go="${esc(x.eref)}">${esc(prettyRef(x.eref))}</button> ${esc(x.text)}</div>`).join('');

const MINED_NOTATION = `<b>≈</b> the word the Septuagint uses for it (so a
  Hebrew and a Greek verse meet) · <b>~{…}</b> any of a few similar words ·
  <b>[…]</b> a kind of thing, not a word · <b>&lt;…&gt;</b> how it is told
  (narrated, commanded, projected) · <b>—then→</b> the next thing told`;

async function openMined(id){
  const d = await api('/api/mined', {id});
  if(!d.found) return;
  const books = (d.by_book||[]).map(g => `<details class="bookgrp"><summary>${
      esc(g.book)} <span class="g">${g.refs.length}</span></summary>
    <div class="fillrefs">${g.refs.map(r =>
      `<button class="occ" data-mref="${esc(r.ref)}" data-mid="${esc(d.id)}"
        >${esc(prettyRef(r.ref))}</button>`).join('')}
      <div class="occshow" hidden></div></div></details>`).join('');
  const tier = d.tier === 'sure'
    ? `<p class="hint">Counted, and resting on the same words or named people
         in ${d.accounts} independent accounts.</p>`
    : `<p class="hint"><b>Less certain:</b> ${esc((d.why||[]).join('; '))}.</p>`;
  DEEP = 'mined=' + encodeURIComponent(id);
  openTab('pattern', d.pattern, `<div class="pane">
    <p class="kind">${esc(d.kind)} · ${d.testaments === 'OT+NT'
        ? 'both testaments' : d.testaments === 'NT' ? 'New Testament'
        : 'Old Testament'} · ${d.accounts} accounts${d.support !== d.accounts
        ? ` (${d.support} tellings)` : ''} · ${d.books} books</p>
    <h1>${esc(d.pattern)}</h1>
    ${tier}
    <div class="vp-h2">Where it happens</div>
    <div class="examples">${exampleRows(d.examples)}</div>
    <p class="hint" style="max-width:62ch">${MINED_NOTATION}</p>
    ${d.support !== d.accounts ? `<p class="hint" style="max-width:62ch">An
      account is counted once however often it is told: a retelling
      (Chronicles of Kings, one gospel of another) or a New Testament
      quotation of an Old Testament instance is not another occurrence.</p>`
      : ''}
    ${sec('m-books', `Where it occurs · ${d.shown} shown of ${d.support}`,
          books, (d.by_book||[]).length, true)}
  </div>`, () => {
    $('#paneinner').querySelectorAll('.occ[data-mref]').forEach(b =>
      b.onclick = () => showMinedVerse(b));
    $('#paneinner').querySelectorAll('.examples [data-go]').forEach(b =>
      b.onclick = () => peekAt(b, b.dataset.go));
  });
}

async function showMinedVerse(btn){
  /* The verse opens in place, with exactly the words that put it on the
     list boxed in the original — by Strong's number, which the miner and
     the strip share — and the Berean text plain (2026-09-19: the
     translation's highlighting is a guess anyway). */
  const grp = btn.closest('.fillrefs');
  const box = grp && grp.querySelector('.occshow');
  if(!box) return;
  const was = btn.classList.contains('on');
  grp.querySelectorAll('.occ.on').forEach(x => x.classList.remove('on'));
  if(was){ box.hidden = true; return; }
  btn.classList.add('on');
  box.hidden = false;
  box.innerHTML = '<span class="hint">loading…</span>';
  const p = await api('/api/mined-verse', {id: btn.dataset.mid, ref: btn.dataset.mref});
  if(!p || !p.found){ box.innerHTML = '<span class="hint">No text.</span>'; return; }
  box.innerHTML = `<p style="margin:6px 0">${esc(p.text)}</p>
    ${origLine(p.orig, p.rtl, true)}
    <button class="refmore" data-go="${esc(p.eref)}">view ${esc(prettyRef(p.eref))} in reader →</button>`;
  box.querySelector('[data-go]').onclick = async () => {
    const v = await api('/api/verse', {ref: p.eref});
    if(v.found) readerGo(v);
  };
}

/* A verse's connections: the verses it takes up and that take it up,
   retellings, and the patterns it is part of. 2026-09-28: a reader of Isa 8:14 wants to know about all the later
   references, filtered for the average interested reader, with a
   deeper drill-in to some of the more questionable matches. */
async function fillConnections(sec, ref){
  sec.innerHTML = '<div class="vp-h">connections</div><span class="hint">loading…</span>';
  const [e, p] = await Promise.all([api('/api/echoes', {ref}),
                                    api('/api/patterns', {ref})]);
  const echoRow = x => `<div class="echo"><button class="refmore" data-go="${
      esc(x.eref)}">${esc(prettyRef(x.eref))}</button> ${esc(x.text)}${
      (x.shared||[]).length ? `<div class="hint">${esc(x.band)} (${
      esc(x.band_note)}) · shares ${esc(x.shared.join(', '))}</div>` : ''}</div>`;
  const patRow = x => `<div class="echo"><button class="pat" data-key="${
      esc(x.key)}">${esc(x.template)}</button><div class="hint">${
      x.instances} accounts · ${x.books} books${x.testaments === 'OT+NT'
      ? ' · both testaments' : ''}${x.deeperWhy ? ' · ' + esc(x.deeperWhy) : ''
      }</div><div class="examples">${exampleRows(x.examples)}</div></div>`;
  /* THE ORDER, and EACH VERSE ONCE. 2026-09-28: lead with
     'says the same thing', then 'Echoed elsewhere in the Old Testament', and
     finally the other verses under 'other potential matches', filtering out
     the repeats like Isa 57:16 (which stood in the thread AND the echoes).
     A verse is shown in the first, strongest group that holds it. */
  const groups = [
    ['elsewhere', 'Echoed elsewhere in the Old Testament'],
    ['earlier', 'Takes up earlier verses'],
    ['later', 'Taken up by later verses'],
    ['parallel', 'Told again elsewhere (parallel accounts)'],
  ];
  const shownRefs = new Set([ref]);
  const once = xs => xs.filter(x => !shownRefs.has(x.ref) && shownRefs.add(x.ref));
  let main = '', deep = '';
  /* SAYS THE SAME THING — by structure, first. 2026-09-28, on Prov
     4:23: an imperative to the reader with a verb of 'guard' or its close
     synonyms and an object of heart or a directionally similar object would
     have produced the expected list. */
  const alRow = x => `<div class="echo"><button class="refmore" data-go="${
      esc(x.eref)}">${esc(prettyRef(x.eref))}</button> ${esc(x.text)}
      <div class="hint">${esc(x.how)}</div></div>`;
  const al = e.aligned || [];
  const sameShown = once(al.filter(x => !x.deeper && x.tier === 'same'));
  if(sameShown.length) main += `<div class="vp-h2">Says the same thing</div>`
      + sameShown.map(alRow).join('');
  /* SAYS THE OPPOSITE: the same verb and object, one side negated — "God
     so loved the world" / "do not love the world" (1 John 2:15). A clear contrast is shown where one is found. */
  const opposite = once(al.filter(x => !x.deeper && x.tier === 'contrast'));
  if(opposite.length) main += `<div class="vp-h2">Says the opposite</div>`
      + opposite.map(alRow).join('');
  for(const [k, label] of groups){
    const sure = once((e[k] || []).filter(x => !x.deeper));
    if(sure.length) main += `<div class="vp-h2">${label}</div>` + sure.map(echoRow).join('');
  }
  /* THE THREAD, strong links only (the strong links are the ones
     made prominent), in canon order. A verse already shown
     above appears as its reference alone, so order is kept and nothing is
     read twice. */
  const th = e.thread || [];
  if(th.length > 2) main += `<div class="vp-h2">The thread through this verse · ${
      th.length} verses, in canon order</div>` +
      th.map(x => (x.here || shownRefs.has(x.ref))
        ? `<div class="echo${x.here ? ' here' : ''}"><button class="refmore"
            data-go="${esc(x.eref)}">${esc(prettyRef(x.eref))}</button>${
            x.here ? ' <span class="hint">this verse</span>' : ''}</div>`
        : `<div class="echo"><button class="refmore" data-go="${esc(x.eref)}">${
            esc(prettyRef(x.eref))}</button> ${esc(x.text)}${x.step > 1
            ? '<div class="hint">two strong links away</div>' : ''}</div>`).join('');
  th.forEach(x => shownRefs.add(x.ref));
  // everything else, once each, under "other potential matches"
  const moreSame = once(al.filter(x => x.deeper && x.tier === 'same'));
  const similar = once(al.filter(x => x.deeper && x.tier !== 'same'));
  if(moreSame.length) deep += `<div class="vp-h2">More that say the same thing</div>`
      + moreSame.map(alRow).join('');
  if(similar.length) deep += `<div class="vp-h2">Says something similar</div>`
      + similar.map(alRow).join('');
  for(const [k, label] of groups){
    const more = once((e[k] || []).filter(x => x.deeper));
    if(more.length) deep += `<div class="vp-h2">${label}</div>` + more.map(echoRow).join('');
  }
  /* PATTERNS FOLDED. 2026-09-28: it is the 'says the same thing' that
     is worthy of the non-expansion, or a clear contrast
     where found. So what a verse SAYS again elsewhere is open; the
     patterns it is part of sit in a fold below. */
  const pats = p.patterns || [];
  const ps = pats.filter(x => x.tier === 'sure');
  const pd = pats.filter(x => x.tier !== 'sure')
    .map(x => Object.assign({}, x, {deeperWhy: (x.why||[]).join('; ')}));
  if(ps.length) deep += `<div class="vp-h2">Patterns it is part of</div>`
      + ps.map(patRow).join('');
  if(pd.length) deep += `<div class="vp-h2">Looser patterns</div>` + pd.map(patRow).join('');
  /* THE THREAD. 2026-09-28: the later echoes when reading the original
     reference are as important as seeing the reference points when reading
     the echoes later. Both are illuminating, as are all the points in the
     middle. So the whole thread, in canon order, from wherever you stand. */
  /* THE SAYING, first: one saying told again, and where it is first told
     (canon order). Exo 34:6 is identifiable as the
     originating instance, which is the direction of the pointer. */
  const sy = e.saying;
  const refBtn = r => `<button class="refmore" data-go="${esc(r.eref)}">${
      esc(prettyRef(r.eref))}</button>`;
  const saying = !sy ? '' : sy.here
    ? `<div class="saying">${sy.formula ? 'A stock formula' : 'A saying'}
         first told here, and told again at ${sy.family.map(refBtn).join(' ')}</div>`
    : `<div class="saying">${sy.formula ? 'A stock formula' : 'The same saying'},
         first told at ${refBtn({eref: sy.eref})} <span class="hint">(${
         esc(sy.by)})</span><div class="ex">${esc(sy.text)}</div>
         <div class="hint">also told at ${sy.family.map(refBtn).join(' ')}</div></div>`;
  /* WHAT IT REFERS TO — a READING, credited, never computed.
     2026-09-28, of Phil 2:5-11: what every line is
     referencing is evident on a reading; such readings are shown,
     credited. Both ways: the verse that refers, and every verse of the
     event it refers to. */
  // no one by name, outside About (2026-10-01: no person is named or quoted
  // in the app outside of the about page),
  // and no tool either: how it was found is a quiet marker (2026-10-16)
  const who = x => `a reading${x.status && !x.confirmed_by ? ', ' + esc(x.status) : ''} ${
      provOf(x.reader, x.confirmed_by)}`;
  /* confirmed readings first: the confirmed reading of Phil 2:5-11 is
     primarily the birth, life, crucifixion, and resurrection — lead with it */
  const conf = xs => [...xs].sort((a, b) => !!b.confirmed_by - !!a.confirmed_by);
  e.refers_to = conf(e.refers_to || []);
  e.referred_by = conf(e.referred_by || []);
  const tellings = ev => ev.tellings.map(t => {
      const a = prettyRef(t.start), z = t.end.split('.');
      return `<button class="refmore" data-go="${esc(t.start)}">${esc(a)}–${
        esc(t.start.split('.')[1] === z[1] ? z[2] : z[1] + ':' + z[2])}</button>`;
    }).join(' ');
  const refTo = (e.refers_to || []).map(x => `<div class="echo reading">
      <span class="rk">${esc(x.kind)}</span> ${x.event
        ? `<b>${esc(x.event.title)}</b> <span class="hint">told at</span> ${tellings(x.event)}`
        : `<button class="refmore" data-go="${esc(x.eref)}">${esc(prettyRef(x.eref))}</button> ${esc(x.text)}`}
      <div class="hint">“${esc(x.words)}” — ${esc(x.note)} · ${who(x)}</div></div>`).join('');
  const refBy = (e.referred_by || []).map(x => `<div class="echo reading">
      <button class="refmore" data-go="${esc(x.eref)}">${esc(prettyRef(x.eref))}</button>
      <span class="rk">${esc(x.kind)}</span>${x.event ? ` <span class="hint">this event (${
        esc(x.event)})</span>` : ''}
      <div class="ex">${esc(x.text)}</div>
      <div class="hint">“${esc(x.words)}” — ${esc(x.note)} · ${who(x)}</div></div>`).join('');
  (e.refers_to || []).forEach(x => shownRefs.add(x.eref));
  /* THE EDITORS' NOTES. 2026-09-29, of John 1:1-5: the aim was to catch
     Gen 1 in these 5 verses. No shared-word method reaches it; the Berean
     editors' parallel note does. Inherited, not derived, and said so: a
     parallel note says two passages belong together, a quotation footnote
     says one quotes the other. */
  // "points to": the editors' "See ..." -- some quotations, some only a
  // reference (Mark 1:44 to Leviticus 14), so never shown as "quotes"
  const EDKIND = {parallel: 'a parallel passage', quotes: 'quotes',
                  'quoted by': 'quoted by', 'points to': 'the editors point here',
                  'pointed to by': 'the editors point here from it'};
  const edRange = x => prettyRef(x.eref) + (x.eend ? '–' + (x.eend.split('.')[1] === x.eref.split('.')[1]
      ? x.eend.split('.')[2] : x.eend.split('.')[1] + ':' + x.eend.split('.')[2]) : '');
  const eds = once(e.editors || []);
  const editors = eds.length ? `<div class="vp-h2">Linked by the Berean editors</div>` +
    eds.map(x => `<div class="echo"><button class="refmore" data-go="${esc(x.eref)}">${
      esc(edRange(x))}</button> ${esc(x.text)}<div class="hint">${esc(EDKIND[x.kind] || x.kind)
      } · the Berean Standard Bible's own note</div>${
      /* where a judged link agrees with the editors, its explanation joins
         their note -- the note is theirs, the explanation a reading; a note
         over a range may hold more than one */''}${(x.explanations || []).map(y =>
      `<div class="expl">${esc(y.explanation)}<span class="hint"> · a reading ${
        provOf(y.reader)}</span></div>`).join('')}</div>`).join('') : '';
  /* WHAT THE ORIGINALS SHARE (2026-10-04), in three kinds:
     words one verse takes up from another; an image or expression both use,
     with every verse that uses it; and a story told again, beat beside beat.
     All readings, credited, never presented as the editors' note. */
  const shared = e.allusions || {};
  const alW = shared.words || [], alI = shared.images || [], alS = shared.stories || [];
  const allusions = (alW.length ? `<div class="vp-h2">Words taken up</div>` +
    alW.map(x => `<div class="echo reading"><button class="refmore" data-go="${esc(x.eref)}">${
      esc(prettyRef(x.eref))}</button> ${esc(x.text)}${x.explanation
      ? `<div class="expl">${esc(x.explanation)}</div>` : ''}<div class="hint">${esc(x.kind)
      } · the words side by side in both originals: ${esc(x.words)} · a reading ${
      provOf(x.reader)}</div></div>`).join('') : '') +
    (alI.length ? `<div class="vp-h2">Both use</div>` +
    alI.map(n => `<div class="echo reading"><div class="nodename">“${esc(n.node)}”</div>${
      /* the members are the links judged to share it, not every verse with
         the words (Dan 4:12 has the birds nesting and is not judged here) */''}${
      n.members.map(m => `<div class="nodemember"><button class="refmore" data-go="${esc(m.eref)}">${
        esc(prettyRef(m.eref))}</button> ${esc(m.text)}</div>`).join('')}${
      n.explanations.map(x => `<div class="expl">${esc(x.explanation || '')}</div>`).join('')
      }<div class="hint">an image or expression both use, not a claim that one points to the other
      · a reading ${provOf(n.reader)}</div></div>`).join('') : '') +
    (alS.length ? `<div class="vp-h2">A story told again</div>` +
    alS.map(x => `<div class="echo reading"><button class="refmore" data-go="${esc(x.eref)}">${
      esc(prettyRef(x.eref))}</button> ${esc(x.text)}${(x.beats || []).map(p =>
      `<div class="beatpair"><div>“${esc(p[0][1])}” <span class="g">${esc(prettyRef(p[0][0]))}</span></div><span
        class="g">↔</span><div>“${esc(p[1][1])}” <span class="g">${esc(prettyRef(p[1][0]))}</span></div></div>`).join('')
      }${x.explanation ? `<div class="expl">${esc(x.explanation)}</div>` : ''}${
      x.differs ? `<div class="expl"><i>Where they differ:</i> ${esc(x.differs)}</div>` : ''}<div class="hint">the
      steps of two stories side by side, not a claim that one was told with the other in mind
      · a reading ${provOf(x.reader)}</div></div>`).join('') : '');
  /* IN THE THEMES — the themes whose tables set this verse beside others
     (2026-10-08; before, the theme map's outline): the quick way to see what
     a verse belongs to before any detail. Each opens its table at the row. */
  const mt = e.themes || [];
  const themesLine = mt.length ? `<div class="vp-h2">In the themes</div>${
      mt.map(x => `<div class="echo"><span class="link" data-mtheme="${esc(x.theme)}">${esc(x.title)}</span>${
        [...(x.rows || []).map(r => `<a class="g" href="#" data-imagery="${esc(x.theme)}" data-row="${r[0]}"
            title="its row in the theme's table">${esc(r[1])}</a>`),
         ...(x.concepts || []).map(c => c[0] ? `<span class="link g" data-ent="${esc(c[0])}"
            title="a core concept of the theme">${esc(c[1])}</span>` : `<span class="g">${esc(c[1])}</span>`),
         ...(x.also || []).map(a => `<span class="g">${esc(a)}</span>`),
         ...(x.chapters || []).map(ch => `<span class="g">the chapter ${esc(ch)}</span>`),
         // an event on the theme's page whose telling holds this verse (2026-10-08)
         ...(x.events || []).map(ev => `<span class="link g" data-ent="${esc(ev[0])}"
            title="an event on the theme's page">${esc(ev[1])}</span>`)]
          .map(s => ' · ' + s).join('')}</div>`).join('')}
      <div class="hint">where each theme's own pages point to this verse</div>` : '';
  /* THE SAME WORD FAMILY (plan 5.10). 2026-10-01: a bridge between Phil 4:11 and 1 Tim 6:8 and
     1 Tim 6:6. A bridge by the
     words -- this verse's word and a kin word elsewhere, one derivation step
     apart in the Greek lexicon -- and said to be only that: kin words, not
     "says the same thing". */
  /* Grouped by kin word, rarest first, three verses each and the rest on the
     word's own card: measured over 60 random New Testament verses, one in
     ten listed 30 or more rows, all of a common kin word (Phil 4:11's
     ὑστερέω 16, Rom 8:15's δουλεύω 23) burying the rare one that is the
     point (αὐτάρκεια, 2). */
  const KIN_SHOW = 3;
  const kinBy = new Map();
  once(e.kin || []).forEach(x => {
    if(!kinBy.has(x.kin_key)) kinBy.set(x.kin_key, []);
    kinBy.get(x.kin_key).push(x);
  });
  const kinGroups = [...kinBy.values()].sort((a, b) => a.length - b.length);
  const kinBlock = kinGroups.length ? `<div class="vp-h2">The same word family</div>` +
    kinGroups.map(rows => { const x = rows[0]; return `<div class="hint" style="margin:8px 0 2px"><span class="orig">${
        esc(x.kin)}</span>${x.kin_gloss ? ' “' + esc(x.kin_gloss) + '”' : ''}, ${esc(x.how)} <span class="orig">${
        esc(x.word)}</span> here · kin by derivation (Abbott-Smith)</div>` +
      rows.slice(0, KIN_SHOW).map(r => `<div class="echo"><button class="refmore" data-go="${esc(r.eref)}">${
        esc(prettyRef(r.eref))}</button> ${esc(r.text)}</div>`).join('') +
      (rows.length > KIN_SHOW ? `<div class="echo"><span class="link" data-sense="${esc(x.kin_key)}">${
        rows.length - KIN_SHOW} more with <span class="orig">${esc(x.kin)}</span> — its card lists them all</span></div>` : '');
    }).join('') : '';
  /* FROM THE LETTERS (plan 6.21), both ways and up front (2026-10-05:
     the connection panel is where they will be accessed more often
     and they should be prominent there): a letter verse lists the happening
     it refers to; the account verse whose words it matches lists the letter.
     The two verses' words side by side, the reviewed sentence where the link
     is not plain, and "apparent, not certain" where readers differ. */
  const LT = (shared.letters || []);
  /* THE PROPHETS (plan 6.20), their three kinds kept apart. A prophet verse
     looking back or dated to its day "refers to" a happening like a letter;
     one LOOKING FORWARD is the other way about -- the later text takes up
     the prophet's words -- so it has its own heading on both verses and the
     strongest disclaimer the site has: the site reports what the later text
     says, never what a prophecy meant. */
  const relLabel = x => x.kind === 'prophet'
    ? (x.pkind === 'forward' ? (x.dir === 'to' ? 'taken up in' : 'the prophet’s words, taken up in')
      : x.pkind === 'own_time' ? (x.dir === 'to' ? 'dated by its own words to' : 'the prophet dates his words to')
      : (x.dir === 'to' ? 'refers to' : 'the prophet refers to'))
    : x.dir === 'to' ? 'refers to' : x.kind === 'poem' ? 'the poem refers to' : 'the letter refers to';
  const FWD_NOTE = `<p class="hint fwdnote">Here the later text itself quotes the prophet, or says something
    happened as the prophet spoke. The site reports what that text says. It does not say what a prophecy
    meant, whom it was about, or whether it was fulfilled; readers and traditions differ on these.</p>`;
  const letRow = x => `<div class="echo reading"><button class="refmore" data-go="${esc(x.eref)}">${
      esc(prettyRef(x.eref))}</button> ${esc(x.text)}
    <div class="beatpair"><div>“${esc(x.dir === 'to' ? x.words : x.account_words)}”</div><span
      class="g">↔</span><div>“${esc(x.dir === 'to' ? x.account_words : x.words)}”</div></div>${
      /* LABELLED, so two texts set side by side ("The psalm says X; Exodus 14
         tells Y") read as how they connect, not as one correcting the other
         (2026-10-05: the blue boxes read like there is a
         contradiction, but it really is more the way things are explained by
         the later writer) */
      x.why ? `<div class="expl"><b>How they connect:</b> ${esc(x.why)}</div>` : ''}<div class="hint">${relLabel(x)} <span class="link" data-ent="${esc(x.event)}">${
        esc(x.event_title)}</span>${x.certainty === 'apparent' ? ` · <i>apparent, not certain: ${
        x.reason === 'disputed' ? 'readers differ on which account is meant'
          : 'the tie rests on words other accounts share'}</i>` : ''} · a reading ${prov('auto')}</div></div>`;
  const fwd = x => x.kind === 'prophet' && x.pkind === 'forward';
  const letTo = LT.filter(x => x.dir === 'to' && !fwd(x)).map(letRow).join('');
  const letBy = LT.filter(x => x.dir === 'by' && !fwd(x)).map(letRow).join('');
  const fwdTo = LT.filter(x => x.dir === 'to' && fwd(x)).map(letRow).join('');
  const fwdBy = LT.filter(x => x.dir === 'by' && fwd(x)).map(letRow).join('');
  /* REVELATION AND THE REST OF SCRIPTURE (plan 6.22): every objective link,
     in four kinds kept apart -- words it takes up, an image both use, a
     person, place or happening it names, and its own key ("the seven stars
     are the angels of the seven churches") -- both texts' words side by side,
     shown on both verses, with the forward links' disclaimer: the site shows
     what the texts share, never what a vision means or when it happens. */
  const RV = (shared.revelation || []);
  const revLabel = x => ({
    rev:   {words: 'takes up the words of', image: 'uses an image also in', names: 'names what is told in',
            key: 'says what its image is, seen in'},
    other: {words: 'its words taken up in', image: 'an image also used in', names: 'named in',
            key: 'its image explained in'}})[x.dir][x.kind] || '';
  const REV_NOTE = `<p class="hint fwdnote">Revelation and the other passage share words, an image or a name,
    or Revelation says in its own words what one of its images is. The site shows what the texts share. It does
    not say what a vision means, whom it is about, or when it happens; readers and traditions differ on these.</p>`;
  const revRow = x => `<div class="echo reading"><button class="refmore" data-go="${esc(x.eref)}">${
      esc(prettyRef(x.eref))}</button> ${esc(x.text)}
    <div class="beatpair"><div>“${esc(x.dir === 'rev' ? x.rev_words : x.other_words)}”</div><span
      class="g">↔</span><div>“${esc(x.dir === 'rev' ? x.other_words : x.rev_words)}”</div></div>${
      x.why ? `<div class="expl"><b>How they connect:</b> ${esc(x.why)}</div>` : ''}<div class="hint">${
      revLabel(x)} ${esc(prettyRef(x.eref))}${x.certainty === 'apparent' ? ` · <i>apparent, not certain: ${
        x.reason === 'disputed' ? 'readers differ on which passage is meant'
          : 'the link rests on words other passages share'}</i>` : ''} · a reading ${prov('auto')}</div></div>`;
  /* ...AND SHOWN AS ONE CONNECTION (presented as one
     connection): a verse in a group lists the group
     once, its sentence and every pair, in place of a row per phrase. */
  const grpRow = g => `<div class="echo reading">${g.pairs.map(p =>
      `<div class="beatpair"><div><button class="refmore" data-go="${esc(p.rev)}">${esc(prettyRef(p.rev))}</button> “${
        esc(p.rev_words)}”</div><span class="g">↔</span><div><button class="refmore" data-go="${esc(p.other)}">${
        esc(prettyRef(p.other))}</button> “${esc(p.other_words)}”${p.certainty === 'apparent'
        ? ' <i class="g">(apparent alone)</i>' : ''}</div></div>`).join('')}<div class="hint">read together, as one
      connection · a reading ${prov('auto')}</div></div>`;
  /* A LIST FIRST, THE DETAIL ONE TAP AWAY (2026-10-06: the density
     of connections on Rev 1 is a lot to take in,
     though Revelation researchers will want it). Each connection is one
     line naming the other passage and how they connect; it opens to the
     words side by side. The apparent ones fold under "more". */
  const KINDW = {words: 'words taken up', image: 'an image both use', names: 'names it', key: 'its own key'};
  const revList = xs => {
    const seen = new Set(), clear = [], apparent = [];
    for (const x of xs) {
      let line, body, sure;
      if (x.group) {
        if (seen.has(x.group.id)) continue;
        seen.add(x.group.id);
        line = esc(x.group.label);
        body = grpRow(x.group);
        sure = x.group.pairs.some(p => p.certainty === 'clear');
      } else {
        line = `${esc(prettyRef(x.eref))} · ${KINDW[x.kind] || ''}`;
        body = revRow(x);
        sure = x.certainty !== 'apparent';
      }
      (sure ? clear : apparent).push(`<details class="revc"><summary>${line}</summary>${body}</details>`);
    }
    return clear.join('') + (apparent.length ? `<details class="revc"><summary class="g">${apparent.length} more, ${
      ''}apparent, not certain</summary>${apparent.join('')}</details>` : '');
  };
  const revFrom = revList(RV.filter(x => x.dir === 'rev'));
  const revIn = revList(RV.filter(x => x.dir === 'other'));
  /* THE HISTORY BOOKS AND THE PASSAGES BEFORE THEM (plan 6.23): a later
     passage tells again, quotes, carries out, or says in its own words that
     something happened as was said. A fixed label per kind and both texts'
     words, no sentence (approved 2026-10-06; the labels reviewed as
     nine traditions would read them). The server orders them: across books
     first, since the interesting ones are across books and time; a nearby link
     standing alone folds at the foot, so isolated close
     references are not overemphasized. */
  const HX = (shared.history || []);
  const histLabel = x => ({
    /* "recalls", not "tells again": a `back` link may only name the earlier
       happening, and a bare mention is not a retelling (the nine-reader
       review, 2026-10-06: ontology/provenance/briefs/6.23-LABELS-REVIEW.md) */
    later:   {back: 'recalls what is told in', fulfilled: 'says it happened as was said in',
              carried_out: 'does as was commanded in', quotes: 'quotes'},
    earlier: {back: 'recalled in', fulfilled: 'a later passage says this happened as said here, in',
              carried_out: 'done as commanded here, in', quotes: 'quoted in'}})[x.dir][x.kind] || '';
  const HIST_NOTE = `<p class="hint fwdnote">The later passage recalls, quotes or carries out the earlier one,
    or says in its own words that something happened as was said. The site shows what the texts say. It does not
    say what a prophecy or promise meant beyond that, or whether a later reading of it is right; readers and
    traditions differ on these.</p>`;
  const histRow = x => `<div class="echo reading"><button class="refmore" data-go="${esc(x.eref)}">${
      esc(prettyRef(x.eref))}</button> ${esc(x.text)}
    <div class="beatpair"><div>“${esc(x.dir === 'later' ? x.later_words : x.earlier_words)}”</div><span
      class="g">↔</span><div>“${esc(x.dir === 'later' ? x.earlier_words : x.later_words)}”</div></div><div class="hint">${
      histLabel(x)} ${esc(prettyRef(x.eref))}${x.also ? ` · also told at ${esc(x.also)}` : ''}${
      x.certainty === 'apparent' ? ' · <i>apparent, not certain: the tie rests on a shared subject or a common phrase</i>'
        : ''} · a reading ${prov('auto')}</div></div>`;
  const histGrp = g => `<div class="echo reading">${g.pairs.map(p =>
      `<div class="beatpair"><div><button class="refmore" data-go="${esc(p.later)}">${esc(prettyRef(p.later))}</button> “${
        esc(p.later_words)}”</div><span class="g">↔</span><div><button class="refmore" data-go="${esc(p.earlier)}">${
        esc(prettyRef(p.earlier))}</button> “${esc(p.earlier_words)}”${p.certainty === 'apparent'
        ? ' <i class="g">(apparent alone)</i>' : ''}</div></div>`).join('')}<div class="hint">read together, as one
      connection · a reading ${prov('auto')}</div></div>`;
  const histList = xs => {
    const seen = new Set(), clear = [], apparent = [], quiet = [];
    for (const x of xs) {
      let line, body, sure;
      if (x.group) {
        if (seen.has(x.group.id)) continue;
        seen.add(x.group.id);
        line = esc(x.group.label);
        body = histGrp(x.group);
        sure = x.group.pairs.some(p => p.certainty === 'clear');
      } else {
        line = `${histLabel(x)} ${esc(prettyRef(x.eref))}`;
        body = histRow(x);
        sure = x.certainty !== 'apparent';
      }
      const item = `<details class="revc"><summary>${line}</summary>${body}</details>`;
      (x.quiet ? quiet : sure ? clear : apparent).push(item);
    }
    return clear.join('') +
      (apparent.length ? `<details class="revc"><summary class="g">${apparent.length} more, apparent, not certain</summary>${
        apparent.join('')}</details>` : '') +
      (quiet.length ? `<details class="revc"><summary class="g">${quiet.length} nearby, in the same book</summary>${
        quiet.join('')}</details>` : '');
  };
  /* CLOSE BY RANKS LOWER (2026-10-06: close proximity links also rank
     lower in connections): across books and further back in the book (rank
     0-1) show with the other readings; everything nearby -- a pattern, the
     re-judged within-book ones, a nearby link alone -- goes below every
     other kind of connection on the verse */
  const far = x => x.rank < 2;
  const histBack = histList(HX.filter(x => x.dir === 'later' && far(x)));
  const histOn = histList(HX.filter(x => x.dir === 'earlier' && far(x)));
  const histNear = histList(HX.filter(x => !far(x)));
  const readings = themesLine +
                   (refTo || letTo ? `<div class="vp-h2">Refers to</div>${letTo}${refTo || ''}` : '') +
                   (refBy || letBy ? `<div class="vp-h2">Referred to by</div>${letBy}${refBy || ''}` : '') +
                   (fwdTo ? `<div class="vp-h2">Its words taken up later</div>${fwdTo}${FWD_NOTE}` : '') +
                   (fwdBy ? `<div class="vp-h2">Takes up the words of a prophet</div>${fwdBy}${FWD_NOTE}` : '') +
                   (revFrom ? `<div class="vp-h2">Revelation and the rest of Scripture</div>${revFrom}${REV_NOTE}` : '') +
                   (revIn ? `<div class="vp-h2">In Revelation</div>${revIn}${REV_NOTE}` : '') +
                   (histBack ? `<div class="vp-h2">Looks back</div>${histBack}` : '') +
                   (histOn ? `<div class="vp-h2">Looked back to by later passages</div>${histOn}` : '') +
                   (histBack || histOn ? HIST_NOTE : '')
                   + editors + allusions + kinBlock;
  const nearBlock = histNear ? `<div class="vp-h2">Nearby in the same book</div>${histNear}${
                     histBack || histOn ? '' : HIST_NOTE}` : '';
  /* THE DISCLOSURE. 2026-09-29: the matches "may be wrong" — said where
     they are read, not only on the About page. 2026-10-16: as a quiet marker,
     and naming no tool: these matches (structure, shared wording, the thread)
     are deterministic; the readings above carry their own markers. */
  const disclose = (main || deep) ? `<p class="hint disclose">${prov('algo',
      'They may be wrong; a match that failed a check is held under “Other potential matches” with the reason')}</p>` : '';
  sec.innerHTML = `<div class="vp-h">connections</div>` + saying + readings +
    (main || (readings || nearBlock ? '' : '<p class="hint">Nothing certain links this verse to another yet.</p>')) +
    nearBlock +
    (deep ? `<details class="dig"><summary>Other potential matches</summary><div class="digbody">${deep}</div></details>` : '') +
    disclose;
  sec.querySelectorAll('[data-go]').forEach(b =>
    b.onclick = () => peekAt(b, b.dataset.go));
  sec.querySelectorAll('[data-sense]').forEach(b =>
    b.onclick = () => openSense(b.dataset.sense));
}

/* A node's patterns (a person's, a word's), for its card. */
function minedSection(id, list){
  if(!(list||[]).length) return '';
  const row = x => `<div class="echo"><button class="pat" data-key="${esc(x.key)}">${
      esc(x.template)}</button><div class="hint">${x.instances} accounts · ${
      x.books} books${x.testaments === 'OT+NT' ? ' · both testaments' : ''}${
      x.tier !== 'sure' ? ' · ' + esc((x.why||[]).join('; ')) : ''}</div>
      <div class="examples">${exampleRows(x.examples)}</div></div>`;
  const sure = list.filter(x => x.tier === 'sure'), more = list.filter(x => x.tier !== 'sure');
  return sec(id, 'Patterns it is part of', (sure.map(row).join('')
      || '<p class="hint">None certain yet.</p>')
    + (more.length ? `<details class="dig"><summary>Potential matches — less certain</summary><div class="digbody">${
        more.map(row).join('')}</div></details>` : ''), list.length);
}

async function openPattern(key){
  if(String(key).startsWith('m:')) return openMined(String(key).slice(2));
  const d = await api('/api/pattern', {key});
  if(!d.found) return;
  /* SAY WHAT IS NOT SHOWN. 2026-09-15: these counts seemed skewed and
     there were no references to check.

     Both were true of what the card displayed. `lord of [X]` reports 224
     instances; the fillers listed summed to 219 and there were 11 distinct
     fillers of which 6 were rendered — so the arithmetic could not be made to
     work from anything on screen. A card that shows counts has to say which
     counts are partial, or a reader is right to distrust it. */
  /* One renderer, used for the Hebrew and for the Greek. The card used to
     build this inline for `d` alone, which is why two boxes at the top were
     followed by one language's evidence. */
  const slotsFor = (rec) => Object.entries(rec.slots || {}).map(([s, f]) => {
    const max = Math.max(...Object.values(f), 1);
    const shown = Object.values(f).reduce((a,b) => a+b, 0);
    const nf = Object.keys(f).length;
    const rest = (rec.distinct_fillers || nf) - nf;
    /* EACH FILLER CARRIES ITS OWN VERSES. 2026-09-19: on the declares page the
       verses are grouped under the 'What
       fills each slot' lists, allowing the user to navigate through all the
       examples.

       The card said [X] is "lord" 336 times and then offered one
       undifferentiated list of references below, so there was no way from a
       filler to its own instances — the two halves of the card described the
       same thing and did not connect. The references open in place, the same
       as everywhere else, so reading one does not lose the pattern. */
    const refsOf = (rec.slot_refs || {})[s] || {};
    /* THE SHARE SITS ON THE BAR. 2026-09-19: the top filler's share is
       rolled into the 'what fills each slot', where each slot shows its
       percentage. It was a single number in a classification table describing
       one filler; here it describes every filler, next to the count it is
       computed from. */
    const REF_PAGE = 24;
    return `<div class="slotname">[${esc(s)}]</div>` + Object.entries(f).map(([w,n]) => {
      const rs = refsOf[w] || [];
      const pct = Math.round(100 * n / rec.instances);
      return `<div class="fillbar"><span class="w">${esc(w)}</span>
       <span class="bar" style="width:${Math.round(120*n/max)}px"></span>
       <span class="n">${n}<span class="pct">${pct}%</span></span></div>`
      + (rs.length ? `<div class="fillrefs" data-shown="${REF_PAGE}">${
          rs.map((r,i) =>
          `<button class="occ" data-pref="${esc(r)}" data-pkey="${esc(rec.key)}"
            ${i >= REF_PAGE ? 'hidden' : ''}
            >${esc(prettyRef(r))}</button>`).join('')}${
          rs.length > REF_PAGE
            ? `<button class="refmore">${rs.length - REF_PAGE} more</button>`
            : ''}
         <div class="occshow" hidden></div></div>` : '');
    }).join('')
      + `<p class="hint" style="margin:8px 0 0">${nf} of ${
           rec.distinct_fillers || nf} fillers shown, covering ${shown} of ${
           rec.instances} uses${rest > 0 ? ` — ${rest} rarer filler${
           rest === 1 ? '' : 's'} not listed` : ''}.</p>`;
  }).join('');
  /* When the template holds both testaments, its own section shows only its
     own side — otherwise the Hebrew folder would list the Greek verses too and
     the two sections would double-count. `own_side` is that slice; where a
     pattern does not cross, it is absent and the whole record is used. */
  const mine = d.other_side && d.own_side ? d.own_side : d;
  const slots = slotsFor(mine);

  /* Every book it reaches, each opening to its own verses. The reach used to
     be a single number in a table — "21" — which is the one fact about it a
     reader cannot do anything with. The references come from the slots, so
     this counts what is actually here rather than what the harvest reported. */
  const byBook = {};
  Object.values(mine.slot_refs || {}).forEach(fills =>
    Object.values(fills).forEach(rs => rs.forEach(r => {
      const b = r.split('.')[0];
      (byBook[b] = byBook[b] || []).push(r);
    })));
  const booksOf = (rec) => {
    const bb = {};
    Object.values(rec.slot_refs || {}).forEach(fills =>
      Object.values(fills).forEach(rs => rs.forEach(r => {
        const b = r.split('.')[0];
        (bb[b] = bb[b] || []).push(r);
      })));
    return bb;
  };
  const bookNames = Object.keys(byBook).sort((a, b) =>
    (d.books||[]).indexOf(a) - (d.books||[]).indexOf(b));
  const booksSec = !bookNames.length ? '' : sec('p-books',
    /* Named by language like every other folder on the card.
       2026-09-19: the Books it Reaches above is labelled Hebrew for
       consistency. It is the reach of THIS template, not of the predicate
       the card now spans — and once a Greek counterpart is on the page, an
       unlabelled "Books it reaches · 21" reads as though it covered both. */
    `${d.anchor && d.anchor.rtl ? 'Hebrew' : 'Greek'} — books it reaches · ${
      bookNames.length}`,
    bookNames.map(b => `<details class="bookgrp"><summary>${esc(b)}
        <span class="g">${byBook[b].length}</span></summary>
      <div class="fillrefs">${byBook[b].map(r =>
        `<button class="occ" data-pref="${esc(r)}" data-pkey="${esc(d.key)}"
          >${esc(prettyRef(r))}</button>`).join('')}
        <div class="occshow" hidden></div></div></details>`).join('')
    + `<p style="color:var(--muted);font-size:14px;margin:12px 0 0;max-width:60ch">
        Nothing here names the pattern — it is sorted by what can be counted.
        One filler taking most of a slot means the text repeats the phrase;
        many fillers across many books means it builds with it.</p>`,
    bookNames.length);
  /* THE VERSE OPENS HERE, not in a chapter. 2026-09-16: clicking on
     the verses had dumped the reader in a chapter; do more in the pattern
     pages, at a minimum showing the specific verses.

     Jumping to the chapter loses the pattern you were reading and makes the
     reader find the phrase themselves. The verse now opens under its own
     reference with the pattern's words marked, so what put the verse on the
     list is visible -- and going to the chapter stays available inside it. */
  /* ONE BLOCK OVER THE WHOLE SECTION, with each BOOK as a row. Wrapping each
     book separately gave every group its own filter and its own
     "showing 1 of 1" footer, which is noise -- and left no way to search all
     sixty references at once. */
  DEEP = 'pattern=' + encodeURIComponent(key);
  openTab('pattern', d.template, `<div class="pane">
    <p class="kind">${esc(d.kind)} pattern · ${d.instances.toLocaleString()} uses
      · ${d.reach} books</p>
    <h1>${esc(d.template)}</h1>
    ${/* THE ORIGINAL WORD, because the English on this card is one rendering
          of it and the corpus picks a different one 43.5% of the time.

          2026-09-19, having traced `declares the [X]` by hand to Numbers
          24:4 and found the verse reads "the prophecy of one who hears":
          prophecy and declares are the same word, so the pattern matching
          has to bring as much insight as word navigation does.

          Three Englishes were in play for נְאֻם at that verse and nothing on
          screen connected them: the card said `declares` (the lemma's
          commonest gloss), the interlinear strip said `oracle` (MACULA's gloss
          there), and the Berean text said `prophecy`. Word navigation worked
          because it shows the lexeme, which is the only stable identity; the
          template is a label. So the lexeme goes on the card, with the other
          Englishes the corpus uses, and a reader who lands on `oracle` can see
          they are in the right verse. */''}
    ${/* THE PRIMARY WORD IS SET APART, AND BOTH ARE NAMED. 2026-09-19:
          the Hebrew 'declares' is set apart as the primary, labelled
          outside the boxes as Hebrew or Greek for those who are new to this,
          with lego made clear as what it is compared
          to.

          The card's subject is the Hebrew; the Greek is what it is being
          compared WITH, and two equal boxes side by side said otherwise. So
          the Hebrew and everything that evidences it sit inside one bordered
          group, the arrow and the Greek sit outside it, and each box carries
          its language above it for a reader who does not read either script.

          The Septuagint line is gone from here: it listed λέγει, φησὶν and
          εἶπεν, which is the same claim the λέγω box makes and better made
          there. It remains on the word card, where the word is the subject. */''}
    ${d.anchor ? `<div class="anchorw">
      <div class="anchormain">
        <div class="langtag">${d.anchor.rtl ? 'Hebrew' : 'Greek'}</div>
        <div class="anchorrow">
          <button class="anchornode" data-sense="${esc(d.anchor.key)}"
            title="Open this word — the same card the reader opens">
            ${origLine([{t: d.anchor.t, x: d.anchor.x, g: d.anchor.g}],
                       d.anchor.rtl, false)}
          </button>
          <div class="anchorside">
            ${(d.anchor.reads||[]).length
              ? `<div><span class="g">read here as</span>
                 ${moreJoin(d.anchor.reads, 4, g => `“${esc(g)}”`, ', ')}</div>` : ''}
            ${(d.anchor.also||[]).length
              ? `<div><span class="g">glossed</span>
                 ${moreJoin(d.anchor.also, 4, g => `“${esc(g)}”`, ', ')}</div>` : ''}
            ${d.loan ? `<div><span class="g">not translated</span>
               ${d.loan.means ? `the text reads it “${
                 esc(d.loan.means.gloss)}”` : 'spelled, not translated'}</div>`
              : ''}
          </div>
        </div>
      </div>
      ${/* THE OBSERVED PAIR, preferred over the predicted one.
            2026-09-19: the Greek bridge, as in the
            prior pattern, is an even better case for the
            bridge here. Better because the Greek word is IN this template's own
            verses rather than reached through the Septuagint column — Matthew
            11:10 and Luke 7:27 are instances of it, so the box points at what
            the text has rather than at what a translator chose elsewhere. */''}
      ${d.observed ? `
        <span class="eqarrow" title="the word standing in this pattern's own Greek verses">↔</span>
        <div class="anchorcmp">
          <div class="langtag">${d.observed.rtl ? 'Hebrew' : 'Greek'}</div>
          <button class="anchornode"${d.observed.key
            ? ` data-sense="${esc(d.observed.key)}"` : ' disabled'}>
            ${origLine([{t: d.observed.t, x: d.observed.x, g: d.observed.g}],
                       d.observed.rtl, false)}
          </button>
          <div class="cmpnote">in this pattern’s own verses · ${
            d.observed.n}×</div>
        </div>` : ''}
      ${!d.observed && (d.counterparts||[]).length && d.counterparts[0].anchor ? `
        <span class="eqarrow" title="the same predicate, said the other way">↔</span>
        <div class="anchorcmp">
          <div class="langtag">${
            d.counterparts[0].anchor.rtl ? 'Hebrew' : 'Greek'}</div>
          <button class="anchornode" data-pat="${esc(d.counterparts[0].key)}"
            title="Open ${esc(d.counterparts[0].template)}">
            ${origLine([{t: d.counterparts[0].anchor.t,
                         x: d.counterparts[0].anchor.x,

          </button>
          <div class="cmpnote">compared with</div>

    </div>` : ''}
    ${/* WHY IT SAYS "is". 2026-09-19: the confusing word

          wrong. The shape `[S] is X` is how a verbless clause is written down

          PARTICLE it does not: hinneh points at something, it does not

    ${/* AND NOW ONLY WHERE THERE IS AN "is" TO EXPLAIN. 2026-09-19:
          the pattern needs to be 'speaker slot' -> declares/issues/commands
          -> 'Behold'; the construction then in use was nonsensical.

          The harvest was fixed rather than the wording: a function-word
          anchor no longer takes a copula at all, so `[S] is behold` is now
          `behold [S]`. This note explained an "is" the template had stopped
          containing, which is the same fault one level down — a caveat that
          has outlived what it was warning about is worse than none, because
          a reader who checks it and finds it stale stops believing the rest
          of the page. So it fires on the template, not on the part of

    ${d.anchor_pos && ['particle','ptcl','suffix','pronoun','conjunction',
                       'preposition'].indexOf(d.anchor_pos) >= 0
      ? (/\bis\b/.test(d.template || '')
        ? `<p class="hint" style="max-width:66ch;margin:0 0 12px">

        : `<p class="hint" style="max-width:66ch;margin:0 0 12px">
           ${esc(d.anchor ? d.anchor.g : 'This word')} is a ${
