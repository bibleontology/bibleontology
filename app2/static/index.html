const THEME_PATH = {}, IMG_PATH = {};   // theme id -> /themes/<slug>[/side-by-side] (7.6d)
/* AN OPEN SECTION HAS AN ADDRESS TOO (2026-10-17: several expansions on
   the Explore page could not be deeplinked). Every collapsible section is a
   details.sec with a data-sec, on cards and on Explore alike; the one a reader
   last opened is named after the #: /e/david#open=rel-Family,
   /#tag=love&open=tg-pinned, /#explore&open=pg-shapes. Only a reader's own
   click names it (a summary click), never a section a card opens by default. */
function addressOf(tb){
  const base = baseAddress(tb);
  const sec = tb && tb.openSec;
  if(!sec) return base;
  const s = 'open=' + encodeURIComponent(sec);
  if(tb.id === 'explore') return '/#explore&' + s;
  return base + (base.includes('#') ? '&' : '#') + s;
}
/* A SECTION WITHOUT AN ID GETS ONE: its parent's id and its own title,
   "pg-shapes/chiasm" (19 under the story shapes alone had none). Numbers
   are left out of the title, so a count that changes does not move the
   address. */
const _slugSec = t => String(t || '').toLowerCase().replace(/[0-9]+/g, '')
  .replace(/[^a-z֐-׿Ͱ-Ͽἀ-῿]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 48);
function secId(d){
  if(d.dataset.sec) return d.dataset.sec;
  const parent = d.parentElement?.closest('details');
  const p = parent ? secId(parent) : '';
  let own = _slugSec(d.querySelector(':scope > summary')?.textContent) || 'section';
  // "+8 more" says nothing: named after the row it extends (the line before
  // its row of chips: "Outsider believes" -> outsider-believes-more)
  if(/^more\b/.test(own)){
    const label = _slugSec((d.parentElement?.previousElementSibling?.textContent || '').trim().split('\n')[0]);
    if(label) own = label + '-more';
  }
  let id = (p ? p + '/' : '') + own;
  // two of the same in one place: numbered in reading order (ids are given to
  // the whole page at once, top to bottom: allSecIds)
  if(document.querySelector(`details[data-sec="${CSS.escape(id)}"]`)){
    let n = 2;
    while(document.querySelector(`details[data-sec="${CSS.escape(id + '-' + n)}"]`)) n++;
    id += '-' + n;
  }
  d.dataset.sec = id;
  return id;
}
const allSecIds = () => document.querySelectorAll('#paneinner details').forEach(secId);
document.addEventListener('click', e => {
  const sum = e.target.closest('#paneinner details > summary');
  if(!sum) return;
  setTimeout(() => {
    const d = sum.parentElement, tb = state.tabs.find(x => x.id === state.active);
    // the reader's verse panels have their own form (#orig, #struct, #links)
    if(!tb || tb.id === READER) return;
    allSecIds();
    const sec = secId(d);
    if(d.open) tb.openSec = sec;
    else if(tb.openSec === sec){
      const up = d.parentElement?.closest('details[open]');
      tb.openSec = up ? secId(up) : null;
    }
    showAddress(tb);
  }, 0);
}, true);
// open a named section once its tab has drawn it: it, its parents, and in
// view. A tab may draw twice on arrival (Explore did): if the section opened
// is replaced, the new one is opened too.
function openSecLater(sec){
  const t0 = Date.now();
  const tick = () => {
    allSecIds();
    const d = document.querySelector(`#paneinner details[data-sec="${CSS.escape(sec)}"]`);
    if(!d){ if(Date.now() - t0 < 12000) setTimeout(tick, 200); return; }
    for(let p = d; p; p = p.parentElement?.closest('details')) p.open = true;
    d.scrollIntoView({block: 'start'});
    const tb = state.tabs.find(x => x.id === state.active);
    if(tb){ tb.openSec = sec; showAddress(tb); }
    setTimeout(() => {
      if(!d.isConnected && Date.now() - t0 < 12000) tick();
      else d.scrollIntoView({block: 'start'});
    }, 600);
  };
  tick();
}
function baseAddress(tb){
  if(!tb) return '/';
  // a card whose id misleads has an address from its name (tools/card_slugs.py)
  if(tb.id.startsWith('who:')) return '/e/' + encodeURIComponent(ADDR[tb.id.slice(4)] || tb.id.slice(4));
  // a theme at /themes/<slug> (7.6d); the old /theme/<id> still answers 301
  if(tb.id.startsWith('mtheme:')) { const t = tb.id.split(':')[1];
    return THEME_PATH[t] || '/theme/' + encodeURIComponent(t); }
  if(tb.id.startsWith('mimagery:')) { const t = tb.id.split(':')[1];
    return IMG_PATH[t] || '/theme/' + encodeURIComponent(t) + '/side-by-side'; }
  if(tb.id.startsWith('about:')) return '/about';
  // a tab with no page of its own: after the # (DEEP, above)
  if(tb.deep) return '/#' + tb.deep;
  // a word card at its Strong's number (2026-10-16: "deeplinks for the
  // original language word cards ... with strongs number in URL")
  { const m = tb.id.match(/^word:([hg])(\d+)$/);
    if(m) return '/word/' + m[1].toUpperCase() + m[2]; }
  // the Navigator, open and centred: linkable, though search engines are
  // told the card is the page to keep (the Navigator should not be the
  // dominant mode that search engines use)
  if(tb.id === 'explore' && KGN.center
     && document.querySelector('details[data-sec="x-kgn"]')?.open)
    return '/graph/' + encodeURIComponent(ADDR[KGN.center] || KGN.center);
  if(tb.id === 'ch:reader' && state.book){
    // a verse with its original, structure or links open: that verse, and what is open
    const dh = VDEPTH && VDEPTH.book === state.book && VDEPTH.c === +state.chapter ? depthHash() : '';
    if(dh) return `/p/${encodeURIComponent(state.book)}.${state.chapter}.${VDEPTH.v}${dh}`;
    const lit = HILITE && HILITE.book === state.book && HILITE.chapter === +state.chapter
      ? '.' + HILITE.from : '';
    return `/p/${encodeURIComponent(state.book)}.${state.chapter}${lit}`;
  }
  return '/';
}
function showAddress(tb){
  const to = addressOf(tb);
  // a verse's open depth is after the # (/p/John.3.16#orig), so the # counts
  // here; any other # (a theme table's #row-N) is left as it was
  // the app's own: a verse's depth, or a tab's address (#tag=love); cleared
  // when the tab on screen has none
  const depthNow = /^#(orig|struct|links|note)\b|^#[a-z]+(=|$)/.test(location.hash);
  const here = location.pathname + (to.includes('#') || depthNow ? location.hash : '');
  try{ if(here !== to) history.replaceState(history.state, '', to); }catch(e){}
  document.title = to.startsWith('/graph/') && KGN.data
    ? `${KGN.data.name || KGN.center} in the Knowledge Graph Navigator · Bible Ontology`
    : tb && tb.id !== 'explore' && tb.title
    ? `${tb.title} · Bible Ontology` : 'Bible Ontology — a Scripture explorer';
}
function closeTab(id){
  const ix = state.tabs.findIndex(x => x.id === id);
  state.tabs = state.tabs.filter(x => x.id !== id);
  if(state.active === id){
    const next = state.tabs[Math.min(ix, state.tabs.length - 1)];
    return selectTab((next || {id:'explore'}).id);
  }
  renderTabs();
}
/* ONE reader, not one per chapter.
   2026-09-14: Prev or Next within a reader tab navigates within the tab:
   only one scripture reader tab in addition to the
   explorer tab, all other tabs being searchable tabs which could contain
   scripture content but not the reader.

   The tab id used to carry the chapter -- `ch:Genesis 1` -- so Prev and Next
   opened tabs instead of moving, and a morning's reading left a row of them.
   The distinction that settles it: **a reader is a place you are, a study tab
   is a thing you opened.** You are only ever reading one passage, so the
   reader keeps a fixed identity and its title follows the chapter. Words,
   people and patterns are things, and things may accumulate.

   The comment below already said "the scripture tab", singular. It was built
   for this and then keyed per chapter, which is what made the two disagree. */
const READER = 'reader';

/* `key` identifies the tab; the title only labels it. They are different things
   whenever two records answer to one name -- the graph holds two entities called
   Jesus and several called God, and keying on the title made the second one
   REPLACE the first; opening the second should open a second tab. Distinct records, distinct tabs. */
/* EVERY TAB HAS AN ADDRESS (2026-10-17: a thorough pass through
   the app to provide deeplinks for as much as possible). A tab whose kind has
   no page of its own on the server -- a tag, a pattern, a sequence, Coverage
   -- is addressed after the #, /#tag=love: the link opens it, and a search
   engine still sees one page (a new path would be the empty app to it, a thin
   page). Each opener sets DEEP just before openTab; openTab gives it to the
   tab, and the boot script reads it back (DEEP_OPEN). */
let DEEP = null;
function openTab(kind, title, html, wire, key){
  const deep = DEEP; DEEP = null;
  const id = kind + ':' + (key || title);
  const existing = state.tabs.find(x => x.id === id);
  if(existing && deep) existing.deep = deep;
  /* A card already open, reached again from a link, comes back as it was
     left (its sections, its place), not re-rendered closed at the top. The
     reader tab is the exception: one tab, many chapters, so it always takes
     the new chapter. So is the tab on screen: re-opening it is a refresh. */
  if(existing && existing.html && key !== READER && id !== state.active && existing.title === title){
    return selectTab(id);
  }
  if(existing){ existing.html = html; existing.wire = wire; existing.title = title; existing.scroll = 0; }
  else {
    /* OPEN TO THE IMMEDIATE RIGHT OF WHERE YOU WERE. 2026-09-16: the
       reader tab location floats; a click that causes a
       tab to open puts it to the immediate right.

       Appending put every new tab at the far end of the strip, so following a
       word into a card and then into a second card scattered the trail: the
       tab you came from could be several places away, and on a wrapped strip
       even on another row. Inserting after the active tab keeps a chain of
       clicks in the order it was made, which is also what makes the Back
       button's path match what the strip shows. */
    const at = state.tabs.findIndex(x => x.id === state.active);
    if(at < 0) state.tabs.push({id, kind, title, html, wire, deep});
    else state.tabs.splice(at + 1, 0, {id, kind, title, html, wire, deep});
  }
  selectTab(id);
}
/* Coming back to the passage has to be trivial, or a deep dive is a dead end. */
/* Read a usage in place. Scanning twenty of them must not cost you the tab
   you came from, so the verse opens under its citation and going to the
   chapter stays an explicit, separate choice. */
async function peek(btn){
  const wrap = btn.parentElement;
  const open = wrap.querySelector('.peeked');
  if(open){ open.remove(); btn.classList.remove('on'); return; }
  const d = await api('/api/verse', {ref: btn.dataset.ref});
  const el = document.createElement('div');
  el.className = 'peeked';
  /* SAY WHAT FAILED. This formatted `d.title` unconditionally, so when the
     endpoint could not parse a ref it rendered the string "Read undefined →"
     over an empty verse -- which tells a reader nothing and told us nothing
     either. It was found on the concept cards, which cite in the display
     spelling. */
  el.innerHTML = d.text
    ? `<span class="ptext">${vtext(d.text, d.vmarks)}</span>
       <button class="goto" data-ref="${esc(btn.dataset.ref)}"
         data-label="${esc(btn.textContent)}">view in reader →</button>`
    : `<span class="ptext" style="color:var(--muted)">No text for ${
         esc(btn.dataset.ref)}.</span>`;
  wrap.appendChild(el);
  btn.classList.add('on');
  const go = el.querySelector('.goto');
  if(go) go.onclick = () => readerGo(d, rangeTo(btn.textContent, d));
}

/* A RESTORED "VIEW IN READER" STILL WORKS. 2026-10-02, after much
   navigation, the 'view in reader' button on a page did not work. A tab
   comes back from a saved copy of its HTML, which keeps an opened verse box
   but not the handler set on its button, so the button was dead. Handled
   here, once, for every such button that has lost its own. */
document.addEventListener('click', async e => {
  const g = e.target.closest && e.target.closest('.goto[data-ref]');
  if(!g || g.onclick) return;
  e.stopPropagation();
  const d = await api('/api/verse', {ref: g.dataset.ref});
  if(d.text) readerGo(d, rangeTo(g.dataset.label || '', d));
});

/* A DRILL-IN NEVER MOVES THE READER BY ITSELF. 2026-09-30: drill-ins
   do not hijack the reader without the user's permission; in general
   an in-tab viewing option with an explicit 'view in
   reader' chip is provided. Every verse reference ([data-go]) opens its verse right
   where it was clicked; a second click closes it; only the chip moves the
   reader. `peek` above did this for the pattern tab alone. */
async function peekAt(el, ref){
  // In a table the verse opens as a full-width row under the clicked row; in
  // a cell it stretched its column and pushed the rest of the table off the
  // screen.
  const tr = el.closest('tbody > tr');
  const next = tr ? tr.nextElementSibling : el.nextElementSibling;
  const openHere = next && (tr ? next.classList.contains('peekrow') : next.classList.contains('peeked'));
  if(openHere){
    const same = !tr || next.dataset.ref === ref;
    next.remove();
    document.querySelectorAll('.on[data-go]').forEach(x => x.classList.remove('on'));
    if(same) return;
  }
  const d = await api('/api/verse', {ref});
  const box = document.createElement('div');
  box.className = 'peeked';
  box.innerHTML = d.text
    ? `<span class="ptext"><b>${esc(prettyRef(ref))}</b> ${vtext(d.text, d.vmarks)}</span>
       <button class="goto" data-ref="${esc(ref)}"
         data-label="${esc(el.textContent)}">view in reader →</button>`
    : `<span class="ptext" style="color:var(--muted)">No text for ${esc(prettyRef(ref))}.</span>`;
  if(tr){
    const row = document.createElement('tr');
    row.className = 'peekrow';
    row.dataset.ref = ref;
    const td = document.createElement('td');
    td.colSpan = tr.children.length;
    td.appendChild(box);
    row.appendChild(td);
    tr.after(row);
  } else {
    el.insertAdjacentElement('afterend', box);
  }
  el.classList.add('on');
  const go = box.querySelector('.goto');
  if(go) go.onclick = e => { e.stopPropagation(); readerGo(d, rangeTo(el.textContent, d)); };
}

/* A VERSE ARRIVED AT IS LIT, wherever it came from. 2026-10-03: a searched
   verse is highlighted when it navigates to the reader, as well as scrolled
   to -- search, an old /p/ link
   and, under A.21, a verse's own address all come through here, and go the
   way "view in reader" already does: centred, and lit until reading leaves
   the chapter. This only tinted the verse number before. */
function jumpTo(ref){
  const m = String(ref).match(/^([\w]+)[ .](\d+)[:.](\d+)$/);
  if(!m) return;
  return readerGo({book: BOOKMAP[m[1]] || m[1], chapter: +m[2], verse: +m[3]});
}

/* ---------------- tree mode ----------------
   A second way to read a chapter: as a structure you can fold. The flow view
   shows every verse; tree mode lets a group close to its heading and a verse
   close over everything that builds on it, so the skeleton of an argument is
   readable without its detail. It was asked for as a place to experiment,
   so it is a MODE, not
   a replacement, and the flow view is untouched.

   Collapse works on the flat DOM rather than a nested one: the render already
   marks each verse with its depth, so a verse's subtree is simply the run of
   verses after it whose depth is greater. That keeps one renderer instead of
   two and means the tree can never disagree with the text. */
function vdepth(el){
  const c = [...el.classList].find(x => /^d\d$/.test(x));
  return c ? +c[1] : 0;
}

function ldepth(el){
  const c = [...el.classList].find(x => /^l\d$/.test(x));
  return c ? +c[1] : 0;
}

/* A limb's subtree is the run of limbs after it that sit deeper. */
function subtree(v){
  const out = [], d = ldepth(v);
  let n = v.nextElementSibling;
  while(n && n.classList.contains('limb') && ldepth(n) > d){
    out.push(n);
    n = n.nextElementSibling;
  }
  return out;
}

function foldVerse(v, close){
  const kids = subtree(v);
  if(!kids.length) return;
  v.classList.toggle('folded', close);
  kids.forEach(k => { k.hidden = close; });
  const c = v.querySelector('.caret');
  if(c) c.textContent = close ? '▸' : '▾';
}

function foldGroup(g, close){
  g.classList.toggle('folded', close);
  g.querySelector('.grp-b').hidden = close;
  const c = g.querySelector('.gcaret');
  if(c) c.textContent = close ? '▸' : '▾';
}

function markTree(){
  document.querySelectorAll('#paneinner .limb').forEach(v => {
    if(v.querySelector('.caret')) return;
    if(!subtree(v).length) return;
    const b = document.createElement('button');
    b.className = 'caret';
    b.type = 'button';
    b.textContent = '▾';
    b.title = 'Fold what builds on this verse';
    b.onclick = e => { e.stopPropagation();
      foldVerse(v, !v.classList.contains('folded')); };
    v.insertBefore(b, v.firstChild);
  });
  document.querySelectorAll('#paneinner .grp:not(.grp-open)').forEach(g => {
    if(g.querySelector('.gcaret')) return;
    const h = g.querySelector('.grp-h');
    if(!h) return;
    const b = document.createElement('button');
    b.className = 'gcaret';
    b.type = 'button';
    b.textContent = '▾';
    b.title = 'Fold this group';
    b.onclick = e => { e.stopPropagation();
      foldGroup(g, !g.classList.contains('folded')); };
    h.insertBefore(b, h.firstChild);
  });
}

/* The outline/flow toggle is gone. 2026-09-14: two modes in the reader
   were confusing. There is one reader now and it shows both things at
   once -- the Berean text on the left, the structure on the right -- so there
   is nothing to switch between. */
/* Fold or unfold everything at once — the view wanted when seeing
   a whole chapter's shape rather than read it. */
function foldAll(close){
  document.querySelectorAll('#paneinner .grp:not(.grp-open)')
    .forEach(g => foldGroup(g, close));
  if(!close){
    document.querySelectorAll('#paneinner .v')
      .forEach(v => foldVerse(v, false));
  }
}

/* ---------------- density lever ---------------- */
function setDensity(d){
  document.body.dataset.density = d;
  document.querySelectorAll('.lever button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.d===d)));
  mem.set('density', d);
  applyDensity();
}
document.querySelectorAll('.lever button').forEach(b =>
  b.onclick = () => setDensity(b.dataset.d));

/* ---------------- reader ----------------

   TWO VIEWS OF ONE CHAPTER, and they are shaped differently on purpose.

   FLOW is verse-oriented: a row per verse, each with its own tools, because
   that is how someone reads a Bible and it was already right.

   TREE is group-oriented. 2026-09-10: the tree had been accommodating
   the verses instead of orienting around the groups with the
   small verse numbers in line. So the group is the unit here — its text runs
   as continuous prose with verse numbers inline and small, and a run of verses
   at one depth forms a limb. Nesting a limb is what shows an argument building.
   The per-verse apparatus is gone: it belongs to reading, not to structure. */
let lastChapter = null;

async function loadChapter(book, chapter){
  /* A chapter move is a history entry of its own, so Back from John 3 returns
     to John 2 rather than to whatever tab preceded the reader. */
  push('chapter', book, chapter);
  state.book=book; state.chapter=chapter;
  // the passage a "view in reader" asked for stays lit only in its chapter
  if(HILITE && !(HILITE.book === book && HILITE.chapter === +chapter)) HILITE = null;
  const d = await api('/api/chapter', {b:book, c:chapter});
  lastChapter = d;
  renderChapter(d);
  paintHilite();
}

/* VIEW IN READER. 2026-09-30: view-in-reader links gave a
   blank page in some cases, and the passages clicked on should be temporarily
   highlighted until reader navigation leaves
   that chapter. The blank pages were display-form references ("Genesis
   17:7") re-parsed on the client into a book the reader does not know; this
   goes by the book, chapter and verse the server resolved (/api/verse).
   `to` is the last verse of the passage clicked, read off its label. */
let HILITE = null;
function readerGo(d, to){
  const book = BOOKMAP[d.book] || d.book;
  HILITE = {book, chapter: +d.chapter, from: +d.verse, to: Math.max(+d.verse, to || +d.verse)};
  return loadChapter(book, +d.chapter).then(() => {
    const el = document.querySelector(`.vs[data-v="${d.verse}"]`);
    if(el) el.scrollIntoView({block: 'center'});
  });
}
function paintHilite(){
  if(!HILITE) return;
  document.querySelectorAll('.vs[data-v]').forEach(v => {
    const n = +v.dataset.v;
    if(n >= HILITE.from && n <= HILITE.to) v.classList.add('hl');
  });
}
/* the last verse of the passage a label names, in the clicked verse's
   chapter: "32:7–10" -> 10; "Exodus 20–24" or "Genesis 12" (whole chapters)
   -> the chapter's end; otherwise the one verse */
function rangeTo(label, d){
  const t = String(label || '');
  const m = t.match(/(\d+):(\d+)\s*[–-]\s*(?:(\d+):)?(\d+)/);
  if(m && +m[1] === +d.chapter && +m[2] === +d.verse)
    return m[3] && +m[3] !== +d.chapter ? 999 : +m[4];
  if(/^[^:]*\b\d+(\s*[–-]\s*\d+)?\s*$/.test(t.split(';')[0])) return 999;
  return +d.verse;
}

/* ---------------- the reader: two columns ----------------

   2026-09-14: two modes in the reader were confusing; the design is desktop
   optimized. The outline/plain toggle is gone.
   There is one reader and it shows two things side by side:

     LEFT   the Berean text, with Berean headings and paragraphs. The only
            addition is a link on each maximal non-predicating phrase -- so
            "the complete armor of God" is one link and "compassionate" and
            "gracious" are two. tools/phrases.py derives them.

     RIGHT  the original words in ORIGINAL order, grouped in boxes by the
            word-group tree, boxes inside boxes. Chips at the head of a box
            are the patterns that apply at that level.

   A box whose unit runs past the chapter edge is drawn open -- borderless
   with a continuation mark -- rather than pretending the unit ends where the
   chapter does: a box may span two chapters, leaving the
   bottom or top borderless with a continuation indicator. */

const MAXBOX = 4;        /* deeper nesting reads as a circuit diagram */

function chip(c, span){
  const sc = c.scores || {};
  const label = (c.arc || (c.traits || []).join(' + '))
              + (span ? ` · ${span}` : '');
  return `<button class="chip" data-pat="${esc(c.id||'')}"
    title="${esc((c.family||'') + '  ' + (sc.support||0) + ' instances, '
                 + (sc.spread||0) + ' books')}">${esc(label)}</button>`;
}

/* One box. `kids` are boxes or words; a word carries its own link to the
   lexicon, as the original-language strip already did. */
/* A box with exactly one child box is the same span drawn twice. MACULA's
   tree is full of such wrappers -- wg > wg > wg down four levels, each adding
   a mark and no information -- so the chain is collapsed and only the levels
   that actually branch are drawn. */
function collapse(node){
  while(node && node.kids && node.kids.length === 1 && node.kids[0].kids)
    node = node.kids[0];
  return node;
}

/* BRACKETS, not nested boxes.

   2026-09-15: if chips only appear on the outmost box then
   the inner boxes should not be shown: just boxes
   at the section level and brackets within, with section-level chips at the top and
   lower-level chips at the end of the brackets they apply to.

   A bordered box for every level of a syntax tree is a circuit diagram: four
   nested borders around three words says nothing a reader can use. A bracket
   marks the same span at a fraction of the ink, and it has a natural place to
   hang a chip -- the closing bracket, which is where a unit finishes. There is
   ONE box, the section, and everything inside it is bracketed. */
/* MACULA's HEBREW glosses join their words with dots and no spaces --
   `let.them.be.gathered` -- so a browser sees one unbreakable token and it
   printed over its neighbours. The Greek has no dots at all: measured over
   out/phrases.jsonl.gz, 143,649 Hebrew glosses contain a dot and **zero**
   Greek ones do, which matches the observation of 2026-09-15 that the Greek,
   having no dots, does not show the overlap problem.

   So the dots become spaces rather than zero-width breaks (scrubbed out under
   the Hebrew and replaced with blanks before rendering) -- and it is the better fix, because a space both permits the
   line break AND reads as English. This is a no-op on Greek.

   Of 143,649 dotted glosses exactly two do not use the dot as a separator: an
   ellipsis and one trailing dot. Runs of two or more are folded to a real
   ellipsis first so that signal survives; the trailing dot falls out in the
   trim. */
function gloss(s){
  return esc(String(s || '')
    .replace(/\.{2,}/g, '…')
    .replace(/\./g, ' ')
    .replace(/\s+/g, ' ')
    .trim());
}

function brack(node, depth){
  if(!node) return '';
  if(!node.kids){
    /* Hebrew Strong's numbers carry a letter suffix -- `0871a` -- and Greek
       ones do not. The sense profiles are keyed on digits alone (`h8064`), so
       the suffix has to come off or the lookup misses silently. `strip()` has
       always done this; this path did not, which would have kept Hebrew broken
       even after the extraction started supplying a number at all. */
    const key = node.s ? ((node.l && /[\u0590-\u05FF]/.test(node.l)) ? 'h' : 'g')
                       + String(node.s).replace(/^0+/,'').replace(/\D/g,'') : '';
    /* the ORIGINAL over its gloss -- the right column exists to show the
       original, and an earlier version printed the gloss on both lines */
    return `<span class="ow" data-key="${esc(key)}">
        <span class="oo">${esc(node.t || '')}</span>
        <span class="og">${gloss(node.g)}</span></span>`;
  }
  node = collapse(node);
  if(!node.kids) return brack(node, depth);
  const lbl = [node.cls, node.role].filter(Boolean).join(' ');
  const inner = node.kids.map(k => brack(k, depth + 1)).join('');
  if(depth >= MAXBOX) return inner;          /* past the cap, no more marks */
  /* chips for THIS span, when phrase-level patterns exist; the slot is here
     so the shape of the thing is right before the data arrives */
  const chips = (node.chips || []).map(chip).join('');
  return `<span class="br b${Math.min(depth,3)}" title="${esc(lbl)}"
      >${inner}${chips}</span>`;
}

function renderChapter(d){
  const book = d.book, chapter = d.chapter, cont = d.continues || {};
  const picker = `<div class="picker">
      <select id="bookpick" aria-label="Book"></select>
      <select id="chappick" aria-label="Chapter"></select>
    </div>`;
  const nav = `<div class="chapnav">
      <button id="colswitch" title="The English and the Hebrew or Greek side by side"
        >${document.body.classList.contains('withcol') ? 'hide' : 'show'} split language view</button>
      ${/* NO SECOND "← Back" HERE. The committee, as first-time Reddit
            visitors (2026-10-01): two Back buttons a line apart, doing the
            same thing (goBack). The one in the tab strip, on every tab, is
            the one kept. */''}
      ${/* no inline onclick: the content security policy forbids inline
            handlers (2026-10-01); wired in the chapter's wire function */''}
      <button class="chapstep" ${chapter<=1?'disabled':''} data-book="${esc(book)}" data-ch="${chapter-1}">‹ Prev</button>
      <button class="chapstep" ${chapter>=d.chapters?'disabled':''} data-book="${esc(book)}" data-ch="${chapter+1}">Next ›</button>
    </div>`;
  let html = `<div class="chaphead">
      <div class="chaptitle"><h1>${esc(d.title)} ${d.chapter}</h1></div>
      <div class="chapctl">${picker}${nav}</div>
    </div>`;

  /* Chips descend to their evidence.

     2026-09-15: the chips were all going to the
     top of the section. Two causes, and only one is the display's.

     GRAPH: every pattern in the graph is attached to a SECTION, so there is
     no sub-section pattern to place. That is the real limit and phrase-level
     mining is what lifts it.

     DISPLAY: but a section pattern's `fill` names the VERSE that showed each
     trait -- creation_ev at John 1:3, new_creation at 1:4 -- and that was
     being thrown away. A chip now sits at the verse where its pattern
     COMPLETES, which is the last verse it cites, and the earlier cited verses
     are marked so the span is visible. Only a chip whose fill names nothing
     stays at the head. */
  const vnum = s => { const m = /:(\d+)\s*$/.exec(s||''); return m ? +m[1] : 0; };
  const byVerse = {}, topChips = [];
  for(const c of (d.chips||[])){
    if(!c || !c.id) continue;
    const vs = (c.fill||[]).map(f => vnum(f[1])).filter(Boolean);
    if(!vs.length){ topChips.push(c); continue; }
    const last = Math.max(...vs);
    (byVerse[last] = byVerse[last] || []).push({c, from: Math.min(...vs)});
  }
  const chips = topChips.map(chip).join('');
  /* A chapter's original is right-to-left if its verses are; no chapter mixes
     directions, and Daniel's and Ezra's Aramaic is RTL like the Hebrew around
     it, so `some` and `every` agree everywhere it matters. */
  const heb = (d.verses||[]).some(v => v.rtl);
  html += `<div class="cols${heb ? ' heb' : ''}">
    <div class="colL"><p class="hint vhint">After each verse,
      <span class="vh-orig"><i>orig</i> opens its Hebrew or Greek, </span><i>struct</i> its structure,
      and <i>links</i> the verses connected to it.${(d.theme_spans || []).length
        ? ` Coloured brackets mark verses a theme's own pages point to; tap one to open it there.`
        : ''}</p>${cont.before ? `<div class="contin">…continues from ${chapter-1}</div>` : ''}`;

  /* LEFT: Berean text in BEREAN PARAGRAPH FORM. 2026-09-15: the left is BSB
     paragraph form, and the fact that there are links is
     subtle. So verses RUN TOGETHER into paragraphs with the number inline,
     and a paragraph breaks only where the Berean text breaks -- not at every
     verse, which is a lectionary convention and not how the translation sets
     its own prose. */
  /* Per verse: the two chips that open the verse's depth -- the original,
     and the structure (desktop only) -- right after the text, then its
     pattern chips, which lived in the right column and must not vanish
     with it. What the original chip opens is the right column's content
     for this verse, kept here. */
  const origHtml = {};
  for(const v of d.verses){
    /* THE BERean NUMBER IS THE REFERENCE. 2026-09-25: the BSB
       verse references are primary and the Hebrew is only visible if original
       language is expanded. So the Hebrew verse is named here, on the panel
       that shows the Hebrew, and nowhere else in the reader. */
    const hv = (v.heb || '').split('.').slice(1).join(':');
    const lang = v.rtl ? 'Hebrew' : 'Greek';
    // RIGHT TO LEFT, SAID QUIETLY. 2026-10-01: a small subtle
    // arrow informs the reader that it reads right to left, subtle enough
    // that it is not annoying to those who understand this well. And the
    // language is declared, so a screen reader reads it in its own voice.
    origHtml[v.ref] = `<div class="vp-h">original · ${lang} ${esc(hv)}${v.rtl ? RTL_CUE : ''}</div><div class="ovr${
      v.rtl?' rtl':''}" lang="${v.rtl ? 'hbo' : 'grc'}">${
      (v.tree||[]).map(tr => brack(tr, 1)).join('')
      || (v.orig||[]).map(w => `<span class="ow"><span class="oo">${esc(w.t||'')}</span>
           <span class="og">${gloss(w.g)}</span></span>`).join('')}</div>`;
  }
  window._origHtml = origHtml;
  /* THE MAJOR THEMES, AT THE SECTION THEY COVER, AND BRACKETED.
     2026-09-29: in the viewer these themes rise to the section they
     cover, with brackets around the passage in the same
     color. Each cited passage opens and closes with a
     bracket in its theme's colour (a tap opens the theme); each section's
     heading names, in the same colours, the themes cited inside it. (Credit
     for the map is given once, in About -- 2026-09-30: automation helps
     generate things but everything is sourced in the Bible.) */
  /* FROM THE THEMES' OWN TABLES (2026-10-08): verses are tagged based on
     what is referenced in the theme. A bracket is a run of verses a theme
     sets side by side; it names the theme and the rows, and opens the table
     at that row (the theme's front page where a verse is only quoted there). */
  const spans = d.theme_spans || [];
  /* and every verse the theme's front page points to (the same day: verses on
     the front pages of the themes count, since
     leaving those out is not comprehensive): a core concept's
     passage opens the concept's card, a quotation or a chapter singled out
     the theme */
  const brTitle = s => `${s.title}${(s.marks || []).length ? ' — ' + s.marks.slice(0, 4).join('; ') : ''} (${s.label}) · a theme`;
  const brAttr = s => s.row != null ? `data-imagery="${esc(s.theme)}" data-row="${s.row}"`
    : s.node ? `data-ent="${esc(s.node)}"` : `data-mtheme="${esc(s.theme)}"`;
  const brCls = s => s.row == null && s.node ? 'thb link' : 'thb';
  const openBr = vn => spans.filter(s => s.from === vn).map(s =>
    `<span class="${brCls(s)}" ${brAttr(s)} style="color:${thColor(s.n)}"
       title="${esc(brTitle(s))}">[</span>`).join('');
  const closeBr = vn => spans.filter(s => s.to === vn).map(s =>
    `<span class="${brCls(s)}" ${brAttr(s)} style="color:${thColor(s.n)}"
       title="${esc(brTitle(s))}">]</span>`).join('');
  // the sections of this chapter: a titled seam starts one; verses before the
  // first heading belong to a section begun in the chapter before
  const secThemes = [];
  { let cur = {start: d.verses.length ? d.verses[0].v : 0, end: 0};
    for(const v of d.verses){
      if(v.seam && v.seam.title && v.v !== cur.start){ cur.end = v.v - 1; secThemes.push(cur); cur = {start: v.v, end: 0}; }
    }
    cur.end = d.verses.length ? d.verses[d.verses.length - 1].v : 0; secThemes.push(cur); }
  const themesIn = (a, b) => {
    const seen = new Map();
    spans.filter(s => s.from <= b && s.to >= a).forEach(s => seen.has(s.theme) || seen.set(s.theme, s));
    return [...seen.values()].sort((x, y) => x.n - y.n);
  };
  const secLine = vn => {
    const s = secThemes.find(x => x.start === vn);
    const ts = s ? themesIn(s.start, s.end) : [];
    return ts.length ? `<div class="sthemes">${ts.map(t => `<span class="sth" data-mtheme="${
      esc(t.theme)}" style="color:${thColor(t.n)};border-color:${thColor(t.n)}"
      title="A theme whose pages point to verses of this section">${esc(t.title)}</span>`).join('')}</div>` : '';
  };
  /* STORY PATTERNS IN THE READER (plan A.9). 2026-09-30: in
     the reader the common patterns are called out so that other
     instances of the pattern can be seen. Where a stage of a story begins, a chip
     names the pattern and the stage; it opens the pattern's card, which lists
     every story told with it. */
  const stories = d.story_spans || [];
  const firstV = d.verses.length ? d.verses[0].v : 0;
  /* ◆ a story pattern's stage; ◇ a role pattern's part, where the verses use
     its own word (plan A.10). Both open the pattern's table. */
  /* ✉ a divine message whose form stands in this verse: the most specific
     first (fewest verses), two at most, so a verse of the prophets does not
     disappear under "Thus says the LORD" */
  const msgsAt = d.messages_at || {};
  const msgMark = vn => (msgsAt[vn] || []).slice(0, 2).map(m =>
    `<span class="stchip msg link" data-ent="${esc(m.id)}" title="Message: ${esc(m.name)} — open it to see every verse that says it, and where it is spoken">✉ ${esc(m.name)}</span>`).join('');
  /* ❝ a kind of speaking the text names in this verse -- a confession of
     faith, a lament, a blessing (plan A.18; approved 2026-10-01 as
     P-73). The rarest one only, and none where one of its own messages
     already has a chip (the server leaves those off). */
  const actsAt = d.acts_at || {};
  const actMark = vn => (actsAt[vn] || []).slice(0, 1).map(a =>
    `<span class="stchip act link" data-ent="${esc(a.id)}" title="Speech act: ${esc(a.name)} — open it to see every verse where the text names it">❝ ${esc(a.name)}</span>`).join('');
  const storyMark = vn => msgMark(vn) + actMark(vn) + stories.filter(s => s.from === vn || (s.from < firstV && vn === firstV))
    .filter((s, i, all) => s.kind !== 'role' ||
      all.findIndex(o => o.kind === 'role' && o.instance === s.instance) === i)
    .map(s => s.kind === 'role'
      ? `<span class="stchip role link" data-ent="${esc(s.pattern_id)}"
      title="Role pattern: ${esc(s.family_name)} — the ${esc(s.stage)} in the row ${esc(s.title)}. Open it to see everyone who fills this role.">◇ ${
      esc(s.family_name)} · ${esc(s.title)}</span>`
      : `<span class="stchip link" data-ent="${esc(s.pattern_id || 'tpl_' + s.family)}"
      title="Story pattern: ${esc(s.family_name)} — the ${esc(s.stage)} in ${esc(s.title)}. Open it to see the other stories told this way.">◆ ${
      esc(s.family_name)} · ${esc(s.stage)}</span>`).join('');
  let open = false;
  if(d.verses.length && !(d.verses[0].seam && d.verses[0].seam.title)) html += secLine(d.verses[0].v);
  for(const v of d.verses){
    if(v.seam){
      if(open){ html += `</p>`; open = false; }
      if(v.seam.title) html += `<h2 class="sect">${esc(v.seam.title)}</h2>` + secLine(v.v);
    }
    if(!open){ html += `<p class="para">`; open = true; }
    const here = byVerse[v.v] || [];
    const pchips = here.length ? `<span class="endchips">${
        here.map(x => chip(x.c, x.from < v.v ? `${x.from}–${v.v}` : '')).join('')
      }</span>` : '';
    /* THE THREE SIT AT THE VERSE'S END, ALWAYS SHOWN, IN SHORT WORDS.
       History, so the discarded versions are not re-proposed: after every
       verse as full chips (2026-09-25) -- Psalm 23's six verses carried
       eighteen and could no longer be read as a psalm (UI committee,
       2026-09-30); then folded into the verse number as a pop-up on hover or
       click -- which was found a little unintuitive and clunky. On 2026-10-05 four
       always-visible versions were tried side by side and this one won:
       "orig · struct · links" in small quiet type after the text. The verse
       number is just a number again. */
    const vchips = `<span class="vchips"><button class="tgv orig"
        data-what="orig" aria-label="original"
        title="Show the Hebrew / Greek of this verse">orig</button><button
        class="tgv struct" data-what="struct" aria-label="structure"
        title="Show the structure of this verse: its clauses and how they connect">struct</button>${
        /* only where there is something behind it (2026-09-28) */
        v.conn ? `<button
        class="tgv conn" data-what="conn" aria-label="connections"
        title="Other verses this one takes up or is taken up by, retellings, and the patterns it is part of">links</button>` : ''}</span>`;
    /* The chips that mark where something begins (a message, a speech act, a
       story's stage) follow the verse number rather than lead it. Leading,
       they sat straight after the previous verse's "orig · struct · links"
       and read as its own: "prophets, orig · struct · links ❝ Promise 33 who
       through faith" (Heb 11:32-33). 2026-10-05: the Promise chip
       goes after the verse number. */
    html += `<span class="vs" data-ref="${v.ref}" data-c="${v.c}" data-v="${v.v}">${openBr(v.v)}<span class="vn vn-r">${v.v}</span>${storyMark(v.v)}${
      vtext(v.text, v.vmarks, t => linkify(t, v.links))}${closeBr(v.v)}${vchips}${pchips} </span>`;
  }
  if(open) html += `</p>`;
  html += (cont.after ? `<div class="contin">continues into ${chapter+1}…</div>` : '')
        + `</div><div class="colR">`;

  /* RIGHT: the original, in its own order, boxed by structure. */
  html += `<div class="bx sec${cont.before?' openT':''}${cont.after?' openB':''}">
      ${chips ? `<div class="chips">${chips}</div>` : ''}`;
  for(const v of d.verses){
    const here = byVerse[v.v] || [];
    html += `<div class="ovr${v.rtl?' rtl':''}" data-ref="${v.ref}"><span class="ovn">${v.v}</span>${
      (v.tree||[]).map(tr => brack(tr, 1)).join('')
      || (v.orig||[]).map(w => `<span class="ow"><span class="oo">${esc(w.t||'')}</span>
           <span class="og">${gloss(w.g)}</span></span>`).join('')}${
      here.length ? `<span class="endchips">${
        here.map(x => chip(x.c, x.from < v.v ? `${x.from}–${v.v}` : '')).join('')
      }</span>` : ''}</div>`;
  }
  html += `</div></div></div>`;

  openTab('ch', `${d.title} ${d.chapter}`, html, () => {
    buildPicker(); syncPicker();
    $$('#paneinner .chip').forEach(b => b.onclick = () => openHigherPattern(b.dataset.pat));
    $$('#paneinner a.ph').forEach(a => a.onclick = e => {
      e.preventDefault(); doSearch(a.dataset.q);
    });
    $$('#paneinner .ow[data-key]').forEach(w => {
      if(w.dataset.key) w.onclick = () => openSense(w.dataset.key);
    });
    $$('#paneinner .tgv').forEach(t => t.onclick = e => {
      e.stopPropagation(); toggleVerseDepth(t, book);
    });
    // the chapter navigation, wired here rather than by inline onclick
    // attributes, which the content security policy forbids
    const cs = $('#colswitch'), gb = $('#goback');
    if(cs) cs.onclick = toggleCols;
    if(gb) gb.onclick = goBack;
    $$('#paneinner .chapstep').forEach(b =>
      b.onclick = () => loadChapter(b.dataset.book, parseInt(b.dataset.ch, 10)));
    stickyHead(); alignParas();
  }, READER);
  mem.set('place', {b:book, c:chapter});
}

/* The two-column layout, on request. Remembered, like the other reading
   choices; the paragraphs' alignment pass only runs when there is a column
   to align with. */
const PHONE = matchMedia('(max-width: 767px)');
function applyColsForWidth(){
  document.body.classList.toggle('withcol', !PHONE.matches && !!mem.get('withcol', false));
}
function toggleCols(){
  if(PHONE.matches) return;          // no split view on a phone (2026-10-01)
  const on = !document.body.classList.contains('withcol');
  document.body.classList.toggle('withcol', on);
  mem.set('withcol', on);
  const b = document.getElementById('colswitch');
  if(b) b.textContent = (on ? 'hide' : 'show') + ' split language view';
  alignParas();
}

/* A VERSE'S DEPTH, OPENED UNDER IT. Turning a chip on breaks the paragraph
   at that verse: everything after the verse moves into a continuation
   paragraph, and a panel sits between the two. Turning the verse's last chip
   off removes the panel and rejoins the paragraph, so the text reads as the
   Berean sets it again. */
/* A major theme's colour: its number around the colour wheel by the golden
   angle, so themes that sit side by side in a passage never look alike;
   saturation and lightness come from the page's light or dark ground. */
function thColor(n){
  return `hsl(${Math.round(((n - 1) * 137.508 + 20) % 360)} var(--th-s) var(--th-l))`;
}

function toggleVerseDepth(btn, book){
  const vs = btn.closest('.vs');
  const p = vs && vs.closest('p.para');
  if(!p) return;
  const what = btn.dataset.what;
  const on = !btn.classList.contains('on');
  btn.classList.toggle('on', on);
  let panel = p.nextElementSibling;
  if(!(panel && panel.classList.contains('vpanel')
       && panel.dataset.ref === vs.dataset.ref)) panel = null;
  if(on && !panel){
    // split: the verses after this one continue in a new paragraph
    const rest = [];
    for(let n = vs.nextSibling; n; n = n.nextSibling) rest.push(n);
    panel = document.createElement('div');
    panel.className = 'vpanel';
    panel.dataset.ref = vs.dataset.ref;
    p.after(panel);
    if(rest.length){
      const cont = document.createElement('p');
      cont.className = 'para';
      cont.dataset.split = '1';
      rest.forEach(n => cont.appendChild(n));
      panel.after(cont);
    }
  }
  if(!panel) return;
  let sec = panel.querySelector(`.vp-sec[data-what="${what}"]`);
  if(on && !sec){
    sec = document.createElement('div');
    sec.className = 'vp-sec';
    sec.dataset.what = what;
    // the original above the structure, whichever was opened first
    if(what === 'orig') panel.prepend(sec); else panel.append(sec);
    if(what === 'orig') fillOriginal(sec, vs.dataset.ref);
    else if(what === 'conn') fillConnections(sec, vs.dataset.ref);
    else fillStructure(sec, book, vs.dataset.c, vs.dataset.v);
  }
  if(sec) sec.hidden = !on;
  if(!vs.querySelector('.tgv.on')){
    // rejoin: the continuation paragraph's verses come back, the panel goes
    const cont = panel.nextElementSibling;
    if(cont && cont.dataset.split === '1'){
      while(cont.firstChild) p.appendChild(cont.firstChild);
      cont.remove();
    }
    panel.remove();
  }
  // the address follows the verse whose depth was last opened
  VDEPTH = vs.querySelector('.tgv.on, .vmark[aria-expanded="true"]') ? {ref: vs.dataset.ref, book: state.book, c: +vs.dataset.c, v: +vs.dataset.v}
         : (VDEPTH && VDEPTH.ref === vs.dataset.ref ? null : VDEPTH);
  showAddress(state.tabs.find(x => x.id === state.active));
}

/* A VERSE WITH ITS DEPTH OPEN HAS AN ADDRESS: /p/John.3.16#orig, and
   #orig,struct,links in any combination. 2026-10-16: a url of a verse in
   original language could not be sent before.
   After the #, so the verse stays one page to a search engine. */
let VDEPTH = null;
const DEPTH_NAME = {orig: 'orig', struct: 'struct', conn: 'links'};
function depthHash(){
  if(!VDEPTH) return '';
  const vs = document.querySelector(`#paneinner .vs[data-ref="${CSS.escape(VDEPTH.ref)}"]`);
  const on = vs ? [...vs.querySelectorAll('.tgv.on')].map(b => DEPTH_NAME[b.dataset.what]).filter(Boolean) : [];
  /* THE STRUCTURE OPENED A LEVEL DEEPER: each open clause row is named,
     #struct:cl1 (2026-10-17: a way to double-expand the structure via a url
     deeplink) */
  const panel = document.querySelector(`#paneinner .vpanel[data-ref="${CSS.escape(VDEPTH.ref)}"]`);
  const cls = panel ? [...panel.querySelectorAll('.scl.open')].map(r => 'struct:' + String(r.dataset.id).split('#').pop()) : [];
  const all = [...on.filter(n => !(n === 'struct' && cls.length)), ...cls];
  /* THE NOTES OPENED: #note (2026-10-17: the Berean note opens as well,
     for /p/Mark.16.9#orig) */
  if(vs && vs.querySelector('.vmark[aria-expanded="true"]')) all.push('note');
  return all.length ? '#' + all.join(',') : '';
}
function openDepth(verse, hash){
  const want = String(hash || '').replace(/^#/, '').split(/[,+]/);
  const vs = document.querySelector(`#paneinner .vs[data-v="${verse}"]`);
  if(!vs) return;
  const clauses = want.filter(w => w.startsWith('struct:')).map(w => w.slice(7));
  for(const [what, name] of Object.entries(DEPTH_NAME)){
    const b = vs.querySelector(`.tgv[data-what="${what}"]`);
    const asked = want.includes(name) || (name === 'struct' && clauses.length);
    if(b && asked && !b.classList.contains('on')) b.click();
  }
  if(want.includes('note')) vs.querySelectorAll('.vmark[aria-expanded="false"]').forEach(b => b.click());
  vs.scrollIntoView({block: 'center'});
  // the structure loads after the click: open the named clauses once it is drawn
  if(clauses.length){
    const t0 = Date.now();
    const tick = () => {
      const panel = document.querySelector(`#paneinner .vpanel[data-ref="${CSS.escape(vs.dataset.ref)}"]`);
      const rows = panel ? [...panel.querySelectorAll('.scl')] : [];
      if(!rows.length){ if(Date.now() - t0 < 10000) setTimeout(tick, 150); return; }
      rows.filter(r => clauses.includes(String(r.dataset.id).split('#').pop()) && !r.classList.contains('open'))
        .forEach(r => clauseToggle(r));
      showAddress(state.tabs.find(x => x.id === state.active));
    };
    tick();
  }
}

function fillOriginal(sec, ref){
  sec.innerHTML = (window._origHtml||{})[ref] || '<div class="vp-h">original</div>';
  sec.querySelectorAll('.ow[data-key]').forEach(w => {
    if(w.dataset.key) w.onclick = () => openSense(w.dataset.key);
  });
}

/* THE STRUCTURE, compact first. Each clause is one line: its force, its
   words, and how it connects — "fulfils 8:16", "and so", "elaborates". A
   click opens that clause's node diagram, drawn only then. 2026-09-25:
   the whole-verse diagrams are too wide to sit under a verse, so the verse's
   clauses come first and a diagram only for the clause asked about. */
/* ONE merged map of graph node id → card key, from every structure response
   fetched so far (several verses can be open at once; ids are globally
   unique). The diagram's click lines call window.structWord, which mermaid
   invokes at global scope. */
const _structKeys = {};
window.structWord = id => { const k = _structKeys[id]; if(k) openSense(k); };

let _mermaid = null;
/* SERVED FROM HERE, NOT A CDN (2026-10-01, docs/LAUNCH.md: the security
   review flagged a third-party script imported at run time, unpinnable and
   unverifiable). The file is pinned by name and checksum in
   app2/VENDORED.md, so a content security policy can allow scripts
   from this site alone. 'loose' stays: mermaid only runs click callbacks
   (a word opens its card) at that level, and the diagram text is built by
   the server from the graph, never from what a visitor types. */
const MERMAID_SRC = '/vendor/mermaid-11.17.2.min.js';
/* EACH VENDORED SCRIPT CARRIES ITS CHECKSUM (Fable's review, 2026-10-01,
   L3): the browser refuses a file whose bytes differ from the ones recorded
   in app2/VENDORED.md -- a stale or tampered copy at the proxy's cache,
   which the year-long `immutable` caching would otherwise keep serving.
   A new version is a new file name AND a new hash here. */
const SRI = {
  '/vendor/mermaid-11.17.2.min.js': 'sha256-WB7X10vZBI0OOpE2OSfXLvIpQtdyJUayf3zCnjU5Drg=',
  '/vendor/cytoscape-3.30.2.min.js': 'sha256-g+jFSmvsZVv9gd8H32BWScJor2muymel6i2lTqQtrIE=',
};
function loadScript(src){
  return new Promise((ok, fail) => {
    const s = document.createElement('script');
    if(SRI[src]) s.integrity = SRI[src];
    s.src = src; s.onload = ok; s.onerror = () => fail(new Error('could not load ' + src));
    document.head.appendChild(s);
  });
}
async function mermaidLib(){
  if(!_mermaid){
    if(!window.mermaid) await loadScript(MERMAID_SRC);
    _mermaid = window.mermaid;
    const dark = isDark();
    _mermaid.initialize({startOnLoad:false, theme: dark ? 'dark' : 'neutral',
      securityLevel:'loose',
      flowchart:{curve:'basis', nodeSpacing:24, rankSpacing:56, htmlLabels:true}});
  }
  return _mermaid;
}

/* A CLAUSE AS A VERTICAL ROLE LIST, for narrow screens: read from the
   clause's own diagram (mermaid text), so the two views cannot disagree.
   Nodes `id["label"]`, edges `a -->|"role"| b`, and `click id call
   structWord("graph id")`; what hangs under a word indents under it. */
const ROLE_NAME = {subject: 'doer', verb: 'action', object: 'acted on',
                   'prep. phrase': 'where / with', 'second object': 'second object',
                   'indirect object': 'to / for', predicate: 'is'};
function roleList(diagram){
  const label = {}, gid = {}, kids = {}, hasParent = new Set();
  for(const ln of String(diagram || '').split('\n')){
    let m;
    if((m = /^\s*(\w+)\s*(?:\(\[|\[)"(.*?)"(?:\]\)|\])\s*$/.exec(ln))) label[m[1]] = m[2];
    else if((m = /click (\w+) call structWord\("([^"]+)"\)/.exec(ln))) gid[m[1]] = m[2];
    else if((m = /^\s*(\w+)\s*-\.?->\|"([^"]*)"\|\s*(\w+)/.exec(ln))){
      // the dotted arrows too: who a pronoun is ("you" is O Israel), which on
      // a phone was the one thing the list left out (2026-10-17)
      (kids[m[1]] = kids[m[1]] || []).push([m[2], m[3]]);
      hasParent.add(m[3]);
    }
  }
  const clean = s => String(s || '').replace(/<br\/?>/g, ' · ').replace(/<[^>]+>/g, '');
  const rows = (id, depth, seen) => (kids[id] || []).map(([role, k]) => {
    if(seen.has(k)) return '';
    const r = role.split(' · ')[0];
    const name = ROLE_NAME[r] || r;
    // how a resolution was reached, as the diagram's arrow says it
    const how = / · (automated analysis|BSB reading|inferred)$/.exec(role);
    const by = !how ? '' : how[1] === 'automated analysis' ? prov('auto')
      : ` <span class="hint">(${esc(how[1])})</span>`;
    const own = `<div class="rl" style="padding-left:${depth * 14}px"><span class="rlr">${
        esc(name)}</span><span class="rlw${gid[k] ? ' rlk' : ''}"${
        gid[k] ? ` data-gid="${esc(gid[k])}"` : ''}>${esc(clean(label[k]))}${by}</span></div>`;
    return own + rows(k, depth + 1, new Set([...seen, k]));
  }).join('');
  // start under the clause's content (the "asserts" target), not the clause.
  // Found by the arrow itself: a clause that is a part of a speech turn has
  // an arrow INTO it, so "the node nothing points at" found no clause and the
  // list read "No roles recorded" (Mark 12:30 in Jesus' answer, 2026-10-17)
  const contents = Object.values(kids).flat()
    .filter(([role]) => role.startsWith('asserts')).map(x => x[1]);
  const html = contents.map(ct => rows(ct, 0, new Set([ct]))).join('');
  return html || '<div class="hint">No roles recorded for this clause.</div>';
}

async function fillStructure(sec, book, c, v){
  sec.innerHTML = `<div class="vp-h">structure</div><div class="vp-note">loading…</div>`;
  let d;
  try{ d = await api('/api/structure', {b: book, c, v}); }
  catch(e){ sec.innerHTML = `<div class="vp-h">structure</div><div class="vp-note">could not load the structure for this verse</div>`; return; }
  // merge this verse's keys into the shared map, for whichever diagram opens
  if(d.keys) Object.assign(_structKeys, d.keys);
  const status = d.worked ? `<span class="vp-status">${esc(d.worked.name)}: ${esc(d.worked.status)}</span>` : '';
  // BOTH numberings where they differ, the Berean first (the
  // structure shows either both or neither)
  const eng = (d.english || '').split(' ').pop();
  const hv = (d.ref || '').split('.').slice(1).join(':');
  const heb = eng && hv && eng !== hv ? ` · ${esc(eng)} (${esc(d.source_lang || 'Hebrew')} ${esc(hv)})` : '';
  const rows = (d.clauses||[]).map(cl => {
    const links = (cl.links||[]).filter(l => l.type !== 'next').map(l => {
      // a clause in this same verse is named by its words; elsewhere, by verse
      const short = t => { const w = String(t||'').split(' ');
        return w.slice(0, 5).join(' ') + (w.length > 5 ? '…' : ''); };
      const where = l.here ? ` “${esc(short(l.text))}”`
        : ` ${esc(l.ref)}${l.heb ? ` (Heb ${esc(l.heb)})` : ''}`;
      const what = l.group ? ` (${esc(l.kind)})` : '';
      // a link the structure sweep read, marked as model output (plan 1.34)
      const by = l.auto ? prov('auto') : '';
      if(l.dir === 'member') return `<span>${esc(l.label)} in <b>${esc(l.kind)}</b>${where}${by}</span>`;
      if(l.dir === 'in') return `<span>← ${esc(l.label)}${where}${by}</span>`;
      return `<span><b>${esc(l.label)}</b> →${where}${what}${by}</span>`;
    }).join('');
    /* WHAT THE CLAUSE SPEAKS OF: stamps and concepts a model placed on this
       clause, strongest first, shaded by strength (high / medium / low) —
       a reading, marked as one. These tags are added to the
       structure expansions in the reader, since they apply 1:1. */
    /* each tag opens its own page: where it sits in the taxonomy, the books
       that carry it, and the verses' assertions (2026-09-28: clickable
       at the clause level) */
    const tagRow = (cl.tags||[]).length ? `<div class="scl-tags">${cl.tags.map(t =>
        `<button class="ctag ${esc(t.strength)} ${esc(t.kind)}" data-tag="${esc(t.tag)}"
          title="${esc(t.kind)} · ${esc(t.strength)} · a reading — open">${
          esc(tagName(t.tag))}</button>`).join('')}<span class="ctag-by">a reading ${
        /* no reader's id on screen (2026-10-17): it was a tool's name */ provOf(cl.tags[0].reader)}</span></div>` : '';
    return `<div class="scl" data-id="${esc(cl.id)}">
      <div class="scl-top"><span class="scl-f ${esc(cl.force||'')}">${esc(cl.force||'clause')}</span>
        <span class="scl-t">${esc(cl.text)}</span></div>
      ${tagRow}
      ${links ? `<div class="scl-l">${links}</div>` : ''}
      <div class="scl-d" hidden></div></div>`;
  }).join('');
  sec.innerHTML = `<div class="vp-h">structure${heb}</div>
    <div class="vp-note">${esc(d.note||'')} ${status}</div>${rows || '<div class="vp-note">no clause layer for this verse</div>'}
    <div class="vp-note" style="margin-top:6px">The grammar of the sentence, not the
      literary design of the passage (a chiasm, an inclusio): see About.</div>`;
  /* Nothing is bound to these elements: a tab's html is saved and restored
     when the reader leaves and returns, and handlers bound here were lost
     with it — the first tag click worked and later ones did nothing
     (2026-09-29). The page-level listener (wireReaderClicks) handles tags,
     clause rows and words wherever they are drawn, and each clause's diagram
     is kept here so a restored row can still open. */
  (d.clauses||[]).forEach(cl => { _clauseDiagram[cl.id] = cl.diagram; });
}

const _clauseDiagram = {};

/* Open or close one clause of the structure view: a role list on a narrow
   screen, the diagram otherwise. */
async function clauseToggle(row){
  const box = row.querySelector('.scl-d');
  const diagram = _clauseDiagram[row.dataset.id];
  if(!box || !diagram) return;
  // decided at click time, so rotating or resizing behaves sensibly. A
  // narrow screen gets the SAME clause as a vertical role list rather than a
  // flowchart that needs width. 2026-09-29: the reader's
  // structure clauses expand in the mobile experience, given that it is
  // the user's choice to keep expanding, rendered so that
  // it is readable. (Before: step one of the structure only, and nothing opened.)
  const narrow = matchMedia('(max-width: 767px)').matches;
  const opening = box.hidden;
  box.hidden = !opening;
  row.classList.toggle('open', opening);
  if(!opening || box.dataset.drawn === (narrow ? 'list' : 'svg')) return;
  box.dataset.drawn = narrow ? 'list' : 'svg';
  if(narrow){ box.innerHTML = roleList(diagram); return; }
  box.textContent = 'drawing…';
  try{
    const m = await mermaidLib();
    const id = 'sd' + Math.random().toString(36).slice(2, 9);
    const {svg} = await m.render(id, diagram);
    box.innerHTML = svg;
    // pointer + hover cue only where the node has a card behind it; the
    // click itself is handled page-level from the node id (wireReaderClicks)
    const re = /click (\S+) call structWord\("([^"]+)"\)/g;
    let mr;
    while((mr = re.exec(diagram))){
      if(_structKeys[mr[2]]){
        box.querySelectorAll(`[id*="flowchart-${mr[1]}-"]`)
          .forEach(n => n.classList.add('sw-link'));
      }
    }
  }catch(err){ box.textContent = 'could not draw this clause'; }
}

/* ONE LISTENER FOR THE WHOLE PAGE, so what a tab restores still works:
   tag buttons, clause rows, a role list's words and a diagram's nodes. */
function wireReaderClicks(){
  document.addEventListener('click', e => {
    const tag = e.target.closest('.ctag[data-tag]');
    if(tag && !tag.onclick){ e.stopPropagation(); openTag(tag.dataset.tag); return; }
    // the major-theme map: its pages are drawn once and restored as HTML, so
    // every link on them is handled here and never by its own onclick
    const mt = e.target.closest('[data-mtheme]');
    if(mt && !mt.onclick){ e.stopPropagation(); openMajorTheme(mt.dataset.mtheme); return; }
    const tgo = e.target.closest('[data-tgo]');
    if(tgo){ e.stopPropagation(); peekAt(tgo, tgo.dataset.tgo); return; }
    // A THEME'S IMAGERY SIDE BY SIDE (plan 7.6b): its door, an image to
    // begin with, a book to filter by, and the page's own controls
    const img = e.target.closest('[data-imagery]');
    if(img){ e.stopPropagation(); e.preventDefault(); openImagery(img.dataset.imagery, {row: img.dataset.row, book: img.dataset.book}); return; }
    const ib = e.target.closest('[data-imgbook]');
    if(ib){ e.stopPropagation(); imageryFilter(ib.dataset.imgbook); return; }
    const ia = e.target.closest('[data-imgall]');
    if(ia){ e.stopPropagation();
      document.querySelectorAll('#paneinner details.imgrow').forEach(d => { if(!d.hidden) d.open = ia.dataset.imgall === 'open'; });
      return; }
    const ir = e.target.closest('[data-imgrow]');
    if(ir){ e.stopPropagation(); imageryOpenRow(ir.dataset.imgrow); return; }
    const rc = e.target.closest('[data-readch]');
    if(rc){ e.stopPropagation(); const [b, c] = rc.dataset.readch.split('|'); loadChapter(b, +c).then(() => selectTab(READER)); return; }
    const otag = e.target.closest('[data-opentag]');
    if(otag){ e.stopPropagation(); openTag(otag.dataset.opentag); return; }
    // a node graph's "+N more": open that category below and go to it
    const ct = e.target.closest('.conntab[data-conn]');
    if(ct){ e.stopPropagation(); connShow(ct.dataset.conn); return; }
    const em = e.target.closest('.entmore[data-cat]');
    if(em){
      e.stopPropagation();
      const d = [...document.querySelectorAll('#paneinner details.sec')]
        .find(x => x.dataset.sec === 'rel-' + em.dataset.cat);
      // a lane's name on a concept card turns the diagram to its list
      if(d && d.closest('.connview[hidden]')) connShow('list');
      if(d){ d.open = true; d.querySelectorAll('details.sub').forEach(s => s.open = true);
             d.scrollIntoView({block: 'start'}); }
      return;
    }
    // an event card's link to the sections stamped with its name
    const stp = e.target.closest('.link[data-pat^="stamp:"]');
    if(stp && !stp.onclick){ e.stopPropagation(); openHigherPattern(stp.dataset.pat); return; }
    // verse and record links drawn inside something opened later (a
    // connections panel, a card's lazy section, a tag's book list) lose their
    // handlers when the tab is restored; act only where one is missing
    const go = e.target.closest('[data-go]');
    if(go && !go.onclick){ e.stopPropagation(); peekAt(go, go.dataset.go); return; }
    // and a card diagram's nodes, which lost theirs the same way (A.34)
    const ent = e.target.closest('.link[data-ent],.entnode[data-ent]');
    if(ent && !ent.onclick){ e.stopPropagation(); openEntity(ent.dataset.ent); return; }
    const w = e.target.closest('.rlk[data-gid]');
    if(w){ e.stopPropagation(); structWord(w.dataset.gid); return; }
    const node = e.target.closest('.scl-d svg [id*="flowchart-"]');
    if(node){
      const row = node.closest('.scl');
      const m = /flowchart-(\w+)-/.exec(node.id);
      const dg = row && _clauseDiagram[row.dataset.id];
      const hit = m && dg && new RegExp(`click ${m[1]} call structWord\\("([^"]+)"\\)`).exec(dg);
      if(hit){ e.stopPropagation(); structWord(hit[1]); }
      return;
    }
    if(e.target.closest('.scl-d')) return;
    const row = e.target.closest('.scl[data-id]');
    if(row){
      clauseToggle(row);
      // the address names the open clause, ready to share (#struct:cl1)
      showAddress(state.tabs.find(x => x.id === state.active));
    }
  });
}

/* Line the two columns up where a Berean paragraph starts.

   2026-09-15: the verses line up vertically whenever a paragraph starts,
   with spacing on one side or the other.

   The columns cannot stay in step on their own: they are two independent
   flows, and a Berean paragraph and the original-language sentences under it
   are different heights, so they drift further apart down a chapter. This
   measures each paragraph-start pair and pads whichever side is HIGHER until
   they meet, which is exactly the "spacing on one side or the other"
   described.

   Why measure instead of restructuring into per-paragraph grid rows: the right
   column is ONE section box with brackets inside it, which was decided
   earlier the same day: just boxes at the section
   level and brackets within. Rows would cut that box into pieces.

   Padding is applied top-down and each pair is measured after the pairs above
   it have already been adjusted, so a fix never invalidates the fixes before
   it. Previous padding is cleared first, so the pass is idempotent and can
   re-run on resize. */
function alignParas(){
  const root = document.getElementById('paneinner');
  if(!root) return;
  const L = root.querySelector('.colL'), R = root.querySelector('.colR');
  if(!L || !R) return;
  root.querySelectorAll('[data-pad]').forEach(e => {
    e.style.paddingTop = ''; e.removeAttribute('data-pad');
  });
  // one column: nothing to align with (the right column is hidden, and
  // measuring a hidden box would pad the paragraphs by nonsense)
  if(!document.body.classList.contains('withcol')) return;
  const pairs = [];
  L.querySelectorAll('p.para').forEach(p => {
    const first = p.querySelector('.vs[data-ref]');
    if(!first) return;
    const r = R.querySelector(`.ovr[data-ref="${CSS.escape(first.dataset.ref)}"]`);
    const rn = r && r.querySelector('.ovn');
    if(rn) pairs.push([p, first, r, rn]);
  });
  for(const [lbox, lanchor, rbox, ranchor] of pairs){
    /* Measure the CONTENT, adjust the BOX.
       The first version measured `p.getBoundingClientRect().top` and left
       residual gaps up to 10px, from two separate mistakes:
       - it used margin-top, and a <p>'s top margin COLLAPSES with the
         preceding sibling's bottom margin, so part of the space asked for was
         silently absorbed. Padding never collapses.
       - it measured the box top, which does not move when you pad the box, so
         the correction could not be seen by the next measurement.
       Measuring the first verse span on the left and the verse number on the
       right anchors on what a reader actually sees line up. */
    const gap = lanchor.getBoundingClientRect().top
              - ranchor.getBoundingClientRect().top;
    /* Under half a pixel is sub-pixel rounding, not misalignment. Padding it
       would churn the layout on every resize for no visible gain. */
    if(Math.abs(gap) < 0.5) continue;
    /* A SECTION HEADING TRAVELS WITH ITS TEXT. 2026-09-15: the
       headings move down to just above the text below them when that text
       shifts down.

       Padding the paragraph alone left the heading where it was, so a gap
       opened between a heading and the text it introduces and the heading
       drifted toward the paragraph ABOVE it -- which reads as though it
       belongs to the wrong passage. Padding the heading instead moves both:
       the heading's box grows, the paragraph below it shifts by exactly the
       same amount, and the pair stays together. Measured on Genesis 1 the
       orphaning was 1.9px, but it scales with the drift being corrected. */
    let lower = gap > 0 ? rbox : lbox;
    if(lower === lbox){
      const h = lbox.previousElementSibling;
      if(h && h.classList.contains('sect')) lower = h;
    }
    const cur = parseFloat(getComputedStyle(lower).paddingTop) || 0;
    lower.style.paddingTop = (cur + Math.abs(gap)) + 'px';
    lower.setAttribute('data-pad', '1');
  }
}

/* The chapter head sticks BELOW the tab strip, and the strip wraps to a second
   row on a narrow window, so its height is measured rather than assumed. */
function stickyHead(){
  const t = document.getElementById('tabs');
  if(!t) return;
  // the strip sticks at -26px with 26px of padding above its tabs, so what
  // shows is its height less that padding
  document.documentElement.style.setProperty(
    '--tabsH', Math.round(t.getBoundingClientRect().height
      - (parseFloat(getComputedStyle(t).paddingTop) || 0)) + 'px');
}

/* The columns are proportional, so a width change re-wraps both and every
   measurement above goes stale. The tab strip can re-wrap on the same event,
   which moves where the chapter head has to stick. Debounced because resize
   fires continuously while a window is being dragged. */
let _alignT = null;
addEventListener('resize', () => {
  clearTimeout(_alignT);
  _alignT = setTimeout(() => { stickyHead(); alignParas(); }, 120);
});

/* Function words. Linking these would be noise -- searching "the" tells a
   reader nothing -- and they are the only words a liberal rule needs to
   exclude. */
const STOPW = new Set(('a an the and or but nor for yet so as if then than '
  + 'that this these those there here when while because since though although '
  + 'of to in on at by with from into unto upon over under above below through '
  + 'between among against before after during within without about across '
  + 'is are was were be been being am do does did done has have had having '
  + 'will would shall should may might must can could let '
  + 'i me my mine we us our ours you your yours he him his she her hers '
  + 'it its they them their theirs who whom whose which what where why how '
  + 'not no nor all any both each every few more most other some such only '
  + 'own same too very one two three s t d ll ve re m o').split(' '));

/* ONE WORD PER LINK, AND LIBERALLY. 2026-09-15: since the links populate the
   search, only single words are hyperlinked, liberally.

   The previous rule linked whole phrases taken from the ORIGINAL-language word
   groups, and measured against the search on Genesis 1 it was mostly dead:

       linked as          tested   returned nothing
       phrases              40       23   (58%)
       single words         40        0

   The failures say why. The phrase text is the interlinear GLOSS, not the
   Berean wording -- "in beginning", "(et) the heavens",
   "[was].over the.surface of.the.deep" -- so it carried MACULA's dots and
   (et) markers into a search over English and could never match, so the search sometimes
   returned no references.

   A link that goes nowhere is worse than no link, because the reader spends a
   click to learn nothing. Single content words always resolve, so every link
   now leads somewhere.

   `links` is still accepted and ignored: the server keeps sending it and other
   callers may still want it, and silently changing its meaning would be worse
   than leaving it unused. */
function linkify(text, links){
  const rx = /[A-Za-z\u2019']+/g;
  let out = '', at = 0, m;
  while((m = rx.exec(text))){
    const w = m[0];
    const bare = w.replace(/[\u2019']/g, '').toLowerCase();
    if(bare.length < 3 || STOPW.has(bare)) continue;
    out += esc(text.slice(at, m.index))
        + `<a class="ph" href="#" data-q="${esc(w)}">${esc(w)}</a>`;
    at = m.index + w.length;
  }
  return out + esc(text.slice(at));
}
/* WHAT THE PAGE SAYS AT THE VERSE, BESIDE THE BEREAN'S WORDS (2026-10-08).
   `vmarks` comes with the verse from the server (verse_marks; "marks" was
   already the theme brackets' field): "find", where
   the original reads otherwise at a word -- an asterisk at the word -- and
   "ms", the Berean's own note on the manuscripts -- a dagger at the end.
   The decision: keep Berean's words but make the note clearly marked, with
   an asterisk or equivalent right in the verse. The words are never
   changed. The word is marked in the raw text with a private-use character
   before escaping or linking, since linkify wraps each word apart and a
   finding can be several words ("they will be restrained"); a word not
   found gets its asterisk at the end, so no finding is ever dropped. */
const vmarkBtn = (kind, note) => `<button type="button" class="vmark vm-${kind}" data-vkind="${kind}"
  data-vnote="${esc(note)}" aria-label="${kind === 'ms' ? 'The Berean’s note on the manuscripts'
  : 'A note on the original'}" aria-expanded="false">${kind === 'ms' ? '†' : '*'}</button>`;
function vtext(text, marks, fmt){
  fmt = fmt || esc;
  const finds = (marks && Array.isArray(marks.find)) ? marks.find : [];
  let t = String(text == null ? '' : text);
  finds.forEach((f, i) => {
    const k = t.indexOf(f.word);
    if(k >= 0) t = t.slice(0, k + f.word.length) + String.fromCharCode(0xE000 + i) + t.slice(k + f.word.length);
  });
  let h = fmt(t);
  finds.forEach((f, i) => {
    const s = String.fromCharCode(0xE000 + i);
    h = h.includes(s) ? h.replace(s, vmarkBtn('find', f.note)) : h + vmarkBtn('find', f.note);
  });
  ((marks && marks.ms) || []).forEach(n => { h += vmarkBtn('ms', n); });
  return h;
}
/* One handler for every mark on every page, in the capture phase so a tap on
   the mark opens its note and never also opens the verse under it. */
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('.vmark');
  if(!b) return;
  e.preventDefault(); e.stopPropagation();
  const open = b.nextElementSibling && b.nextElementSibling.classList.contains('vnote');
  if(open){ b.nextElementSibling.remove(); b.setAttribute('aria-expanded', 'false'); noteAddress(b); return; }
  const n = document.createElement('span');
  n.className = 'vnote';
  n.innerHTML = `<b>${b.dataset.vkind === 'ms' ? 'The Berean’s note' : 'On the original (this site’s note)'}:</b> ${
    esc(b.dataset.vnote)}`;
  b.after(n);
  b.setAttribute('aria-expanded', 'true');
  noteAddress(b);
}, true);
/* a note opened or closed in the reader puts its verse in the address (#note) */
function noteAddress(b){
  const vs = b.closest('#paneinner .vs');
  if(!vs || !vs.dataset.c) return;
  VDEPTH = vs.querySelector('.tgv.on, .vmark[aria-expanded="true"]')
    ? {ref: vs.dataset.ref, book: state.book, c: +vs.dataset.c, v: +vs.dataset.v}
    : (VDEPTH && VDEPTH.ref === vs.dataset.ref ? null : VDEPTH);
  showAddress(state.tabs.find(x => x.id === state.active));
}
/* THE NAMED ENTRY POINT THE SEARCH NEVER HAD.

   2026-09-15: the hyperlinks in the BSB did not work either. Genesis 1
   renders 65 phrase links, every one with a handler attached, and every one
   calling `doSearch` -- which was never defined. `askPhrase()` below calls it
   too, so that was dead in the same way. The console said so plainly
   (`doSearch is not defined`) and nothing surfaced it, because an onclick
   that throws fails silently to the reader.

   Searching lives in an `input` listener on #q rather than in a function, so
   this drives the control instead of duplicating it: one search path, and the
   box visibly shows what was asked, which is also how a reader learns the box
   can be typed in. */
function doSearch(q){
  q = (q || '').trim();
  if(!q) return;
  const box = $('#q');
  if(!box) return;
  box.value = q;
  box.focus();
  box.dispatchEvent(new Event('input', {bubbles: true}));
}

/* EVERYTHING A LINK. 2026-09-30: everything is a link everywhere;
   if in doubt, link to the search to keep it simple. A name with a node opens
   the node; one without runs the search for it. `findLink` is the second. */
const findLink = (term, label) =>
  `<span class="link" data-find="${esc(term)}" title="Search for ${esc(term)}">${esc(label || term)}</span>`;
const nameLink = (id, name) => id
  ? `<span class="link" data-ent="${esc(id)}">${esc(name)}</span>` : findLink(name);
document.addEventListener('click', e => {
  const f = e.target.closest('[data-find]');
  if(f){ e.stopPropagation(); doSearch(f.dataset.find); }
  // "About says who drew it" on a reading's card
  if(e.target.closest('[data-about]')) openAbout();
});

/* THE KEYBOARD REACHES WHAT THE MOUSE DOES. The second panel of first-time
   visitors (2026-10-01, on keyboard access): a verse number, an
   underlined word or name, and a theme bracket were spans that only a pointer
   could open, and a verse's three chips stayed hidden until the number was
   pointed at -- so from the keyboard the reader could be read and nothing in
   it opened. Every such span, as it is drawn, is made focusable and named as
   what it acts as; and Enter or Space clicks it. (A verse's three links at
   its end are buttons, so they were always reachable.) */
const KEY_REACH = 'span.link, .vn:not(.vn-r), .thb';
function keyboardReach(root){
  root.querySelectorAll?.(KEY_REACH).forEach(el => {
    if(el.hasAttribute('tabindex')) return;
    el.tabIndex = 0;
    el.setAttribute('role', el.classList.contains('vn') ? 'button' : 'link');
  });
}
new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => {
  if(n.nodeType !== 1) return;
  if(n.matches(KEY_REACH)) keyboardReach(n.parentNode || n);
  keyboardReach(n);
}))).observe(document.body, {childList: true, subtree: true});
keyboardReach(document);
document.addEventListener('keydown', e => {
  if(e.key !== 'Enter' && e.key !== ' ') return;
  const el = e.target;
  if(el instanceof Element && el.matches(KEY_REACH)){
    e.preventDefault();
    el.click();
  }
});

function askPhrase(t){ doSearch(t); return false; }
window.askPhrase = askPhrase;
/* A pattern card: what it IS first, then where else it happens.

   The spec for the app, 2026-09-14: the structure, the
   stamps, and the other instances. Structure leads because it is the part
   that does not depend on the stamps being right. */
/* Named apart from the older openPattern(key), which serves the subsentence
   clause patterns. Two layers, two callers, and a later `async function
   openPattern` was silently overriding this one. */
/* WHAT THESE SHARE — mined from the structure of every section a stamp sits
   on (tools/event_profiles.py). 2026-09-29: more is revealed about the
   characteristics of this list of events.
   Each feature: how many of the sections carry it, and how much more often
   than in the same books; clicking one filters the list below to them. */
const FACET_NAME = {actions: 'Actions', doers: 'Who acts', things: 'What is acted on',
                    places: 'Places', concepts: 'Concepts'};
function profileBlock(p){
  const facets = Object.entries(p.profile || {}).filter(([, ls]) => ls.length);
  if(!facets.length) return '';
  return `<div class="sheetbox"><div class="slotname">What these ${p.sections} share</div>
    <p class="hint" style="margin:0 0 8px;max-width:62ch">What recurs across these sections
      more often than in the same books — counted from their clauses, words and
      names, not read. The share is of these sections; tap one to list only them.</p>
    ${facets.map(([f, ls]) => `<div class="rowline" style="align-items:flex-start">
      <span class="g" style="flex:0 0 130px">${esc(FACET_NAME[f] || f)}</span>
      <span>${ls.map(x => `<button class="shared" data-in="${esc(x.in.join(','))}"
        data-label="${esc(x.what)}" title="${x.sections} sections · ${x.lift}× the same books">${
        esc(x.what)} <span class="g">${Math.round(x.share * 100)}% · ${x.lift}×</span></button>`).join(' ')}
      </span></div>`).join('')}</div>`;
}

/* The list, grouped: by book (canon order), or by one of the mined groupings
   (who acts, place). A section appears once per group it belongs to. */
function instGroups(r, by, only){
  const inst = (r.instances || []).filter(x => !only || only.set.has(x.ref));
  const row = x => `<li><button class="occ" data-vref="${esc(x.ref)}"
        >${esc(prettyRef(x.ref))}</button>${x.seq ? `<button class="seqbtn"
        data-seq="${esc(x.ref)}" title="What happens here, in order">sequence →</button>` : ''}
      ${x.title ? `<span class="fill">${esc(x.title)}</span>` : ''}
      ${x.fill ? `<span class="fill">${x.fill.map(f => esc((f[1]||'') || f[0])).join(' · ')}</span>` : ''}
    </li>`;
  const groups = (r.profile && r.profile.groups) || {};
  const opts = [['book', 'Book']].concat(
    ['doers', 'places'].filter(g => groups[g]).map(g => [g, g === 'doers' ? 'Who acts' : 'Place']));
  const head = `<div class="orgbar">Organize by ${opts.map(([k, l]) =>
      `<button class="orgby${k === by ? ' on' : ''}" data-by="${k}">${l}</button>`).join('')}${
      only ? ` · only “${esc(only.label)}” (${inst.length}) <button class="clearonly">show all</button>` : ''}</div>`;
  let body;
  if(by === 'book' || !groups[by]){
    const bb = {};
    inst.forEach(x => (bb[x.book] = bb[x.book] || []).push(x));
    body = Object.entries(bb).map(([b, xs]) => sec('ib-' + b,
