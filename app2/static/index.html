      `${b.replace(/^(\d)/, '$1 ')} · ${xs.length}`, `<ul class="instlist">${xs.map(row).join('')}</ul>`,
      null, Object.keys(bb).length <= 4)).join('');
  } else {
    const seen = new Set();
    body = groups[by].map(g => {
      const xs = inst.filter(x => g.in.includes(x.ref));
      xs.forEach(x => seen.add(x.ref));
      return xs.length ? sec('ig-' + g.key, `${g.what} · ${xs.length}`,
        `<ul class="instlist">${xs.map(row).join('')}</ul>`, null, false) : '';
    }).join('');
    const rest = inst.filter(x => !seen.has(x.ref));
    if(rest.length) body += sec('ig-rest', `none of these · ${rest.length}`,
      `<ul class="instlist">${rest.map(row).join('')}</ul>`, null, false);
  }
  return head + body;
}

function openHigherPattern(id){
  if(!id) return;
  api('/api/pattern', {id}).then(r => {
    /* SAY SO WHEN THERE IS NOTHING. A bare `return` here plus the
       `.catch(() => {})` below is why the chips looked inert for so long: the
       server answered {found:false} for every `stamp:` id and the click
       produced no card, no message and no console line. A dead end the reader
       can see is a bug report; a dead end they cannot is a mystery. */
    if(!r || !r.found){
      console.warn('pattern not found:', id);
      DEEP = 'pat=' + encodeURIComponent(id);
      openTab('pat', id, `<div class="pane">
        <p class="kind">nothing recorded</p>
        <h2>${esc(id.replace(/^stamp:/, '').replace(/_/g, ' '))}</h2>
        <p class="hint">This chip has no entry behind it yet.</p>
      </div>`, null, id);
      return;
    }
    // a declared list is one card, its graph card (A.34)
    if(r.redirect){ openEntity(r.redirect); return; }
    const sc = r.scores || {};
    const form = (r.form || r.traits || []);
    const arrow = r.family === 'arc' ? ' → ' : ' + ';
    /* THE MEMBERS LEAD. A collection's members ARE the thing -- a card that
       lists where the fruit of the Spirit is mentioned without naming love,
       joy and peace has answered a different question than the one asked. */
    const members = (r.members||[]).length
      ? `<div class="sheetbox"><div class="slotname">${
           (r.members||[]).length} members${r.passage
             ? ' · ' + esc(r.passage) : ''}</div>
         <div class="memlist">${r.members.map(m =>
           `<span class="mem">${esc(String(m).replace(/_/g,' '))}</span>`
         ).join('')}</div>${r.shape
           ? `<p class="hint" style="margin:8px 0 0">moves: ${
               esc(r.shape)}</p>` : ''}</div>`
      : '';
    const body = `<div class="pane">
      <p class="kind">${esc(r.family||'pattern')}</p>
      <h2>${esc(r.label||id)}</h2>
      ${r.explain ? `<p style="max-width:64ch;margin:0 0 14px">${
          esc(r.explain)}</p>` : ''}
      ${members}
      <p class="patform">${form.map(x => `<span class="slot">${esc(x)}</span>`)
                              .join(`<span class="arr">${arrow}</span>`)}</p>
      <p class="hint">${sc.support||0} instances across ${sc.spread||0} books${
        sc.lift ? ` · lift ${sc.lift}×` : ''}${
        sc.score ? ` · score ${sc.score}` : ''}</p>
      ${r.profile ? profileBlock(r.profile) : ''}
      <p class="kind">Where else</p>
      ${/* THE VERSE OPENS HERE, NOT IN THE READER. 2026-09-16: in these verse
            lists the links were not targeted displays of the
            verses but took over the reader. The subsentence and layer
            cards were fixed for this days ago; this card was missed, so the
            one list a collection actually leads to still hijacked the
            passage the reader was in. */''}
      <div id="instbox">${instGroups(r, r.profile && r.profile.groups && r.profile.groups.doers ? 'doers' : 'book', null)}</div>
      <div class="occshow" hidden></div>
    </div>`;
    DEEP = 'pat=' + encodeURIComponent(id);
    openTab('pat', r.label || id, body, () => {
      wireLists($('#paneinner'));
      /* organize and filter: by book, by who acts, by place; a feature of
         "what these share" filters the list to the sections that have it */
      const st = {by: r.profile && r.profile.groups && r.profile.groups.doers ? 'doers' : 'book', only: null};
      const redraw = () => {
        $('#instbox').innerHTML = instGroups(r, st.by, st.only);
        $$('#paneinner .orgby').forEach(b => b.classList.toggle('on', b.dataset.by === st.by));
        $$('#paneinner .shared[data-in]').forEach(b => b.classList.toggle('on', b === st.onlyBtn));
        $$('#instbox .occ[data-vref]').forEach(b => b.onclick = () => showPlainVerse(b));
        $$('#instbox .seqbtn').forEach(b => b.onclick = () => openSequence(b.dataset.seq));
        const clr = $('#instbox .clearonly');
        if(clr) clr.onclick = () => { st.only = null; st.onlyBtn = null; redraw(); };
        // the bar is redrawn with the list, so its buttons are bound here
        $$('#instbox .orgby').forEach(b => b.onclick = () => { st.by = b.dataset.by; redraw(); });
      };
      $$('#paneinner .shared[data-in]').forEach(b => b.onclick = () => {
        const same = st.onlyBtn === b;
        st.only = same ? null : {label: b.dataset.label, set: new Set(b.dataset.in.split(','))};
        st.onlyBtn = same ? null : b;
        redraw();
      });
      redraw();
      $$('#paneinner .occ[data-vref]').forEach(b =>
        b.onclick = () => showPlainVerse(b));
      $$('#paneinner .seqbtn').forEach(b =>
        b.onclick = () => openSequence(b.dataset.seq));
      $$('#paneinner [data-go]').forEach(a => a.onclick = e => {
        e.preventDefault();
        peekAt(a, a.dataset.go);
      });
    }, id);
  }).catch(e => console.error('pattern load failed:', id, e));
}

window.loadChapter = loadChapter;

function marked(text, marks){
  if(!marks || !marks.length) return esc(text);
  let out='', at=0;
  for(const m of marks){
    if(m.start < at) continue;
    out += esc(text.slice(at, m.start));
    const key = m.strong ? (m.lang||'')[0]+String(m.strong).replace(/^0+/,'').replace(/\D/g,'') : '';
    out += `<mark class="m${m.proper?' proper':''}" data-key="${esc(key)}"
      data-word="${esc(m.word)}">${esc(text.slice(m.start,m.end))}</mark>`;
    at = m.end;
  }
  return out + esc(text.slice(at));
}

/* The mapping between the translation and the original, shown as the words in
   THEIR order with the gloss each carries. Hebrew leads with the verb and
   English does not, and seeing that is most of what looking at the original
   gives a reader who does not read it. Not an interlinear — deliberately. */
function strip(v){
  if(!v.orig || !v.orig.length) return '';
  const cells = v.orig.map(w => {
    const key = w.s ? (v.rtl?'h':'g') + String(w.s).replace(/^0+/,'').replace(/\D/g,'') : '';
    return `<span class="ow${w.p==='verb'?' verb':''}" ${key?`data-key="${esc(key)}"`:''}
      data-word="${esc(w.g||'')}"><span class="oo">${esc(w.t||'')}</span>
      <span class="og">${gloss(w.g)}</span></span>`;
  }).join('');
  return `<div class="origstrip ${v.rtl?'rtl':''}" lang="${v.rtl ? 'hbo' : 'grc'}">${
    v.rtl ? RTL_CUE : ''}${cells}</div>`;
}
// the first thing in a right-to-left row, so it sits at the row's start
const RTL_CUE = `<span class="rtlcue" title="Hebrew reads right to left" role="img"
  aria-label="reads right to left">←</span>`;

function setOpen(vEl, what, on){
  const box = vEl.querySelector('.exp.' + what);
  if(!box) return;
  box.hidden = !on;
  const btn = vEl.querySelector(`.tg[data-what="${what}"]`);
  if(btn) btn.classList.toggle('on', on);
  if(on && what === 'struct' && !box.dataset.done){
    box.dataset.done = '1';
    if(box.dataset.refs !== undefined){
      // a GROUP panel: one diagram per structured verse it holds
      const refs = (box.dataset.refs || '').split(' ').filter(Boolean);
      box.innerHTML = refs.length ? '' : '<p class="hint">No structure here.</p>';
      refs.forEach(r => {
        const slot = document.createElement('div');
        slot.className = 'gsub';
        slot.innerHTML = `<span class="gsubn">${r.split('.').pop()}</span>`;
        box.appendChild(slot);
        api('/api/unit', {ref: r}).then(d => drawStructure(slot, d));
      });
      return;
    }
    api('/api/unit', {ref: box.dataset.ref}).then(d => drawStructure(box, d));
    const pats = vEl.querySelector('.exp.pats');
    if(pats && !pats.dataset.done){
      pats.dataset.done = '1'; pats.hidden = false;
      api('/api/patterns', {ref: pats.dataset.ref}).then(d => {
        pats.innerHTML = (d.patterns||[]).slice(0,5).map(pp =>
          `<button class="pat ${esc(pp.kind)}" data-key="${esc(pp.key)}"
            title="${pp.instances} uses">${esc(pp.template)}</button>`).join('');
      });
    }
  }
}

/* The lever is a DEFAULT, not a lock: it decides what is open when a chapter
   loads, and any verse can then be opened or closed on its own. */
function applyDensity(){
  const d = document.body.dataset.density;
  document.querySelectorAll('.v').forEach(v => {
    setOpen(v, 'orig', d !== 'plain');
    setOpen(v, 'struct', d === 'structured');
  });
}

$('#paneinner').addEventListener('click', e => {
  const tg = e.target.closest('.tg');
  if(tg){
    /* In tree mode the chips sit on the group; in flow they sit on the verse.
       One handler, whichever container owns the panel. */
    const v = tg.closest('.v, .grp');
    return setOpen(v, tg.dataset.what,
                   v.querySelector('.exp.' + tg.dataset.what).hidden);
  }
  const ow = e.target.closest('.ow');
  if(ow && ow.dataset.key) return openSense(ow.dataset.key, ow.dataset.word);
  const mk = e.target.closest('mark.m');
  if(mk) return openSense(mk.dataset.key, mk.dataset.word);
  const chip = e.target.closest('.patchip');
  if(chip) return openPattern(chip.dataset.key);
  // an example verse under a pattern, on any card
  const exv = e.target.closest('.examples [data-go]');
  if(exv && !exv.onclick) return peekAt(exv, exv.dataset.go);
  const pt = e.target.closest('.pat');
  if(pt) return openPattern(pt.dataset.key);
  // the reader's verse number (.vn-r) is only a number now: its three links
  // sit at the verse's end, so it must not fall through to the passage
  // view's handler below, which expects a .v around it and threw
  const vn = e.target.closest('.vn:not(.vn-r)');
  if(vn){
    const v = vn.closest('.v');
    const b = v.querySelector('.exp.struct');
    return b ? setOpen(v, 'struct', b.hidden) : openUnit(vn.dataset.ref);
  }
});
$('#paneinner').addEventListener('keydown', e => {
  if(e.key==='Enter' && e.target.classList.contains('vn')) openUnit(e.target.dataset.ref);
});

/* ---------------- the diagram ----------------
   One renderer, and it is deliberately level-agnostic: it takes nodes and
   edges for a ref and never asks whether that ref is a verse, a sentence or a
   speech. Auto-fits its own viewBox, so it never needs a zoom control. */
const STRUCTURAL = new Set(['member','references','apposition','possessed_by']);
const slugify = s => String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');

function drawStructure(container, data){
  const N = {}; data.nodes.forEach(n => N[n.id]=n);
  const members = {}, construct = {};
  data.edges.forEach(e => {
    if(e.type==='member' && e.src && e.dst)
      (members[e.src] = members[e.src]||[]).push(e.dst);
    const r = e.dst_relation;
    if(r && e.src && r.src && r.dst) construct[e.src] = r;
  });

  /* A composite node's id is machine-made -- `heavensandearth`,
     `surfaceOfDeep`. Never show it. Rebuild the label from what the composite
     is made of, which the graph already records. */
  function label(id, depth){
    const n = N[id];
    if(!n) return '?';
    if(n.text && !n.composite) return n.text;
    const kids = members[id];
    if(kids && kids.length && (depth||0) < 2){
      const names = kids.slice(0,3).map(k => label(k,(depth||0)+1));
      return names.join(' and ') + (kids.length>3 ? ' …' : '');
    }
    const c = construct[id];
    if(c && (depth||0) < 2)
      return `${label(c.src,(depth||0)+1)} of ${label(c.dst,(depth||0)+1)}`;
    return (n.text || n.local || '?');
  }

  const events = data.edges.filter(e =>
    !STRUCTURAL.has(e.type) && !e.scopes_over && (e.src || e.dst));
  const frames = data.edges.filter(e => e.scopes_over && e.dst);

  if(!events.length){ container.innerHTML =
    '<div class="structnote">No event structure recorded for this unit.</div>'; return; }

  const PAD=16, BOXH=30, GAP=13, KIDSTEP=36;
  const fw = s => 8.1*String(s).length + 22;      // generous, so text never clips
  let y = PAD, maxX = 0, parts = [];

  const tmplOf = e => {
    const verb = slugify(e.verb || e.type);
    if(!verb) return null;
    if(e.scopes_over) return `[S] ${verb} ${slugify(e.type)} [X]`;
    return typeof e.dst === 'string' ? `[S] ${verb} [O]` : `[S] ${verb}`;
  };

  events.slice(0,6).forEach(e => {
    const sub  = e.src ? label(e.src) : '(carried over)';
    /* `adjunct` is the fallback the builder uses when a phrase modifies the
       event and no preposition could be read off it. It is machine vocabulary
       and means nothing to a reader, so it is shown as no label at all -- the
       arrow already says the phrase attaches here. */
    const raw  = e.type || e.verb || '';
    const verb = raw === 'adjunct' ? '' : raw;
    const obj  = e.dst ? label(e.dst) : '';
    const myFrames = frames.filter(f => (f.verb||'') === verb);
    const framed = myFrames.length > 0;

    /* Reserve the frame's label line BEFORE drawing, so the dashed box can
       never land on top of the event it is supposed to contain. */
    if(framed) y += 20;
    const top = y, inner = [];

    let x = PAD + (framed ? 8 : 0);
    const sw = fw(sub);
    inner.push(box(x,y,sw,sub, e.src ? (N[e.src]&&N[e.src].proper) : false, !e.src));
    x += sw;
    const vw = Math.max(fw(verb), 58);
    inner.push(arrow(x, y+BOXH/2, vw, verb));
    x += vw;
    let bottom = y + BOXH;
    if(obj){
      const ow = fw(obj);
      inner.push(box(x,y,ow,obj, N[e.dst]&&N[e.dst].proper, false));
      maxX = Math.max(maxX, x+ow);
      const kids = (members[e.dst]||[]).slice(0,5);
      let ky = y + BOXH + 14;
      kids.forEach(k => {
        const kw = fw(label(k,1));
        inner.push(`<path d="M${x+18} ${y+BOXH} V${ky+BOXH/2} H${x+36}"
          fill="none" stroke="var(--rule)" stroke-width="1"/>`);
        inner.push(box(x+36, ky, kw, label(k,1), N[k]&&N[k].proper, false, true));
        maxX = Math.max(maxX, x+36+kw);
        ky += KIDSTEP;
      });
      if(kids.length) bottom = ky - KIDSTEP + BOXH;
      x += ow;
    }
    maxX = Math.max(maxX, x);

    if(framed){
      const f = myFrames[0];
      const ft = (f.type === 'adjunct') ? '' : f.type + ' ';
      const t = `${ft}${label(f.dst)}`;
      parts.push(`<rect x="${PAD-2}" y="${top-6}" width="${maxX-PAD+18}"
        height="${bottom-top+16}" rx="3" fill="none" stroke="var(--slate)"
        stroke-width="1" stroke-dasharray="4 4" opacity=".65"/>`);
      parts.push(`<text x="${PAD+2}" y="${top-13}" fill="var(--slate)"
        font-family="IBM Plex Mono, monospace" font-size="10"
        letter-spacing=".1em">${esc(t.toUpperCase())}</text>`);
    }
    parts.push(inner.join(''));

    /* The pattern sits ON the event that instantiates it, not in a list under
       the verse — so you can see which part of the sentence is the recurring
       shape. Only patterns clearing the surprise gate are marked. */
    const tm = tmplOf(e), pt = tm && (data.patterns||{})[tm];
    if(pt){
      const lbl = `${tm}  ${pt.instances}×`;
      const w = 6.6*lbl.length + 18;
      parts.push(`<g class="patchip" data-key="${pt.key}" style="cursor:pointer">
        <rect x="${PAD}" y="${bottom+6}" width="${w}" height="19" rx="9.5"
          fill="none" stroke="var(--ochre)" stroke-width="1" opacity=".75"/>
        <text x="${PAD+9}" y="${bottom+19}" fill="var(--ochre)"
          font-family="IBM Plex Mono, monospace" font-size="10.5">${esc(lbl)}</text>
      </g>`);
      bottom += 24;
    }
    y = bottom + 30;
  });

  const W = Math.max(maxX+PAD+8, 300), H = y;
  container.innerHTML = `<div class="sheetbox">
    <svg viewBox="0 0 ${W} ${H}" width="${Math.min(W,760)}"
         role="img" aria-label="Structure of ${esc(data.ref)}">${parts.join('')}</svg>
    <div class="structnote">${data.ref} · ${events.length} event${events.length===1?'':'s'}${
      frames.length?` · ${frames.length} framing`:''}</div></div>`;

  function box(x,y,w,t,proper,unstated,small){
    const fill = proper ? 'var(--ochre-soft)' : 'var(--surface)';
    const stroke = proper ? 'var(--ochre)' : 'var(--rule)';
    return `<rect x="${x}" y="${y}" width="${w-GAP}" height="${BOXH}" rx="3"
      fill="${fill}" stroke="${stroke}" stroke-width="1"
      ${unstated?'stroke-dasharray="3 3"':''}/>
      <text x="${x+(w-GAP)/2}" y="${y+BOXH/2+5}" text-anchor="middle"
      fill="${unstated?'var(--muted)':'var(--ink)'}" font-family="Spectral, serif"
      font-size="${small?13:14.5}">${esc(t)}</text>`;
  }
  function arrow(x,cy,w,t){
    return `<line x1="${x}" y1="${cy}" x2="${x+w-GAP-6}" y2="${cy}"
      stroke="var(--ink)" stroke-width="1"/>
      <polygon points="${x+w-GAP},${cy} ${x+w-GAP-7},${cy-3.5} ${x+w-GAP-7},${cy+3.5}"
      fill="var(--ink)"/>
      <text x="${x+(w-GAP)/2}" y="${cy-7}" text-anchor="middle" fill="var(--ink)"
      font-family="Spectral, serif" font-style="italic" font-size="13.5">${esc(t)}</text>`;
  }
}

/* Patterns are discovered FROM the passage you are reading, not from a
   catalogue. That is how anyone actually notices one. */
async function drawAllPatterns(){
  const boxes = [...document.querySelectorAll('.pats')].filter(b => !b.dataset.done);
  for(const b of boxes.slice(0,40)){
    b.dataset.done = '1';
    try{
      const d = await api('/api/patterns', {ref:b.dataset.ref});
      if(!d.patterns.length) continue;
      b.innerHTML = d.patterns.filter(p => p.distinctive !== false).slice(0,5).map(p =>
        `<button class="pat ${esc(p.kind)}" data-key="${esc(p.key)}"
          title="${p.instances} uses">${esc(p.template)}</button>`).join('');
    }catch(err){}
  }
}

async function drawAllStructures(){
  const boxes = [...document.querySelectorAll('.struct')].filter(b => !b.dataset.done);
  for(const b of boxes.slice(0,40)){
    b.dataset.done='1';
    try{ drawStructure(b, await api('/api/unit',{ref:b.dataset.ref})); }
    catch(err){ b.innerHTML=''; }
  }
}

/* ---------------- card stack ---------------- */
/* The right pane is for FINDING and the tabs are for STUDYING. Splitting by
   size was arbitrary and invisible to anyone using it; splitting by what the
   surface is FOR can be said in one sentence and has no exceptions. */
function pushCard(title, kind, html){ openTab('card', title, html); }
function wireCard(){
  $('#paneinner').querySelectorAll('details.sec').forEach(d => {
    if(openSecs.has(d.dataset.sec)) d.open = true;
    d.addEventListener('toggle', () => {
      d.open ? openSecs.add(d.dataset.sec) : openSecs.delete(d.dataset.sec);
      mem.set('open', [...openSecs]);
    });
  });
  $('#paneinner').querySelectorAll('.cite').forEach(c => {
    c.onclick = () => peekAt(c, c.dataset.ref);
  });
  // a neighbouring word pushes another card: the dive has no floor
  $('#paneinner').querySelectorAll('.link').forEach(l => {
    l.onclick = () => l.dataset.ent ? openEntity(l.dataset.ent)
                    : l.dataset.go ? peekAt(l, l.dataset.go)
                    : l.dataset.pat ? (l.dataset.pat.startsWith('stamp:')
                                         ? openHigherPattern(l.dataset.pat)
                                         : openPattern(l.dataset.pat))
                    : openSense(l.dataset.key, l.dataset.word);
  });
}
/* Every section of every pane is a fold: the want was contents with
   tree-like collapsability and expandability. A
   count on the summary lets a branch say how much is inside before you open
   it, which is most of what a tree is for, and the open/closed state is
   remembered so a reader's habits become their default. */
/* A LIST THAT IS LONGER THAN THE PAGE NEEDS A WAY THROUGH IT.
   2026-09-16: whenever the length of any of these lists exceeds the
   display, offer a more on the bottom or a more sophisticated navigation
   through, as well as a simple text match filter.

   One block used by every list, because the alternative is four different
   behaviours for four lists that look identical. It shows a page at a time,
   filters on plain text as you type, and says what it is not showing — a list
   that silently stops at twenty is the same fault as the pattern card
   claiming 224 uses and rendering 60.

   The filter runs over rows already in the DOM, so it is instant and needs no
   request; when the server sent fewer rows than exist, the count line says so
   rather than letting the filter imply it searched everything. */
const LB_PAGE = 15;
/* Each list remembers how to ask the server for its next page, and how to
   render a row, so "Show more" can reach past the page it was sent. */
const LB_MK = new WeakMap();
function listBlock(items, mk, total, cls, src){
  if(!items.length) return '<div style="color:var(--muted)">Nothing yet.</div>';
  /* NO FILTER ON A PARTIAL LIST. 2026-09-16: if the filter cannot cover more
     than the 24 shown, do not offer it.

     Several of these lists are a page the server chose out of thousands. The
     first version showed the box anyway and labelled it honestly — "filter the
     24 shown (of 6,242)" — which is still the wrong offer: a reader types a
     word, gets nothing, and cannot tell whether the corpus lacks it or the box
     never looked. A control that can only disappoint should not be there.
     The count line still says the list is partial. */
  const partial = (total || items.length) > items.length;
  const long = items.length > LB_PAGE && !partial;
  /* THE TRUE TOTAL TRAVELS WITH THE LIST. 2026-09-18: show more was reported not
     working under 'Themes with their evidence'. It was firing, and that was
     the problem: the header said 30, the server had sent 20, and the footer
     counted the rows in the DOM — so it read "showing 20 of 20", the button
     hid itself, and ten themes were unreachable behind a line claiming
     everything was on screen.

     A footer that counts what it can see cannot report what it was not sent.
     `data-total` carries the real figure so the count line can say what is
     missing instead of rounding the list down to whatever arrived. */
  const id = 'lb' + (listBlock.n = (listBlock.n || 0) + 1);
  LB_MK.set(listBlock, LB_MK.get(listBlock) || {});
  LB_MK.get(listBlock)[id] = mk;
  return `<div class="lb ${cls || ''}" data-total="${total || items.length}"${
      src ? ` data-src="${esc(src)}"` : ''} data-mk="${id}">
    ${long ? `<input class="lbf" type="search" placeholder="filter ${
        items.length} …" aria-label="Filter list">` : ''}
    <div class="lbrows">${items.map((it, i) =>
      `<div class="lbrow"${i >= LB_PAGE ? ' hidden' : ''}>${mk(it)}</div>`
    ).join('')}</div>
    <div class="lbfoot"${items.length > LB_PAGE || partial ? '' : ' hidden'}>
      <button class="lbmore">Show more</button>
      <span class="lbcount hint"></span></div>
  </div>`;
}

/* Re-runs after any filter or page change so the footer never disagrees with
   what is on screen. */
function lbSync(lb){
  const rows = [...lb.querySelectorAll('.lbrow')];
  const q = (lb.querySelector('.lbf')?.value || '').trim().toLowerCase();
  const match = rows.filter(r => !q || r.textContent.toLowerCase().includes(q));
  const shown = +(lb.dataset.shown || LB_PAGE);
  rows.forEach(r => { r.hidden = true; });
  match.slice(0, shown).forEach(r => { r.hidden = false; });
  const more = lb.querySelector('.lbmore');
  const left = Math.max(0, match.length - shown);
  /* A FETCHABLE LIST KEEPS ITS BUTTON while the server still has rows. The
     old test hid it as soon as the rows in the DOM ran out, which on a
     server-cut list meant hiding it one click in with thousands unread. */
  const total = +(lb.dataset.total || rows.length);
  const fetchable = !q && lb.dataset.src && total > rows.length;
  if(more) more.hidden = left === 0 && !fetchable;
  const c = lb.querySelector('.lbcount');
  /* When the server sent fewer rows than exist, say so here. Without it the
     footer reads "showing 20 of 20" on a list the header calls 30, which is
     the exact fault this block was written to prevent -- a list that stops
     silently and looks complete. A filter narrows what arrived, so while one
     is typed the count is about the matches and the shortfall is not implied
     to have been searched. */
  /* With paging the shortfall is REACHABLE, so the count is stated against
     the whole list rather than against the page that happens to be loaded —
     "showing 15 of 2,516", not "15 of 20 of 2516". A list with no source
     keeps the old wording, because there the rest really is out of reach. */
  const paged = !q && lb.dataset.src && total > rows.length;
  const against = paged ? total : match.length;
  const short = !q && !lb.dataset.src && total > rows.length
    ? ` (${total - rows.length} more not loaded)` : '';
  if(c) c.textContent = match.length
    ? `showing ${Math.min(shown, match.length)} of ${
        against.toLocaleString()}${q ? ' matching' : ''}${short}`
    : 'nothing matches';
}

function wireLists(root){
  (root || document).querySelectorAll('.lb').forEach(lb => {
    if(lb.dataset.wired) return;
    lb.dataset.wired = '1';
    lb.dataset.shown = LB_PAGE;
    const f = lb.querySelector('.lbf');
    if(f) f.addEventListener('input', () => {
      lb.dataset.shown = LB_PAGE;   /* a new query starts at the top */
      lbSync(lb);
    });
    const m = lb.querySelector('.lbmore');
    if(m) m.onclick = async () => {
      const rows = lb.querySelectorAll('.lbrow').length;
      const total = +(lb.dataset.total || rows);
      /* FETCH BEFORE REVEALING, when there is nothing left to reveal. The
         button used to only unhide rows that were already here, so on a list
         the server had cut to 20 out of 2,516 one click exhausted it and it
         removed itself — which is what "not working" looked like. */
      if(+lb.dataset.shown >= rows && total > rows && lb.dataset.src){
        m.disabled = true;
        const was = m.textContent;
        m.textContent = 'Loading…';
        try{
          const sep = lb.dataset.src.includes('?') ? '&' : '?';
          const r = await fetch(`${lb.dataset.src}${sep}offset=${rows}&limit=50`)
            .then(x => x.json());
          const mk = (LB_MK.get(listBlock) || {})[lb.dataset.mk];
          const box = lb.querySelector('.lbrows');
          (r.items || []).forEach(it => {
            const div = document.createElement('div');
            div.className = 'lbrow';
            div.innerHTML = mk ? mk(it) : esc(it.title || '');
            box.appendChild(div);
          });
        }catch(err){ /* leave the count honest and let the reader retry */ }
        m.textContent = was;
        m.disabled = false;
      }
      lb.dataset.shown = +lb.dataset.shown + 25;
      lbSync(lb);
    };
    lbSync(lb);
  });
}

document.addEventListener('toggle', e => {
  /* Rows inside a closed <details> have no layout, and a list opened for the
     first time must size itself then. */
  if(e.target.tagName === 'DETAILS' && e.target.open) wireLists(e.target);
}, true);

/* "+N MORE" OPENS THE REST, never just names the shortfall. 2026-09-30:
   a "+21 more" makes the list expandable. The first n
   render; the rest sit in an inline fold whose summary is the count. */
function moreJoin(items, n, render, sep){
  sep = sep === undefined ? ' · ' : sep;
  const head = items.slice(0, n).map(render).join(sep);
  if(items.length <= n) return head;
  return head + ` <details class="moreinl"><summary>+${items.length - n} more</summary>${
    sep.trim() ? sep : ''}${items.slice(n).map(render).join(sep)}</details>`;
}

/* WHAT A CLOSED HEADING PREVIEWS (the card-sections review, 2026-10-13): the
   first names inside it, so "Kinship 26" says "Jesse · Solomon · Absalom ..."
   before a tap. Baymard: collapse into a readable summary, not a bare header. */
function pvOf(items, n){
  const names = [...new Set(items.map(it => it.name).filter(Boolean))].slice(0, n || 8);
  return names.length ? `<span class="pv">${names.map(esc).join(' · ')}</span>` : '';
}
function sec(id, label, body, count, open, preview){
  let c = (count === undefined || count === null) ? ''
    : `<span class="ct">${count}</span>`;
  /* A COUNT IS PRINTED ONCE. The UI committee, 2026-09-30: "SPEECH ACTS
     SPOKEN IN IT · 3 3" on every pattern card -- the label carried the count
     and so did the badge. The badge wins; the label's copy is dropped. */
  if(c) label = String(label).replace(new RegExp(` · ${count}$`), '');
  // ...and a count written into the label (" · 12", " · 13 kinds") is one
  // count too: it moves to the badge, in one style (the review found three)
  else {
    const m = /^(.*?) · ([\d,]+(?: [a-z]+)?)$/.exec(String(label));
    if(m){ label = m[1]; c = `<span class="ct">${m[2]}</span>`; }
  }
  const isOpen = open !== undefined ? open : openSecs.has(id);
  return `<details class="sec" data-sec="${id}"${isOpen ? ' open' : ''}>
    <summary>${esc(label)}${c}${preview ? `<span class="pv">${esc(preview)}</span>` : ''}</summary>
    <div class="body">${body}</div></details>`;
}
/* THE DESCRIPTIONS' MARKUP, RENDERED. The UI committee, 2026-09-30: 384
   descriptions printed `**` literally, 375 a `--` for a dash, 101 `*italic*`,
   and some a raw `[[id]]` link -- love's card opened on asterisks. Escaped
   first, then the four marks; `links` false gives plain text for a search row
   (a link inside a clickable row would be a second target). */
function mdLite(s, links){
  let h = esc(String(s || ''));
  h = h.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
       .replace(/(^|[^*\w])\*([^*\n]+?)\*(?![*\w])/g, '$1<i>$2</i>')
       .replace(/ -- /g, ' — ').replace(/--/g, '—')
       .replace(/\[\[([a-z0-9_]+)\]\]/g, (m, id) => links === false
         ? id.replace(/_/g, ' ')
         : `<span class="link" data-ent="${id}">${id.replace(/_/g, ' ')}</span>`);
  return h;
}
const plural = (n, one, many) => `${(n || 0).toLocaleString()} ${n === 1 ? one : (many || one + 's')}`;
// a description as paragraphs, each a lead
const leadHtml = s => String(s || '').split(/\n\s*\n/).filter(p => p.trim())
  .map(p => `<p class="lead">${mdLite(p)}</p>`).join('') || '<p class="lead"></p>';
const cites = refs => `<div class="cites">${(refs||[]).map(r =>
  `<span class="cite" data-ref="${esc(r)}">${esc(prettyRef(r))}</span>`).join('')}</div>`;
const prettyRef = r => String(r).replace(/\./g, m => '.').replace(/^([\w]+)\.(\d+)\.(\d+)$/, '$1 $2:$3');

/* ---------------- cards ---------------- */
async function openSense(key, word){
  if(!key) return;
  const d = await api('/api/sense', {key});
  if(!d.found){
    return openTab('word', word, `<div class="pane">
      <p class="kind">Word</p><h1>${esc(word)}</h1>
      <p class="lead">No profile yet — this word appears too rarely for the text
      to say much about it on its own.</p></div>`);
  }

  /* The word IN A PHRASE first. A list of properties tells you about a word;
     phrases show it working, which is how anyone actually learns one. */
  /* THE ORIGINAL FIRST, THE ENGLISH UNDER IT. 2026-09-15: clicking on
     the reference box showed what was already visible, and in the case of
     fellowship it was hard to see how the word fit into several of the
     examples, so the original language sequence is primary instead of the
     English emphasizing the word that is linked on.

     The English cannot show what the examples have in common, because the
     translation changes with context: κοινωνία is "fellowship",
     "contribution" and "participation" across three of its own examples, and
     the highlight failed entirely on 6 of the 8. The original is the constant
     -- the same word is visibly there every time -- so it leads, with the word
     itself marked, and the English stays beneath as the reading. */
  /* EVERY BOX, AND THE VERSE ON CLICK. 2026-09-15: Words in a Phrase was
     the one with the redundancy and it typically only got through a few
     references in Matthew (for Greek) as it comes first. So all the boxes
     show on expanding, and a click on one shows the
     verse.

     The old card printed the first 8 occurrences in canonical order with their
     full text, which failed twice over: for a common Greek word all eight were
     Matthew, so the range was invisible; and eight verses of English mostly
     repeated what the reader already had in front of them.

     Refs are cheap, so all of them show. The verse costs a request and is
     fetched only when a box is opened. */
  const occ = d.occurrences || {rows: [], total: 0};
  const ph = occ.rows.length
    ? `<p class="hint" style="margin:0 0 8px">${occ.total} occurrence${
         occ.total === 1 ? '' : 's'} across ${occ.books} book${
         occ.books === 1 ? '' : 's'}${
         occ.shown < occ.total
           ? ` · showing ${occ.shown}, spread across the books` : ''
       } — click a reference for the verse.</p>
       ${listBlock(occ.rows, r =>
           `<button class="occ" data-ref="${esc(r.ref)}" data-key="${esc(key)}"
              >${esc(prettyRef(r.ref))}</button>`, occ.total, 'chips')}
       <div class="occshow" hidden></div>`
    : '<div style="color:var(--muted)">No examples found.</div>';

  /* Expandability becomes crucial with so much content. So the
     features fold again by KIND -- what it stands beside, what is done to it,
     what it does -- because fourteen lines of mixed kinds is a wall and three
     labelled branches is a tree. */
  const byKind = {};
  d.features.forEach(f => (byKind[f.says] = byKind[f.says] || []).push(f));
  const feats = Object.entries(byKind)
    .sort((a,b) => b[1].length - a[1].length)
    .map(([says, items]) => `<details class="sub" ${items.length <= 4 ? 'open' : ''}>
      <summary>${esc(says)}<span class="ct">${items.length}</span></summary>
      <div class="subbody">${items.map(f => `<div class="feat">
        <div class="says"><b>${f.quoted ? '“'+esc(f.with)+'”' : esc(f.with||'')}</b>
          <span style="color:var(--muted);font-size:13px"> · ${f.count}×</span></div>
        ${cites(f.refs)}</div>`).join('')}</div></details>`).join('');

  const near = (d.neighbours||[]).map(n => `<div class="rowline">
      <span class="link" data-key="${esc(n.key)}" data-word="${esc(n.gloss||'')}"
        >${esc(n.gloss||n.key)}</span>
      <span class="g">${n.observations} uses · ${n.score.toFixed(3)}</span></div>`
    ).join('') || '<div style="color:var(--muted)">Too few uses to compare.</div>';

  const gram = (d.grammar||[]).map(g => `<div class="rowline">
      <span class="g">${esc(g.field)}</span>
      <span>${g.values.map(v => `${esc(v.v)} <span class="g">(${v.n})</span>`)
        .join(' · ')}</span></div>`).join('');

  const lxx = (d.lxx||[]).map(x => `<span class="pill">${findLink(x.word)} · ${x.n}</span>`)
    .join('');

  const contr = (d.contrasts||[]).map(c => `<div class="rowline">
      <span>${esc(c.a === (d.gloss||'').toLowerCase() ? c.b : c.a)}</span>
      <span class="g">${esc(c.kind)} · ${c.count}×</span></div>`).join('')
      || '<div style="color:var(--muted)">Nothing recorded yet.</div>';

  /* What this word DOES, for a verb. Only a narrative form has events -- the
     Hebrew wayyiqtol, the Greek aorist indicative -- so a noun shows nothing
     here and that is correct rather than missing. */
  const a = d.acts;
  const acts = !a ? '' : sec('w-acts', 'What happens when this word is used',
    `<p style="margin:0 0 10px;color:var(--muted)">Recorded ${a.count} times as
       something that happens, across ${a.verses} verses.</p>
     ${a.agents.length ? `<div class="rowline"><span>who does it</span>
       <span class="g">${a.agents.map(x => `<span class="heb">${esc(x.lemma)}</span> ${x.n}×`).join(' · ')}</span></div>` : ''}
     ${/* THE REF OPENS THE VERSE. 2026-09-15: for verbs this was
           confusing and the verse hyperlinks did not work; showing in the
           verse would help.

           Both, and the dead link was a wiring mismatch rather than missing
           data: these were rendered as `.link` elements carrying `data-ref`,
           while every `.link` on the card is wired to
           openSense(dataset.key, dataset.word) -- and with no key it returned
           on its first line. Silent, like the chips.

           They are now the same reference boxes the word-in-a-phrase section
           uses, so the verse opens underneath with the verb marked in the
           original. A grammatical row -- "abused, adv, pp" -- means very
           little without the sentence it came from. */''}
     ${a.examples.map(e => `<div class="vex">
        <div class="rowline">
          <button class="occ" data-ref="${esc(e.ref)}" data-key="${esc(key)}"
            >${esc(prettyRef(e.ref))}</button>
          <span>${esc(e.gloss||'')}</span>
          <span class="g">${Object.entries(e.participants||{})
            .map(([r, v]) => `${esc(r)}: <span class="heb">${esc(v.join(', '))}</span>`).join(' · ')}</span>
        </div>
        <div class="occshow" hidden></div>
      </div>`).join('')}
     <p style="color:var(--muted);font-size:13.5px;margin:10px 0 0;max-width:62ch">
       Read off the grammar, not inferred: the form the language uses to carry a
       story forward. Who did it is the clause's own subject.</p>`,
    a.count);

  /* The verbs it behaves like. Unnamed unless the members share a gloss word --
     naming a class is a ruling, not a computation. */
  const vc = d.verb_class;
  const vclass = !vc ? '' : sec('w-class',
    'Verbs it behaves like' + (vc.name ? ` — ${vc.name}` : ''),
    `<div class="uses">${vc.glosses.map(g => `<span class="chip">${esc(g)}</span>`).join('')}</div>
     <p style="color:var(--muted);font-size:13.5px;margin:10px 0 0;max-width:62ch">
       Grouped by the company they keep and by MACULA&rsquo;s gloss${vc.name ? ''
       : ', and left unnamed on purpose — these share a sense but no word, which is exactly the kind of class a label would have to be ruled on'}.</p>`,
    vc.size);

  openTab('word', d.short || d.gloss || word, `<div class="pane">
    <p class="kind">${esc(d.lang||'')} · ${d.observations} uses ·
      Strong’s ${esc((d.key||'').slice(0,1).toUpperCase() + (d.strong||''))}</p>
    ${/* THE WORD IS NAMED BY ITS MEANING, not by one of its renderings.
          2026-09-25, on הָיָה: the card was titled "he was" — the
          commonest gloss across its uses, from narrative — so a verb meaning
          "to be, become" read as though it named a person. The lexicon's
          short sense heads the card; the commonest rendering follows it. */''}
    <h1>${d.lemma ? `<span class="heb">${esc(d.lemma)}</span> ` : ''}${esc(d.short||d.gloss||word)}</h1>
    <p class="lead">${d.translit ? `<span class="translit">${esc(d.translit)}</span>` : ''}${
      d.gloss && d.short && d.gloss !== d.short
        ? ` · most often rendered “${esc(d.gloss)}”` : ''}</p>
    ${/* A WORD'S NOTE, where how it is used needs saying first (the words for
          "Jew", 2026-10-10), with the card it belongs to */''}
    ${d.note ? `<p class="lead" style="max-width:64ch;color:var(--ink)">${esc(d.note.text)}</p>${
      d.note.card ? `<a class="hubhero link" href="#" data-ent="${esc(d.note.card)}">${esc(d.note.card_label || 'The card')} →</a>` : ''}` : ''}
    ${/* THE BRIDGE TO THE CONCEPT (2026-10-09: a natural
          bridge from the language card to the concept card, as the concept
          card is far richer; this is the love hub): the concept cards
          that list this word, right under its name */''}
    ${(d.concepts || []).length ? `<a class="hubhero link" href="#" data-ent="${esc(d.concepts[0].id)}">
        What the text says of ${esc(d.concepts[0].name)} →</a>${d.concepts.length > 1
        ? `<p class="hint" style="margin:4px 0 10px">Also: ${d.concepts.slice(1).map(c =>
            `<span class="link" data-ent="${esc(c.id)}">${esc(c.name)}</span>`).join(' · ')}</p>` : ''}` : ''}
    ${/* THE GREEK LEADS HERE TOO. 2026-09-19: when drilling in to the
          word, the Greek equivalent is displayed prominently
          there. It was already on the card and buried in a collapsed section
          near the bottom, which is the same as not being there — and it is
          the one field that lets a Hebrew word be compared with a Greek one
          at all, so it belongs beside the word rather than under it. */''}
    ${/* THE EQUIVALENTS AS WORD NODES, not as bare strings. 2026-09-19:
          the Greek chips carry the original and phonetic and English
          label, clickable for each word offered.

          Same shape as the reader's own word node, so a Greek equivalent is
          the same kind of object as the Hebrew it sits beside, and clicking
          one opens its card.

          The two rows say different things on purpose. Greek is what the
          SEPTUAGINT USED — a translator's decision recorded in MACULA, an
          alignment. Aramaic is what the Bible's ARAMAIC PASSAGES USE with the
          same consonants — a cognate observed in the text, not a translation
          of this word. Showing them identically would dress the weaker claim
          as the stronger one. */''}
    ${/* A WORD THE TEXT SPELLS RATHER THAN TRANSLATES. 2026-09-19:
          support for language switches within the verse
          in the reader.

          It already is, in the data: where MACULA's gloss IS the
          transliteration, the translators wrote the sound instead of the
          sense. And the New Testament glosses its own — ἀββά is followed by
          ὁ πατήρ in all three of its occurrences — so what it means comes
          from the text rather than from a lexicon, and the card says which. */''}
    ${d.loan ? `<p class="loanline">
      <span class="tag">not translated — spelled</span>
      ${d.loan.means ? `the text reads it
        <b>${esc(d.loan.means.gloss)}</b> (${esc(d.loan.means.lemma)}) in all
        ${d.loan.n} of its occurrences` : `the New Testament writes the sound,
        not the sense — ${d.loan.n} occurrence${d.loan.n === 1 ? '' : 's'}`}

    ${(d.equiv && d.equiv.greek || []).length ? `<div class="eqrow">
      <span class="g">Septuagint used</span>
      ${d.equiv.greek.map(w => `<button class="eqnode${w.key ? '' : ' dead'}"
        ${w.key ? `data-sense="${esc(w.key)}"` : 'disabled'}>
        ${origLine([{t: w.t, x: w.x, g: w.g}], false, false)}
        <span class="n">${w.n}</span></button>`).join('')}
      <span class="hint">an alignment recorded in the data, not a guess</span>
