        if(r.verse) jumpTo(`${r.id}.${r.chapter||1}.${r.verse}`);
        else loadChapter(r.id, r.chapter||1);
      }
      else if(r.kind==='entity') openEntity(r.id);
      else if(r.kind==='mtheme') openMajorTheme(r.id);
      /* Patterns arrive from the search now, and the two kinds open different
         cards: a clause template is keyed, a node shape is its own shape
         string. Routing both through one opener would silently return
         nothing, which is how the chips stayed broken for weeks. */
      else if(r.kind==='pattern') openPattern(r.id);
      else if(r.kind==='node') openLayerItem('node', r.id);
      // the Patterns section (M-D17): a literary device opens its card, a
      // set opens where it stands in Explore
      else if(r.kind==='stamp') openHigherPattern(r.id);
      else if(r.kind==='pset') openPatternSet(r.id);
      else openSense(r.id, r.title);
    });
  }, 160);
});

/* THE KEYBOARD WALKS THE SUGGESTIONS. 2026-10-01: the top
   option is highlighted by default, tab/shift-tab move through the list
   forward/backward, and enter opens the chosen one. The
   arrows do the same; Escape closes the list. The focus stays in the box,
   so typing on refines the list. */
let SEARCH_I = 0, SEARCH_ENTER = false;
function searchSel(i){
  const bs = [...$('#results').querySelectorAll('button')];
  if(!bs.length) return;
  SEARCH_I = (i + bs.length) % bs.length;
  bs.forEach((b, k) => b.classList.toggle('sel', k === SEARCH_I));
  bs[SEARCH_I].scrollIntoView({block: 'nearest'});
}
$('#q').addEventListener('keydown', e => {
  const open = !$('#results').hidden && $('#results').querySelector('button');
  /* ENTER BEFORE THE LIST ARRIVES. Typing "Heb 1:3" and pressing Enter at
     once did nothing (2026-10-03): the list comes 160 ms after the last key
     plus the request, so Enter found no list. It is remembered instead, and
     the list opens its top row when it lands. */
  if(!open && e.key === 'Enter' && $('#q').value.trim().length >= 2){
    e.preventDefault();
    SEARCH_ENTER = true;
    return;
  }
  if(!open) return;
  if(e.key === 'Tab' || e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    e.preventDefault();
    searchSel(SEARCH_I + ((e.key === 'Tab' && e.shiftKey) || e.key === 'ArrowUp' ? -1 : 1));
  } else if(e.key === 'Enter'){
    e.preventDefault();
    const b = $('#results').querySelectorAll('button')[SEARCH_I];
    if(b) b.click();
  } else if(e.key === 'Escape'){
    $('#results').hidden = true;
  }
});

let BOOKMAP = {}, BOOKS = [];
function goRef(book, ch){

/* ---------------- the selector ---------------- */
/* Fill the chapter list for whichever book the BOOK PICKER shows, which is
   not always the book on screen -- while browsing the picker they differ on
   purpose. Keyed on the book too, since two books can share a chapter count
   and a length test alone would leave the previous book's list standing. */
/* `prompt` puts an unselectable placeholder at the top and leaves it showing.
   2026-09-14: chapter 1 of a new book could not be selected because
   the list assumed no change. Refilling the list left it sitting
   on Chapter 1, so choosing Chapter 1 fired no `change` event and the commonest
   move in the app -- open a new book at its beginning -- did nothing.

   A select can only report a CHANGE, so after picking a book it must rest on
   something that is not a chapter. Then every chapter, one included, is a
   change. */
function fillChapters(prompt){
  const bp = $('#bookpick'), cp = $('#chappick');
  const bk = BOOKS.find(x => x.id === bp.value);
  const n = bk ? bk.chapters : 0;
  const want = bp.value + (prompt ? '?' : '');
  if(cp.dataset.fill !== want){
    cp.innerHTML = (prompt ? `<option value="">Chapter…</option>` : '')
      + Array.from({length:n}, (_,i) =>
          `<option value="${i+1}">Chapter ${i+1}</option>`).join('');
    cp.dataset.fill = want;
    if(prompt) cp.value = '';
  }
}
function syncPicker(){
  const bp = $('#bookpick'), cp = $('#chappick');
  if(bp.value !== state.book) bp.value = state.book;
  fillChapters(false);
  cp.value = state.chapter;
}
function buildPicker(){
  $('#bookpick').innerHTML = BOOKS.map(b =>
    `<option value="${b.id}">${esc(b.title)}</option>`).join('');
  /* Choosing a book REFILLS the chapter list and does not navigate.
     2026-09-14: selecting another book had opened chapter 1
     without intent. A book is not a destination -- picking one is how
     you get at its chapters, and jumping on the first half of a two-part
     choice takes the reader somewhere they did not ask to go. Navigation
     happens when a chapter is chosen. */
  /* Returning to the book already open shows its real chapter list and
     restores the chapter being read -- otherwise the list would rest on
     Chapter 1 while the reader is at chapter 5, and choosing Chapter 1 would
     again be a non-change. */
  $('#bookpick').onchange = e => {
    const away = e.target.value !== state.book;
    fillChapters(away);
    if(!away) $('#chappick').value = state.chapter;
  };
  $('#chappick').onchange = e => { if(e.target.value)
      loadChapter($('#bookpick').value, +e.target.value); };
}

    ${sec('a-principles', 'Principles', `
      <p style="max-width:64ch"><b>Built from the text.</b> Every connection

    ${sec('a-floor', 'The computed floor', `
      <p style="max-width:64ch;margin:0 0 12px">Read off the grammar of the

      <p style="max-width:64ch;margin:12px 0 0">A verse's <b>connections</b> that

      <p style="max-width:64ch;margin:12px 0 0">A card's <b>Where the text speaks of it</b>

        hub's file. Love and righteousness were drafted by Claude Opus and checked by the nine
        readers below — love in a pass that flagged where a grouping might take a side,
        righteousness in two full readings of every row. The rest were each drafted by a Claude
        Sonnet worker from the same rules, which also read sixteen of its verses against their rows,
        and each was read row by row by the eleven readers below. Every hub was changed where the
        readers found a row tilted, a note that said more than its verses, or an example that did
        not show its label, and the site's owner approved it before it was shown. The concept's graph comes after the texts' own words, and
        everything else the card records is kept below. Every other concept card, and every card
        for a group (a people, a party, an order), is laid out the same way by rule, without rows: its words, the words of the same root (by the lexicon's
        links and, for Greek, the spelling), its own verses quoted, its graph, and the other words
        English renders as its words are rendered — found from MACULA's glosses verse by verse, a
        word counting where that rendering is its usual one — set apart with their verses.</p>`)
      : ''}

    ${evk ? sec('a-events', 'The events', `
      <p style="max-width:64ch">The ${n(evk.count)} events at the top of Explore's
        events — ${evk.groups.map(esc).join('; ')} — are nodes of the graph, each told
        in one or more passages (${n(evk.instances)} tellings). The list of events began
        as a draft (see Who built it). What is checked: every passage it names was
        resolved against the Berean text; each telling was compared with the
        <b>Berean editors'</b> own sections and parallel notes, and the editors
        outrank the draft. In the Gospels, where the editors note a parallel and give
        it the same heading, it is a telling even if the draft left it out. In Samuel,
        Kings and Chronicles, where the same reign can
        be headed differently in each (Abijam in Kings, Abijah in Chronicles), a
        parallel the editors note between those histories — or between Kings and
        Isaiah or Jeremiah — is a telling when it supplies a history the event had
        no telling in, is not part of another event, and is the event's own section.
        Where the editors overrule the draft, the telling is marked disputed. Any
        other parallel the editors note is shown as their parallel, not as a telling,
        because their notes mark similar passages as well as one event told twice.
        Where the draft repeats an event at a different grain, the two are one card,
        with the other title kept. Who is in an event is everyone the tellings name,
        from the graph's own record of who each word refers to — and, listed apart,
        anyone whose own verses fall in a telling but whom no name in the text was tied
        to: most because the text gives none (the rich young ruler, the woman at the
        well), some because their name is shared and could not be settled. Which of
        several people of one name a word means (four men called James, several
        called Simon) is taken, where it can be, from STEP Bible's index of proper names,
        which names the individual at every verse; it is not used for a name that is
        also a people's (Israel, Judah, Levi), nor where it would join two people
        the graph keeps apart, and a word it gives to someone the graph has no
        record of is left unassigned rather than guessed. Where the
        tellings disagree about which person a shared name means (Mark 6:3's "son of
        Mary" and Matthew 13:55's), none is chosen: the card lists the verse and the
        possibilities. Each passage an event
        points to shows the evidence the graph has for the link (an editors' note, a
        declared reference, a judged pair, or the same people or places named). The
        rest were each read by a model (Claude Sonnet), blind, against the event's own
        passage: one read as speaking of the event -- naming it, retelling it or
        recalling it in its own words -- shows that reading as its evidence, marked as
        a reading; one that only shares its subject stays a suggestion and says so;
        one with no connection in the text is not shown. An event whose
        passages lie inside a larger event's is shown as part of it (Gideon's fleece
        within Gideon's victory, within the judges), read from the passages. An event
        belongs to a major theme only with scripture behind it: the theme map cites
        one of its passages (for the theme the citing concept is placed in, and any
        it also belongs to), or the corpus clause tags give three or more of its
        verses the theme's stamps (for a theme reached only through a related stamp —
        Church through "people of God" — the draft must also name the theme for the
        event). The theme's page lists its events; the draft's other theme words for
        an event are shown as words, unlinked. Letters, summaries and genealogies in
        the draft are held back, as they are not events.</p>
      <p style="max-width:64ch"><b>Story patterns.</b> Sixteen shapes that stories are
        told in — "Story pattern: Sin, judgment and mercy", "Cry and rescue",
        "Judgment and a remnant spared", "Meant for evil, turned to good" and twelve
        more — are nodes too, each a sequence of stages, some optional. They began as
        drafts (see Who built it), and one as a reader's own find: a judgment that
        leaves a remnant, as in the flood and Sodom. Four were added where the text
        tells the same shape several times over: a barren woman given a son, the
        younger chosen over the elder, a meeting at a well that ends in a marriage,
        and a covenant pledged before the assembled people. Each story placed in a pattern
        was checked stage by stage against the Berean text, and a stage's verses carry
        the corpus clause tags found in them. Optional stages were added where the
        text marks them — a turning (repentance or intercession), a cry, an objection
        to a call, those to be spared set apart — and an optional stage is kept only
        where at least three stories carry it. Some patterns the text states itself:
        Judges 2:11–19 gives the cry-and-rescue sequence, Jesus draws the remnant
        pattern from Noah and Lot (Luke 17:26–30), the LORD tells Rebekah "the older
        will serve the younger" (Genesis 25:23), and Joseph says of his brothers,
        "what you intended against me for evil, God intended for good" (Genesis
        50:20). Where a story's stages reach past
        one event, the instance is a "Story arc" of events. A story the draft named
        differently, or put in a different pattern, from what its verses show is
        marked as a reading. A symbolic stage (a death that is not a death) is used
        only where the text declares one; the draft's other templates are held back.
        In the reader, a chip marks where a stage begins; the pattern's page sets
        every story told that way side by side, a column for each stage.</p>
      <p style="max-width:64ch"><b>Role patterns.</b> Eight roles the text returns to —
        shepherd, king, priest, bridegroom, father, servant, prophet, and standing against
        the devil — as nodes, each with a row for every figure who fills it and a column for
        each part of the role (the shepherd's sheep, pasture, protection, provision). They
        began as a draft (see Who built it). Every verse the draft gave was found in the
        Berean text and tested for the part's own word in the Hebrew or Greek; a cell whose
        verses do not use it is shown as a reading, and a passage of over 40 verses is not
        a cell. A row says whether the text gives that figure the role in its own words
        ("Elijah the prophet") or a reader gives it by likeness (David as a priest, which the
        text never says). Where the text says otherwise, the draft was corrected: standing
        against the devil begins with submitting to God, as James 4 and 1 Peter 5 both put
        it; Psalm 110:4 is not in David's row, because it is spoken to "my Lord" and the text
        never calls David a priest (Hebrews gives the verse to Jesus). A cell's description
        says where it is; the draft's own wording is not shown as a description.</p>
      <p style="max-width:64ch"><b>Story echoes.</b> A few links from one account to an
        earlier one it echoes, each anchored in the text and graded by how: Jesus in the
        wilderness answers each test from Deuteronomy, and the card sets the words side by
        side ("fasting forty days and forty nights", Matthew 4:2, beside Moses' "forty days
        and forty nights. I ate no bread", Deuteronomy 9:9). An account that re-enacts an
        earlier scene is linked one way; one that takes up an earlier account's words (the
        Sermon on the Mount's "You have heard that it was said") another, and that link
        claims no likeness between persons (Nazareth's naming of Naaman is one of these: no
        scene is repeated there). Every echo was challenged by a second reading as the
        first panel of eight readers (under "The reader review") would read it, and what the text could not carry
        was taken out. Who is like whom is left to the reader. Most links are a third kind:
        a story told again, whose steps match an earlier story's (Jesus asleep in the storm
        and Jonah; the barley loaves and Elisha; Gibeah and Sodom), found by reading every event
        of the Gospels, Acts and the Old Testament against the Old Testament's events. Each is
        kept only where two judges called the steps clear (the second had to quote, word for
        word, the detail no one would expect by chance), with every step quoted from both texts
        and checked by machine, the explanation challenged by the same eight readers, and the
        whole read by the site's owner. Such a link says "has the same steps as" and claims no
        intent: whether one was told with the other in mind is not known. Where one of the two
        stories had no event of its own (the widow of Zarephath, Tabitha, Elisha's hundred fed),
        it was given one: the Berean editors' own section that holds the steps, under their
        heading, shown as part of any larger event that contains it. The full record of how
        each was judged, and of those not kept, is published with the data.</p>
      <p style="max-width:64ch"><b>References from the letters.</b> A verse of Romans through
        Jude that points at a happening the Bible tells (Hebrews 11:7, "built an ark to save his
        family") is shown on that event's card and in the connections of both verses (the
        letter's "Refers to", the account's "Referred to by"), with the letter's words beside
        the account's, both quoted exactly. Two sets of Claude readers each read every verse of the letters; each
        reference they found was judged by Claude Opus with both texts in full and read again by a
        second, skeptical Opus reading, and every quotation was checked by machine against the
        Berean. Where the link is not plain from the words, one sentence says what the letter
        names, reviewed as the first panel's eight readers would take it. A reference whose account
        readers differ on (which imprisonment, which raising of the dead), or whose tie rests on
        words other accounts share, is shown marked "apparent, not certain". The site's owner
        checked a sample of them before they were shown.</p>
      <p style="max-width:64ch"><b>References from the psalms and poems.</b> A psalm or poem
        that points at a happening the Bible tells is shown the same way, on the event's card
        and in the connections of both verses: by its title (Psalm 3, "when he fled from his son
        Absalom"), by naming it (Psalm 106:30, "But Phinehas stood and intervened"), or by
        retelling it (Psalm 78). Two sets of Claude readers read every verse of the Psalms, Job,
        Proverbs to the Song of Solomon, and the poems inside the narrative books (the Song of
        the Sea, Moses' song and blessing, David's lament for Saul and Jonathan, his songs in
        2 Samuel and 1 Chronicles); each reference was judged and read again as the letters'
        were, every quotation checked by machine. A song inside the account it celebrates is
        part of that account, not a reference to it. Where only a poem's content suggests an
        occasion (a sanctuary burned, with no word of which), no link is shown, nor where a link
        rests on one translation's reading (Job 31:33's "like Adam" can as well be read "as men
        do"). Where a poem points at one scene of a longer event, the Berean editors' own section
        for that scene is its event, under their heading, shown as part of the larger one. Where
        the link is not plain from the words, a sentence says how the two connect; these were the
        first reviewed by the nine readers below. The site's owner checked them all before they
        were shown.</p>
      <p style="max-width:64ch"><b>The prophets and events.</b> A passage of Isaiah to Malachi
        is linked to a happening the Bible tells in three ways, kept apart: <i>looking back</i>,
        where the prophet names or retells an earlier happening (Hosea 12:3, "In the womb he
        grasped his brother's heel"); <i>in its own time</i>, where the prophet's own words date
        the passage to a happening of its day (Isaiah 6:1, "In the year that King Uzziah died");
        and <i>looking forward</i>, where a later text itself quotes the prophet or says
        something happened as the prophet spoke (Matthew 1:23 and Isaiah 7:14). A forward link is
        shown under its own heading, never as the prophet "referring to" the later event, and with
        a note that the site reports what the later text says and does not say what a prophecy
        meant, whom it was about, or whether it was fulfilled. Two sets of Claude readers read
        every verse of the prophets; each link was judged with both texts in full (by Claude Opus,
        or first by Claude Sonnet where the readers saw only a likeness of content), read again by
        a skeptical Opus reading, and every quotation checked by machine. Where only the content
        suggests a happening, no link is shown; nor where the later words are a letter's, which
        tell no event; Revelation's are linked as the next paragraph says. Shown on the event's card and in
        the connections of both verses, as the letters' are, with "apparent, not certain" where
        readers differ or the tie rests on words other accounts share. Where the link is not plain,
        a sentence says how the two connect, reviewed by the nine readers below. The site's owner
        checked them all before they were shown.</p>
      <p style="max-width:64ch"><b>Revelation and the rest of Scripture.</b> Every link a reader can
        see by setting a verse of Revelation beside another passage, in four kinds kept apart:
        <i>words taken up</i> ("Holy, holy, holy", Isaiah 6:3 and Revelation 4:8), <i>an image both
        use</i> (living creatures full of eyes, with the faces of a lion, an ox, a man and an eagle,
        Ezekiel 1 and Revelation 4), <i>a person, place or happening it names</i> (Balaam and Balak,
        Revelation 2:14), and <i>Revelation's own key</i> to one of its images ("the seven stars are
        the angels of the seven churches", 1:20). Where verses close together share several details
        with one chapter, they are shown as one connection (Revelation 1:5 with Psalm 89).
        Two Claude Sonnet readers read every verse, looking up each passage's words in the Berean;
        each link was judged by Claude Opus with both passages in full and read again by a skeptical
        Opus reading, and every quotation checked by machine. Shown in the connections of both
        verses, one line each, opening to the words side by side; "apparent, not certain" where
        several passages share the words or the link rests on words others share. Each carries the
        note that the site shows what the texts share, never what a vision means, whom it is about,
        or when it happens. A link only the Hebrew or Greek shows is left out unless the Berean
        editors make it. Where the link is not plain, a sentence says what the two have in common,
        reviewed by the nine readers below. The site's owner checked them all before they were
        shown.</p>
      ${/* 6.23 (2026-10-06). Says what is built: the four kinds and their fixed
            labels, no sentence per link, the reach order and the quiet nearby
            ones, Sonnet for every pass (the committee's), the owner's review.
            Keep true if the labels, the ordering or the process change. */''}
      ${/* 7.6b (2026-10-06): the first theme front page. Says what is built:
            Apocalyptic only; the imagery table's making and review; the
            no-stance note. Keep true as more themes get front pages. */''}
      <p style="max-width:64ch"><b>A theme's front page: Apocalyptic.</b> The Apocalyptic theme opens in
        the texts' own words and leads to the imagery side by side, at its own address: 74 images that more
        than one book describes (thrones and living creatures, beasts and horns, scrolls, a measuring rod, a
        river), set out by book from Daniel and Ezekiel to the Gospels, the letters and Revelation, each in the
        passages' own words, with a line on what is alike and a line on what differs. The images were chosen
        and the lines drafted by Claude Opus from links already judged (Revelation's and the prophets'); every
        quotation is checked by machine, and every line was read by the nine readers below (49 accepted as
        drafted, 25 revised). The page takes no interpretive stance: it does not say what an image stands for,
        whom it refers to, whether one passage looks forward to another, or when anything happens. The site's
        owner saw it before it was shown. The theme map's outline follows, lower on the theme's page.</p>
      <p style="max-width:64ch"><b>New Creation</b> is built the same way. Its front page leads to the new creation
        side by side: 30 things more than one source says, set out from Genesis and the prophets to the Gospels,
        the letters and Revelation, of new heavens and a new earth, a city, a river and a tree, death and tears no
        more, and of a person made new, with a new heart and a new spirit. The rows were chosen and the lines
        drafted by Claude Opus from the passages the theme map cites; every quotation is checked by machine, and
        every line was read by the nine readers below (18 accepted as drafted, 12 revised). It takes no stance on
        whether these passages speak of this earth renewed or replaced, of something begun now or wholly to come,
        or how a person made new relates to the new heavens and the new earth. The site's owner saw it before it
        was shown.</p>
      <p style="max-width:64ch"><b>Prophets and Prophecy</b> leads to the prophets' words, taken up later: 40
        passages of Isaiah to Malachi, each beside the later passages that quote it, in another prophet, elsewhere in
        the Old Testament, in the Gospels and Acts, the letters or Revelation, drawn from the Berean editors' own
        notes of where a passage is quoted. Where a later passage says that something "fulfilled what was spoken"
        by a prophet, those are its own words, shown in its cell; the site never says it in its own voice, and does
        not say what a prophet meant or whether a later reading is right. Drafted by Claude Opus, checked by
        machine, and read by the nine readers below. The site's owner saw it before it was shown.</p>
      <p style="max-width:64ch"><b>Messiah</b> leads to the titles side by side: anointed, Messiah, Christ, Son
        of David, King of Israel, Son of Man, Son of God, Servant, a prophet like Moses, a priest like Melchizedek,
        Shepherd, Branch, Lamb, Stone, Immanuel and Holy One, each with where it is used and of whom, as each text
        names them: "anointed" of Saul, David and Cyrus as well; "son of man" as a prophet is addressed as well. It
        says of whom a text uses a title only as that text says, and never who a title is "really" about, since
        Christian traditions, Jewish readers of the Hebrew Bible and scholars read them differently. Drafted by
        Claude Opus, checked by machine, read by the nine readers below; the site's owner saw it before it was
        shown.</p>
      <p style="max-width:64ch"><b>Creation</b>, <b>Image of God</b> and <b>Blessing &amp; Commission</b> are
        built the same way. <i>Creation told again</i> sets the making of the world in Genesis beside the places
        that tell it again, in the Psalms, Job and Proverbs, the prophets, John, the letters and Revelation: the
        heavens stretched out, the earth founded, the sea given its bounds, the man formed from the dust, the rest
        on the seventh day. <i>The image side by side</i> sets out the places that speak of humankind made in the
        image and likeness of God, and of an image borne or renewed. <i>Blessed and sent</i> sets each blessing
        and each charge (to the first man and woman, to Noah, to Abraham, Aaron's blessing, the sending of the
        disciples) beside the places that repeat its words. They take no stance on whether the days are days or
        how old the earth is, on what the image is or whether it was lost, or on how the blessing promised to
        Abraham relates to Israel, the nations and the church. Where the same row belonged in two tables, it
        was kept in one and the verses moved there. Drafted by Claude Opus, checked by machine, read by the nine
        readers below; the site's owner saw them before they were shown.</p>
      <p style="max-width:64ch"><b>Covenant</b> and <b>Kingdom</b> are built the same way. <i>The covenant
        words side by side</i> sets out the words the texts use of covenant wherever more than one book shares
        them: a covenant established, everlasting, kept, remembered and broken, its signs, its blood, and a new
        covenant, from Noah and Abraham to Sinai, David, the prophets and the Last Supper. <i>The kingdom side by
        side</i> does the same for God's reign: "The LORD reigns", an everlasting kingdom, "Your kingdom come",
        the kingdom of God and the kingdom of heaven, each as its verse words it. They take no stance on how the
        covenants relate to one another or with whom the new covenant is made, nor on whether the kingdom is
        present or to come, the thousand years of Revelation 20, or how the kingdom relates to Israel and the
        church. Each row's verses were drafted by Claude Opus from the theme map's passages, the Berean editors'
        own notes of where a passage is quoted, and a search of the whole Berean, and a row already on another
        table is not repeated. Checked by machine, read by the nine readers below; the site's owner saw them
        before they were shown.</p>
      <p style="max-width:64ch"><b>The Law</b> (the theme map named it "Law / Wisdom"; its wisdom concepts now
        sit with Wisdom Literature) leads to <i>the commandments taken up</i>, in two parts. First the Law as set
        out, each commandment beside the later passages that quote it; then, opening at Matthew 5:17, what the
        texts say of the Law itself, each verse in its own words. Set first are the two commandments of which
        Jesus says "No other commandment is greater than these", and two rows join the Law to wisdom where the
        texts do ("Fear God and keep His commandments"). The page takes no stance on whether or how the Law binds
        now, on law and gospel, or on how a person is made right with God; where the letters speak of the Law,
        each is quoted and none is set against another or reconciled with it. Drafted by Claude Opus, the bridge
        rows by Claude; checked by machine, read by the nine readers below, the page's own introduction
        included; the site's owner saw it before it was shown.</p>
      <p style="max-width:64ch"><b>Wisdom Literature</b>, <b>Sacrifice</b> and <b>Priesthood</b> are built the same
        way. <i>Wisdom's sayings side by side</i> sets the sayings of Job, Proverbs, Ecclesiastes and the Psalms
        beside the places that repeat them or take up their words, with its own columns for those books. <i>The
        offerings side by side</i> sets out the words the texts use of offering and sacrifice, from Abel and
        Abraham and the Law's offerings to the psalms, the prophets and the letters. <i>The priests side by
        side</i> does the same for priests, from Aaron and the Levites to Hebrews, Peter and Revelation. They take
        no stance on whether Proverbs' sayings promise or describe, on how a sacrifice takes away sin or whether
        the Lord's Supper is one, or on whether the church has priests. Two rows were withdrawn because their
        pairing alone took a side, though every line was in quotation (one setting out a model of atonement).
        Checked by machine, read by the nine readers below; the site's owner saw them before they were
        shown.</p>
      <p style="max-width:64ch"><b>Temple &amp; Presence</b>, <b>Spirit</b> and <b>Church</b> complete the group
        on worship and presence, built the same way. <i>The dwelling side by side</i> sets out the words the texts
        use of God's dwelling, from the tabernacle and the temple filled with glory to what the Gospels and letters
        call a temple, each in its own words. <i>The Spirit side by side</i> sets out the words used of the Spirit,
        coming upon, poured out, filling, baptizing and bearing fruit. <i>The church side by side</i> sets out the
        words used of the people gathered, from the assembly of the LORD in Israel to the body, the household and
        the flock. They take no stance on whether a temple will be built again or how the temple, Jesus' body,
        the church and a believer's body relate; on the Spirit's gifts today, on when the Spirit is received, or
        from whom the Spirit proceeds, and the site's own sentences give the Spirit no pronoun; or on who "this
        rock" is, how the church is ordered, or how it relates to Israel. Two rows came out because their pairing
        alone answered one of those questions. Checked by machine, read by the nine readers below; the site's
        owner saw them before they were shown.</p>
      <p style="max-width:64ch"><b>Sin, Exile &amp; Death</b>, <b>Judgment</b>, <b>Deliverance</b> and <b>Mercy &amp;
        Restoration</b> complete the twenty themes of the map, each with a front page and a table built the same
        way: the words the texts use of sin and exile, of judgment, of being delivered and saved, and of mercy and
        restoring, each set out wherever more than one book shares them. They take no stance on how sin passes
        from the first man to others, on what hell is, on purgatory or the order of the last things, on how a
        person is saved or whether salvation can be lost, or on whether promises of restoration are to Israel, to
        the church, or to both. On judgment, the scholarly reader on the panel below holds each line to leaving
        every reading of the verses open; the page quotes the verses and lets them stand. Checked by machine, read
        by the nine readers; the site's owner saw them before they were shown.</p>
      <p style="max-width:64ch"><b>Themes of the site's own.</b> To the twenty of the map, the site has added
        themes of its own: <b>Father, Son and Holy Spirit (the Trinity)</b>, <b>Spiritual Warfare</b>,
        <b>Freedom</b> and <b>Children of God</b>, making twenty-four. Their outlines are not Microsoft Copilot's: each was drafted by Claude Opus from the
        text, every concept named in the texts' own words and every note an exact quotation, then read by the nine
        readers below, who renamed most of the concepts so that none says more than its passages. Each has a front
        page and a table like the others. The page on the Father, the Son and the Holy Spirit sets the texts side by
        side and says neither that the three are one God nor that they are not; the word "Trinity" is the church's
        name for the teaching, not the text's. Spiritual Warfare begins with Ephesians 6: its first concept is the
        card for the full armor of God itself. A theme of the site's own is shown only after its owner has seen it.</p>
      <p style="max-width:64ch">Every row of these tables was then checked for what it left out: a machine
        searched the whole Berean for every verse with the wording the row's passages share, and each verse it
        found was sorted by Claude Sonnet as belonging, as a common phrase to leave out, or as the same words
        used of something else. Those last are shown with an asterisk, marked as off the theme's subject and
        shown for the shared words (the tree of life in Proverbs, beside Genesis and Revelation's). Every row
        that changed went back through the nine readers. A row may also point to the cards on the same subject
        ("See also"), so the side-by-side view and the imagery and concept cards meet; a card is offered only where
        its own verses are among the row's, checked by machine.</p>
      <p style="max-width:64ch"><b>The history books and the passages before them.</b> Where a
        passage of Genesis to Esther looks back to an earlier one, in four kinds kept apart: it
        <i>recalls</i> an earlier happening ("another famine in the land, subsequent to the one that
        had occurred in Abraham's time", Genesis 26:1), <i>quotes</i> earlier words ("according to
        what is written in the Book of the Law of Moses", 2 Kings 14:6), <i>does as was commanded</i> (the
        tabernacle made as Exodus 25–31 directed), or <i>says in its own words that something happened
        as was said</i> ("according to the word that the LORD had spoken through Joshua son of Nun",
        1 Kings 16:34). Each shows the two passages' own words side by side under a fixed label,
        with no sentence of the site's own; the labels were reviewed by the nine readers below. Where
        the same happening is told in more than one verse, the others are named. Links across books
        come first; one to a passage a few chapters earlier in the same book is kept but listed after
        the rest of a verse's connections, and folded where it stands alone. Two Claude Sonnet
        readers read every verse, looking up each passage's words in the Berean; each link was judged
        by Claude Sonnet with both passages in full and read again by a skeptical Sonnet reading, and
        every quotation was checked by machine. "Apparent, not certain" marks a tie that rests on a
        shared subject or a common phrase. The site's owner reviewed them before they were shown.</p>
      <p style="max-width:64ch"><b>The reader review.</b> Every sentence the site says in its
        own voice about what a text says — an event's retelling, how two verses connect — is read
        by a second Claude reading against the verses it cites, and as each reader of a panel would
        take it; it is shown only if all of them could accept it. The panel is chosen by the
        questions the site must not take a side on (baptism, election, eternal security, the
        dispensations), so that each has readers on both sides. Each judges within the 66 books
        all of them share, a constraint they agree to. From 5 October 2026 it is nine:</p>
      <table class="panel" style="max-width:64ch; font-size:14px; border-collapse:collapse; margin:0 0 12px">
        <tr><td><b>Lutheran</b></td><td>justification by faith alone; law and gospel; the sacraments</td></tr>
        <tr><td><b>Reformed</b></td><td>election; the perseverance of the saints</td></tr>
        <tr><td><b>Wesleyan</b> (Methodist, Arminian)</td><td>free will; that a believer can fall away</td></tr>
        <tr><td><b>Baptist / free church</b></td><td>believer's baptism; often dispensational</td></tr>
        <tr><td><b>Pentecostal / Charismatic</b></td><td>the gifts of the Spirit</td></tr>
        <tr><td><b>Secular academic</b></td><td>reads under no confession: does the text say this?</td></tr>
        <tr><td><b>Catholic</b></td><td>Scripture read with the Church's tradition</td></tr>
        <tr><td><b>Eastern Orthodox</b></td><td>Scripture read with the Church's tradition</td></tr>
        <tr><td><b>Biblical-theological</b> (literary)</td><td>the Bible as one story; its literary
          design; the Old Testament heard on its own terms before it is read as pointing forward,
          reading of the kind taught by BibleProject, Wheaton College Graduate School and Regent
          College, Vancouver</td></tr>
      </table>
      <p style="max-width:64ch">From 10 October 2026 it is eleven. A rabbi joined, on the same
        terms as the others: the 66 books as they are, and the text represented fairly, hard verses
        included. A young African American believer joined too, with a deep faith and a high view of
        Scripture:</p>
      <table class="panel" style="max-width:64ch; font-size:14px; border-collapse:collapse; margin:0 0 12px">
        <tr><td><b>A rabbi</b></td><td>the Hebrew Scriptures heard first as their first hearers
          heard them; the Jewish people presented as the text presents them, whole, before any part.
          He defers to the other seats on how a Christian tradition reads its own text</td></tr>
        <tr><td><b>A young African American believer</b></td><td>no US political framing of the
          text, left or right; nothing culturally insensitive in how peoples, slavery, exile and
          oppression in the text are presented; the text's own concern for justice shown where it is
          there, and not supplied where it is not</td></tr>
      </table>
      <p style="max-width:64ch">The card on the Jews was reviewed by the nine and the rabbi; the
        cards on the Pharisees, the chief priests, the sons of Israel, Ham, Canaan, the Canaanites,
        Cush and slavery, and the concept hubs after love and righteousness, by the eleven. Before
        5 October the panel was eight: Baptist, Calvinist,
        Arminian, Lutheran, Methodist, Charismatic, Orthodox and academic. The event retellings,
        the story echoes, the stories told again, what two verses share, the significant numbers
        and the letters' sentences were reviewed by those eight; the psalms' and poems' sentences,
        the prophets' and Revelation's, by the nine. The panel changed because two of the eight answered alike on every question
        the review exists for (Methodist and Arminian), and Catholic and Pentecostal readers had
        no seat.</p>
      <p style="max-width:64ch"><b>What two verses share.</b> A New Testament verse and an Old
        Testament verse that have a rare phrase word beside word in the Hebrew and Greek (two
        nouns or adjectives, found together in a dozen verses or fewer) were each read by two
        Claude judges, separately and without the Berean editors' notes, and kept only where
        both said one takes up the other. Each kept link is then shown as one of three kinds,
        with a few sentences saying what the two texts have in common: <i>words taken up</i>,
        where one quotes or closely reproduces the other ("new covenant", Luke 22:20 and
        Jeremiah 31:31); <i>both use</i>, an image or expression two texts share, gathered with
        the other verses judged to share it and no claim that one points to the other (the ten horns of Daniel 7
        and Revelation, where both texts say the horns are ten kings); and <i>a story told
        again</i>, where the steps of two stories match and are set side by side (barley loaves
        in John 6 and 2 Kings 4). The explanations were written by Claude Opus, checked by machine
        (every quotation against the Berean, every claim that a wording occurs nowhere else
        against the whole Old Testament), and challenged by the same eight-reader review. For
        prophecy they say what each text says and nothing about what or when a vision refers to.
        A story told again with no shared phrase is not found this way.</p>
      <p style="max-width:64ch"><b>Significant numbers.</b> Forty: the spans of forty days or
        forty years the text counts, the phrases it repeats ("forty days and forty nights" is
        used of the flood, Moses on the mountain, Elijah, and in Matthew Jesus, and of nothing
        else), and the places where the text itself sets one forty beside another ("a year for
        each day", Numbers 14:34). Forties that count ages, armies or measures are not listed,
        and the card says how many there are; what the number means is not said, because the
        text does not say it. Where the text leaves a count open (whether Moses' second forty
        is one or two) the card says so. Every verse is checked against the Berean and against
        the Hebrew or Greek number word, and the card was challenged by the same eight-reader
        review. Twelve: the sets the text counts as twelve — the tribes, things numbered one
        for each tribe (pillars, stones, staffs, men), the Twelve, and other sets — and where
        the text itself ties one twelve to another ("twelve pillars for the twelve tribes",
        Exodus 24:4; "twelve thrones, judging the twelve tribes", Matthew 19:28). Every verse
        with twelve is either on the card or set aside with its reason.</p>
      <p style="max-width:64ch"><b>Lists and collections.</b> Thirteen lists have a card each: the
        full armor of God, the fruit of the Spirit, the Beatitudes, the acts of the flesh, the Ten
        Commandments, the seven churches, the tabernacle and its furnishings, the offerings, and others.
        Most are lists the text gives in one passage; five are gathered across passages (the gifts of
        1 Corinthians 12, Romans 12 and Ephesians 4; "Blessed is the man" in Psalms 1, 32 and 112; the
        seven spirits of God, with Isaiah 11:2 set beside them; the sevens of Revelation; dying and rising
        with Christ), and each card names its passages and says it gathers them.
        Every member is named in the Berean's words and opens a card of its own, the same one the rest
        of the graph uses; where the graph had none, one was made with its verse. A figure opens the
        whole figure as the verse names it ("the breastplate of righteousness"), whose card leads on to
        the object it is built on and to what the verse says it is. Where traditions
        count a list differently (the Beatitudes, the Ten Commandments) the members are the text's
        sentences, not numbered.
        The moves are shown in the passage's own words ("put on", "take up", "stand firm"), each
        opening its verse. The lists were first drawn up by Microsoft Copilot; their members were
        then put into the Berean's words, completed where a list left items out, and checked by machine
        against each verse. The sections a list is tagged in come from a tagging pass and are marked
        as not each read.</p>
      <p style="max-width:64ch"><b>Divine messages.</b> A hundred and one things God says,
        or has said on his behalf — "Do not fear", "Go", "I will gather you", "Surely I am
        coming soon" — in ten groups, the groups a draft laid out (see Who built it). A message
        is found by its form in the Hebrew or Greek, not by a word: "Go" is the command form
        of the verb, spoken by God, Jesus, an angel, a prophet or Moses; "Do not fear" is the
        verb with a "not" before it. Who speaks each verse is the Hebrew and Greek datasets'
        own record; a verse with none takes its book's voice (a prophet's oracle, a psalmist).
        Where the Hebrew cannot tell two senses apart, the Berean's wording decides. A random
        verse from each message was read after the last change: 91 of 101 were the message.
        Each message says where it is spoken, by the verses they share: in which story (Cain's,
        at its judgment), in which figure's role (Huldah's, as a prophet calling to
        repentance), in which major themes and events. The patterns those belong to say which
        messages are spoken in any of them. In the reader a dashed chip marks a message in its
        verse.</p>
      <p style="max-width:64ch"><b>Speech acts.</b> Thirty-one kinds of speaking — blessing,
        cursing, oath, vow, naming, prayer, lament, complaint, praise, confession, testimony,
        promise, warning, command, rebuke, accusation, defence, taunt, boast, riddle, last
        words and more — in five groups by what the speaking does, and each also labelled
        with its kind in the standard scheme (Searle's: it says something is so, tries to get
        the hearer to act, binds the speaker, voices a feeling, or makes something so by
        saying it). Thirty came as a draft (see
        Who built it); command was added because the text has it more than any other. Each
        message is a narrower form of one ("Do not fear" of promise). An act is counted only
        where the text names it: the Hebrew or Greek word for it, checked by its sense where
        one word has two (the same Hebrew verb is "grumble" and "lodge"); a few set words that
        are the act ("As surely as the LORD lives"); a psalm headed so ("A prayer of the
        afflicted"); or an edge the graph already had. Where a rule is known to fall short, a
        verse is added or removed by hand as an overlay -- a handful, on acts and messages
        alike, each shown on its card with a dashed outline and its reason, and each meant
        to give way to a rule that can find it. A passage the draft gave that the text
        does not name this way is listed on the card as a reading and not counted — 224 of its
        513. The text never calls a psalm a lament; most of the psalms the draft called
        laments name a complaint ("How long, O LORD?") or a prayer instead, and are counted
        there. Four verses at random from every act were read four times over, the rules
        corrected after each read; the last found 119 of 124 right. Every draft reference the
        rules missed was read as well, and where the text did name the act (Daniel's Aramaic
        "I give thanks and praise"), the rule was widened to find it. In the reader a
        dotted chip marks a speech act at its verse — the rarest one there, and none
        where one of its own messages already has a chip.</p>`) : ''}

    ${sec('a-not', 'What it does not attempt', `
      <p style="max-width:64ch">A conclusion of its own. The computed floor
        records that a verse says something, not what the verse means. Where a
        reading of meaning appears — a clause's tags, what a line refers to — it
        is marked as a reading, with how it was reached, and the reader who
        decides is you.</p>
      <p style="max-width:64ch">The floor cannot see a figure the text asserts
        somewhere else — 1 Peter reads the flood as a deliverance and Genesis 7
        does not say so, so no rule over Genesis 7 will find it.</p>
      ${/* GRAMMAR, NOT DESIGN. The BibleProject reader (2026-10-02) comes for

      <p style="max-width:64ch">Literary design. The structure shown is the

      <p style="max-width:64ch">A judgment on history. A card's description reports the

      <p style="max-width:64ch">And an absence proves nothing. A book with no

      structure read off the grammar, which reaches the whole canon.
      <b>Claims</b> is what the earlier graph reasoned and sourced, which
      reaches ${c.books.filter(b => b.claims).length} of ${c.books.length} books
      and is very uneven. <b>Tagged</b> is clauses read by automated analysis
      for what they speak of, section by section across the canon. A book can be fully

    <div class="covgrid covgrid5">
      <div class="covhead">book</div><div class="covhead">verses</div>

        <div class="g">${b.events || '—'}</div>
        <div class="${b.claims ? 'covyes' : 'g'}">${b.claims || '—'}</div>

    </div>
    <p style="color:var(--muted);font-size:13.5px;max-width:64ch;margin:14px 0 0">

function wireMore(){
  const btn = $('#morebtn'), menu = $('#moremenu');
  if(!btn || !menu) return;
  const close = () => { menu.hidden = true; btn.setAttribute('aria-expanded', 'false'); };
  btn.onclick = e => {
    e.stopPropagation();
    const open = menu.hidden;
    menu.hidden = !open;
    btn.setAttribute('aria-expanded', String(open));
  };
  document.addEventListener('click', e => {
    if(!menu.hidden && !menu.contains(e.target) && e.target !== btn) close();
  });
  document.addEventListener('keydown', e => { if(e.key === 'Escape') close(); });
  menu.querySelectorAll('[data-more]').forEach(b => b.onclick = () => {
    close();
    if(b.dataset.more === 'about') openAbout();
    if(b.dataset.more === 'coverage') openCoverage();
    if(b.dataset.more === 'welcome') showWelcome();
    if(b.dataset.more === 'feedback') openFeedback();
  });
  /* THE THEME: the device's unless chosen here, and kept in this browser only
     (2026-10-13: Wikipedia, GitHub and MDN offer the same three) */
  const opts = menu.querySelectorAll('[data-theme-set]');
  const mark = () => opts.forEach(o => o.setAttribute('aria-pressed',
    String(o.dataset.themeSet === (document.documentElement.dataset.theme || 'device'))));
  opts.forEach(o => o.onclick = e => {
    e.stopPropagation();
    const t = o.dataset.themeSet;
    if(t === 'device') delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = t;
    mem.set('theme', t === 'device' ? null : t);
    mark();
  });
  mark();
}
/* dark, whether chosen in the menu or by the device */
function isDark(){
  const t = document.documentElement.dataset.theme;
  return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
}

/* ---------------- the welcome ----------------
   Shown once, on a first visit (2026-10-01: a one-time welcome with a
   defaulted dismissal option). "Don't show this again" starts ticked, so
   any way of closing it -- the button, a "try this" link, Escape, the
   backdrop -- ends it for good; untick it to see it next time. "How this
   works" in the ⋯ menu brings it back. */
/* SOMETHING WRONG OR MISSING? (plan A.27, reader feedback). 2026-10-03:
   a way to hear from readers before search brings strangers, read on /ops;
   no email (one-way, as the old notes design chose). The note carries the
   page it was sent from and nothing about the sender. `website` is a field a
   person never sees: a bot that fills it is thanked and dropped. */
function openFeedback(){
  if($('#fbdlg')) return;
  const page = location.pathname || '/';
  const about = document.title.replace(/ · Bible Ontology$/, '');
  const w = document.createElement('div');
  w.className = 'welcome'; w.id = 'fbdlg';
  w.innerHTML = `<div class="wcard" role="dialog" aria-modal="true" aria-labelledby="fbtitle">
    <h2 id="fbtitle">Something wrong or missing?</h2>
    <p class="wlead">Tell us what you noticed on <b>${esc(about)}</b>. A sentence is plenty;
      if a verse says otherwise, name it.</p>
    <textarea id="fbtext" maxlength="1000" rows="6" style="width:100%;margin-top:12px;
      font:inherit;padding:8px 10px;border:1px solid var(--rule);border-radius:8px;
      background:var(--paper);color:var(--ink)" aria-label="Your note"></textarea>
    <input id="fbweb" name="website" tabindex="-1" autocomplete="off" aria-hidden="true"
      style="position:absolute;left:-9999px;width:1px;height:1px">
    <p class="hint" style="margin:6px 0 0">Read by the person who maintains the site and the tools he
      builds with, as something to check against the text; never published or shown to anyone else. It carries the page
      you are on and nothing about you, so no reply can be sent.
      <span id="fbcount">0</span>/1000</p>
    <div class="wfoot"><span id="fbmsg" role="status"></span>
      <span><button class="wlink" id="fbcancel">Cancel</button>
        <button class="wgo" id="fbsend">Send</button></span></div></div>`;
  document.body.appendChild(w);
  const ta = $('#fbtext');
  const close = () => { w.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if(e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  w.addEventListener('click', e => { if(e.target === w) close(); });
  $('#fbcancel').onclick = close;
  ta.addEventListener('input', () => { $('#fbcount').textContent = ta.value.length; });
  ta.focus();
  $('#fbsend').onclick = async () => {
    const text = ta.value.trim();
    if(!text){ $('#fbmsg').textContent = 'Write a note first.'; return; }
    $('#fbsend').disabled = true; $('#fbmsg').textContent = 'Sending…';
    try{
      const r = await fetch('/api/feedback', {method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({text, page, title: document.title, website: $('#fbweb').value,
                              device: PHONE.matches ? 'mobile' : 'desktop'})});
      if(r.ok){
        $('#fbmsg').textContent = 'Thank you — sent.';
        setTimeout(close, 1400);
        return;
      }
      const j = await r.json().catch(() => ({}));
      $('#fbmsg').textContent = j.error ? j.error[0].toUpperCase() + j.error.slice(1) + '.'
                                        : 'It could not be sent; try again later.';
    }catch(e){ $('#fbmsg').textContent = 'It could not be sent; try again later.'; }
    $('#fbsend').disabled = false;
  };
}

    else if(what === 'close' && !PHONE.matches) openNavigator();

  w.querySelector('.wgo').focus({preventScroll: true});

}

// Explore, with the navigator section open
function openNavigator(){
  // asked for: Explore builds the section already open (a build that lands
  // after this would otherwise replace an opened section with a shut one)
  KGN.want = true;
  selectTab('explore');
  /* WAIT FOR THE SECTION. Explore is built by requests of its own, so on a
     cold start -- a /graph link opened fresh (A.21) -- it was not there
     after the fixed 300 ms this waited, and the Navigator stayed shut. It is
     looked for until it exists, for up to ten seconds. */
  let tries = 0;
  const go = () => {
    const kd = document.querySelector('details[data-sec="x-kgn"]');
    if(kd){ kd.open = true; kd.scrollIntoView({block: 'start'}); return; }
    if(++tries < 50) setTimeout(go, 200);
  };
  setTimeout(go, 200);
}

/* the server's name slug (letters and digits, lower case), to tell when a tag
   reached a record through one of its other names */
const _slugJs = s => String(s || '').toLowerCase().normalize('NFD')
  .replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '');
/* A tag's name as a reader should see it: "sacrifice_ev" -> "sacrifice". */
/* "_ev" marks the EVENT-image twin of a theme ("sacrifice" the theme,
   "sacrifice_ev" the event), so it stays visible as "(event)" — dropping it
   showed two different tags as the same word */
const tagName = t => String(t).replace(/_ev$/, ' (event)').replace(/_/g, ' ');

/* ONE TAG'S PAGE. 2026-09-28: a click shows the tag
   taxonomy and the books that include it, with a drill into the verses
   assertions for the expanded book. Two sources, never blended: clauses a
   model pinned the tag to, and sections the September pass stamped with it. */
/* A tag's clauses and sections, by book — shared by the tag page and by a
   card whose record carries the same name. */
const tagVerseBtn = r => `<button class="refmore" data-go="${esc(r)}">${esc(prettyRef(r))}</button>`;
const tagPinnedItem = x => `<div class="echo">${tagVerseBtn(x.eref)}
    <span class="ctag ${esc(x.strength)}">${esc(x.strength)}</span>
    <div class="ex">“${esc(x.text)}”</div>
    <div class="hint">${esc(x.verse)}</div></div>`;
/* WHAT THE CORPUS RUN MADE OF IT. 2026-09-29: the
   section tags are not thrown away just because they did not hit nodes; in some cases they may
   apply better to sections. So a September section stamp stays listed and
   says whether the later pass pinned it to clauses, read it as the
   section's drift, or disputed it (with its reason). */
const CORPUS_SAYS = {pinned: 'pinned to clauses by the corpus pass',
  general: 'the section as a whole, no clause in particular',
  disputed: 'disputed by the corpus pass'};
const tagStampedItem = x => `<div class="echo">${x.eref ? tagVerseBtn(x.eref) : ''}
    <span class="hint">${esc(x.title || x.section)}</span>
    <div class="hint">${esc(x.verse)}</div>${x.corpus ? `<div class="hint"><i>${
      esc(CORPUS_SAYS[x.corpus] || x.corpus)}${x.corpus === 'disputed' && x.reason
      ? ': ' + esc(x.reason) : ''}</i></div>` : ''}</div>`;
const tagByBook = (blk, item, pre) => blk.books.map(b => sec(pre + b.book,
    `${b.title} · ${b.n}`, b.items.map(item).join(''), null, false)).join('');

async function openTag(id){
  const d = await api('/api/tag', {id});
  /* A THEME'S OLD TAG OPENS THE THEME (2026-10-08): the September theme
     stamps are retired from view, and the theme itself now
     sets out its verses */
  if(d.theme){ openMajorTheme(d.theme); return; }
  const tx = d.taxonomy;
  const byBook = tagByBook, pinnedItem = tagPinnedItem, stampedItem = tagStampedItem;
  /* the record of the same name: 2026-09-28, the tag page
     provides linkage to the concept page */
  const recs = (d.records||[]).length ? `<p class="lead" style="margin-top:4px">The ${
      d.records.length > 1 ? 'records' : 'record'} of this name: ${d.records.map(r =>
      `<span class="link" data-ent="${esc(r.id)}">${esc(r.name)}</span> <span class="g">${
      esc(r.type)}</span>`).join(' · ')}</p>` : '';
  DEEP = 'tag=' + encodeURIComponent(id);
  openTab('tag:' + id, tagName(id), `<div class="pane">
    <p class="kind">A tag</p><h1>${esc(tx ? tx.label : tagName(id))}</h1>${recs}
    ${tx && tx.folded_into ? `<p class="lead">A thing, held by its own card: <span class="link"
        data-ent="${esc(tx.folded_into)}">${esc(tx.folded_name)}</span>. <span class="g">The
        clauses below are candidates for where it appears, not proof ${prov('auto', 'Unreviewed')}</span></p>`
    : tx ? `<p class="lead">${tx.gloss ? esc(tx.gloss) + ' · ' : ''}<span class="g">a kind of
      passage: ${esc(tx.category)}${tx.group ? ' › ' + esc(tx.group) : ''}</span></p>
      ${tx.note ? `<p class="hint" style="max-width:62ch">${esc(tx.note)}</p>` : ''}`
      : `<p class="hint">Not in the tag taxonomy: a concept or a tag named by the reading.</p>`}
    ${/* An empty section is not shown, and the full one opens (UI committee:
          "Pinned to clauses · 0 — None yet." stood open over 80 sections). */''}
    ${!d.pinned.total ? '' : sec('tg-pinned', `Pinned to clauses · ${d.pinned.total}`,
      `<p class="hint" style="max-width:62ch">Clauses read as speaking of this, each
        high, medium or low — a reading, made section by section across the canon ${prov('auto')}</p>`
      + byBook(d.pinned, pinnedItem, 'tgp-'), null, true)}
    ${!d.stamped.total ? '' : sec('tg-stamped', `Stamped on sections · ${d.stamped.total}`,
      `<p class="hint" style="max-width:62ch">Sections the September pass stamped with this
        tag, across the canon, each citing one verse, and loose: a pilot of them found
        about a fifth wrong. A later pass read each one again and says under it
        whether it pinned the tag to clauses, read it as the section's drift as a
        whole, or disputed it.</p>`
      + byBook(d.stamped, stampedItem, 'tgs-'), null, !d.pinned.total)}
    ${!d.pinned.total && !d.stamped.total ? '<p class="hint">No clause or section carries this tag yet.</p>' : ''}
  </div>`, () => {
    $$('#paneinner [data-go]').forEach(b => b.onclick = () => peekAt(b, b.dataset.go));
    $$('#paneinner .link[data-ent]').forEach(l => l.onclick = () => openEntity(l.dataset.ent));
  });
}

/* ONE MAJOR THEME. 2026-09-29: a high-level mapping layer for each
   theme, naming MS Copilot as the source, gives a user a quick
   way to detect, navigate to, and understand these major themes before
   diving into as much detail as desired; and every relationship is grounded in
   some kind of scripture backup, so that a reader can reference some
   scripture and not just take Copilot's word for it. So every concept
   shows its passages in the Berean text, every link to another theme shows
   what grounds it (or says that nothing does yet), and the page ends in the
   ontology's own stamps for going deeper. */
/* A REFRAIN OR A DECLARING FORMULA (plan A.8): every verse where the text says
   it, by book, each saying how it was found when it was not the Berean's own
   wording, and — for "as it is written" and the fulfilment formulas — the
   source the Berean editors give. Links are delegated (data-go). */
/* A SET OF THE PATTERNS SECTION, from the search: Explore, with Patterns and
   the set open, scrolled to it. Explore builds its sections when it is first
   shown, so this waits for the set to exist (as openNavigator does). */
async function openPatternSet(key){
  selectTab('explore');
  for(let i = 0; i < 40; i++){
    const outer = document.querySelector('details[data-sec="x-patternsets"]');
    const set = document.querySelector(`details[data-sec="ps-${CSS.escape(key)}"]`);
    if(outer) outer.open = true;
    if(set){
      // every enclosing section open too, then scrolled once the layout settles
      for(let p = set; p; p = p.parentElement?.closest('details')) p.open = true;
      set.scrollIntoView({block: 'start'});
      setTimeout(() => set.scrollIntoView({block: 'start'}), 300);
      return;
    }
    await new Promise(r => setTimeout(r, 150));
  }
}

async function openMajorTheme(id){
  const d = await api('/api/majortheme', {id});
  if(!d.found) return;
  // arriving at /themes/<slug> passes the slug: the tab is keyed by the id
  // (7.6d), and the address bar shows the theme's own address
  id = d.id;
  THEME_PATH[id] = d.path;
  /* A reference with no display form still opens in place, from its store id
     ("Exod.25.8"). The secondary concepts' references carried only that, and
     rendered as grey text nothing could open. 2026-09-30: the verse
     references should be expandable. */
  const refBtn = r => r.go ? `<button class="refmore" data-tgo="${esc(r.go)}">${esc(r.label)}</button>`
                    : r.id ? `<button class="refmore" data-go="${esc(r.id)}">${esc(r.label)}</button>`
                           : `<span class="g">${esc(r.label)}</span>`;
  /* the graph's own nodes a theme or concept names; "no node" says so, since
     a theme the graph has no node for is a gap to discuss */
  // one entry per name: two nodes of one name ("covenant concept · covenant
  // concept", UI committee) are one link here; the card it opens names the
  // other under "Also recorded separately under this name"
  const nodeLine = ns => (ns = [...new Map((ns || []).map(n => [n.name + '|' + n.type, n])).values()]).length
    ? `<p class="hint" style="margin:0 0 6px">In the graph: ${ns.map(n =>
        `<span class="link" data-ent="${esc(n.id)}">${esc(n.name)}</span> <span class="g">${
        esc(n.type)}${n.near ? ', near' : ''}</span>`).join(' · ')}</p>`
    : `<p class="hint" style="margin:0 0 6px">In the graph: no existing node</p>`;
  /* the concept's OWN node in the graph (a merged one is the existing node) */
  const ownNode = id => id ? `<p class="hint" style="margin:0 0 4px">As a node: <span class="link"
      data-ent="${esc(id)}">open it in the graph</span></p>` : '';
  /* THE OUTLINE AS CARDS (plan 7.6c): a concept's name opens its own card;
     a passage with a quotation shows it as the front page's quotations do;
     the rest are the verse buttons under it */
  const conceptCards = cs => `<div class="otl">${cs.map(c => {
    const quoted = c.passages.filter(p => p.note), plain = c.passages.filter(p => !p.note);
    /* the heading: each term the graph has a card for opens it (2026-10-08:
       concepts mentioned in the outline headings are
       hyperlinked for further exploration); other words plain;
       the sub-theme's own card after it */
    const head = (c.terms || []).some(x => x.k === 'node' || x.k === 'theme')
      ? c.terms.map(x => x.k === 'node' ? `<span class="link" data-ent="${esc(x.id)}">${esc(x.t)}</span>`
          : x.k === 'theme' ? `<span class="link" data-mtheme="${esc(x.id)}">${esc(x.t)}</span>` : esc(x.t)).join('')
      : esc(c.name);
    return `<div class="otlc" id="otl-${c.n}">
      <div class="otln">${head}${c.node ? ` <span class="link g" style="font-family:inherit;font-size:13px"
        data-ent="${esc(c.node)}" title="this sub-theme's own card">its card →</span>` : ''}</div>
      ${c.moved_from ? `<p class="hint" style="margin:0 0 4px">Placed here from <span class="link"
        data-mtheme="${esc(c.moved_from.id)}">${esc(c.moved_from.title)}</span>'s list</p>` : ''}
      ${quoted.map(p => `<div class="hubq">“${esc(String(p.note).replace(/^[“”"]+|[“”"]+$/g, ''))}” ${
        p.refs.map(refBtn).join(' ')}</div>`).join('')}
      ${plain.length ? `<div class="otlr">${quoted.length ? 'and ' : ''}${
        plain.flatMap(p => p.refs).map(refBtn).join(' ')}</div>` : ''}</div>`;
  }).join('')}</div>`;
  const chipRow = (items, render, n = 12) => `<p class="hubchips">${items.slice(0, n).map(render).join('')}</p>${
      items.length > n ? `<details class="moreinl"><summary>show all ${items.length}</summary><p class="hubchips">${
        items.slice(n).map(render).join('')}</p></details>` : ''}`;
  const concepts = (cs, pre) => cs.map(c => sec(pre + c.n, `${c.n}. ${c.name}`,
      (c.moved_from ? `<p class="hint" style="margin:0 0 4px">Placed here from <span class="link"
        data-mtheme="${esc(c.moved_from.id)}">${esc(c.moved_from.title)}</span>'s list, where it was first drawn</p>` : '') +
      ownNode(c.node) + nodeLine(c.nodes) + c.passages.map((p, i) => {
        const g = p.group && (i === 0 || c.passages[i - 1].group !== p.group)
          ? `<div class="vp-h2">${esc(p.group)}</div>` : '';
        return g + `<div class="echo">${p.label ? `<b>${esc(p.label)}</b> — ` : ''}${
          p.refs.map(refBtn).join(' ')}${p.note ? ` <span class="hint">${esc(p.note)}</span>` : ''}${
          p.refs.filter(r => r.text).slice(0, 1).map(r =>
            `<div class="ex">${esc(r.text)}</div>`).join('')}</div>`;
      }).join(''), c.passages.length, false)).join('');
  /* "Covenant → Presence": the theme is the card you are on, so only the far
     end is a link -- to the node the name was matched to, else the search.
     2026-09-30: it should just link on Presence; the search
     would never get hits (it searched the whole phrase). */
  /* GRANULAR. 2026-09-30, on Creation's "Creation and wisdom": one link
     found nothing under search, so it parses and goes more
     granular with the links. A name is several terms joined ("→", "and",
     "&", commas), so each word links on its own: a term a node was matched to
     opens the node, any other content word searches for itself, the theme's
     own word (you are on its card) and the joining words stay plain. */
  const JOIN = new Set(['and', 'or', 'of', 'the', 'a', 'an', 'in', 'to', 'with', 'for',
                        'from', 'on', 'by', 'as', 'at', 'into', 'vs', 'versus', 'its', 'his', 'her']);
  const themeWords = new Set(String(d.title || '').toLowerCase().match(/[a-z]+/g) || []);
  const secName = s => s.terms ? s.terms.map(x =>
      x.k === 'node' ? `<span class="link" data-ent="${esc(x.id)}">${esc(x.t)}</span>`
    : x.k === 'theme' ? `<span class="link" data-mtheme="${esc(x.id)}">${esc(x.t)}</span>`
    : x.k === 'search' ? findLink(x.t)
    : esc(x.t)).join('') : secNameLocal(s);
  const secNameLocal = s => {
    const byTerm = {};
    (s.nodes || []).forEach(n => { if(n.matched) byTerm[n.matched.toLowerCase()] = byTerm[n.matched.toLowerCase()] || n; });
    // a matched multi-word term ("image of god") links as one piece
    const terms = Object.keys(byTerm).filter(t => t.includes(' ')).sort((a, b) => b.length - a.length);
    let out = '', rest = String(s.name);
    while(rest){
      const low = rest.toLowerCase();
      const hit = terms.find(t => low.startsWith(t) && !/[a-z]/i.test(rest[t.length] || ''));
      if(hit){
        out += `<span class="link" data-ent="${esc(byTerm[hit].id)}">${esc(rest.slice(0, hit.length))}</span>`;
        rest = rest.slice(hit.length);
        continue;
      }
      const m = rest.match(/^[A-Za-z’']+/);
      if(!m){ out += esc(rest[0]); rest = rest.slice(1); continue; }
      const w = m[0], lw = w.toLowerCase();
      out += JOIN.has(lw) || themeWords.has(lw) ? esc(w)
           : byTerm[lw] ? `<span class="link" data-ent="${esc(byTerm[lw].id)}">${esc(w)}</span>`
           : findLink(w);
      rest = rest.slice(w.length);
    }
    return out;
  };
  const secondary = ss => ss.map(s => `<div class="echo">${secName(s)} ${
      (s.refs || []).map(refBtn).join(' ')}${s.note ? ` <span class="hint">${esc(s.note)}</span>` : ''}</div>`).join('');
  /* ONLY GROUNDED LINKS ARE SHOWN. 2026-09-29: nothing that undermines
     the integrity of the system; nothing should exist
     without Biblical backup. A link Copilot drew with no scripture on both
     sides is not displayed at all; it waits in
     docs/review/THEMES-UNGROUNDED.md for Copilot to supply the passages. */
  // never the theme itself: its own full synthesis came back as a "related
  // theme" with 326 shared verses (UI committee)
  const related = d.links.filter(x => x.grounded && x.to !== d.id);
  const links = ls => ls.filter(x => x.grounded && x.to !== d.id).map(x => `<div class="echo">${x.to && x.to !== d.id
      ? `<span class="link" data-mtheme="${esc(x.to)}">${esc(x.to_title)}</span>`
      : `<b>${esc(x.to_title)}</b>`}${x.note ? ` <span class="hint">(${esc(x.note)})</span>` : ''}
      <div class="hint">${x.grounded_by === 'a passage both themes cite'
            ? `grounded: ${x.shared_count} verse${x.shared_count === 1 ? '' : 's'} cited under both — ${
                (x.shared || []).map(s => `<button class="refmore" data-tgo="${esc(s.go)}">${esc(s.label)}</button>`).join(' ')}`
            : `grounded: the corpus tags ${prov('auto')} give both themes to ${x.tagged_both} verses — ${
                (x.tagged_examples || []).map(v => `<button class="refmore" data-go="${esc(v)}">${
                  esc(prettyRef(v))}</button>`).join(' ')}`}</div></div>`).join('');
  const deeper = (d.stamps || []).length ? `<p class="lead" style="margin-top:8px">Go deeper: ${
      d.stamps.map(s => `<span class="link" data-opentag="${esc(s.id)}">${esc(tagName(s.id))}</span>
      <span class="g">${s.verses.toLocaleString()} verses</span>`).join(' · ')}
      <span class="hint">— every clause the corpus reading tagged with it</span></p>` : '';
  const syn = d.synthesis ? sec('mt-syn', /synthesis/i.test(d.synthesis.title)
      ? d.synthesis.title : `${d.synthesis.title} · the full canonical synthesis`,
      `<p class="hint" style="max-width:62ch">${esc(d.synthesis.subtitle || '')}</p>`
      + concepts(d.synthesis.concepts, 'mts-')
      + `<div class="vp-h2">Secondary concepts</div>` + secondary(d.synthesis.secondary),
      d.synthesis.concepts.length, false) : '';
  /* ITS GROUP (plan 7.6b, 2026-10-06: each theme provides easy
     navigation to the others in its group, as they are related): the group's
     plain name and its themes, this one unlinked */
  const groupNav = d.group ? `<p class="hint" style="max-width:62ch">In <b>${esc(d.group.name)}</b>: ${
      d.group.themes.map(g => g.id === d.id ? `<b>${esc(g.title)}</b>`
        : `<span class="link" data-mtheme="${esc(g.id)}">${esc(g.title)}</span>`).join(' · ')}</p>` : '';
  /* WHERE A CONCEPT LIVES (ontology/themes/theme-homes.json): one home each,
     linked from the sibling themes it also belongs to ("some overlap is ok -
     but strive to put things in their logical place") */
  const elsewhere = [...(d.moved_out || []).map(x => ({...x, how: 'its home is'})),
                     ...(d.also_here || []).map(x => ({...x, how: 'also belongs here; its home is'}))];
  const elsewhereSec = elsewhere.length ? sec('mt-else', `On a related theme's page · ${elsewhere.length}`,
      elsewhere.map(x => `<div class="rowline">${esc(x.name)} <span class="g">${x.how}</span> <span class="link"
        data-mtheme="${esc(x.home)}">${esc(x.home_title)}</span></div>`).join(''), null, false) : '';
  /* A THEME'S FRONT PAGE (plan 7.6b; 2026-10-06: a one-stop entry
     point to understanding what the Bible really says about this topic
     on its own terms; a theme cannot be expected to hold it all on one
     page, it is an entry point for many other pages). Its opening in plain
     words and the texts' own, the page it hinges on as the largest door, one
     place to begin for a reader new to it, the visions by chapter, a picture
     of how the books share the images, and its note. The theme map's outline
     (Copilot's, credited) follows, lower. */
  const H = d.hub;
  const hubHtml = !H ? '' : (() => {
    const im = H.imagery;
    const pos = {}; (H.columns || []).forEach((c, i) => pos[c] = [60 + 150 * i, i % 2 ? 150 : 50]);
    const svg = im && H.columns.length ? `<svg class="hubsvg" viewBox="0 0 ${120 + 150 * (H.columns.length - 1)} 200"
        role="img" aria-label="How many images each pair of books shares">${H.share.filter(s => pos[s.a] && pos[s.b])
        .sort((x, y) => x.n - y.n).map(s => `<line x1="${pos[s.a][0]}" y1="${pos[s.a][1]}" x2="${pos[s.b][0]}"
        y2="${pos[s.b][1]}" stroke="currentColor" stroke-opacity="0.3" stroke-width="${Math.max(1, s.n / 2.2).toFixed(1)}"><title>${
        esc(s.a)} and ${esc(s.b)}: ${s.n} images</title></line>`).join('')}${H.columns.map(c => `<g class="hubnode"
        data-imagery="${esc(d.id)}" data-book="${esc(c)}"><circle cx="${pos[c][0]}" cy="${pos[c][1]}" r="10"/><text
        x="${pos[c][0]}" y="${pos[c][1] + (pos[c][1] < 100 ? -17 : 28)}" text-anchor="middle">${esc(c)}</text></g>`).join('')}</svg>
        <p class="hint">Each line joins two columns; its weight is how many of the ${im.n} rows both have. Choose
          one to see only its rows.</p>` : '';
    return `<p class="lead" style="max-width:62ch">${esc(H.intro || '')}</p>
      ${im ? `<button class="hubhero" data-imagery="${esc(d.id)}"><span class="hk">The heart of this theme</span>
        <b>${esc(im.door)} →</b><span>${im.n} ${esc(im.blurb)}</span></button>` : ''}
      ${/* A CARD THE THEME HINGES ON, as a door of its own (2026-10-07:
            Spiritual Warfare links to the Armor of God card) */''}
      ${(H.see_also || []).filter(s => s.card && s.door).map(s => `<button class="hubhero link" data-ent="${
        esc(s.card)}"><span class="hk">${esc(s.door)}</span><b>${esc(s.title.charAt(0).toUpperCase() + s.title.slice(1))} →</b><span>${
        esc(s.blurb || s.label)}</span></button>`).join('')}
      ${im && (H.starters || []).length ? `<div class="vp-h2">${esc(H.starters_label)}</div>
        <p class="hint" style="max-width:62ch">${esc(H.starters_hint)}</p><div class="hubdoors">${H.starters.map(s => `<button class="hubdoor"
          data-imagery="${esc(d.id)}" data-row="${s.row}"><b>${esc(s.title)}</b><span>${esc(s.books.join(' · '))}</span></button>`).join('')}</div>` : ''}
      ${(H.see_also || []).filter(s => !(s.card && s.door)).map(s => s.card
        ? `<p class="hint">See also, ${esc(s.label)}: <span class="link" data-ent="${esc(s.card)}">${esc(s.title)}</span></p>`
        : `<p class="hint">See also, on ${esc(s.door)}: <a href="${esc(s.path)}#row-${s.row}"
        data-imagery="${esc(s.theme)}" data-row="${s.row}">${esc(s.title)}</a></p>`).join('')}
      <div class="vp-h2">In the texts' own words</div>
      ${(H.opening || []).map(o => `<div class="hubq">“${esc(o.words)}” <button class="refmore" data-tgo="${
        esc(o.ref)}">${esc(o.ref)}</button></div>`).join('')}
      <div class="saying" style="max-width:62ch">${esc(H.note || '')}</div>
      ${(H.visions || []).length ? `<div class="vp-h2">${esc(H.chapters_label)}</div><p class="hubchips">${
        H.visions.map(v => `<button class="hubchip" data-readch="${esc(v.b)}|${v.c}">${esc(v.label)}</button>`).join('')}</p>` : ''}
      ${svg ? `<div class="vp-h2">${esc(H.share_label)}</div>${svg}` : ''}
      <h2 class="hubh">${d.source === 'site' || d.outline === 'redone' ? "The theme's outline" : "The theme map's outline"}</h2>`;
  })();
  openTab('mtheme:' + id, d.title, `<div class="pane">
    <p class="kind">A major theme · ${d.pos || d.n} of ${d.count || 20}</p><h1>${esc(d.title)}</h1>
    ${groupNav}
    ${hubHtml}
    <p class="lead">${esc(d.subtitle || '')}</p>
    <p class="hint" style="max-width:62ch">${esc(d.credit)}</p>
    ${/* A READER'S NOTE, where a theme reaches past a word. 2026-09-29,
          on Creation: a clear annotation explains that the idea is
          expanded because of references later in the Bible, particularly
          from Paul, that tie the concept of creation to the New Creation. */''}
    ${d.annotation ? `<div class="saying" style="max-width:62ch"><b>${esc(d.annotation.reader)}'s
      note.</b> ${esc(d.annotation.text)}<div class="hint" style="margin-top:6px">${
      (d.annotation.refs || []).map(r => `<button class="refmore" data-tgo="${esc(r)}">${
        esc(r)}</button>`).join(' ')}</div></div>` : ''}
