           and what follows is held up rather than described. No “is” is
           written, because the Hebrew has no room for one.</p>`) : ''}
    <p class="lead">${esc(d.note)}</p>
    ${/* A description assembled from the counts on this page, so every clause
          can be checked against the figures beside it. More than a verse list was wanted: a
          description of the patterns. */''}
    ${d.describes ? `<p style="max-width:64ch;margin:0 0 14px">${
        esc(d.describes)}</p>` : ''}
    ${drawTemplate(d.template)}
    ${/* THE BY-BOOK LIST IS GONE. 2026-09-19: the first list was no longer
          needed, since what fills each slot serves both purposes.

          It was here because the references had to live somewhere, and the
          fill bars had no verses of their own. Now that every filler carries
          its own, the old list showed the same references a second time with
          the one useful fact -- WHICH filler each belongs to -- thrown away.
          Two lists of the same thing is worse than one, and the survivor is
          the one that groups. */''}
    ${/* THE OTHER LANGUAGE GETS ITS OWN BRANCH, with its own fillers, books
          and verses. 2026-09-19: the text only described the Hebrew and
          the two lists were Hebrew only, so Hebrew and Greek trees are shown
          or a level is inserted lower, holding the distinction that these
          are not exact, but the closest equivalent possible across languages.

          Two boxes at the top and one language's evidence below was the card
          asserting the Greek and never showing it. Each realisation now
          carries what it can prove about itself, and the note between them
          says what the relation is and is not: the same predicate, not the
          same construction. נְאֻם־יְהוָה is a construct and λέγει Κύριος a
          clause, and flattening them into one tree would claim a sameness the
          grammar does not have. */''}
    ${sec('p-slots', `${d.anchor && d.anchor.rtl ? 'Hebrew' : 'Greek'} — what fills each slot, and where`, slots,
          Object.keys(d.slots||{}).length)}

    ${/* WHAT WAS LEFT OF THE CLASSIFICATION. 2026-09-19: 'distinct
          fillers' is redundant and the top filler's share is rolled into
          the 'what fills each slot'; then 'books it reaches'
          moves up a level as it is the only classification.

          All three held. The filler count is the length of the list above
          it; the share is now on each bar beside the count it comes from; and
          a table of one row is not a table. So the reach becomes a section of
          its own, and the thing a reader actually wants from it — WHICH books,
          and which verses in them — is now reachable instead of being summed
          to a number. */''}
    ${booksSec}
    ${/* ONE TRANSITION, WHICHEVER WAY THE PATTERN CROSSES. 2026-09-19:
          this should happen systemically, so that it is
          already there on every pattern.

          Two mechanisms reach the other testament and only one had a section.
          A COUNTERPART is a separate template sharing the predicate, so the
          note is about two shapes for one word. OWN INSTANCES means the verses
          are inside this very template, so the note is about one shape the
          text uses in both languages — a stronger thing, and it was the case
          with no section at all. */''}
    ${(d.counterparts||[]).length ? `<div class="xnote">
      <b>The closest equivalent, not the same construction.</b>
      These share a predicate — ${esc(d.anchor ? d.anchor.g : '')} — and not a
      shape: ${esc(d.template)} is
      ${d.anchor && d.anchor.rtl ? 'a Hebrew construct' : 'a Greek clause'} and
      ${esc(d.counterparts[0].template)} is
      ${d.anchor && d.anchor.rtl ? 'a Greek clause' : 'a Hebrew construct'}.
      Each is shown with its own evidence below.</div>`
    : (d.other_side ? `<div class="xnote">
      <b>The same shape, in both testaments.</b>
      ${d.other_side.instances} of its ${d.instances.toLocaleString()} uses
      are ${d.observed && !d.observed.rtl ? 'Greek' : 'Hebrew'}, where the word
      is ${d.observed ? `<b>${esc(d.observed.t)}</b>` : 'the other language’s'}
      rather than ${esc(d.anchor ? d.anchor.t : '')}. Not a counterpart
      template but this one, used on both sides — shown below with its own
      fillers and verses.</div>` : '')}
    ${d.other_side ? `<div class="xshape">
        <div class="xlang">${d.observed && !d.observed.rtl ? 'Greek' : 'Hebrew'}
          <span class="g">${esc(d.other_side.template)} · ${
            d.other_side.instances}× · ${d.other_side.reach} books</span>
        </div>${drawTemplate(d.other_side.template)}</div>`
      + sec('p-side', `${d.observed && !d.observed.rtl ? 'Greek' : 'Hebrew'
        } — what fills each slot`,
        slotsFor(d.other_side), d.other_side.instances) : ''}
    ${/* DIAGRAM THEN ITS OWN EXPANSION, as a pair. 2026-09-19: first
          placed after the transition text, then, with two
          diagrams floating above two folders, kept where it was for the
          2 Greek lists, and finally each
          expansion placed under the corresponding diagram.

          Both readings were right and this is what satisfies them. The picture
          is visible without opening anything, which is what made it worth
          showing; and it sits immediately above the list it describes, so a
          reader never has to work out which of two shapes belongs to which of
          two lists. The Hebrew above already reads this way — its diagram,
          then its folders — so the page keeps one rhythm throughout. */''}
    ${(d.counterparts||[]).map(c => `<div class="xshape">
        <div class="xlang">${c.anchor && c.anchor.rtl ? 'Hebrew' : 'Greek'}
          <span class="g">${esc(c.template)} · ${
            c.instances.toLocaleString()}× · ${c.reach} books</span>
        </div>${drawTemplate(c.template)}</div>`
      + sec('p-x-' + c.key,
        `${c.anchor && c.anchor.rtl ? 'Hebrew' : 'Greek'} — what fills each slot`,
        (c.describes ? `<p style="max-width:64ch;margin:0 0 12px">${
           esc(c.describes)}</p>` : '')
        + slotsFor(c)
        + `<p class="hint" style="margin:10px 0 0">
             <button class="plink" data-pat="${esc(c.key)}">open its own
             card</button> for the books it reaches and every use.</p>`,
        c.instances)).join('')}

  </div>`, () => {
    $('#paneinner').querySelectorAll('.use').forEach(u =>
      u.onclick = () => peek(u));
    wireLists($('#paneinner'));
    $('#paneinner').querySelectorAll('.occ[data-pref]').forEach(b =>
      b.onclick = () => showPatternVerse(b));
    /* The anchor opens the reader's own word card, not a pattern-flavoured
       imitation of one: clicking it shows the same thing
       as clicking in the reader. */
    $('#paneinner').querySelectorAll('[data-sense]').forEach(b =>
      b.onclick = () => openSense(b.dataset.sense));
    $('#paneinner').querySelectorAll('[data-pat]').forEach(b =>
      b.onclick = () => openPattern(b.dataset.pat));
    /* "298 more" now extends the list instead of merely naming the shortfall.
       2026-09-19: clickable, to extend the list as it is
       elsewhere. */
    $('#paneinner').querySelectorAll('.refmore').forEach(m =>
      m.onclick = () => {
        const wrap = m.closest('.fillrefs');
        const hidden = [...wrap.querySelectorAll('.occ[hidden]')];
        hidden.slice(0, 50).forEach(b => b.removeAttribute('hidden'));
        const left = wrap.querySelectorAll('.occ[hidden]').length;
        if(left) m.textContent = left + ' more'; else m.remove();
        wrap.querySelectorAll('.occ[data-pref]').forEach(b =>
          b.onclick = () => showPatternVerse(b));
      });
  });
}

/* A card for the pattern layers that had no card: node structures and ladder
   chains. Both were listed and neither could be opened — 2026-09-16:
   node structure links were not live, and ladder chains were confusing for a
   reader who does not know the language, since clicking just navigated to the reader with
   no explanation. So the card explains what the thing IS first, shows the
   chain or the slots glossed, and opens its verses in place. */
/* A contrast pair as a card, built like the layer cards: say what it is, then
   let the verses open in place. 2026-09-16: this is a pattern
   and should be drillable, the way reversals work. */
/* A passage as a sequence: what happens, in order, with the actor each clause
   names. 2026-09-16: drill-ins to sequence diagrams for
   the events.

   Deliberately NOT a swimlane. A swimlane needs one lane per actor held across
   the passage, and `events` names participants per CLAUSE -- "Abraham", "he"
   and "the young man" are three strings. So this shows the order and the
   stated actor, and claims nothing about who is whom. */
async function openSequence(ref){
  const d = await api('/api/sequence', {ref});
  if(!d || !d.found){ console.warn('no sequence for', ref); return; }
  const rows = d.steps.map((s, i) => {
    const prev = i ? d.steps[i-1] : null;
    const newVerse = !prev || prev.verse !== s.verse || prev.chapter !== s.chapter;
    return `<div class="seqstep${s.quoted ? ' spoken' : ''}">
      <span class="seqref">${newVerse ? esc(prettyRef(s.ref)) : ''}</span>
      <span class="seqbar"></span>
      <span class="seqbody">
        <b>${esc(s.act || '')}</b>
        ${s.who.length ? `<span class="seqrole">who</span> ${esc(s.who.join(', '))}` : ''}
        ${s.what.length ? `<span class="seqrole">what</span> ${esc(s.what.join(', '))}` : ''}
        ${s.where.length ? `<span class="seqrole">where</span> ${esc(s.where.join(', '))}` : ''}
      </span></div>`;
  }).join('');
  DEEP = 'seq=' + encodeURIComponent(ref);
  openTab('seq', `${prettyRef(ref)} — sequence`, `<div class="pane">
    <p class="kind">sequence</p>
    <h1>${esc(d.title || prettyRef(ref))}</h1>
    <p style="max-width:64ch;margin:0 0 6px">${d.steps.length} actions${
      d.through ? ` from ${esc(prettyRef(ref))} to ${esc(prettyRef(d.through))}`
                : ''}, in the order the text gives them.</p>
    <p class="hint" style="max-width:64ch;margin:0 0 16px">${d.narrated}
      narrated, ${d.spoken} inside speech — the shaded ones are what someone
      SAYS happens, not what the text reports. The actor is whoever the clause
      names, so a pronoun stays a pronoun: this is an order, not a cast list.</p>
    <div class="seq">${rows}</div>
    ${/* Two different kinds of claim, kept apart. A cross-reference is an
          EDITOR's judgement carried in from the Berean notes; a similar
          section is a MODEL's reading scored on rare shared stamps. Merging
          them would launder the second into the first. */''}
    ${(d.xrefs||[]).length ? sec('sq-xref',
        `Passages linked to this one · ${d.xrefs.length}`,
        `<p class="hint" style="margin:0 0 10px;max-width:62ch"><b>an editor's
           judgement</b> — the Berean Standard Bible's own parallel-passage
           notes, made for readers and independent of anything here.</p>`
        + listBlock(d.xrefs, x =>
            `<button class="occ" data-vref="${esc(x.ref)}">${
              esc(prettyRef(x.ref))}${x.end ? '–' + esc(String(x.end).split('.').pop()) : ''
             }</button>`, d.xrefs.length, 'chips')
        + '<div class="occshow" hidden></div>', null, true) : ''}
    ${(d.similar||[]).length ? sec('sq-sim',
        `Passages that resemble it · ${d.similar.length}`,
        `<p class="hint" style="margin:0 0 10px;max-width:62ch"><b>a reading</b> ${prov('auto')}
           — sections sharing RARE stamps with this one, scored so
           that agreeing on something common counts for little. Nothing here
           says the text draws the connection; it says two passages were
           described alike.</p>`
        + d.similar.map(x =>
            `<div class="rowline"><span class="link" data-goref="${esc(x.ref)}"
               >${esc(prettyRef(x.ref))}${x.title ? ' — ' + esc(x.title) : ''}</span>
             <span class="g">${esc(x.shared.join(', '))}</span></div>`).join(''),
        null, true) : ''}
  </div>`, () => {
    wireLists($('#paneinner'));
    $('#paneinner').querySelectorAll('.occ[data-vref]').forEach(b =>
      b.onclick = () => showPlainVerse(b));
    $('#paneinner').querySelectorAll('.link[data-goref]').forEach(a =>
      a.onclick = () => openSequence(a.dataset.goref));
  }, ref);
}

/* A theme card, which the list has been promising and not delivering.
   2026-09-18: the theme links themselves were not working either.

   The card leads with the AXES rather than the size, because that is the claim
   the register actually makes: a theme three independent methods found is
   better attested than one a model stamped a thousand times. Then the measured
   corroboration between those axes, then — not buried — whatever the register
   says it cannot support. A theme page that showed only its size would be the
   authoritative-looking emptiness this project exists to avoid. */
async function openTheme(id){
  const d = await api('/api/theme', {id});
  if(!d || !d.found){ console.warn('theme not found', id); return; }
  const chip = t => `<span class="chip" style="cursor:default">${esc(t)}</span>`;
  DEEP = 'theme=' + encodeURIComponent(id);
  openTab('theme', d.name, `<div class="pane">
    <p class="kind">theme · evidence shown</p>
    <h1>${esc(d.name)}</h1>
    <p style="margin:0 0 6px;color:var(--muted)">Found independently by
      ${d.axes.length} ${d.axes.length === 1 ? 'method' : 'methods'}.</p>
    <div style="margin:0 0 16px">${d.axes.map(chip).join(' ')}</div>
    <p style="color:var(--muted);margin:0 0 18px">
      ${d.sections != null ? `${d.sections.toLocaleString()} sections · ` : ''}
      ${d.verses != null ? `${d.verses.toLocaleString()} verses · ` : ''}
      ${d.books.length} books${d.recall != null
        ? ` · recall ${typeof d.recall === 'number'
            ? (d.recall <= 1 ? Math.round(d.recall * 100) + '%' : d.recall)
            : esc(String(d.recall))}` : ''}</p>
    ${d.notes.length ? `<h3 style="margin:0 0 6px">How the axes agree</h3>
      <ul style="max-width:72ch;margin:0 0 18px;padding-left:20px;
                 color:var(--muted)">${
        d.notes.map(n => `<li style="margin:0 0 6px">${esc(n)}</li>`).join('')
      }</ul>` : ''}
    ${d.limits.length ? `<h3 style="margin:0 0 6px">What it does not support</h3>
      <ul style="max-width:72ch;margin:0 0 18px;padding-left:20px">${
        d.limits.map(n => `<li style="margin:0 0 6px">${esc(n)}</li>`).join('')
      }</ul>` : ''}
    <p class="hint" style="max-width:72ch">Books are where the theme is
      attested, not a claim that it is central to each. The axes are listed so
      the reader can weigh them separately; they are not summed into a score.</p>
  </div>`);
}
